plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nokribook.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.nokribook.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    // Without this, Gradle falls back to auto-generating a debug key at
    // ~/.android/debug.keystore if one doesn't already exist there — fine
    // on a real developer machine where that file persists across
    // builds, but on GitHub Actions' fresh, empty runners it means a
    // BRAND NEW random key every single build. Each APK ends up signed
    // differently from the last one, so installing a newer build over an
    // older one silently fails (Android refuses on signature mismatch)
    // and the app on your phone never actually changes. Pointing this at
    // the debug.keystore checked into the repo (see its own file for
    // details) makes every build use the identical signature, so
    // reinstalling over an existing install works as a normal update.
    signingConfigs {
        debug {
            storeFile file("../debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // WebViewAssetLoader — serves the bundled HTML/JS/CSS over a proper
    // https:// virtual origin (https://appassets.androidplatform.net/)
    // instead of a raw file:// URL, which is what lets Firebase Auth,
    // Firestore, and Google Identity Services all work correctly from
    // inside the WebView (file:// origins are blocked or heavily
    // restricted by exactly the kind of network/storage calls this app
    // depends on).
    implementation 'androidx.webkit:webkit:1.11.0'
}

// androidx.appcompat pulls in a transitive dependency chain that still
// references the OLD, pre-1.8 Kotlin stdlib split (separate
// kotlin-stdlib-jdk7 / kotlin-stdlib-jdk8 artifacts) at version 1.6.21,
// while something else in the graph resolves to the modern merged
// kotlin-stdlib 1.8.22 (which, since Kotlin 1.8, already contains
// everything jdk7/jdk8 used to provide separately). Both versions
// landing in the same build produces duplicate classes
// (kotlin.internal.jdk7.JDK7PlatformImplementations, etc.) and fails
// :app:checkDebugDuplicateClasses. This is Kotlin's own documented fix
// for exactly this situation: force one consistent stdlib version and
// drop the now-redundant jdk7/jdk8 artifacts entirely.
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    }
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

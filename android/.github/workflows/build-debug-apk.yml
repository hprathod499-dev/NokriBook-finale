name: Build debug APK

# Builds a debug .apk — self-signed with a throwaway debug key, fine to
# install manually on your own phone via "install unknown apps", not
# meant for the Play Store — every time you push, and any time you
# trigger it manually from the Actions tab. This is what gets you a real
# installable file without setting up Android Studio or the Android SDK
# on your own machine at all.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nokri-book-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

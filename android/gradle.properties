# Required whenever the project uses AndroidX libraries (this one does —
# androidx.appcompat, androidx.webkit, etc. via build.gradle) — without
# this, Gradle refuses the build with "AndroidX dependencies, but the
# android.useAndroidX property is not enabled".
android.useAndroidX=true
# Auto-translates any old support-library references to their AndroidX
# equivalents. Not strictly required here (nothing in this project uses
# the old support library), but it's the standard pairing with
# useAndroidX and costs nothing to leave on.
android.enableJetifier=true

# Speeds up Gradle itself (parallel task execution, build cache) — safe
# defaults for a project this size, not required for the build to
# succeed.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true

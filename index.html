// Mirrors CategoryView's roster + history tabs — same computeRoster() and
// history rows the admin sees — with the "Actions" column, editable date,
// Assign/Skip/Remove buttons, Undo/Redo, and designation-restriction
// editor all left out, since none of those write data.
function PublicCategoryView({ data, catId }) {
  const { t } = useLang();
  const [tab, setTab] = useState("roster");
  const [pdfBusy, setPdfBusy] = useState(false);
  const [pdfPeriod, setPdfPeriod] = useState({ key: "month", customFrom: todayStr(), customTo: todayStr() });
  const cat = (data.categories || []).find((c) => c.id === catId);
  const membership = (data.membership && data.membership[catId]) || [];
  const roster = useMemo(() => computeRoster(data, catId), [data, catId]);
  const historyRows = useMemo(() => {
    const rows = [];
    membership.forEach((m) => {
      const staffRec = data.staff[m.number];
      (m.history || []).forEach((entry, idx) => {
        rows.push({ number: m.number, idx, name: staffRec ? staffRec.name : m.number, date: historyDate(entry), ts: historyTs(entry), note: historyNote(entry), batch: historyBatch(entry) });
      });
    });
    const sorted = rows.sort((a, b) => (b.date === a.date ? b.ts - a.ts : b.date.localeCompare(a.date)));
    return groupHistoryRows(sorted);
  }, [data, membership]);
  useEffect(() => { setTab("roster"); }, [catId]);
  const presentCount = roster.filter((p) => p.status === "Present").length;

  // Same PDF export the manager's CategoryView offers — a viewer reached
  // via a share link has no write access to the data, but generating this
  // PDF only reads it, so there's no reason to withhold it here.
  const handleDownloadPdf = async () => {
    setPdfBusy(true);
    try {
      await downloadCategoryPdf(cat ? cat.label : catId, roster, historyRows, pdfPeriod);
    } catch (e) {
      window.alert(t("Could not load Gujarati font — check your internet connection and try again.", "ગુજરાતી ફોન્ટ લોડ થઈ શક્યો નહીં — તમારું ઇન્ટરનેટ કનેક્શન તપાસો અને ફરી પ્રયાસ કરો."));
    } finally {
      setPdfBusy(false);
    }
  };

  return (
    <React.Fragment>
      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 4 }}>
        <h1 className="disp" style={{ fontSize: 22, fontWeight: 700, margin: 0 }}>{cat ? cat.label : ""}</h1>
        <div style={{ fontSize: 12, color: "var(--text-secondary)" }} className="gu">{presentCount} {t("available", "ઉપલબ્ધ")}</div>
      </div>

      <div style={{ display: "flex", gap: 6, marginBottom: 20, justifyContent: "space-between", flexWrap: "wrap" }}>
        <div style={{ display: "flex", gap: 6 }}>
          <button onClick={() => setTab("roster")} style={catTabBtn(tab === "roster")} className="gu">{t("Roster", "રોસ્ટર")}</button>
          <button onClick={() => setTab("fairness")} style={catTabBtn(tab === "fairness")} className="gu">{t("Fairness", "ન્યાયીપણું")}</button>
          <button onClick={() => setTab("history")} style={catTabBtn(tab === "history")} className="gu">{t("History", "ઇતિહાસ")}</button>
        </div>
        <div style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap" }}>
          <PeriodFilterSelect period={pdfPeriod} setPeriod={setPdfPeriod} />
          <button
            onClick={handleDownloadPdf} disabled={pdfBusy}
            title={t("Download this work type's roster and history as a PDF", "આ કામના પ્રકારનું રોસ્ટર અને ઇતિહાસ PDF તરીકે ડાઉનલોડ કરો")}
            style={{ background: "#D98E2B", color: "#fff", border: "none", borderRadius: 7, padding: "6px 12px", fontSize: 12, fontWeight: 600, whiteSpace: "nowrap", opacity: pdfBusy ? 0.7 : 1 }} className="gu"
          >{pdfBusy ? t("Preparing…", "તૈયાર થઈ રહ્યું છે…") : "⬇ " + t("Download PDF", "PDF ડાઉનલોડ કરો")}</button>
        </div>
      </div>

      {tab === "fairness" ? (
        <CategoryFairnessTable roster={roster} catLabel={cat ? cat.label : ""} />
      ) : tab === "history" ? (
        <div style={{ background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 10, overflow: "hidden" }}>
          <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
              <thead>
                <tr style={{ background: "var(--bg-surface-2)", textAlign: "left" }} className="gu">
                  <th style={th}>#</th><th style={th}>{t("Date", "તારીખ")}</th><th style={th}>{t("Number", "નંબર")}</th><th style={th}>{t("Name", "નામ")}</th><th style={th}>{t("Note", "નોંધ")}</th>
                </tr>
              </thead>
              <tbody>
                {historyRows.map((r, i) => (
                  <tr key={`${r.number}#${r.idxs.join(",")}`} style={{ borderTop: "1px solid var(--border-soft)", background: i === 0 ? "var(--highlight-bg)" : "transparent" }}>
                    <td style={td} className="mono">{i + 1}</td>
                    <td style={td} className="mono">
                      {r.days > 1 ? `${formatDMY(r.from)} – ${formatDMY(r.to)}` : formatDMY(r.to)}
                      {r.days > 1 && <span style={{ marginLeft: 6, fontSize: 10.5, fontWeight: 700, color: "var(--status-info-text)", background: "var(--status-info-bg)", border: "1px solid var(--status-info-border)", borderRadius: 10, padding: "1px 6px" }}>{t(`${r.days} days`, `${r.days} દિવસ`)}</span>}
                    </td>
                    <td style={td} className="mono">{r.number}</td>
                    <td style={{ ...td, minWidth: 160 }} className="gu">{r.name}</td>
                    <td style={{ ...td, maxWidth: 260, color: "var(--text-secondary)" }}>{r.note || "—"}</td>
                  </tr>
                ))}
                {historyRows.length === 0 && (
                  <tr><td colSpan={5} style={{ ...td, textAlign: "center", color: "var(--text-tertiary)", padding: "26px 0" }} className="gu">{t("No duty has been completed in this work type yet.", "આ કામના પ્રકારમાં હજુ સુધી કોઈ ડ્યુટી પૂર્ણ થઈ નથી.")}</td></tr>
                )}
              </tbody>
            </table>
          </div>
        </div>
      ) : (
        <div style={{ background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 10, overflow: "hidden" }}>
          <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
              <thead>
                <tr style={{ background: "var(--bg-surface-2)", textAlign: "left" }} className="gu">
                  <th style={th}>{t("Rank", "ક્રમ")}</th><th style={th}>{t("Number", "નંબર")}</th><th style={th}>{t("Name", "નામ")}</th><th style={th}>{t("Last duty", "છેલ્લી ડ્યુટી")}</th>
                  <th style={th}>{t("Waiting", "રાહ")}</th><th style={th}>{t("Status", "સ્થિતિ")}</th>
                </tr>
              </thead>
              <tbody>
                {roster.map((p) => {
                  const sty = STATUS_STYLE[p.status] || STATUS_STYLE.Present;
                  return (
                    <tr key={p.number} style={{ borderTop: "1px solid var(--border-soft)", background: p.rank === 1 ? "var(--highlight-bg)" : "transparent" }}>
                      <td style={td}>{p.rank ? <span className="mono" style={{ fontWeight: 600, color: p.rank === 1 ? "var(--status-warning-text)" : "var(--text-primary)" }}>#{p.rank}</span> : <span style={{ color: "var(--text-tertiary)" }}>–</span>}</td>
                      <td style={td} className="mono">{p.number}</td>
                      <td style={{ ...td, minWidth: 160 }} className="gu">{p.name}</td>
                      <td style={td} className="mono">{formatDMY(p.lastDuty)}</td>
                      <td style={td} className="mono">{p.waiting}d</td>
                      <td style={td}>
                        <span style={{ fontSize: 12, fontWeight: 600, padding: "5px 8px", borderRadius: 6, border: "1px solid " + sty.border, background: sty.bg, color: sty.fg }} className="gu">{p.statusLabel}</span>
                      </td>
                    </tr>
                  );
                })}
                {roster.length === 0 && (
                  <tr><td colSpan={6} style={{ ...td, textAlign: "center", color: "var(--text-tertiary)", padding: "26px 0" }} className="gu">{t("No staff added yet.", "હજુ કોઈ સ્ટાફ ઉમેર્યો નથી.")}</td></tr>

  );

// Mirrors the staff list in StaffView (number, name, designation, current
// status) minus every create/rename/delete/leave-assignment control.
function PublicStaffView({ data }) {
  const { t } = useLang();
  const [search, setSearch] = useState("");
  const debouncedSearch = useDebouncedValue(search);
  const [desgFilter, setDesgFilter] = useState("");
  const [sortBy, setSortBy] = useState("name");
  const [showFairnessCompare, setShowFairnessCompare] = useState(false);
  const [historyPersonNumber, setHistoryPersonNumber] = useState(null);

  const currentMonth = todayStr().slice(0, 7);
  const dutyCountByNumber = useMemo(() => {
    const counts = {};
    (data.categories || []).forEach((c) => (data.membership[c.id] || []).forEach((m) => {
      const n = monthlyGroupedDutyCount(m.history, currentMonth);
      counts[m.number] = (counts[m.number] || 0) + n;
    }));
    return counts;
  }, [data, currentMonth]);

  const rows = useMemo(() => {
    let list = Object.values(data.staff || {}).map((s) => {
      const status = effectiveStatus(s, null);
      const statusLabel = (status === "Leave" || status === "Outstation") ? unavailLabel(data, s.unavailable) : status;
      const desg = (data.designations || []).find((d) => d.id === s.designation);
      // Same "currently active" check the sort/filter logic below relies
      // on — matches the manager's StaffView exactly.
      const activeUnavailable = !!(s.unavailable && (!s.unavailable.to || s.unavailable.to >= todayStr()));
      return { ...s, status, statusLabel, desgLabel: desg ? desg.label : "", dutiesThisMonth: dutyCountByNumber[s.number] || 0, activeUnavailable };
    });
    const q = debouncedSearch.trim().toLowerCase();
    if (q) list = list.filter((s) => (s.name || "").toLowerCase().includes(q) || String(s.number || "").toLowerCase().includes(q));
    if (desgFilter) list = desgFilter === "__none__" ? list.filter((s) => !s.designation) : list.filter((s) => s.designation === desgFilter);
    list = [...list];
    // Same five sort/filter modes as the manager's StaffView — "present"
    // and "unavailable" filter down to just that group (sorted by name)
    // rather than merely re-ordering everyone, same reasoning as there.
    if (sortBy === "present") {
      list = list.filter((s) => !s.activeUnavailable && !s.skip).sort((a, b) => (a.name || "").localeCompare(b.name || ""));
    } else if (sortBy === "unavailable") {
      list = list.filter((s) => s.activeUnavailable).sort((a, b) => (a.name || "").localeCompare(b.name || ""));
    } else if (sortBy === "designation") {
      list.sort((a, b) => (a.desgLabel || "").localeCompare(b.desgLabel || "") || (a.name || "").localeCompare(b.name || ""));
    } else if (sortBy === "heat") {
      list.sort((a, b) => b.dutiesThisMonth - a.dutiesThisMonth || (a.name || "").localeCompare(b.name || ""));
    } else {
      list.sort((a, b) => (a.name || "").localeCompare(b.name || ""));
    }
    return list;
  }, [data, debouncedSearch, desgFilter, sortBy, dutyCountByNumber]);

  const maxDuties = useMemo(() => rows.reduce((m, s) => Math.max(m, s.dutiesThisMonth), 0), [rows]);
  const minDuties = useMemo(() => rows.length ? rows.reduce((m, s) => Math.min(m, s.dutiesThisMonth), Infinity) : 0, [rows]);

  return (
    <React.Fragment>
      <h1 className="disp gu" style={{ fontSize: 22, fontWeight: 700, margin: "0 0 16px" }}>{t("Staff", "સ્ટાફ")}</h1>
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 12 }}>
        <input
          type="text" value={search} onChange={(e) => setSearch(e.target.value)}
          placeholder={t("Search by name or number…", "નામ અથવા નંબર દ્વારા શોધો…")} className="gu"
          style={{ width: "100%", maxWidth: 320, boxSizing: "border-box" }}
        />
        <select value={desgFilter} onChange={(e) => setDesgFilter(e.target.value)} style={{ fontSize: 13, padding: "7px 10px", border: "1px solid var(--border)", borderRadius: 6, background: "var(--bg-surface)", color: "var(--text-primary)" }} className="gu">
          <option value="">{t("All designations", "બધા હોદ્દા")}</option>
          <option value="__none__">{t("No designation", "કોઈ હોદ્દો નથી")}</option>
          {(data.designations || []).map((d) => (
            <option key={d.id} value={d.id}>{d.label}</option>
          ))}
        </select>
        <select value={sortBy} onChange={(e) => setSortBy(e.target.value)} style={{ fontSize: 13, padding: "7px 10px", border: "1px solid var(--border)", borderRadius: 6, background: "var(--bg-surface)", color: "var(--text-primary)" }} className="gu">
          <option value="name">{t("Sort: Name", "ક્રમ: નામ")}</option>
          <option value="designation">{t("Sort: Designation", "ક્રમ: હોદ્દો")}</option>
          <option value="heat">{t("Sort: Duty meter (busiest first)", "ક્રમ: ડ્યુટી મીટર (સૌથી વ્યસ્ત પ્રથમ)")}</option>
          <option value="present">{t("Show: Present only", "બતાવો: ફક્ત હાજર")}</option>
          <option value="unavailable">{t("Show: Leave/Outstation only", "બતાવો: ફક્ત રજા/બહારગામ")}</option>
        </select>
        <button
          onClick={() => setShowFairnessCompare((v) => !v)}
          style={{
            background: showFairnessCompare ? "#D98E2B" : "var(--bg-surface)", color: showFairnessCompare ? "#fff" : "var(--text-primary)",
            border: "1px solid " + (showFairnessCompare ? "#D98E2B" : "var(--border)"), borderRadius: 6, padding: "7px 12px", fontSize: 13, fontWeight: 600, whiteSpace: "nowrap",
          }} className="gu"
        >⚖ {t("Duty fairness", "ડ્યુટી ન્યાયીપણું")}</button>
      </div>

      {showFairnessCompare && (
        <DutyFairnessCompare data={data} staffList={rows} currentMonth={currentMonth} />
      )}

      <div style={{ display: "flex", alignItems: "center", gap: 16, marginBottom: 10, fontSize: 11.5, color: "var(--text-secondary)", flexWrap: "wrap" }} className="gu">
        <span style={{ fontWeight: 600 }}>{t("Duty meter:", "ડ્યુટી મીટર:")}</span>
        <span style={{ display: "flex", alignItems: "center", gap: 5 }}><span style={{ width: 8, height: 8, borderRadius: "50%", background: "var(--status-error-text)", display: "inline-block" }} />{t("Busiest", "સૌથી વ્યસ્ત")}</span>
        <span style={{ display: "flex", alignItems: "center", gap: 5 }}><span style={{ width: 8, height: 8, borderRadius: "50%", background: "var(--status-warning-text)", display: "inline-block" }} />{t("Moderate", "મધ્યમ")}</span>
        <span style={{ display: "flex", alignItems: "center", gap: 5 }}><span style={{ width: 8, height: 8, borderRadius: "50%", background: "var(--status-success-text)", display: "inline-block" }} />{t("Least busy", "સૌથી ઓછું વ્યસ્ત")}</span>
        <span style={{ color: "var(--text-tertiary)" }}>{t("— relative to everyone shown, this month", "— આ મહિને બતાવેલ બધાની સાપેક્ષે")}</span>
      </div>

      <div style={{ background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 10, overflow: "hidden" }}>
        <div style={{ overflowX: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
            <thead>
              <tr style={{ background: "var(--bg-surface-2)", textAlign: "left" }} className="gu">
                <th style={th}>{t("Number", "નંબર")}</th><th style={th}>{t("Name", "નામ")}</th><th style={th}>{t("Designation", "હોદ્દો")}</th><th style={th}>{t("Status", "સ્થિતિ")}</th><th style={{ ...th, textAlign: "center" }}>{t("Duties (mo.)", "ડ્યુટીઓ (મહિનો)")}</th>
              </tr>
            </thead>
            <tbody>
              {rows.map((s) => {
                const sty = STATUS_STYLE[s.status] || STATUS_STYLE.Present;
                const heat = dutyHeatTier(s.dutiesThisMonth, minDuties, maxDuties);
                return (
                  <tr key={s.number} style={{ borderTop: "1px solid var(--border-soft)" }}>
                    <td style={td} className="mono">{s.number}</td>
                    <td style={{ ...td, minWidth: 160 }} className="gu">
                      <span style={{ display: "inline-block", width: 7, height: 7, borderRadius: "50%", background: DUTY_HEAT_COLOR[heat], marginRight: 7 }} />
                      <span
                        onClick={() => setHistoryPersonNumber(s.number)}
                        title={t("View full duty history across every work type", "દરેક કામના પ્રકારમાં સંપૂર્ણ ડ્યુટી ઇતિહાસ જુઓ")}
                        style={{ color: DUTY_HEAT_COLOR[heat], fontWeight: heat === "green" ? 400 : 600, cursor: "pointer", borderBottom: "1px dashed currentColor" }}
                      >{s.name}</span>
                    </td>
                    <td style={td} className="gu">{s.desgLabel || <span style={{ color: "var(--text-tertiary)" }}>–</span>}</td>
                    <td style={td}>
                      <span style={{ fontSize: 12, fontWeight: 600, padding: "5px 8px", borderRadius: 6, border: "1px solid " + sty.border, background: sty.bg, color: sty.fg }} className="gu">{s.statusLabel}</span>
                      {s.unavailable && (
                        <div style={{ fontSize: 11, color: "var(--text-tertiary)", marginTop: 6 }} className="gu">
                          {s.unavailable.from > todayStr()
                            ? `${t("starts", "શરૂ થાય છે")} ${formatDMY(s.unavailable.from)}${s.unavailable.to ? ` – ${formatDMY(s.unavailable.to)}` : ""}`
                            : s.unavailable.to
                              ? `${formatDMY(s.unavailable.from)} – ${formatDMY(s.unavailable.to)}`
                              : `${t("from", "થી")} ${formatDMY(s.unavailable.from)} · ${t("no end date", "કોઈ અંતિમ તારીખ નથી")}`}
                        </div>
                      )}
                    </td>
                    <td style={{ ...td, textAlign: "center", fontSize: 12, color: "var(--text-secondary)" }} className="mono">{s.dutiesThisMonth}</td>
                  </tr>
                );
              })}
              {rows.length === 0 && (
                <tr><td colSpan={5} style={{ ...td, textAlign: "center", color: "var(--text-tertiary)", padding: "26px 0" }} className="gu">{t("No staff found.", "કોઈ સ્ટાફ મળ્યો નથી.")}</td></tr>
              )}
            </tbody>
          </table>
        </div>
      </div>

      {historyPersonNumber && data.staff[historyPersonNumber] && (
        <PersonHistoryModal data={data} number={historyPersonNumber} onClose={() => setHistoryPersonNumber(null)} />
      )}
    </React.Fragment>
  );
}

// Catches any render-time error anywhere in the tree below it instead of
// letting the whole app crash to a blank white screen — the single biggest
// "stability" gap in a page like this with no build step to catch mistakes
// ahead of time. Shows a plain recovery screen with a reload button; all
// data is safe either way since every change is already saved live as it
// happens, this only guards the CURRENT tab's rendering.
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null, info: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) {
    console.error("Nokri Book crashed:", error, info);
    this.setState({ info });
    // The actual fix here: this used to ONLY go to console.error, which is
    // gone forever the instant the tab closes or reloads — meaning the
    // *only* way to ever find out what broke was to have DevTools open and
    // watching at the exact moment it happened. Almost never true in
    // practice. Persisting the real error to localStorage (survives
    // reload/close) and showing it directly on the crash screen itself
    // means the actual cause is right there to read or copy, every time,
    // with no DevTools needed at all.
    try {
      localStorage.setItem("nb_last_crash", JSON.stringify({
        message: error && error.message,
        stack: error && error.stack,
        componentStack: info && info.componentStack,
        at: new Date().toISOString(),
        url: window.location.href,
      }));
    } catch (e) { /* storage full/unavailable — the on-screen display below still works for this session */ }
  }
  render() {
    if (this.state.error) {
      const details = `${this.state.error && this.state.error.message}\n\n${(this.state.error && this.state.error.stack) || ""}`.trim();
      return (
        <div style={{ position: "fixed", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", background: "#F4EBDC", padding: 24, overflowY: "auto" }}>
          <div style={{ maxWidth: 560, textAlign: "center" }}>
            <div style={{ fontSize: 34, marginBottom: 10 }}>⚠️</div>
            <div style={{ fontSize: 17, fontWeight: 700, color: "#2B2116", marginBottom: 8 }}>Something went wrong</div>
            <div style={{ fontSize: 13.5, color: "#6E5D49", marginBottom: 18 }}>
              This screen hit an unexpected error. Your data is safe — every change is saved as it happens. Reloading usually fixes it.
            </div>
            <div style={{ display: "flex", gap: 10, justifyContent: "center", marginBottom: 18 }}>
              <button onClick={() => window.location.reload()} style={{ background: "#D98E2B", color: "#fff", border: "none", borderRadius: 8, padding: "10px 20px", fontSize: 14, fontWeight: 700, cursor: "pointer" }}>Reload</button>
              <button
                onClick={(e) => {
                  navigator.clipboard.writeText(details).then(() => {
                    e.target.textContent = "Copied!";
                    setTimeout(() => { e.target.textContent = "Copy error details"; }, 1500);
                  }).catch(() => {});
                }}
                style={{ background: "#fff", color: "#2B2116", border: "1px solid #D9CBB0", borderRadius: 8, padding: "10px 20px", fontSize: 14, fontWeight: 700, cursor: "pointer" }}
              >Copy error details</button>
              <button
                onClick={() => { auth.signOut().catch((e) => console.error("Sign out failed:", e)).finally(() => window.location.reload()); }}
                style={{ background: "#fff", color: "#2B2116", border: "1px solid #D9CBB0", borderRadius: 8, padding: "10px 20px", fontSize: 14, fontWeight: 700, cursor: "pointer" }}
              >Back to sign in</button>
            </div>
            <pre style={{
              textAlign: "left", fontSize: 11.5, color: "#6E5D49", background: "#FFFDF8", border: "1px solid #E8DCC4",
              borderRadius: 8, padding: 12, maxHeight: 220, overflow: "auto", whiteSpace: "pre-wrap", wordBreak: "break-word",
            }}>{details || "(no error details captured)"}</pre>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

function RootApp() {
  const params = new URLSearchParams(window.location.search);
  let viewUid = params.get("view");
  // Ignoring a malformed ?view= param outright (rather than trying to
  // use it and crashing) — same reasoning as extractShareUid above, for
  // whatever might land in the URL itself rather than the paste-a-link
  // field.
  if (viewUid && !looksLikeFirebaseUid(viewUid)) viewUid = null;
  // No ?view= in the URL this time — check whether this browser has a
  // share link pinned from the sign-in screen before. If so, treat it
  // exactly as if that code were in the URL, so a bare visit to the site
  // (no link needed at all) goes straight into that person's pinned
  // roster every time, on this device only.
  if (!viewUid) {
    try {
      const pinned = localStorage.getItem(PINNED_VIEW_KEY);
      if (pinned) {
        if (looksLikeFirebaseUid(pinned)) {
          viewUid = pinned;
        } else {
          // Self-heals a device already affected by the bug described
          // above extractShareUid — a genuinely corrupted stored value
          // (from before that fix existed) would otherwise crash every
          // single future page load forever, no matter how many times
          // "Reload" or "Back to sign in" gets clicked, since both just
          // load this same code again and read the same bad value back
          // out. Clearing it here breaks that loop permanently, this one
          // time, on this device.
          localStorage.removeItem(PINNED_VIEW_KEY);
        }
      }
    } catch (e) { /* localStorage unavailable — just fall through to normal sign-in */ }
  }
  if (viewUid) return <PublicRosterView uid={viewUid} />;
  return <DutyRoster />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><RootApp /></ErrorBoundary>);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js").then((reg) => {
        // Actively checks for a newer service-worker.js on every load
        // instead of waiting for the browser's own (much slower, often
        // 24h+) background update check — new deploys take effect the
        // next time someone opens the app, not "eventually".
        reg.update().catch(() => {});
      }).catch((e) => console.warn("SW registration failed", e));
    });
  }
</script>
</body>

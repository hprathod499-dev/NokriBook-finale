}

// Miscellaneous duty — a one-off task that doesn't deserve a permanent
// work type of its own (a single errand, an escort, a one-time summons).
// A single required text field replaces picking a work type; whatever's
// typed there becomes the note on the actual duty entry, so it's easy
// later to look at someone's history and see exactly what they were sent
// to do, not just a generic label. Every assignment lands in the same
// auto-created "Miscellaneous duty" category behind the scenes (created
// on first use), so it still gets its own roster/history/fairness tabs
// like any other work type without needing to be set up by hand first.
function MiscDutyView({ data, assignMiscDuty, assignMiscDutyRange }) {
  const { t } = useLang();
  const [numberInput, setNumberInput] = useState("");
  const [nameInput, setNameInput] = useState("");
  const [dutyType, setDutyType] = useState("");
  const [extraNote, setExtraNote] = useState("");
  const [oneDayOnly, setOneDayOnly] = useState(true);
  const [date, setDate] = useState(todayStr());
  const [dateFrom, setDateFrom] = useState(todayStr());
  const [dateTo, setDateTo] = useState(todayStr());

  const lookupPreview = useMemo(() => {
    const num = numberInput.trim();
    if (!num) return null;
    const s = data.staff[num];
    return s ? s.name : null;
  }, [numberInput, data.staff]);

  const dayCount = oneDayOnly ? 1 : dateRangeStrs(dateFrom, dateTo).length;
  const canAssign = numberInput.trim() && (lookupPreview || nameInput.trim()) && dutyType.trim() && dayCount > 0;
  const [showInfo, setShowInfo] = useState(false);

  const handleAssign = () => {
    if (!canAssign) return;
    const name = lookupPreview || nameInput.trim();
    if (oneDayOnly) {
      assignMiscDuty(numberInput.trim(), name, dutyType.trim(), extraNote.trim(), date);
    } else {
      assignMiscDutyRange(numberInput.trim(), name, dutyType.trim(), extraNote.trim(), dateFrom, dateTo);
    }
    setNumberInput("");
    setNameInput("");
    setDutyType("");
    setExtraNote("");
    setDate(todayStr());
    setDateFrom(todayStr());
    setDateTo(todayStr());
  };

  return (
    <React.Fragment>
      <div style={{ display: "flex", alignItems: "center", marginBottom: showInfo ? 4 : 20 }}>
        <h1 className="disp gu" style={{ fontSize: 22, fontWeight: 700, margin: 0 }}>{t("Miscellaneous", "વિવિધ")}</h1>
        <InfoIconButton active={showInfo} onClick={() => setShowInfo((v) => !v)} label={t("About this screen", "આ સ્ક્રીન વિશે")} />
      </div>
      {showInfo && (
        <p style={{ fontSize: 13, color: "var(--text-secondary)", margin: "0 0 20px", maxWidth: 520 }} className="gu">
          {t(
            "For a one-off task that doesn't need its own permanent work type — describe what the duty actually is, and that description is what gets saved and shown later, not just \"Miscellaneous\".",
            "એક વખતના કામ માટે જેને પોતાનો કાયમી કામનો પ્રકાર જરૂરી નથી — ડ્યુટી ખરેખર શું છે તે વર્ણવો, અને એ વર્ણન જ સાચવવામાં આવે છે અને પછીથી બતાવવામાં આવે છે, ફક્ત \"વિવિધ\" નહીં."
          )}
        </p>
      )}

      <div style={{ background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 10, padding: 18, maxWidth: 480 }}>
        <div style={{ marginBottom: 14 }}>
          <label style={{ display: "block", fontSize: 12, fontWeight: 600, color: "var(--text-secondary)", marginBottom: 5 }} className="gu">{t("Buckle number", "બકલ નંબર")}</label>
          <input type="text" value={numberInput} onChange={(e) => setNumberInput(e.target.value)} className="mono" style={{ width: "100%", boxSizing: "border-box" }} />
          {numberInput.trim() && (
            <div style={{ fontSize: 11.5, marginTop: 4 }} className="gu">
              {lookupPreview
                ? <span style={{ color: "var(--status-success-text)" }}>{lookupPreview}</span>
                : <span style={{ color: "var(--status-warning-text)" }}>{t("New number — enter their name below", "નવો નંબર — નીચે તેમનું નામ દાખલ કરો")}</span>}
            </div>
          )}
        </div>

        {!lookupPreview && numberInput.trim() && (
          <div style={{ marginBottom: 14 }}>
            <label style={{ display: "block", fontSize: 12, fontWeight: 600, color: "var(--text-secondary)", marginBottom: 5 }} className="gu">{t("Name", "નામ")}</label>
            <input type="text" value={nameInput} onChange={(e) => setNameInput(e.target.value)} className="gu" style={{ width: "100%", boxSizing: "border-box" }} />
          </div>
        )}

        <div style={{ marginBottom: 14 }}>
          <label style={{ display: "block", fontSize: 12, fontWeight: 600, color: "var(--text-secondary)", marginBottom: 5 }} className="gu">{t("What is this duty? (required)", "આ ડ્યુટી શું છે? (જરૂરી)")}</label>
          <input type="text" value={dutyType} onChange={(e) => setDutyType(e.target.value)} placeholder={t("e.g. Escorted VIP to airport, one-time court summons…", "દા.ત. VIP ને એરપોર્ટ સુધી લઈ ગયા, એક વખતનું કોર્ટ સમન્સ…")} className="gu" style={{ width: "100%", boxSizing: "border-box" }} />
        </div>

        <div style={{ marginBottom: 14 }}>
          <label style={{ display: "block", fontSize: 12, fontWeight: 600, color: "var(--text-secondary)", marginBottom: 5 }} className="gu">{t("Note (optional)", "નોંધ (વૈકલ્પિક)")}</label>
          <input type="text" value={extraNote} onChange={(e) => setExtraNote(e.target.value)} placeholder={t("Any extra detail beyond the duty description above", "ઉપરના ડ્યુટી વર્ણન ઉપરાંત કોઈ વધારાની વિગત")} className="gu" style={{ width: "100%", boxSizing: "border-box" }} />
        </div>

        <div style={{ marginBottom: 10, display: "flex", gap: 6 }}>
          <button
            onClick={() => setOneDayOnly(true)}
            style={{ flex: 1, padding: "7px 0", borderRadius: 20, border: "1px solid " + (oneDayOnly ? "#D98E2B" : "var(--border)"), background: oneDayOnly ? "#D98E2B" : "transparent", color: oneDayOnly ? "#fff" : "var(--text-primary)", fontSize: 12, fontWeight: 600, cursor: "pointer" }} className="gu"
          >{t("One day only", "ફક્ત એક દિવસ")}</button>
          <button
            onClick={() => setOneDayOnly(false)}
            style={{ flex: 1, padding: "7px 0", borderRadius: 20, border: "1px solid " + (!oneDayOnly ? "#D98E2B" : "var(--border)"), background: !oneDayOnly ? "#D98E2B" : "transparent", color: !oneDayOnly ? "#fff" : "var(--text-primary)", fontSize: 12, fontWeight: 600, cursor: "pointer" }} className="gu"
          >{t("Multiple days", "એક કરતાં વધુ દિવસ")}</button>
        </div>

        {oneDayOnly ? (
          <div style={{ marginBottom: 18 }}>
            <label style={{ display: "block", fontSize: 12, fontWeight: 600, color: "var(--text-secondary)", marginBottom: 5 }} className="gu">{t("Date", "તારીખ")}</label>
            <input type="date" value={date} onChange={(e) => setDate(e.target.value)} />
          </div>
        ) : (
          <div style={{ display: "flex", gap: 10, marginBottom: 18, flexWrap: "wrap", alignItems: "flex-end" }}>
            <div>
              <label style={{ display: "block", fontSize: 12, fontWeight: 600, color: "var(--text-secondary)", marginBottom: 5 }} className="gu">{t("From date", "તારીખ થી")}</label>
              <input type="date" value={dateFrom} onChange={(e) => { setDateFrom(e.target.value); if (dateTo < e.target.value) setDateTo(e.target.value); }} />
            </div>
            <div>
              <label style={{ display: "block", fontSize: 12, fontWeight: 600, color: "var(--text-secondary)", marginBottom: 5 }} className="gu">{t("To date", "તારીખ સુધી")}</label>
              <input type="date" value={dateTo} min={dateFrom} onChange={(e) => setDateTo(e.target.value)} />
            </div>
            {dayCount > 1 && (
              <div className="gu" style={{ fontSize: 11.5, fontWeight: 600, color: "var(--status-info-text)", background: "var(--status-info-bg)", border: "1px solid var(--status-info-border)", borderRadius: 20, padding: "5px 10px" }}>
                {t(`${dayCount} days`, `${dayCount} દિવસ`)}
              </div>
            )}
          </div>
        )}

        <button
          onClick={handleAssign}
          disabled={!canAssign}
          style={{
            background: canAssign ? "#D98E2B" : "var(--border)", color: "#fff", border: "none", borderRadius: 7,
            padding: "9px 16px", fontSize: 13, fontWeight: 600, width: "100%", cursor: canAssign ? "pointer" : "default",
          }} className="gu"
        >{t("Assign miscellaneous duty", "વિવિધ ડ્યુટી સોંપો")}</button>
      </div>
    </React.Fragment>
  );
}

// Record Leave — batch entry: pick a leave type and date(s) once, then add
// as many people to that batch as needed (same person again for a
// different stretch, or a different person entirely) before actually
// saving anything. Each entry gets added to a visible queue below the
// form; nothing is written until "Record N leave(s)" is pressed, so a
// whole day's worth of leave notices — several different people, several
// different reasons — can be sorted out in one sitting instead of
// re-opening this form from scratch for every single person.
function RecordLeaveView({ data, setUnavailable, showToast }) {
  const { t } = useLang();
  const leaveTypes = data.leaveTypes || [];
  const [typeId, setTypeId] = useState(leaveTypes[0] ? leaveTypes[0].id : "");
  const [oneDayOnly, setOneDayOnly] = useState(true);
  const [from, setFrom] = useState(todayStr());
  const [to, setTo] = useState(todayStr());
  const [numberInput, setNumberInput] = useState("");
  const [queue, setQueue] = useState([]); // [{ number, name, typeId, typeLabel, from, to }]
  const [showInfo, setShowInfo] = useState(false);

  const selectedType = leaveTypes.find((lt) => lt.id === typeId);
  const isIndefinite = !!(selectedType && selectedType.indefinite);

  const lookupName = useMemo(() => {
    const num = numberInput.trim();
    if (!num) return null;
    const s = data.staff[num];
    return s ? s.name : undefined; // undefined = not found, null = nothing typed yet
  }, [numberInput, data.staff]);

  const effectiveTo = isIndefinite ? null : (oneDayOnly ? from : to);
  const canAdd = numberInput.trim() && lookupName && typeId && from && (isIndefinite || (effectiveTo && effectiveTo >= from));

  const addToQueue = () => {
    if (!canAdd) return;
    const num = numberInput.trim();
    setQueue((q) => [...q, { number: num, name: lookupName, typeId, typeLabel: selectedType ? selectedType.label : "", from, to: effectiveTo }]);
    setNumberInput("");
  };

  const removeFromQueue = (idx) => setQueue((q) => q.filter((_, i) => i !== idx));

  const recordAll = () => {
    if (queue.length === 0) return;
    // Every entry writes silently (no per-entry toast) — a single summary
    // toast at the end instead of one popping up for every person in a
    // batch of, say, ten.
    queue.forEach((entry) => setUnavailable(entry.number, "Leave", entry.typeId, entry.from, entry.to, true));
    showToast(t(`Recorded ${queue.length} leave ${queue.length === 1 ? "entry" : "entries"}`, `${queue.length} રજા નોંધાઈ`));
    setQueue([]);
  };

  return (
    <React.Fragment>
      <div style={{ display: "flex", alignItems: "center", marginBottom: showInfo ? 4 : 20 }}>
        <h1 className="disp gu" style={{ fontSize: 22, fontWeight: 700, margin: 0 }}>{t("Record Leave", "રજા નોંધો")}</h1>
        <InfoIconButton active={showInfo} onClick={() => setShowInfo((v) => !v)} label={t("About this screen", "આ સ્ક્રીન વિશે")} />
      </div>
      {showInfo && (
        <p style={{ fontSize: 13, color: "var(--text-secondary)", margin: "0 0 20px", maxWidth: 520 }} className="gu">
          {t(
            "Pick a leave type and date once, then add as many people to the list below as needed — different people, or the same person again for a separate stretch — before saving all of it together.",
            "એક વખત રજાનો પ્રકાર અને તારીખ પસંદ કરો, પછી નીચેની યાદીમાં જરૂર મુજબ ઘણા લોકો ઉમેરો — અલગ લોકો, અથવા એ જ વ્યક્તિ ફરીથી અલગ સમયગાળા માટે — બધું એકસાથે સાચવતાં પહેલાં."
          )}
        </p>
      )}

      <div style={{ background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 10, padding: 18, maxWidth: 480, marginBottom: queue.length ? 18 : 0 }}>
        <div style={{ marginBottom: 14 }}>
          <label style={{ display: "block", fontSize: 12, fontWeight: 600, color: "var(--text-secondary)", marginBottom: 5 }} className="gu">{t("Leave type", "રજાનો પ્રકાર")}</label>
          <select value={typeId} onChange={(e) => setTypeId(e.target.value)} style={{ width: "100%", boxSizing: "border-box", fontSize: 13 }} className="gu">
            {leaveTypes.length === 0 && <option value="">{t("No leave types set up yet", "હજુ કોઈ રજાનો પ્રકાર સેટ નથી")}</option>}
            {leaveTypes.map((lt) => <option key={lt.id} value={lt.id}>{lt.label}</option>)}
          </select>
        </div>

        {!isIndefinite && (
          <React.Fragment>
            <div style={{ marginBottom: 10, display: "flex", alignItems: "center", gap: 7 }}>
              <input type="checkbox" id="oneDayOnlyCk" checked={oneDayOnly} onChange={(e) => setOneDayOnly(e.target.checked)} />
              <label htmlFor="oneDayOnlyCk" style={{ fontSize: 12.5, color: "var(--text-primary)", cursor: "pointer" }} className="gu">{t("One day only", "ફક્ત એક દિવસ")}</label>
            </div>
            <div style={{ marginBottom: 14, display: "flex", gap: 10 }}>
              <div style={{ flex: 1 }}>
                <label style={{ display: "block", fontSize: 12, fontWeight: 600, color: "var(--text-secondary)", marginBottom: 5 }} className="gu">{oneDayOnly ? t("Date", "તારીખ") : t("From", "થી")}</label>
                <input type="date" value={from} onChange={(e) => { setFrom(e.target.value); if (oneDayOnly) setTo(e.target.value); }} style={{ width: "100%", boxSizing: "border-box" }} />
              </div>
              {!oneDayOnly && (
                <div style={{ flex: 1 }}>
                  <label style={{ display: "block", fontSize: 12, fontWeight: 600, color: "var(--text-secondary)", marginBottom: 5 }} className="gu">{t("To", "સુધી")}</label>
                  <input type="date" value={to} onChange={(e) => setTo(e.target.value)} style={{ width: "100%", boxSizing: "border-box" }} />
                </div>
              )}
            </div>
          </React.Fragment>
        )}
        {isIndefinite && (
          <div style={{ marginBottom: 14 }}>
            <label style={{ display: "block", fontSize: 12, fontWeight: 600, color: "var(--text-secondary)", marginBottom: 5 }} className="gu">{t("Starts", "શરૂ થાય છે")}</label>
            <input type="date" value={from} onChange={(e) => setFrom(e.target.value)} style={{ width: "100%", boxSizing: "border-box" }} />
            <div style={{ fontSize: 11, color: "var(--text-tertiary)", marginTop: 4 }} className="gu">{t("This type has no fixed end date.", "આ પ્રકારની કોઈ નિશ્ચિત અંતિમ તારીખ નથી.")}</div>
          </div>
        )}

        <div style={{ marginBottom: 14 }}>
          <label style={{ display: "block", fontSize: 12, fontWeight: 600, color: "var(--text-secondary)", marginBottom: 5 }} className="gu">{t("Buckle number", "બકલ નંબર")}</label>
          <input
            type="text" value={numberInput} onChange={(e) => setNumberInput(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); addToQueue(); } }}
            className="mono" style={{ width: "100%", boxSizing: "border-box" }}
          />
          {numberInput.trim() && (
            <div style={{ fontSize: 11.5, marginTop: 4 }} className="gu">
              {lookupName
                ? <span style={{ color: "var(--status-success-text)" }}>{lookupName}</span>
                : <span style={{ color: "var(--status-error-text)" }}>{t("No staff found with that number — add them in Manage staff first", "તે નંબર સાથે કોઈ સ્ટાફ મળ્યો નથી — પહેલા સ્ટાફ સંચાલિત કરોમાં ઉમેરો")}</span>}
            </div>
          )}
        </div>

        <button
          onClick={addToQueue}
          disabled={!canAdd}
          style={{
            background: canAdd ? "var(--btn-dark-bg)" : "var(--border)", color: "#fff", border: "none", borderRadius: 7,
            padding: "8px 16px", fontSize: 13, fontWeight: 600, width: "100%", cursor: canAdd ? "pointer" : "default",
          }} className="gu"
        >+ {t("Add to list", "યાદીમાં ઉમેરો")}</button>
      </div>

      {queue.length > 0 && (
        <div style={{ maxWidth: 480 }}>
          <div style={{ fontSize: 12, fontWeight: 700, color: "var(--text-secondary)", marginBottom: 8, textTransform: "uppercase", letterSpacing: 0.4 }} className="gu">
            {t(`${queue.length} to record`, `${queue.length} નોંધવાના`)}
          </div>
          {queue.map((entry, idx) => (
            <div key={idx} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 8, padding: "8px 12px", marginBottom: 6 }}>
              <div style={{ fontSize: 12.5 }} className="gu">
                <span style={{ fontWeight: 600 }}>{entry.name}</span>
                <span style={{ color: "var(--text-tertiary)" }}> #{entry.number} · {entry.typeLabel} · {formatDMY(entry.from)}{entry.to && entry.to !== entry.from ? ` – ${formatDMY(entry.to)}` : ""}{!entry.to ? ` ${t("onward", "થી આગળ")}` : ""}</span>
              </div>
              <button onClick={() => removeFromQueue(idx)} title={t("Remove from list", "યાદીમાંથી કાઢી નાખો")} aria-label={t("Remove from list", "યાદીમાંથી કાઢી નાખો")} style={{ ...iconBtn, flexShrink: 0 }}>✕</button>
            </div>
          ))}
          <button
            onClick={recordAll}
            style={{ background: "#D98E2B", color: "#fff", border: "none", borderRadius: 7, padding: "9px 16px", fontSize: 13, fontWeight: 600, width: "100%", marginTop: 8 }} className="gu"
          >{t(`Record ${queue.length} leave${queue.length === 1 ? "" : "s"}`, `${queue.length} રજા નોંધો`)}</button>
        </div>
      )}
    </React.Fragment>
  );
}

function GroupDutyView({ data, assignGroupDuty }) {
  const { t, lang } = useLang();
  const [catId, setCatId] = useState("");
  const [numberInput, setNumberInput] = useState("");
  const [nameInput, setNameInput] = useState("");
  const [people, setPeople] = useState([]); // { number, name }
  const [dateFrom, setDateFrom] = useState(todayStr());
  const [dateTo, setDateTo] = useState(todayStr());
  const [oneDayOnly, setOneDayOnly] = useState(true);
  const [note, setNote] = useState("");
  const [markOutstation, setMarkOutstation] = useState(false);
  const outstationTypes = data.outstationTypes || DEFAULT_OUTSTATION_TYPES;
  const [outstationTypeId, setOutstationTypeId] = useState("");
  const [showInfo, setShowInfo] = useState(false);
  const [lastAssigned, setLastAssigned] = useState(null); // snapshot for the WhatsApp step below

  const lookupPreview = useMemo(() => {
    const num = numberInput.trim();
    if (!num) return null;
    const s = data.staff[num];
    return s ? s.name : null;
  }, [numberInput, data.staff]);

  const addPerson = (e) => {
    if (e) e.preventDefault();
    const num = numberInput.trim();
    if (!num) return;
    if (people.some((p) => p.number === num)) { setNumberInput(""); setNameInput(""); return; }
    const existing = data.staff[num];
    const name = existing ? existing.name : nameInput.trim();
    if (!existing && !name) return; // waiting on a name for a brand-new number
    setPeople((cur) => [...cur, { number: num, name }]);
    setNumberInput("");
    setNameInput("");
  };

  const removePerson = (num) => setPeople((cur) => cur.filter((p) => p.number !== num));

  const cat = (data.categories || []).find((c) => c.id === catId);
  const effectiveDateTo = oneDayOnly ? dateFrom : dateTo;
  const dayCount = dateRangeStrs(dateFrom, effectiveDateTo).length;
  const effectiveOutstationTypeId = outstationTypeId || (outstationTypes[0] ? outstationTypes[0].id : "");
  const canAssign = !!catId && people.length > 0 && !!dateFrom && dayCount > 0 && (!markOutstation || !!effectiveOutstationTypeId);

  const handleAssign = () => {
    if (!canAssign) return;
    assignGroupDuty(catId, people, dateFrom, effectiveDateTo, note, markOutstation ? effectiveOutstationTypeId : null);
    setLastAssigned({ catLabel: cat ? cat.label : "", dateFrom, dateTo: effectiveDateTo, people });
    setPeople([]);
    setNote("");
    setMarkOutstation(false);
  };

  return (
    <React.Fragment>
      <div style={{ display: "flex", alignItems: "center", marginBottom: showInfo ? 4 : 20 }}>
        <h1 className="disp gu" style={{ fontSize: 22, fontWeight: 700, margin: 0 }}>{t("Group duty", "જૂથ ડ્યુટી")}</h1>
        <InfoIconButton active={showInfo} onClick={() => setShowInfo((v) => !v)} label={t("About this screen", "આ સ્ક્રીન વિશે")} />
      </div>
      {showInfo && (
        <p style={{ fontSize: 13, color: "var(--text-secondary)", margin: "0 0 20px", maxWidth: 560 }} className="gu">
          {t(
            "Type a buckle number for each person, pick a work type and date range, and assign the same duty to everyone at once — then send each of them a WhatsApp message naming the rest of their group.",
            "દરેક વ્યક્તિ માટે બકલ નંબર દાખલ કરો, કામનો પ્રકાર અને તારીખ શ્રેણી પસંદ કરો, અને બધાને એકસાથે એ જ ડ્યુટી સોંપો — પછી દરેકને તેમના જૂથના બાકીના સભ્યોના નામ સાથે WhatsApp સંદેશ મોકલો."
          )}
        </p>
      )}

      <div style={{ background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 10, padding: 18, marginBottom: 20, maxWidth: 560 }}>
        <div style={{ marginBottom: 14 }}>
          <label style={{ display: "block", fontSize: 12, fontWeight: 600, color: "var(--text-secondary)", marginBottom: 5 }} className="gu">{t("Work type", "કામનો પ્રકાર")}</label>
          <select value={catId} onChange={(e) => setCatId(e.target.value)} className="gu" style={{ width: "100%", fontSize: 13 }}>
            <option value="">{t("Select a work type…", "કામનો પ્રકાર પસંદ કરો…")}</option>
            {(data.categories || []).map((c) => <option key={c.id} value={c.id}>{c.label}</option>)}
          </select>
        </div>

        <div style={{ marginBottom: 10, display: "flex", gap: 6, maxWidth: 300 }}>
          <button
            onClick={() => setOneDayOnly(true)}
            style={{ flex: 1, padding: "7px 0", borderRadius: 20, border: "1px solid " + (oneDayOnly ? "#D98E2B" : "var(--border)"), background: oneDayOnly ? "#D98E2B" : "transparent", color: oneDayOnly ? "#fff" : "var(--text-primary)", fontSize: 12, fontWeight: 600, cursor: "pointer" }} className="gu"
          >{t("One day only", "ફક્ત એક દિવસ")}</button>
          <button
            onClick={() => setOneDayOnly(false)}
            style={{ flex: 1, padding: "7px 0", borderRadius: 20, border: "1px solid " + (!oneDayOnly ? "#D98E2B" : "var(--border)"), background: !oneDayOnly ? "#D98E2B" : "transparent", color: !oneDayOnly ? "#fff" : "var(--text-primary)", fontSize: 12, fontWeight: 600, cursor: "pointer" }} className="gu"
          >{t("Multiple days", "એક કરતાં વધુ દિવસ")}</button>
        </div>

        <div style={{ display: "flex", gap: 10, marginBottom: 14, flexWrap: "wrap", alignItems: "flex-end" }}>
          <div>
            <label style={{ display: "block", fontSize: 12, fontWeight: 600, color: "var(--text-secondary)", marginBottom: 5 }} className="gu">{oneDayOnly ? t("Date", "તારીખ") : t("From date", "તારીખ થી")}</label>
            <input type="date" value={dateFrom} onChange={(e) => { setDateFrom(e.target.value); if (dateTo < e.target.value) setDateTo(e.target.value); }} />
          </div>
          {!oneDayOnly && (
            <div>
              <label style={{ display: "block", fontSize: 12, fontWeight: 600, color: "var(--text-secondary)", marginBottom: 5 }} className="gu">{t("To date", "તારીખ સુધી")}</label>
              <input type="date" value={dateTo} min={dateFrom} onChange={(e) => setDateTo(e.target.value)} />
            </div>
          )}
          {dayCount > 1 && (
            <div className="gu" style={{ fontSize: 11.5, fontWeight: 600, color: "var(--status-info-text)", background: "var(--status-info-bg)", border: "1px solid var(--status-info-border)", borderRadius: 20, padding: "5px 10px" }}>
              {t(`${dayCount} days`, `${dayCount} દિવસ`)}
            </div>
          )}
          <div style={{ flex: 1, minWidth: 160 }}>
            <label style={{ display: "block", fontSize: 12, fontWeight: 600, color: "var(--text-secondary)", marginBottom: 5 }} className="gu">{t("Note (optional)", "નોંધ (વૈકલ્પિક)")}</label>
            <input type="text" value={note} onChange={(e) => setNote(e.target.value)} className="gu" style={{ width: "100%", boxSizing: "border-box" }} />
          </div>
        </div>

        <div style={{
          display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap", marginBottom: 14,
          background: markOutstation ? "var(--status-purple-bg)" : "var(--bg-surface-2)",
          border: "1px solid " + (markOutstation ? "var(--status-purple-border)" : "var(--border-soft)"),
          borderRadius: 8, padding: "10px 12px",
        }}>
          <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12.5, fontWeight: 600, color: markOutstation ? "var(--status-purple-text)" : "var(--text-secondary)", cursor: "pointer" }} className="gu">
            <input type="checkbox" checked={markOutstation} onChange={(e) => setMarkOutstation(e.target.checked)} />
            {t("Also mark everyone Outstation for these dates", "આ તારીખો માટે બધાને બહારગામ તરીકે પણ માર્ક કરો")}
          </label>
          {markOutstation && (
            <select value={effectiveOutstationTypeId} onChange={(e) => setOutstationTypeId(e.target.value)} className="gu" style={{ fontSize: 12.5, padding: "5px 8px" }}>
              {outstationTypes.map((ot) => <option key={ot.id} value={ot.id}>{ot.label}</option>)}
            </select>
          )}
        </div>
        {markOutstation && (
          <p style={{ fontSize: 11.5, color: "var(--text-tertiary)", margin: "-8px 0 14px" }} className="gu">
            {t("Saves a separate trip to Manage Staff — everyone in the group is automatically marked Outstation for this same date range, so they show as away everywhere (roster, calendar) without a manual entry per person.", "મેનેજ સ્ટાફની અલગ મુલાકાત બચાવે છે — જૂથના બધા સભ્યોને આ જ તારીખ શ્રેણી માટે આપમેળે બહારગામ તરીકે માર્ક કરવામાં આવે છે, જેથી તેઓ દરેક વ્યક્તિ માટે મેન્યુઅલ એન્ટ્રી વગર બધે (રોસ્ટર, કૅલેન્ડર) ગેરહાજર તરીકે બતાય.")}
          </p>
        )}

        <label style={{ display: "block", fontSize: 12, fontWeight: 600, color: "var(--text-secondary)", marginBottom: 5 }} className="gu">{t("Add people to the group", "જૂથમાં લોકો ઉમેરો")}</label>
        <form onSubmit={addPerson} style={{ display: "flex", gap: 8, marginBottom: 6, flexWrap: "wrap", alignItems: "flex-start" }}>
          <div>
            <input type="text" placeholder={t("Buckle number", "બકલ નંબર")} value={numberInput} onChange={(e) => setNumberInput(e.target.value)} className="gu" style={{ width: 140 }} />
            {numberInput.trim() && (
              lookupPreview
                ? <div className="gu" style={{ fontSize: 11, color: "var(--status-success-text)", marginTop: 3 }}>→ {lookupPreview}</div>
                : <div className="gu" style={{ fontSize: 11, color: "var(--status-warning-text)", marginTop: 3 }}>{t("New number — enter name →", "નવો નંબર — નામ દાખલ કરો →")}</div>
            )}
          </div>
          {numberInput.trim() && !lookupPreview && (
            <input type="text" placeholder={t("Name", "નામ")} value={nameInput} onChange={(e) => setNameInput(e.target.value)} className="gu" style={{ width: 160 }} />
          )}
          <button type="submit" style={{ background: "var(--btn-dark-bg)", color: "#fff", border: "none", borderRadius: 7, padding: "8px 14px", fontSize: 13, fontWeight: 600 }} className="gu">+ {t("Add", "ઉમેરો")}</button>
        </form>

        {people.length > 0 && (
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, margin: "10px 0 16px" }}>
            {people.map((p) => (
              <span key={p.number} className="gu" style={{ display: "flex", alignItems: "center", gap: 6, background: "var(--bg-surface-2)", border: "1px solid var(--border)", borderRadius: 20, padding: "4px 6px 4px 12px", fontSize: 12.5 }}>
                {p.name} <span className="mono" style={{ color: "var(--text-tertiary)", fontSize: 11 }}>#{p.number}</span>
                <button onClick={() => removePerson(p.number)} title={t("Remove", "કાઢી નાખો")} aria-label={t("Remove {name}", "{name} ને કાઢી નાખો").replace("{name}", p.name)} style={{ background: "transparent", border: "none", color: "var(--text-tertiary)", fontSize: 12, cursor: "pointer", padding: "2px 4px" }}>✕</button>
              </span>
            ))}
          </div>
        )}

        <button
          onClick={handleAssign}
          disabled={!canAssign}
          style={{
            background: canAssign ? "#D98E2B" : "var(--status-warning-border)", color: "#fff",
            border: "none", borderRadius: 8, padding: "10px 16px", fontSize: 13.5, fontWeight: 700,
          }} className="gu"
        >
          {people.length > 0
            ? t(`Assign duty to ${people.length} ${people.length === 1 ? "person" : "people"}`, `${people.length} લોકોને ડ્યુટી સોંપો`)
            : t("Assign duty to group", "જૂથને ડ્યુટી સોંપો")}
        </button>
      </div>

      {lastAssigned && (
        <div style={{ background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 10, padding: 18, maxWidth: 560 }}>
          <div className="disp gu" style={{ fontWeight: 700, fontSize: 14, marginBottom: 4 }}>{t("Send to WhatsApp", "WhatsApp પર મોકલો")}</div>
          <p style={{ fontSize: 12, color: "var(--text-tertiary)", margin: "0 0 14px" }} className="gu">
            {lastAssigned.catLabel} · {lastAssigned.dateTo && lastAssigned.dateTo !== lastAssigned.dateFrom ? `${formatDMY(lastAssigned.dateFrom)} – ${formatDMY(lastAssigned.dateTo)}` : formatDMY(lastAssigned.dateFrom)} — {t("each button below already has that person's saved number attached, so it opens straight into their chat with the message ready — no searching for their name in WhatsApp, just tap Send there.", "નીચેના દરેક બટન સાથે તે વ્યક્તિનો સેવ કરેલો નંબર પહેલેથી જોડાયેલો છે, તેથી તે સીધું તેમની ચેટમાં સંદેશ તૈયાર સાથે ખૂલે છે — WhatsAppમાં નામ શોધવાની જરૂર નથી, ત્યાં ફક્ત મોકલો ટેપ કરો.")}
          </p>

          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {lastAssigned.people.map((p) => {
              const staffRec = data.staff[p.number];
              const hasNumber = !!(staffRec && staffRec.phone);
              const others = lastAssigned.people.filter((x) => x.number !== p.number).map((x) => x.name);
              return (
                <div key={p.number} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 10px", background: "var(--bg-surface-2)", borderRadius: 8 }}>
                  <div style={{ minWidth: 0 }}>
                    <div className="gu" style={{ fontSize: 13 }}>{p.name} <span className="mono" style={{ color: "var(--text-tertiary)", fontSize: 11 }}>#{p.number}</span></div>
                    <div className="mono" style={{ fontSize: 10.5, color: hasNumber ? "var(--status-success-text)" : "#B8892E" }}>
                      {hasNumber ? staffRec.phone : t("No number on file — you'll need to pick them manually", "કોઈ નંબર નથી — તમારે તેમને જાતે પસંદ કરવા પડશે")}
                    </div>
                  </div>
                  <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
                    {hasNumber && (
                      <a href={`tel:${staffRec.phone}`} title={t("Call", "કૉલ કરો")} aria-label={t("Call", "કૉલ કરો")} style={{ background: "var(--bg-surface)", color: "var(--status-success-text)", border: "1px solid var(--status-success-border)", borderRadius: 6, padding: "7px 10px", fontSize: 12, fontWeight: 700, textDecoration: "none", display: "inline-flex", alignItems: "center" }}>📞</a>
                    )}
                    <button
                      onClick={() => shareDutyOnWhatsApp({ lang, name: p.name, number: p.number, catLabel: lastAssigned.catLabel, date: lastAssigned.dateFrom, dateTo: lastAssigned.dateTo, phone: staffRec && staffRec.phone, kind: "assigned", groupNames: others })}
                      style={{ background: hasNumber ? "#25D366" : "var(--bg-surface)", color: hasNumber ? "#fff" : "var(--status-success-text)", border: hasNumber ? "none" : "1px solid var(--status-success-border)", borderRadius: 6, padding: "7px 12px", fontSize: 12, fontWeight: 700 }} className="gu"
                    >{t("Send", "મોકલો")}</button>
                  </div>
                </div>
              );
            })}
          </div>

          <div style={{ borderTop: "1px solid var(--border-soft)", marginTop: 14, paddingTop: 10 }}>
            <button
              onClick={() => shareGroupDutyOnWhatsApp({ lang, catLabel: lastAssigned.catLabel, date: lastAssigned.dateFrom, dateTo: lastAssigned.dateTo, people: lastAssigned.people })}
              style={{ background: "transparent", color: "var(--text-secondary)", border: "1px solid var(--border)", borderRadius: 6, padding: "6px 10px", fontSize: 11.5, fontWeight: 600 }} className="gu"
            >{t("Or share one combined message via WhatsApp's picker instead", "અથવા તેના બદલે WhatsAppના પિકર દ્વારા એક સંયુક્ત સંદેશ શેર કરો")}</button>
          </div>
        </div>
      )}
    </React.Fragment>
  );
}

function CategoryView({ data, catId, addToCategory, removeFromCategory, importStaffToCategory, setSkipInCategory, skipInCategoryWithLog, setPresentInCategory, setLastDuty, assignDuty, clearCategoryHistory, deleteHistoryEntries, undo, redo, canUndo, canRedo }) {
  const { t, lang } = useLang();
  const [newNumber, setNewNumber] = useState("");
  const [newName, setNewName] = useState("");
  const [newDate, setNewDate] = useState(todayStr());
  const [editingDate, setEditingDate] = useState(null);
  // Removing someone from a work type used to be one tap on the ✕ with no
  // confirmation at all — easy to hit by accident while reaching for the
  // ✓ (assign) or 📲 (WhatsApp) buttons right next to it. Now the ✕ is
  // simply not there at all unless "Edit" (below, next to "Add to this
  // work type") is switched on first — an accidental tap on a hidden
  // button can't do anything.
  const [removeMode, setRemoveMode] = useState(false);
  const [tab, setTab] = useState("roster"); // roster | history
  const [assignTarget, setAssignTarget] = useState(null); // { number, name }
  // "rank" = normal fair-rotation order (default). "duties" = sorted by how
  // many times each person has done this work type, most first — lets you
  // spot at a glance who's carrying the load in this specific work type.
  const [sortMode, setSortMode] = useState("rank");
  const [rosterSearch, setRosterSearch] = useState("");
  // "Import Staff" picker: lets someone add several existing directory
  // staff to this work type's roster at once, instead of one at a time.
  // A plain centered modal (same pattern as HelpPanel/WelcomeModal, both
  // confirmed reliable) rather than a button-relative popup — the
  // previous version computed its position from the button's own
  // bounding rect, which turned out to not show up reliably at all;
  // removing that calculation entirely removes the whole class of bug
  // it could have been, instead of trying to debug coordinates blind.
  const [showImportMenu, setShowImportMenu] = useState(false);
  const [importSelected, setImportSelected] = useState(() => new Set());
  const [importSearch, setImportSearch] = useState("");
  const [importDesgFilter, setImportDesgFilter] = useState("");
  const debouncedRosterSearch = useDebouncedValue(rosterSearch);
  // Tapping a designation pill now ISOLATES that one designation (shows
  // only them) rather than hiding it — a single value, not a list, since
  // only one designation can be isolated at a time; tapping the same one
  // again (or "Show everyone") clears it back to the full roster.
  const [onlyDesignation, setOnlyDesignation] = useState(null);
  // The whole filter row starts collapsed behind an arrow (matching the
  // sidebar's own collapse arrow) so it doesn't take up space until
  // someone actually wants it.
  const [showDesignationFilter, setShowDesignationFilter] = useState(false);
  const [showInfo, setShowInfo] = useState(false);
  const [pdfBusy, setPdfBusy] = useState(false);
  const [pdfPeriod, setPdfPeriod] = useState({ key: "month", customFrom: todayStr(), customTo: todayStr() });
  const cat = data.categories.find((c) => c.id === catId);
  const membership = data.membership[catId] || [];

  const roster = useMemo(() => computeRoster(data, catId), [data, catId]);

  // Everyone in the staff directory who ISN'T already in this specific
  // work type's roster — the only people the Import Staff picker offers,
  // so "Select all" can never re-select someone already there in the
  // first place (importStaffToCategory's own filtering is a second,
  // independent safety net, not the only thing preventing duplicates).
  const importCandidates = useMemo(() => {
    const already = new Set(membership.map((m) => m.number));
    return Object.values(data.staff || {})
      .filter((s) => !already.has(s.number))
      .sort((a, b) => (a.name || "").localeCompare(b.name || ""));
  }, [data.staff, membership]);
  const filteredImportCandidates = useMemo(() => {
    const q = importSearch.trim().toLowerCase();
    let list = importCandidates;
    if (importDesgFilter) list = list.filter((s) => s.designation === importDesgFilter);
    if (!q) return list;
    return list.filter((s) => (s.name || "").toLowerCase().includes(q) || String(s.number || "").toLowerCase().includes(q));
  }, [importCandidates, importSearch, importDesgFilter]);

  // Total completed-duty count for this work type only, per person — used
  // to sort "fewest duties first" so whoever's been under-rostered for
  // THIS specific work type stands out immediately. Independent of the
  // fairness rank on the default tab, which only reflects waiting time.
  const rosterWithCounts = useMemo(
    () => roster.map((p) => ({ ...p, dutyCount: (p.history || []).length })),
    [roster]
  );

  const displayRoster = useMemo(() => {
    let list = rosterWithCounts;
    const q = debouncedRosterSearch.trim().toLowerCase();
    if (q) list = list.filter((p) => p.name.toLowerCase().includes(q) || String(p.number).toLowerCase().includes(q));
    if (onlyDesignation) {
      list = list.filter((p) => p.staffRec && p.staffRec.designation === onlyDesignation);
    }
    if (sortMode === "duties") {
      // Fewest-duties-first is meant to answer "who should get the next
      // duty" — someone on Skip/Leave/Outstation can't actually take a
      // duty right now, so a low count from being away shouldn't put them
      // above people who are genuinely available. Present people sort by
      // fewest duties first as before; everyone else drops to the bottom.
      list = [...list].sort((a, b) => {
        const aAway = a.status === "Present" ? 0 : 1;
        const bAway = b.status === "Present" ? 0 : 1;
        if (aAway !== bAway) return aAway - bAway;
        return a.dutyCount - b.dutyCount || a.name.localeCompare(b.name);
      });
    }
    return list;
  }, [rosterWithCounts, sortMode, debouncedRosterSearch, onlyDesignation]);

  // Every completed duty for THIS work type only, newest first, with
  // consecutive-day spans (an 11-day Group Duty) collapsed into a single
  // row instead of 11 — see groupHistoryRows.
  const historyRows = useMemo(() => {
    const rows = [];
    membership.forEach((m) => {
      const staffRec = data.staff[m.number];
      (m.history || []).forEach((entry, idx) => {
        rows.push({
          number: m.number,
          idx,
          name: staffRec ? staffRec.name : m.number,
          date: historyDate(entry),
          ts: historyTs(entry),
          note: historyNote(entry),
          extraNote: historyExtraNote(entry),
          batch: historyBatch(entry),
        });
      });
    });
    const sorted = rows.sort((a, b) => (b.date === a.date ? b.ts - a.ts : b.date.localeCompare(a.date)));
    return groupHistoryRows(sorted);
  }, [data, membership]);

  // Reset back to "roster" when switching work types, so History from the
  // previous work type never appears to carry over. Same for the
  // designation filter — a filter set up for one work type shouldn't
  // silently keep isolating people on a completely different one.
  useEffect(() => { setTab("roster"); setOnlyDesignation(null); }, [catId]);

  const nextUp = roster.find((p) => p.rank === 1);
  const presentCount = roster.filter((p) => p.status === "Present").length;
  const lookupPreview = newNumber.trim() && data.staff[newNumber.trim()] ? data.staff[newNumber.trim()].name : null;

  const handleDownloadPdf = async () => {
    setPdfBusy(true);
    try {
      await downloadCategoryPdf(cat ? cat.label : catId, roster, historyRows, pdfPeriod);
    } catch (e) {
      window.alert(t("Could not load Gujarati font — check your internet connection and try again.", "ગુજરાતી ફોન્ટ લોડ થઈ શક્યો નહીં — તમારું ઇન્ટરનેટ કનેક્શન તપાસો અને ફરી પ્રયાસ કરો."));
    } finally {
      setPdfBusy(false);
    }
  };

  return (
    <React.Fragment>
      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 4 }}>
        <div style={{ display: "flex", alignItems: "center" }}>
          <h1 className="disp" style={{ fontSize: 22, fontWeight: 700, margin: 0 }}>{cat ? cat.label : ""}</h1>
          <InfoIconButton active={showInfo} onClick={() => setShowInfo((v) => !v)} label={t("About this screen", "આ સ્ક્રીન વિશે")} />
        </div>
        <div style={{ fontSize: 12, color: "var(--text-secondary)" }} className="gu">{presentCount} {t("available", "ઉપલબ્ધ")}</div>
      </div>
      {showInfo && (
        <p style={{ fontSize: 13, color: "var(--text-secondary)", margin: "0 0 16px" }} className="gu">
          {t("Next duty always goes to whoever has waited longest — no manual pick. Leave and outstation are set once in Manage staff and apply to every work type automatically.", "આગલી ડ્યુટી હંમેશા સૌથી લાંબા સમયથી રાહ જોનારને જ મળે છે — કોઈ મેન્યુઅલ પસંદગી નથી. રજા અને બહારગામ સ્ટાફ સંચાલિત કરોમાં એકવાર સેટ થાય છે અને દરેક કામના પ્રકારને આપમેળે લાગુ પડે છે.")}
        </p>
      )}

      <div style={{ display: "flex", gap: 6, marginBottom: 20, justifyContent: "space-between", flexWrap: "wrap" }}>
        <div style={{ display: "flex", gap: 6 }}>
          <button onClick={() => setTab("roster")} style={catTabBtn(tab === "roster")} className="gu">{t("Roster", "રોસ્ટર")}</button>
          <button onClick={() => setTab("fairness")} style={catTabBtn(tab === "fairness")} className="gu">{t("Fairness", "ન્યાયીપણું")}</button>
          <button onClick={() => setTab("history")} style={catTabBtn(tab === "history")} className="gu">{t("History", "ઇતિહાસ")}</button>
        </div>
        <div style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap" }}>
          <PeriodFilterSelect period={pdfPeriod} setPeriod={setPdfPeriod} />
          <button
            onClick={handleDownloadPdf} disabled={pdfBusy}
            title={t("Download this work type's roster and history as a PDF", "આ કામના પ્રકારનું રોસ્ટર અને ઇતિહાસ PDF તરીકે ડાઉનલોડ કરો")}
            style={{ background: "#D98E2B", color: "#fff", border: "none", borderRadius: 7, padding: "6px 12px", fontSize: 12, fontWeight: 600, whiteSpace: "nowrap", opacity: pdfBusy ? 0.7 : 1 }} className="gu"
          >{pdfBusy ? t("Preparing…", "તૈયાર થઈ રહ્યું છે…") : "⬇ " + t("Download PDF", "PDF ડાઉનલોડ કરો")}</button>
        </div>
      </div>

      {tab === "history" ? (
        <CategoryHistoryTable key={catId} rows={historyRows} catLabel={cat ? cat.label : ""} onClearHistory={() => clearCategoryHistory(catId)} onDeleteSelected={(keys) => deleteHistoryEntries(catId, keys)} />
      ) : tab === "fairness" ? (
        <CategoryFairnessTable key={catId} roster={roster} catLabel={cat ? cat.label : ""} />
      ) : (
      <React.Fragment>
      <div style={{
        background: "var(--bg-surface)", border: "1px solid var(--border)", borderLeft: nextUp ? "4px solid #D98E2B" : "4px solid var(--border)",
        borderRadius: 10, padding: "16px 20px", marginBottom: 22, display: "flex", alignItems: "center",
        justifyContent: "space-between", flexWrap: "wrap", gap: 12,
      }}>
        {nextUp ? (
          <React.Fragment>
            <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
              <div className="disp" style={{ width: 40, height: 40, borderRadius: "50%", background: "var(--status-warning-bg)", color: "var(--status-warning-text)", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700, fontSize: 15 }}>1</div>
              <div>
                <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 0.6, color: "var(--status-warning-text)", fontWeight: 600, marginBottom: 2 }} className="gu">{t("Next up", "આગળ")}</div>
                <div className="gu" style={{ fontSize: 16, fontWeight: 600 }}>{nextUp.name}</div>
                <div style={{ fontSize: 12, color: "var(--text-secondary)", marginTop: 2 }} className="gu">{t("Waiting", "રાહ જોઈ રહ્યા છે")} {nextUp.waiting} {nextUp.waiting === 1 ? t("day", "દિવસ") : t("days", "દિવસો")} · {t("last duty", "છેલ્લી ડ્યુટી")} {formatDMY(nextUp.lastDuty)}</div>
              </div>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              {nextUp.staffRec && nextUp.staffRec.phone && (
                <a href={`tel:${nextUp.staffRec.phone}`} title={t("Call", "કૉલ કરો")} aria-label={t("Call", "કૉલ કરો")} style={{ background: "var(--bg-surface)", color: "var(--status-success-text)", border: "1px solid var(--status-success-border)", borderRadius: 7, padding: "9px 12px", fontSize: 13, fontWeight: 600, textDecoration: "none", display: "inline-flex", alignItems: "center" }} className="gu">📞 {t("Call", "કૉલ કરો")}</a>
              )}
              <button onClick={() => shareDutyOnWhatsApp({ lang, name: nextUp.name, number: nextUp.number, catLabel: cat ? cat.label : "", phone: nextUp.staffRec && nextUp.staffRec.phone, kind: "next" })} title={t("Share via WhatsApp", "WhatsApp પર શેર કરો")} aria-label={t("Share via WhatsApp", "WhatsApp પર શેર કરો")} style={{ background: "var(--bg-surface)", color: "var(--status-success-text)", border: "1px solid var(--status-success-border)", borderRadius: 7, padding: "9px 12px", fontSize: 13, fontWeight: 600 }} className="gu">📲 {t("Share", "શેર કરો")}</button>
              <button onClick={() => setAssignTarget({ number: nextUp.number, name: nextUp.name })} style={{ background: "#D98E2B", color: "#fff", border: "none", borderRadius: 7, padding: "9px 16px", fontSize: 13, fontWeight: 600 }} className="gu">{t("Assign duty", "ડ્યુટી સોંપો")}</button>
            </div>
          </React.Fragment>
        ) : (
          <div style={{ fontSize: 13, color: "var(--text-secondary)" }} className="gu">{t("No one available in this category — add staff or clear a Skip/Leave/Outstation status.", "આ કેટેગરીમાં કોઈ ઉપલબ્ધ નથી — સ્ટાફ ઉમેરો અથવા સ્કિપ/રજા/બહારગામ સ્થિતિ સાફ કરો.")}</div>
        )}
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 10, flexWrap: "wrap", alignItems: "center", justifyContent: "space-between" }}>
        <input
          type="text" value={rosterSearch} onChange={(e) => setRosterSearch(e.target.value)}
          placeholder={t("Search by name or number…", "નામ અથવા નંબર દ્વારા શોધો…")} className="gu"
          id="app-search-input" style={{ width: 220 }}
        />
        <div style={{ display: "flex", gap: 6 }}>
          <button
            onClick={() => { setShowImportMenu(true); setImportSelected(new Set()); setImportSearch(""); }}
            style={catTabBtn(false)} className="gu"
          >⬇ {t("Import Staff", "સ્ટાફ આયાત કરો")}</button>
          <button onClick={() => setSortMode("rank")} style={catTabBtn(sortMode === "rank")} className="gu">{t("Rotation order", "રોટેશન ક્રમ")}</button>
          <button onClick={() => setSortMode("duties")} style={catTabBtn(sortMode === "duties")} className="gu">{t("Fewest duties first", "સૌથી ઓછી ડ્યુટી પ્રથમ")}</button>
        </div>
      </div>

      {showImportMenu && (
        <div role="dialog" aria-modal="true" aria-label={t("Import Staff", "સ્ટાફ આયાત કરો")} className="modal-backdrop" style={{ position: "fixed", inset: 0, background: "#00000066", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 500, padding: 16 }} onClick={() => setShowImportMenu(false)}>
          <div onClick={(e) => e.stopPropagation()} className="modal-card" style={{
            width: 360, maxWidth: "100%", maxHeight: "80vh",
            display: "flex", flexDirection: "column", background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 12,
            boxShadow: "0 20px 60px rgba(0,0,0,0.3)", overflow: "hidden",
          }}>
            <div style={{ padding: "16px 20px", borderBottom: "1px solid var(--border-soft)", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div className="disp gu" style={{ fontSize: 16, fontWeight: 700 }}>{t("Import Staff", "સ્ટાફ આયાત કરો")}</div>
              <button onClick={() => setShowImportMenu(false)} title={t("Close", "બંધ કરો")} aria-label={t("Close", "બંધ કરો")} style={{ background: "transparent", border: "none", color: "var(--text-tertiary)", fontSize: 16 }}>✕</button>
            </div>
            <div style={{ padding: "12px 20px 0", display: "flex", gap: 8 }}>
              <input
                type="text" autoFocus value={importSearch} onChange={(e) => setImportSearch(e.target.value)}
                placeholder={t("Search staff…", "સ્ટાફ શોધો…")} className="gu"
                style={{ flex: 1, minWidth: 0, fontSize: 12.5 }}
              />
              {(data.designations || []).length > 0 && (
                <select value={importDesgFilter} onChange={(e) => setImportDesgFilter(e.target.value)} className="gu" style={{ fontSize: 12, width: 110, flexShrink: 0 }}>
                  <option value="">{t("All", "બધા")}</option>
                  {data.designations.map((d) => (
                    <option key={d.id} value={d.id}>{d.label}</option>
                  ))}
                </select>
              )}
            </div>
            {filteredImportCandidates.length === 0 ? (
              <div className="gu" style={{ padding: "24px 20px", fontSize: 12.5, color: "var(--text-tertiary)", textAlign: "center" }}>
                {importCandidates.length === 0
                  ? t("Everyone in the directory is already in this roster", "ડિરેક્ટરીમાંના બધા પહેલેથી આ રોસ્ટરમાં છે")
                  : t("No match", "કોઈ મેળ નથી")}
              </div>
            ) : (
              <React.Fragment>
                <label style={{ display: "flex", alignItems: "center", gap: 8, padding: "12px 20px 10px", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }} className="gu">
                  <input
                    type="checkbox"
                    checked={filteredImportCandidates.length > 0 && filteredImportCandidates.every((s) => importSelected.has(s.number))}
                    onChange={(e) => {
                      setImportSelected((cur) => {
                        const next = new Set(cur);
                        filteredImportCandidates.forEach((s) => e.target.checked ? next.add(s.number) : next.delete(s.number));
                        return next;
                      });
                    }}
                  />
                  {t("Select all", "બધા પસંદ કરો")}
                </label>
                <div style={{ overflowY: "auto", flex: 1, borderTop: "1px solid var(--border-soft)" }}>
                  {filteredImportCandidates.map((s) => (
                    <label key={s.number} style={{ display: "flex", alignItems: "center", gap: 8, padding: "10px 20px", fontSize: 12.5, cursor: "pointer", borderBottom: "1px solid var(--border-soft)" }} className="gu">
                      <input
                        type="checkbox" checked={importSelected.has(s.number)}
                        onChange={(e) => setImportSelected((cur) => {
                          const next = new Set(cur);
                          e.target.checked ? next.add(s.number) : next.delete(s.number);
                          return next;
                        })}
                      />
                      <span style={{ flex: 1, minWidth: 0 }}>{s.name}</span>
                      <span className="mono" style={{ fontSize: 11, color: "var(--text-tertiary)" }}>#{s.number}</span>
                    </label>
                  ))}
                </div>
              </React.Fragment>
            )}
            <div style={{ padding: "14px 20px", borderTop: "1px solid var(--border-soft)" }}>
              <button
                onClick={() => { importStaffToCategory(catId, [...importSelected]); setShowImportMenu(false); }}
                disabled={importSelected.size === 0}
                style={{ width: "100%", background: importSelected.size ? "#D98E2B" : "var(--border-soft)", color: importSelected.size ? "#fff" : "var(--text-tertiary)", border: "none", borderRadius: 7, padding: "10px 12px", fontSize: 13, fontWeight: 700 }} className="gu"
              >{t(`Import${importSelected.size ? ` (${importSelected.size})` : ""}`, `આયાત કરો${importSelected.size ? ` (${importSelected.size})` : ""}`)}</button>
            </div>
          </div>
        </div>
      )}

      {(data.designations || []).length > 0 && (
        <div style={{ marginBottom: 16 }}>
          <button
            onClick={() => setShowDesignationFilter((v) => !v)}
            style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11.5, fontWeight: 600, color: "var(--text-secondary)", background: "transparent", border: "none", padding: 0, marginBottom: showDesignationFilter ? 6 : 0, cursor: "pointer" }}
            className="gu"
          >
            <span style={{ display: "inline-block", transform: showDesignationFilter ? "rotate(90deg)" : "none", transition: "transform 0.15s" }}>▸</span>
            {onlyDesignation

// Shown whenever "Assign duty" is pressed, in every work type. The note is

          <button onClick={() => onConfirm(note, date)} style={{ background: "#D98E2B", color: "#fff", border: "none", borderRadius: 7, padding: "8px 14px", fontSize: 13, fontWeight: 600 }} className="gu">{t("Assign duty", "ડ્યુટી સોંપો")}</button>

}
// How lopsided duty allocation has been within one work type, all-time:
// each person's share of every duty ever logged for this work type, as a
// percentage — so someone can point at a number ("Rakesh has done 42% of
// all High Court duty") instead of eyeballing a roster table. Shared by
// the authenticated and public read-only views, same as the history table.
function CategoryFairnessTable({ roster, catLabel }) {
  const { t } = useLang();
  const [period, setPeriod] = useState({ key: "month", customFrom: todayStr(), customTo: todayStr() });
  const [periodFrom, periodTo] = periodRangeOf(period);
  const rows = useMemo(() => {
    const withCounts = roster.map((p) => ({ number: p.number, name: p.name, count: groupedDutyCountInRange(p.history, periodFrom, periodTo) }));
    const total = withCounts.reduce((sum, p) => sum + p.count, 0);
    return withCounts
      .map((p) => ({ ...p, pct: total > 0 ? (p.count / total) * 100 : 0 }))
      .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
  }, [roster, periodFrom, periodTo]);
  const totalDuties = rows.reduce((sum, r) => sum + r.count, 0);

  return (
    <div style={{ background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 10, overflow: "hidden" }}>
      <div style={{ padding: "12px 16px", borderBottom: "1px solid var(--border-soft)", display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
        <div style={{ fontSize: 12, color: "var(--text-secondary)" }} className="gu">
          {totalDuties > 0
            ? t(`${totalDuties} total ${totalDuties === 1 ? "duty" : "duties"} logged for ${catLabel} in ${periodLabel(t, period)} — each person's share of that.`, `${catLabel} માટે ${periodLabel(t, period)} કુલ ${totalDuties} ડ્યુટી નોંધાયેલ — દરેક વ્યક્તિનો હિસ્સો.`)
            : t(`No duties logged for this work type in ${periodLabel(t, period)}.`, `આ કામના પ્રકાર માટે ${periodLabel(t, period)} કોઈ ડ્યુટી નોંધાયેલ નથી.`)}
        </div>
        <PeriodFilterSelect period={period} setPeriod={setPeriod} />
      </div>
      <div style={{ overflowX: "auto" }}>
        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
          <thead>
            <tr style={{ background: "var(--bg-surface-2)", textAlign: "left" }} className="gu">
              <th style={th}>{t("Name", "નામ")}</th><th style={th}>{t("Number", "નંબર")}</th><th style={{ ...th, textAlign: "center" }}>{t("Duties", "ડ્યુટીઓ")}</th><th style={{ ...th, minWidth: 180 }}>{t("Share of all duties here", "અહીંની બધી ડ્યુટીનો હિસ્સો")}</th>
            </tr>
          </thead>
          <tbody>
            {rows.map((r) => (
              <tr key={r.number} style={{ borderTop: "1px solid var(--border-soft)" }}>
                <td style={{ ...td, minWidth: 140 }} className="gu">{r.name}</td>
                <td style={td} className="mono">{r.number}</td>
                <td style={{ ...td, textAlign: "center" }} className="mono">{r.count}</td>
                <td style={td}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <div style={{ flex: 1, height: 6, borderRadius: 3, background: "var(--border-soft)", overflow: "hidden", minWidth: 60 }}>
                      <div style={{ width: `${Math.max(r.pct > 0 ? 3 : 0, r.pct)}%`, height: "100%", borderRadius: 3, background: "#D98E2B" }} />
                    </div>
                    <span className="mono" style={{ fontSize: 12, color: "var(--text-secondary)", minWidth: 42, textAlign: "right" }}>{r.pct.toFixed(1)}%</span>
                  </div>
                </td>
              </tr>
            ))}
            {rows.length === 0 && (
              <tr><td colSpan={4} style={{ ...td, textAlign: "center", color: "var(--text-tertiary)", padding: "26px 0" }} className="gu">{t("No one on this work type's roster yet.", "આ કામના પ્રકારના રોસ્ટરમાં હજુ કોઈ નથી.")}</td></tr>
            )}

        </table>
      </div>
    </div>
  );
}
// Read-only, newest-first log of every completed duty for one work type —
// kept separate per work type so it can be used as evidence for that
// specific duty allocation without mixing in other work types.
// Supports gallery-style multi-select (like Samsung Gallery/Google Photos):
// tap the ✕ on any row to start selecting, tap rows to add/remove from the
// selection, then delete just the picked entries — or clear everything at
// once with the separate "Clear history" button.
function CategoryHistoryTable({ rows, catLabel, onClearHistory, onDeleteSelected }) {
  const { t } = useLang();
  const [selectMode, setSelectMode] = useState(false);
  const [selected, setSelected] = useState(new Set());

  const keyOf = (r) => `${r.number}#${r.idxs.join(",")}`;
  const allSelected = rows.length > 0 && selected.size === rows.length;

  const toggle = (key) => {
    setSelected((prev) => {
      const next = new Set(prev);
      if (next.has(key)) next.delete(key); else next.add(key);
      return next;
    });
  };
  const toggleAll = () => setSelected(allSelected ? new Set() : new Set(rows.map(keyOf)));
  const startSelect = (key) => { setSelectMode(true); setSelected(new Set([key])); };
  const cancelSelect = () => { setSelectMode(false); setSelected(new Set()); };
  const confirmDelete = () => {
    if (selected.size === 0) return;
    // A selected row may represent several underlying per-day entries (a
    // multi-day span) — expand back to individual number#idx keys here so
    // onDeleteSelected (shared with the rest of the app) doesn't need to
    // know anything about grouping.
    const expanded = new Set();
    let entryCount = 0;
    rows.forEach((r) => {
      if (selected.has(keyOf(r))) {
        r.idxs.forEach((idx) => expanded.add(`${r.number}#${idx}`));
        entryCount += r.idxs.length;
      }
    });
    if (!window.confirm(t(`Delete ${selected.size} selected history ${selected.size === 1 ? "entry" : "entries"}${entryCount !== selected.size ? ` (${entryCount} duty-days)` : ""}? They'll move to the Recycle bin and can be restored.`, `પસંદ કરેલી ${selected.size} ઇતિહાસ ${selected.size === 1 ? "એન્ટ્રી" : "એન્ટ્રીઓ"} ડિલીટ કરવી છે? તે રિસાયકલ બિનમાં જશે અને પુનઃસ્થાપિત કરી શકાશે.`))) return;
    onDeleteSelected(expanded);
    setSelected(new Set());
    setSelectMode(false);
  };

  return (
    <React.Fragment>
      <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 12, margin: "-8px 0 14px", flexWrap: "wrap" }}>
        <p style={{ fontSize: 12.5, color: "var(--text-secondary)", margin: 0, flex: "1 1 260px" }} className="gu">
          {selectMode
            ? t(`${selected.size} selected — tap a row to toggle it.`, `${selected.size} પસંદ કરેલ — ટોગલ કરવા માટે પંક્તિ પર ટેપ કરો.`)
            : t(`Every completed "${catLabel}" duty, most recent first — a multi-day Group Duty assignment shows as one row spanning its dates. Tap "Select" to pick specific entries to delete, or clear everything at once.`, `"${catLabel}" ની બધી પૂર્ણ થયેલી ડ્યુટી, નવીનતમ પહેલા — બહુ-દિવસીય જૂથ ડ્યુટી સોંપણી તેની તારીખોને આવરી લેતી એક પંક્તિ તરીકે બતાય છે. ડિલીટ કરવા માટે ચોક્કસ એન્ટ્રીઓ પસંદ કરવા "Select" પર ટેપ કરો, અથવા બધું એકસાથે સાફ કરો.`)}
        </p>
        <div style={{ display: "flex", gap: 6, flexShrink: 0, flexWrap: "wrap" }}>
          {selectMode ? (
            <React.Fragment>
              <button onClick={toggleAll} style={{ background: "var(--bg-surface)", color: "var(--text-primary)", border: "1px solid var(--border)", borderRadius: 7, padding: "6px 12px", fontSize: 12, fontWeight: 600 }} className="gu">{allSelected ? t("Deselect all", "બધું અનસિલેક્ટ કરો") : t("Select all", "બધું પસંદ કરો")}</button>
              <button onClick={cancelSelect} style={{ background: "var(--bg-surface)", color: "var(--text-secondary)", border: "1px solid var(--border)", borderRadius: 7, padding: "6px 12px", fontSize: 12, fontWeight: 600 }} className="gu">{t("Cancel", "રદ કરો")}</button>
              <button onClick={confirmDelete} disabled={selected.size === 0} style={{ background: selected.size ? "var(--btn-danger-solid)" : "var(--status-error-border)", color: "#fff", border: "none", borderRadius: 7, padding: "6px 12px", fontSize: 12, fontWeight: 600 }} className="gu">{t("Delete selected", "પસંદ કરેલ ડિલીટ કરો")}{selected.size ? ` (${selected.size})` : ""}</button>
            </React.Fragment>
          ) : (
            rows.length > 0 && (
              <React.Fragment>
                <button onClick={() => setSelectMode(true)} style={{ background: "var(--bg-surface)", color: "var(--text-primary)", border: "1px solid var(--border)", borderRadius: 7, padding: "6px 12px", fontSize: 12, fontWeight: 600 }} className="gu">{t("Select", "પસંદ કરો")}</button>
                <button
                  onClick={() => downloadCsv(
                    `nokri-book-${catLabel.toLowerCase().replace(/\s+/g, "-")}-history.csv`,
                    [["#", "From", "To", "Days", "Number", "Name", "Note"], ...rows.map((r, i) => [rows.length - i, formatDMY(r.from), formatDMY(r.to), r.days, r.number, r.name, r.note || ""])]
                  )}
                  style={{ background: "var(--bg-surface)", color: "var(--text-primary)", border: "1px solid var(--border)", borderRadius: 7, padding: "6px 12px", fontSize: 12, fontWeight: 600, whiteSpace: "nowrap" }} className="gu"
                >⬇ {t("Export CSV", "CSV એક્સપોર્ટ કરો")}</button>
                <button onClick={onClearHistory} title={t("Clear all history entries for this work type", "આ કામના પ્રકાર માટે તમામ ઇતિહાસ એન્ટ્રીઓ સાફ કરો")} aria-label={t("Clear all history entries for this work type", "આ કામના પ્રકાર માટે તમામ ઇતિહાસ એન્ટ્રીઓ સાફ કરો")} style={{ background: "var(--bg-surface)", color: "var(--status-error-text)", border: "1px solid var(--status-error-border)", borderRadius: 7, padding: "6px 12px", fontSize: 12, fontWeight: 600, whiteSpace: "nowrap" }} className="gu">
                  {t("Clear history", "ઇતિહાસ સાફ કરો")}
                </button>
              </React.Fragment>
            )
          )}
        </div>
      </div>
      <div style={{ background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 10, overflow: "hidden" }}>
        <div style={{ overflowX: "auto" }}>
        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
          <thead>
            <tr style={{ background: "var(--bg-surface-2)", textAlign: "left" }} className="gu">
              {selectMode && <th style={{ ...th, width: 30 }}></th>}
              <th style={th}>#</th><th style={th}>{t("Date", "તારીખ")}</th><th style={th}>{t("Number", "નંબર")}</th><th style={th}>{t("Name", "નામ")}</th><th style={th}>{t("Note", "નોંધ")}</th>
            </tr>
          </thead>
          <tbody>
            {rows.map((r, i) => {
              const key = keyOf(r);
              const isSel = selected.has(key);
              return (
                <tr
                  key={key}
                  onClick={() => { if (selectMode) toggle(key); }}
                  style={{
                    borderTop: "1px solid var(--border-soft)",
                    background: isSel ? "var(--status-error-bg)" : (i === 0 && !selectMode ? "var(--highlight-bg)" : "transparent"),
                    cursor: selectMode ? "pointer" : "default",
                  }}
                >
                  {selectMode && (
                    <td style={{ ...td, width: 30 }}>
                      <input type="checkbox" checked={isSel} onChange={() => toggle(key)} onClick={(e) => e.stopPropagation()} />
                    </td>
                  )}
                  <td style={td} className="mono">{i + 1}</td>
                  <td style={td} className="mono">
                    {r.days > 1 ? `${formatDMY(r.from)} – ${formatDMY(r.to)}` : formatDMY(r.to)}
                    {r.days > 1 && <span style={{ marginLeft: 6, fontSize: 10.5, fontWeight: 700, color: "var(--status-info-text)", background: "var(--status-info-bg)", border: "1px solid var(--status-info-border)", borderRadius: 10, padding: "1px 6px" }}>{t(`${r.days} days`, `${r.days} દિવસ`)}</span>}
                  </td>
                  <td style={td} className="mono">{r.number}</td>
                  <td style={{ ...td, minWidth: 160 }} className="gu">{r.name}</td>
                  <td style={{ ...td, maxWidth: 260, color: "var(--text-secondary)" }}>
                    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
                      <span>
                        {r.note || "—"}
                        {r.extraNote && <div style={{ fontSize: 11, color: "var(--text-tertiary)", marginTop: 2 }} className="gu">{r.extraNote}</div>}
                      </span>
                      {!selectMode && (
                        <button onClick={(e) => { e.stopPropagation(); startSelect(key); }} title={t("Select this entry to delete", "ડિલીટ કરવા માટે આ એન્ટ્રી પસંદ કરો")} aria-label={t("Select this entry to delete", "ડિલીટ કરવા માટે આ એન્ટ્રી પસંદ કરો")} style={{ ...iconBtn, flexShrink: 0 }}>✕</button>
                      )}
                    </div>
                  </td>
                </tr>
              );
            })}
            {rows.length === 0 && (
              <tr><td colSpan={selectMode ? 6 : 5} style={{ ...td, textAlign: "center", color: "var(--text-tertiary)", padding: "26px 0" }} className="gu">{t("No duty has been completed in this work type yet.", "આ કામના પ્રકારમાં હજુ સુધી કોઈ ડ્યુટી પૂર્ણ થઈ નથી.")}</td></tr>
            )}
          </tbody>
        </table>
        </div>
      </div>
    </React.Fragment>
  );
}

function StaffView({

}) {
  const { t, lang } = useLang();

  const [name, setName] = useState("");
  const [phone, setPhone] = useState("");
  const [newStaffDesg, setNewStaffDesg] = useState("");
  const [showInfo, setShowInfo] = useState(false);
  const [search, setSearch] = useState(initialSearch || "");
  const debouncedSearch = useDebouncedValue(search);
  const [desgFilter, setDesgFilter] = useState("");
  const [sortBy, setSortBy] = useState("name"); // name | designation | duties
  const [modalFor, setModalFor] = useState(null); // staff number currently editing leave/outstation
  const [modalKind, setModalKind] = useState("Leave");
  const [modalTypeId, setModalTypeId] = useState("");
  const [modalFrom, setModalFrom] = useState(todayStr());
  const [modalTo, setModalTo] = useState(todayStr());
  // "new" (the usual case — start a fresh Leave/Outstation period, or log
  // a past one via the same form) vs "edit" (adjust the dates of the
  // period that's already active right now, via "Manage leave" below) —
  // controls which function the Save button calls and what the modal's
  // heading says, without needing two separate modal components for what
  // is otherwise the exact same form.
  const [modalMode, setModalMode] = useState("new");
  const [manageLeaveMenuFor, setManageLeaveMenuFor] = useState(null);
  // The dropdown itself used to be position:absolute relative to its
  // table cell — but that cell sits inside a horizontally-scrolling table
  // (overflowX: auto) wrapped by a card with overflow: hidden, and the
  // Actions column is the LAST (rightmost) one. On a phone or tablet,
  // after scrolling right to even see the Actions column, the dropdown's
  // absolute position could open past the visible/clipped edge of that
  // overflow:hidden card — technically "open" but invisible and
  // untappable, which is exactly the "not clickable / not opening"
  // symptom on mobile. Storing the button's own on-screen position and
  // rendering the menu with position:fixed (viewport-relative, so it
  // completely escapes the scrolling table's clipping) fixes this
  // regardless of scroll position or screen size.
  const [manageLeaveMenuPos, setManageLeaveMenuPos] = useState(null); // { top, left }
  // manageLeaveMenuPos is captured ONCE, at the moment the button is
  // clicked — correct at that instant, but if the page (or the table's
  // own horizontal/vertical scroll) then scrolls while the menu stays
  // open, those fixed coordinates go stale: the menu visibly stays put
  // while the button it belongs to moves away underneath it, looking
  // "detached." Closing on any scroll (capture:true so this also catches
  // scrolling inside the table's own overflow container, not just the
  // page) is simpler and safer than trying to keep recalculating the
  // position on every scroll tick.
  useEffect(() => {
    if (!manageLeaveMenuFor) return;
    const closeOnScroll = () => { setManageLeaveMenuFor(null); setManageLeaveMenuPos(null); };
    window.addEventListener("scroll", closeOnScroll, true);
    return () => window.removeEventListener("scroll", closeOnScroll, true);
  }, [manageLeaveMenuFor]);
  // Manage Staff's row actions default to just the ✎ edit icon — Call,
  // WhatsApp, and the ✕ remove-entirely icon are all hidden until this is
  // switched on, same pattern as the "Edit"/"Done editing" toggle a work
  // type's own roster already uses for its own remove button. Keeps the
  // row compact and harder to misclick a destructive action on, while the
  // full set is still one tap away via this toggle whenever actually

  const [showFullActions, setShowFullActions] = useState(false);

  const [showLeaveTypesList, setShowLeaveTypesList] = useState(false);
  const [showOutstationTypesList, setShowOutstationTypesList] = useState(false);

    const res = await fetch(url, {
      method: existingId ? "PATCH" : "POST",
      headers: { Authorization: `Bearer ${token}`, "Content-Type": `multipart/related; boundary=${boundary}` },
      body,
      // keepalive lets this request finish even after the tab has started
      // closing/navigating away — used only for the silent on-close backup.
      ...(keepalive ? { keepalive: true } : {}),
    });
    if (!res.ok) {
      const errBody = await res.json().catch(() => null);
      throw new Error(errBody?.error?.message || `Drive upload failed (${res.status})`);
    }
    const fileId = existingId || (await res.json().catch(() => null))?.id || null;
    if (fileId) driveTodayFileRef.current = { date: todayStr(), fileId };
    return fileId;
  };

  // interactive=true (from the "Connect" / "Back up now" buttons) shows
  // toasts and may pop the consent screen. interactive=false (the once-a-day
  // automatic run, the online-reconnect retry, and the on-close backup)
  // stays silent — on failure it just flags "needs reconnect" instead of
  // interrupting whoever opened the app.
  const backupToDrive = useCallback(async ({ interactive, keepalive } = {}) => {
    if (!driveConfigured) { if (interactive) showToast(t("Google Drive isn't set up for this app yet", "આ એપ માટે Google Drive હજુ સેટ થયું નથી"), "error"); return; }
    if (!data) return;
    setDriveBusy(true);
    try {
      const token = await requestDriveToken(interactive);
      setDriveNeedsReconnect(false);
      const folderId = await findOrCreateDriveFolder(token);
      await uploadBackupToDrive(token, folderId, JSON.stringify(data, null, 2), { keepalive });
      const now = new Date().toISOString();
      localStorage.setItem("nb_drive_last_backup", now);
      localStorage.setItem("nb_drive_connected", "1");
      setDriveLastBackup(now);
      setDriveConnected(true);
      // Only actually writes to Firestore the first time (or if it was
      // somehow false) — every other successful backup after that is a
      // no-op here, so this doesn't turn "back up daily" into "write an
      // extra Firestore document every single day" for no reason.
      if (!dataRef.current.driveEnabled) persist({ ...dataRef.current, driveEnabled: true });
      recordBackupNow();
      if (interactive) showToast(t("Backed up to Google Drive", "Google Drive પર બેકઅપ થયું"));
    } catch (e) {
      console.warn("Drive backup failed", e);
      if (interactive) showToast(t(`Couldn't back up to Google Drive: ${e.message || "unknown error"}`, `Google Drive પર બેકઅપ થઈ શક્યું નથી: ${e.message || "અજ્ઞાત ભૂલ"}`), "error");
      else setDriveNeedsReconnect(true);
    } finally {
      setDriveBusy(false);
    }
  }, [data, driveConfigured]);

  const disconnectDrive = () => {
    localStorage.removeItem("nb_drive_connected");
    localStorage.removeItem("nb_drive_last_backup");
    localStorage.removeItem("nb_drive_folder_id");
    driveFolderIdRef.current = null;
    driveTokenCacheRef.current = { token: null, expiresAt: 0 };
    try { sessionStorage.removeItem("nb_drive_token_cache"); } catch (e) {}
    driveTodayFileRef.current = { date: "", fileId: null };
    setDriveConnected(false);
    setDriveLastBackup("");
    setDriveNeedsReconnect(false);
    // Also turns Drive backup off for the whole account, not just this
    // device — matches what "Disconnect" reads as: stopping the feature,
    // not just forgetting this one browser's token. Any other device that
    // still has its own cached token will simply stop being asked to
    // auto-backup once it next syncs this change.
    if (dataRef.current.driveEnabled) persist({ ...dataRef.current, driveEnabled: false });
    showToast(t("Disconnected from Google Drive", "Google Drive થી ડિસકનેક્ટ થયું"));
  };

  // Once a day, quietly try to back up — no dialogs unless a reconnect turns
  // out to be needed. Only fires once per page load, a few seconds after
  // data is ready so it never competes with the initial render. Because this
  // only runs while the app is open, it backs up on the first visit each
  // day rather than at a fixed clock time.
  useEffect(() => {
    if (!data || !driveConfigured || !driveConnected || driveAutoTriedRef.current) return;
    const last = localStorage.getItem("nb_drive_last_backup");
    const lastDate = last ? last.slice(0, 10) : "";
    if (lastDate === todayStr()) return;
    driveAutoTriedRef.current = true;
    const t = setTimeout(() => { backupToDrive({ interactive: false }); }, 3000);
    return () => clearTimeout(t);
  }, [data, driveConnected, driveConfigured, backupToDrive]);

  // A specific overnight (2:00–2:04 AM local time) attempt, in addition to
  // the "first visit each day" one above — similar in spirit to how
  // WhatsApp times its own backups for a quiet window. This can only run
  // while the app/tab is actually open at 2am (there's no way for a plain
  // browser page to wake up on its own once closed — that would need a
  // background server, which this app doesn't have), so it mainly helps
  // when the app is left open overnight on a desktop, or running as an
  // installed PWA. Checks the clock once a minute rather than trying to
  // calculate an exact fire time, since the tab could be backgrounded/
  // throttled by the browser for stretches at that hour. Both this and the
  // "first visit" backup above check the same "already done today" flag,
  // so whichever happens to fire first for the day silently covers the
  // other — no duplicate backups. The manual "Backup now" button and the
  // in-app backup reminder banner are both untouched by this — they stay
  // as the reliable fallback for whenever nothing was open overnight.
  useEffect(() => {
    if (!driveConfigured || !driveConnected) return;
    const checkOvernightWindow = () => {
      if (!data) return;
      const now = new Date();
      if (now.getHours() !== 2 || now.getMinutes() >= 5) return;
      const last = localStorage.getItem("nb_drive_last_backup");
      const lastDate = last ? last.slice(0, 10) : "";
      if (lastDate === todayStr()) return;
      backupToDrive({ interactive: false });
    };
    const id = setInterval(checkOvernightWindow, 60000);
    return () => clearInterval(id);
  }, [data, driveConnected, driveConfigured, backupToDrive]);

  // Keep a valid access token cached at all times while the tab is open —
  // completely independent of whether a backup has already run today. This
  // is what actually fixes "backup on close doesn't work": the on-close
  // handler below can only send anything if a token is ALREADY cached (it
  // can't wait on an async request while the page is unloading), and the
  // once-a-day effect above skips itself entirely on a same-day revisit —
  // so without this, reopening the app later the same day (after an
  // earlier successful backup) left the in-memory token cache empty for
  // the rest of that session, and every close from then on silently had
  // nothing to send. This warms the cache shortly after connecting, then
  // re-warms it every 45 minutes (before the ~55-minute token lifetime
  // runs out) for as long as the tab stays open.
  useEffect(() => {
    if (!driveConfigured || !driveConnected) return;
    const warm = () => { if (!getCachedDriveToken()) requestDriveToken(false).catch(() => {}); };
    const t = setTimeout(warm, 1500);
    const interval = setInterval(warm, 45 * 60 * 1000);
    return () => { clearTimeout(t); clearInterval(interval); };
  }, [driveConfigured, driveConnected]);

  // If a previous silent renewal failed (driveNeedsReconnect), retry
  // automatically the moment the browser reports it's back online, instead
  // of leaving the "Drive ⚠" state sitting there until the person notices
  // and taps Connect themselves. This is what fixes most of the "silent
  // renewal fails once, so Drive just stays disconnected" cases — patchy
  // duty-room wifi dropping mid-session, not an actual revoked connection.
  useEffect(() => {
    if (!driveConfigured || !driveConnected) return;
    const onOnline = () => { if (driveNeedsReconnect) backupToDrive({ interactive: false }); };
    window.addEventListener("online", onOnline);
    return () => window.removeEventListener("online", onOnline);
  }, [driveConfigured, driveConnected, driveNeedsReconnect, backupToDrive]);

  // Silent backup the moment the app is closed, backgrounded, or the tab is
  // hidden — this is the actual "secure my data on close" safety net.
  // "visibilitychange" fires reliably when a tab is closed, switched away
  // from, or the app is backgrounded on mobile (unlike "beforeunload",
  // which mobile browsers often skip); "pagehide" is added as a second,
  // overlapping trigger for browsers that fire one but not the other. Both
  // reuse a cached access token and cached today's-file id (see above) so
  // the request can go out immediately with no round-trip, and both use a
  // keepalive fetch so the browser finishes sending it even after the page
  // has started unloading. If there's no cached token yet (nothing to reuse
  // without an interactive prompt) or Drive was never connected, this is a
  // silent no-op — the roster is still safe either way, since every change
  // is already saved live to the account's Firestore document as it
  // happens; this is only an extra copy.
  useEffect(() => {
    if (!driveConfigured) return;
    const attemptSilentClose = () => {
      if (!driveConnected || !data) return;
      const token = getCachedDriveToken();
      const folderId = driveFolderIdRef.current;
      if (!token || !folderId) return;
      uploadBackupToDrive(token, folderId, JSON.stringify(data, null, 2), { keepalive: true })
        .then(() => {
          const now = new Date().toISOString();
          try {
            localStorage.setItem("nb_drive_last_backup", now);
            localStorage.setItem("nb_drive_connected", "1");
            localStorage.setItem("nb_last_backup_at", now);
          } catch (e) {}
        })
        .catch(() => {}); // silent by design — the tab is closing regardless
    };
    const onVisibility = () => { if (document.visibilityState === "hidden") attemptSilentClose(); };
    document.addEventListener("visibilitychange", onVisibility);
    window.addEventListener("pagehide", attemptSilentClose);
    return () => {
      document.removeEventListener("visibilitychange", onVisibility);
      window.removeEventListener("pagehide", attemptSilentClose);
    };
  }, [driveConfigured, driveConnected, data]);

  const undo = useCallback(() => {
    setUndoStack((stack) => {
      if (stack.length === 0) return stack;
      const prevState = stack[stack.length - 1];
      const actionDesc = lastActionRef.current;
      setRedoStack((r) => [...r, data]);
      writeToFirestore(prevState);
      showToastRaw(actionDesc ? t(`Undone: ${actionDesc}`, `પૂર્વવત્ થયું: ${actionDesc}`) : t("Undone — last change reverted", "પૂર્વવત્ થયું — છેલ્લો ફેરફાર રદ થયો"));
      return stack.slice(0, -1);
    });
  }, [data]);

  const redo = useCallback(() => {
    setRedoStack((stack) => {
      if (stack.length === 0) return stack;
      const nextState = stack[stack.length - 1];
      const actionDesc = lastActionRef.current;
      setUndoStack((u) => [...u, data]);
      writeToFirestore(nextState);
      showToastRaw(actionDesc ? t(`Redone: ${actionDesc}`, `ફરીથી કરાયું: ${actionDesc}`) : t("Redone", "ફરીથી કરાયું"));
      return stack.slice(0, -1);
    });
  }, [data]);

  // Ctrl/Cmd+Z to undo, Ctrl/Cmd+Shift+Z or Ctrl/Cmd+Y to redo, Ctrl/Cmd+K
  // opens the command palette, and "/" jumps straight into whichever
  // search box is on screen (or opens the palette if there isn't one) —
  // all skipped while typing in a text field so they don't fight normal
  // typing or the browser's own per-input undo.
  useEffect(() => {
    const onKeyDown = (e) => {
      const tag = (e.target && e.target.tagName) || "";
      const typing = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
        e.preventDefault();
        setShowCommandPalette(true);
        return;
      }
      if (!typing && e.key === "/") {
        e.preventDefault();
        const el = document.getElementById("app-search-input");
        if (el) el.focus(); else setShowCommandPalette(true);
        return;
      }
      if (typing) return;
      if (!(e.ctrlKey || e.metaKey)) return;
      const key = e.key.toLowerCase();
      if (key === "z" && !e.shiftKey) { e.preventDefault(); undo(); }
      else if ((key === "z" && e.shiftKey) || key === "y") { e.preventDefault(); redo(); }
    };
    window.addEventListener("keydown", onKeyDown);
    return () => window.removeEventListener("keydown", onKeyDown);
  }, [undo, redo]);

  // ---------- recycle bin ----------
  const MAX_RECYCLE_ITEMS = 300;
  const withRecycled = (base, item) => {
    const entry = { id: uid(), deletedAt: todayStr(), ts: Date.now(), ...item };
    const bin = [entry, ...((base.recycleBin) || [])].slice(0, MAX_RECYCLE_ITEMS);
    return { ...base, recycleBin: bin };
  };
  const restoreFromRecycleBin = (id) => {
    if (!data) return;
    const item = (data.recycleBin || []).find((r) => r.id === id);
    if (!item) return;
    const nextBin = (data.recycleBin || []).filter((r) => r.id !== id);
    let next = { ...data, recycleBin: nextBin };
    if (item.type === "category") {
      const exists = next.categories.find((c) => c.id === item.payload.category.id);
      next.categories = exists ? next.categories : [...next.categories, item.payload.category];
      next.membership = { ...next.membership, [item.payload.category.id]: item.payload.membership };
    } else if (item.type === "staff") {
      next.staff = { ...next.staff, [item.payload.staffRecord.number]: item.payload.staffRecord };
      const nextMembership = { ...next.membership };
      (item.payload.memberships || []).forEach(({ catId, entry }) => {
        if (!nextMembership[catId]) return;
        const already = nextMembership[catId].some((m) => m.number === entry.number);
        nextMembership[catId] = already ? nextMembership[catId] : [...nextMembership[catId], entry];
      });
      next.membership = nextMembership;
    } else if (item.type === "membership") {
      const list = next.membership[item.payload.catId] || [];
      const already = list.some((m) => m.number === item.payload.entry.number);
      next.membership = { ...next.membership, [item.payload.catId]: already ? list : [...list, item.payload.entry] };
    } else if (item.type === "history") {
      const list = next.membership[item.payload.catId] || [];
      next.membership = {
        ...next.membership,
        [item.payload.catId]: list.map((m) => {
          const snap = (item.payload.snapshot || []).find((s) => s.number === m.number);
          return snap ? { ...m, history: snap.history } : m;
        }),
      };
    } else if (item.type === "unavailable") {
      const prevRec = next.staff[item.payload.number];
      if (prevRec) {
        next.staff = {
          ...next.staff,
          [item.payload.number]: {
            ...prevRec,
            unavailable: item.payload.wasCurrent ? item.payload.entry : prevRec.unavailable,
            unavailableHistory: [...(prevRec.unavailableHistory || []), item.payload.entry],
          },
        };
      }
    }
    persist(next);
    showToast(t(`Restored "${item.label}"`, `"${item.label}" પુનઃસ્થાપિત થયું`));
  };
  const deleteFromRecycleBinForever = (id) => {
    if (!data) return;
    if (!window.confirm(t("Delete this permanently? It cannot be restored after this.", "આ કાયમ માટે ડિલીટ કરવું છે? આ પછી પુનઃસ્થાપિત કરી શકાશે નહીં."))) return;
    persist({ ...dataRef.current, recycleBin: (data.recycleBin || []).filter((r) => r.id !== id) });
  };
  const emptyRecycleBin = () => {
    if (!data) return;
    if (!window.confirm(t("Empty the recycle bin? Everything in it will be permanently deleted.", "રિસાયકલ બિન ખાલી કરવું છે? તેમાંનું બધું કાયમ માટે ડિલીટ થઈ જશે."))) return;
    persist({ ...dataRef.current, recycleBin: [] });
    showToast(t("Recycle bin emptied", "રિસાયકલ બિન ખાલી થયું"));
  };

  // ---------- category / membership mutations ----------
  // Generic reorder for any array-of-{id,...} list in data (work types,
  // designations, leave types, outstation types) — moves the dragged item
  // to sit where the drop target was. Also powers the ▲/▼ buttons: those
  // pass the neighbour's id as targetId, which lands on the exact same code
  // path as a drag-and-drop.
  const reorderList = (key, draggedId, targetId) => {
    if (!data || draggedId === targetId) return;
    const list = data[key] || [];
    const fromIdx = list.findIndex((x) => x.id === draggedId);
    const toIdx = list.findIndex((x) => x.id === targetId);
    if (fromIdx === -1 || toIdx === -1) return;
    const next = [...list];
    const [moved] = next.splice(fromIdx, 1);
    next.splice(toIdx, 0, moved);
    persist({ ...dataRef.current, [key]: next });
  };

  const addCategory = (label) => {
    const clean = (label || "").trim();
    if (!clean || !data) return;
    const id = slugify(clean) + "-" + uid().slice(0, 4);
    persist({
      ...dataRef.current,
      categories: [...data.categories, { id, label: clean }],
      membership: { ...data.membership, [id]: [] },
    });
    setView({ mode: "category", catId: id });
    showToast(t(`Added work type "${clean}"`, `કામનો પ્રકાર "${clean}" ઉમેરાયો`));
  };
  const renameCategory = (id) => {
    const cur = data.categories.find((c) => c.id === id);
    const next = window.prompt(t("Rename work type:", "કામનો પ્રકાર નામ બદલો:"), cur ? cur.label : "");
    if (!next || !next.trim() || !data) return;
    persist({ ...dataRef.current, categories: data.categories.map((c) => c.id === id ? { ...c, label: next.trim() } : c) });
  };
  const deleteCategory = (id) => {
    const cur = data.categories.find((c) => c.id === id);
    if (!window.confirm(t(`Delete work type "${cur ? cur.label : id}"? It will move to the Recycle bin and can be restored later.`, `કામનો પ્રકાર "${cur ? cur.label : id}" ડિલીટ કરવો છે? તે રિસાયકલ બિનમાં જશે અને પછીથી પુનઃસ્થાપિત કરી શકાશે.`))) return;
    const nextCats = data.categories.filter((c) => c.id !== id);
    const nextMembership = { ...data.membership };
    const removedMembership = nextMembership[id] || [];
    delete nextMembership[id];
    const recycled = withRecycled({ ...data, categories: nextCats, membership: nextMembership }, {
      type: "category",
      label: cur ? cur.label : id,
      payload: { category: cur || { id, label: id }, membership: removedMembership },
    });
    persist(recycled);
    showToast(t(`Moved "${cur ? cur.label : id}" to Recycle bin`, `"${cur ? cur.label : id}" રિસાયકલ બિનમાં ખસેડાયું`));
    if (view.catId === id) setView({ mode: "category", catId: nextCats[0] ? nextCats[0].id : null });
  };

  const updateMembership = (catId, updater) => {
    if (!data) return;
    const list = data.membership[catId] || [];
    persist({ ...dataRef.current, membership: { ...data.membership, [catId]: updater(list) } });
  };

  // Bulk version of addToCategory, for the "Import Staff" picker: adds
  // several existing directory staff to this work type's roster in one
  // write instead of one confirm-dialog-per-person. Deliberately doesn't
  // assign anyone a duty or a lastDuty date — they just join the
  // rotation with none recorded yet, so they naturally rank as having
  // waited the longest (fair for someone newly added, not last in line
  // for having "just" been imported). Anyone already in this roster is
  // silently left completely untouched — filtered out here as a
  // guaranteed safety net even though the picker UI itself shouldn't
  // offer them in the first place, in case two tabs/devices import into
  // the same work type at nearly the same time.
  const importStaffToCategory = (catId, numbers) => {
    const existingNums = new Set((data.membership[catId] || []).map((m) => m.number));
    const toAdd = numbers.filter((num) => !existingNums.has(num));
    if (toAdd.length === 0) { showToast(t("Everyone selected is already in this roster", "પસંદ કરેલા બધા પહેલેથી આ રોસ્ટરમાં છે")); return; }
    const nextMembership = {
      ...data.membership,
      [catId]: [...(data.membership[catId] || []), ...toAdd.map((num) => ({ number: num, lastDuty: null, history: [], skip: false }))],
    };
    persist({ ...dataRef.current, membership: nextMembership });
    const skipped = numbers.length - toAdd.length;
    showToast(t(
      `${toAdd.length} added to roster${skipped ? ` (${skipped} already there)` : ""}`,
      `${toAdd.length} રોસ્ટરમાં ઉમેરાયા${skipped ? ` (${skipped} પહેલેથી હતા)` : ""}`
    ));
  };

  const addToCategory = (catId, number, name, date) => {
    const num = (number || "").trim();
    const cleanName = (name || "").trim();
    if (!num) { showToast(t("Enter a buckle number", "બકલ નંબર દાખલ કરો")); return; }
    const existing = data.staff[num];
    if (!existing && !cleanName) { showToast(t("New number — enter the staff name too", "નવો નંબર — સ્ટાફનું નામ પણ દાખલ કરો")); return; }
    const already = (data.membership[catId] || []).some((m) => m.number === num);
    if (already) { showToast(t("Already listed in this work type", "આ કામના પ્રકારમાં પહેલેથી સૂચિબદ્ધ છે")); return; }
    const dutyDate = date || todayStr();
    if (!confirmDutyOverride(data, num, dutyDate, catId, existing ? existing.name : cleanName)) return;
    const nextStaff = existing ? data.staff : { ...data.staff, [num]: { number: num, name: cleanName, unavailable: null, designation: null } };
    const nextMembership = {
      ...data.membership,
      [catId]: [...(data.membership[catId] || []), { number: num, lastDuty: dutyDate, history: [], skip: false }],
    };
    persist({ ...dataRef.current, staff: nextStaff, membership: nextMembership });
    showToast(t(`${existing ? existing.name : cleanName} added`, `${existing ? existing.name : cleanName} ઉમેરાયું`));
  };

  // Wipes every duty/operational record in the account back to a clean
  // slate — membership history, last-duty dates, per-work-type and global
  // Skip flags, Leave/Outstation status, the skip log, recycle bin, events,
  // and reminder acknowledgements — while deliberately keeping the setup
  // that took real effort to build: every staff member's name, buckle
  // number, phone, and designation; the designations list itself; the work
  // types (and their order); and the leave/outstation TYPE lists. This is
  // meant for "start the new rotation year clean" without re-entering the
  // whole staff roster and work-type setup from scratch. Goes through
  // persist() like every other change, so — same as any other action in
  // this app — it can still be reverted with Undo right after, as one more
  // safety net.
  //
  // Guarded by a 3-step confirmation (FormatAllDataModal, below): a plain
  // warning, typing the exact phrase "format all data", and the buckle
  // number of the person actually doing it — before anything is touched.
  // Opening that modal is all this entry point does now; the real wipe
  // happens in performFormatAllData once the modal's own confirm fires.
  const formatAllData = () => { if (data) setShowFormatModal(true); };

  // Runs the actual wipe (see formatAllData above) once the modal's 3-step
  // confirmation has completed, then records who did it (by buckle number,
  // with their name looked up from the roster that still exists at this
  // point — it's read BEFORE the wipe clears anything) and when, by email
  // to the signed-in account's own email address. Sent automatically via
  // EmailJS with zero further clicks when it's configured (see the
  // <head> config block); otherwise falls back to opening a pre-filled
  // mailto draft in the person's own mail app for them to send instead —
  // still a real record, just not a silent one.
  const performFormatAllData = (buckleNumber) => {
    if (!data) return;
    const staffRec = data.staff[buckleNumber];
    // Belt-and-braces: FormatAllDataModal already only allows Step 3 to be
    // confirmed with a buckle number that matches someone on the staff
    // list, but the actual wipe checks that match again right here too,
    // rather than trusting the modal was the only possible caller.
    if (!staffRec) return;
    const personName = staffRec.name;
    const whenText = new Date().toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
    const cleanStaff = {};
    Object.values(data.staff || {}).forEach((s) => {
      cleanStaff[s.number] = { number: s.number, name: s.name, phone: s.phone || null, designation: s.designation || null, unavailable: null, unavailableHistory: [] };
    });
    const cleanMembership = {};
    Object.keys(data.membership || {}).forEach((catId) => {
      cleanMembership[catId] = (data.membership[catId] || []).map((m) => ({ number: m.number, lastDuty: null, history: [], skip: false }));
    });
    persist({
      ...dataRef.current,
      staff: cleanStaff,
      membership: cleanMembership,
      skipLog: [],
      recycleBin: [],
      events: [],
      reminderAcks: {},
    });
    if (user && user.email) {
      const subject = "Nokri Book — all duty data was formatted";
      const performedByLine = `Performed by: ${personName} (buckle number ${buckleNumber})`;
      const bodyLines = [
        "This confirms that all duty data in Nokri Book was cleared.",
        "",
        performedByLine,
        `Time: ${whenText}`,
        "",
        "Staff names, designations, and work types were kept. All duty history, last-duty dates, Skip status, Leave/Outstation records, skip history, recycle bin, and events were erased.",
      ];
      const messageText = bodyLines.join("\n");
      if (emailjsConfigured) {
        emailjs.send(window.EMAILJS_SERVICE_ID, window.EMAILJS_TEMPLATE_ID, {
          to_email: user.email,
          subject,
          message: messageText,
          person_name: personName || "",
          buckle_number: buckleNumber,
          time: whenText,
        }).then(() => {
          showToastRaw(t("Confirmation email sent automatically.", "પુષ્ટિ ઈમેલ આપમેળે મોકલાયો."));
        }).catch((e) => {
          console.warn("EmailJS send failed, falling back to mailto", e);
          const reason = (e && (e.text || e.message)) || t("unknown error", "અજ્ઞાત ભૂલ");
          showToastRaw(t(`Automatic email failed (${reason}) — opening a draft to send manually instead.`, `આપમેળે ઈમેલ મોકલવામાં નિષ્ફળ (${reason}) — તેના બદલે જાતે મોકલવા માટે ડ્રાફ્ટ ખોલી રહ્યા છીએ.`), "error");
          const mailtoUrl = `mailto:${encodeURIComponent(user.email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(messageText)}`;
          const a = document.createElement("a");
          a.href = mailtoUrl;
          a.click();
        });
      } else {
        const mailtoUrl = `mailto:${encodeURIComponent(user.email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(messageText)}`;
        const a = document.createElement("a");
        a.href = mailtoUrl;
        a.click();
      }
    }
    showToastRaw(t("All duty data cleared — staff, designations, and work types kept.", "બધો ડ્યુટી ડેટા સાફ થયો — સ્ટાફ, હોદ્દાઓ અને કામના પ્રકારો સચવાયા."));
  };


  const clearCategoryHistory = (catId) => {
    const cur = data.categories.find((c) => c.id === catId);
    const label = cur ? cur.label : catId;
    if (!window.confirm(t(`Clear all duty history for "${label}"? Last duty dates and the roster stay the same — the cleared entries move to the Recycle bin and can be restored.`, `"${label}" માટેનો બધો ડ્યુટી ઇતિહાસ સાફ કરવો છે? છેલ્લી ડ્યુટીની તારીખો અને રોસ્ટર એ જ રહેશે — સાફ કરેલી એન્ટ્રીઓ રિસાયકલ બિનમાં જશે અને પુનઃસ્થાપિત કરી શકાશે.`))) return;
    const list = data.membership[catId] || [];
    const nextMembership = { ...data.membership, [catId]: list.map((m) => ({ ...m, history: [] })) };
    const recycled = withRecycled({ ...data, membership: nextMembership }, {
      type: "history",
      label: `${label} history (${list.reduce((n, m) => n + (m.history || []).length, 0)} entries)`,
      payload: { catId, catLabel: label, snapshot: list },
    });
    persist(recycled);
    showToast(t(`History cleared for "${label}" — moved to Recycle bin`, `"${label}" માટે ઇતિહાસ સાફ થયો — રિસાયકલ બિનમાં ખસેડાયો`));
  };
  // Deletes just the picked history entries (gallery-style multi-select),
  // leaving the rest of each member's history untouched. Identified by
  // number + their position in that member's own history array, so the
  // deletion is exact regardless of how entries are sorted for display.
  const deleteHistoryEntries = (catId, selectedKeys) => {
    if (!selectedKeys || selectedKeys.size === 0) return;
    const cur = data.categories.find((c) => c.id === catId);
    const label = cur ? cur.label : catId;
    const list = data.membership[catId] || [];
    const byNumber = {};
    selectedKeys.forEach((key) => {
      const sep = key.lastIndexOf("#");
      const number = key.slice(0, sep);
      const idx = parseInt(key.slice(sep + 1), 10);
      (byNumber[number] = byNumber[number] || new Set()).add(idx);
    });
    const affectedNumbers = new Set(Object.keys(byNumber));
    const snapshot = list.filter((m) => affectedNumbers.has(m.number)).map((m) => ({ number: m.number, history: m.history || [] }));
    const nextMembership = {
      ...data.membership,
      [catId]: list.map((m) => {
        const idxSet = byNumber[m.number];
        if (!idxSet) return m;
        return { ...m, history: (m.history || []).filter((_, i) => !idxSet.has(i)) };
      }),
    };
    const count = selectedKeys.size;
    const recycled = withRecycled({ ...data, membership: nextMembership }, {
      type: "history",
      label: `${label} history (${count} ${count === 1 ? "entry" : "entries"} deleted)`,
      payload: { catId, catLabel: label, snapshot },
    });
    persist(recycled);
    showToast(t(`${count} history ${count === 1 ? "entry" : "entries"} deleted — moved to Recycle bin`, `${count} ઇતિહાસ ${count === 1 ? "એન્ટ્રી" : "એન્ટ્રીઓ"} ડિલીટ થઈ — રિસાયકલ બિનમાં ખસેડાયું`));
  };
  const removeFromCategory = (catId, number) => {
    const cur = data.categories.find((c) => c.id === catId);
    const label = cur ? cur.label : catId;
    const list = data.membership[catId] || [];
    const entry = list.find((m) => m.number === number);
    if (!entry) return;
    const staffRec = data.staff[number];
    const nextMembership = { ...data.membership, [catId]: list.filter((m) => m.number !== number) };
    const recycled = withRecycled({ ...data, membership: nextMembership }, {
      type: "membership",
      label: `${staffRec ? staffRec.name : number} — ${label}`,
      payload: { catId, catLabel: label, entry },
    });
    persist(recycled);
    showToast(t(`Removed from "${label}" — moved to Recycle bin`, `"${label}" માંથી કાઢી નાખ્યું — રિસાયકલ બિનમાં ખસેડાયું`));
  };
  // "Skip" (marked absent) set from Manage Staff is a GLOBAL flag on the
  // person, not on a single work type's membership row — so marking
  // someone absent here reflects everywhere they're rostered (the duty
  // calendar deliberately excludes skipped people entirely, though — see
  // awayForDate in CalendarView). Un-marking Skip (putting someone back to
  // Present) needs no confirmation or note — only turning Skip ON does, via
  // skipPersonWithLog below. See setSkipInCategory / skipInCategoryWithLog
  // just below for the work-type-scoped equivalent of this pair.
  const setSkip = (number, skip) => {
    const staffRec = data.staff[number];
    if (!staffRec) return;
    persist({ ...dataRef.current, staff: { ...data.staff, [number]: { ...staffRec, skip } } });
  };
  // "Set Present" from Manage Staff needs to be a full reset, not just
  // the global flag — otherwise anyone who also has a local (per-work-type)
  // skip flag set stays stuck showing Skip in that work type even after
  // this clears the global one. Sets skip=false on the staff record AND
  // on every membership row for this number, across every work type, in
  // one persist.
  const setPresentEverywhere = (number) => {
    const staffRec = data.staff[number];
    const nextMembership = {};
    Object.keys(data.membership || {}).forEach((catId) => {
      nextMembership[catId] = (data.membership[catId] || []).map((m) => m.number === number ? { ...m, skip: false } : m);
    });
    persist({
      ...dataRef.current,
      staff: staffRec ? { ...data.staff, [number]: { ...staffRec, skip: false } } : data.staff,
      membership: nextMembership,
    });
  };
  // Marks someone Skip globally — this always runs instantly, no
  // confirmation step (byNumber/byName/note are always blank from every
  // current caller; the fields still exist in skipLog in case a future
  // caller wants to pass them, but nothing in the UI does right now).
  // Flips the flag and permanently records the entry — who was skipped
  // and date + time — in data.skipLog, stored in the app's own data,
  // synced like everything else, so it can never be lost when the browser
  // closes.
  const skipPersonWithLog = (number, name, note, byNumber, byName) => {
    const staffRec = data.staff[number];
    if (!staffRec) return;
    const now = Date.now();
    const logEntry = { id: uid(), number, name, note: note.trim(), date: todayStr(), ts: now, byNumber, byName, scope: "global" };
    persist({
      ...dataRef.current,
      staff: { ...data.staff, [number]: { ...staffRec, skip: true } },
      skipLog: [...(data.skipLog || []), logEntry],
    });
    showToast(t(`${name} marked Skip (all work types) — logged in Skip history`, `${name} ને સ્કિપ તરીકે માર્ક કર્યું (બધા કામના પ્રકારો) — સ્કિપ ઇતિહાસમાં નોંધાયું`));
  };
  // The work-type-scoped counterpart of setSkip: flips the skip flag on
  // just this one category's membership row, leaving the person's global
  // flag and every other work type's row untouched. Used for turning Skip
  // OFF from inside a work type (no confirmation needed, same as setSkip),
  // and internally by skipInCategoryWithLog below for turning it ON.
  const setSkipInCategory = (catId, number, skip) => {
    updateMembership(catId, (list) => list.map((m) => m.number === number ? { ...m, skip } : m));
  };
  // "Present" clicked from inside a work type needs to actually make the
  // person show as Present *in that work type*, no matter which of the
  // two independent flags (see effectiveStatus) put them on Skip — the
  // global one from Manage Staff, the local one on this category's row,
  // or (from old/edge-case data) both at once. Clearing only one of them
  // left people stuck showing Skip when the other flag was still set, so
  // this clears both in a single persist rather than leaving it to
  // whichever single flag happened to be the one that mattered here.
  const setPresentInCategory = (catId, number) => {
    const staffRec = data.staff[number];
    const list = data.membership[catId] || [];
    persist({
      ...dataRef.current,
      staff: staffRec ? { ...data.staff, [number]: { ...staffRec, skip: false } } : data.staff,
      membership: { ...data.membership, [catId]: list.map((m) => m.number === number ? { ...m, skip: false } : m) },
    });
  };
  // Marks someone Skip within a single work type — same optional
  // badge-number/note as the global version above, just scoped to this one
  // category's membership row; every other work type this person is on
  // keeps rostering them normally. Still logged to the shared
  // data.skipLog (tagged with which work type), so Skip history stays the
  // one place that records every Skip, global or local.
  const skipInCategoryWithLog = (catId, catLabel, number, name, note, byNumber, byName) => {
    const now = Date.now();
    const logEntry = { id: uid(), number, name, note: note.trim(), date: todayStr(), ts: now, byNumber, byName, scope: "category", catId, catLabel };
    const list = data.membership[catId] || [];
    persist({
      ...dataRef.current,
      membership: { ...data.membership, [catId]: list.map((m) => m.number === number ? { ...m, skip: true } : m) },
      skipLog: [...(data.skipLog || []), logEntry],
    });
    showToast(t(`${name} marked Skip in "${catLabel}" — logged in Skip history`, `${name} ને "${catLabel}" માં સ્કિપ તરીકે માર્ક કર્યું — સ્કિપ ઇતિહાસમાં નોંધાયું`));
  };
  const setLastDuty = (catId, number, date) => {
    if (!date) return;
    const staffRec = data.staff[number];
    if (!confirmDutyOverride(data, number, date, catId, staffRec ? staffRec.name : number)) return;
    updateMembership(catId, (list) => list.map((m) => m.number === number ? { ...m, lastDuty: date } : m));
  };
  // date defaults to today but can be any date (e.g. tomorrow, for the
  // nightly "assign tomorrow's duty" workflow) — set via the calendar
  // field in AssignDutyModal.
  //
  // Manually assigning someone a duty needs to also clear both of their
  // Skip flags (global, from Manage Staff, AND local, from this one work
  // type's roster) — otherwise the duty gets logged fine, but they keep
  // showing as Skip afterward (effectiveStatus checks skip before
  // anything else), which reads as "the duty is assigned but Skip isn't
  // changing." Assigning them a duty is an explicit statement that
  // they're available, so both flags come off in the same update, same
  // as setPresentInCategory already does for the status dropdown.
  const assignDuty = (catId, number, name, note, date) => {
    const dutyDate = date || todayStr();
    const staffRec = data.staff[number];
    const conflict = unavailableOnDate(staffRec, dutyDate);
    if (conflict) {
      const label = unavailLabel(data, conflict);
      if (!window.confirm(t(
        `${name} is marked ${label} on ${formatDMY(dutyDate)}. Assign this duty anyway?`,
        `${name} ${formatDMY(dutyDate)} ના રોજ ${label} તરીકે નોંધાયેલ છે. તેમ છતાં આ ડ્યુટી સોંપવી છે?`
      ))) return;
    }
    if (!confirmDutyOverride(data, number, dutyDate, catId, name)) return;
    const entry = { date: dutyDate, ts: Date.now(), note: (note || "").trim() || null, batch: uid() };
    const list = data.membership[catId] || [];
    persist({
      ...dataRef.current,
      staff: staffRec ? { ...data.staff, [number]: { ...staffRec, skip: false } } : data.staff,
      membership: {
        ...data.membership,
        [catId]: list.map((m) => m.number === number ? { ...m, skip: false, lastDuty: dutyDate, history: [...(m.history || []), entry] } : m),
      },
    });
    showToast(t(`Duty assigned to ${name} for ${formatDMY(dutyDate)}`, `${formatDMY(dutyDate)} માટે ${name} ને ડ્યુટી સોંપાઈ`));
  };

  // A fixed, always-the-same category id — auto-created the first time
  // anyone assigns a Miscellaneous duty, so it behaves exactly like any
  // other work type from then on (shows up in the sidebar, has its own
  // roster/history/fairness tabs) without needing to be set up by hand
  // first. The point of this whole feature: for a one-off task that
  // doesn't deserve a permanent work type of its own (escorting someone,
  // a single errand, a court summons that's a one-time thing), you
  // describe *what* the duty actually was in the required text field
  // below instead — that description is what gets stored as the entry's
  // note, so History and this person's full record both show exactly
  // what they were sent to do, not just "Miscellaneous duty" with no
  // detail. Reuses the exact same conflict-check/skip-clearing behavior
  // as assignDuty above; the only real difference is handling someone
  // who isn't already on this category's roster yet, which for a brand
  // new (or rarely used) category is the common case.
  const MISC_CATEGORY_ID = "misc-duty";
  const assignMiscDuty = (number, name, dutyType, extraNote, date) => {
    if (!data) return;
    const cleanType = (dutyType || "").trim();
    if (!cleanType) { showToast(t("Describe the duty before assigning it", "સોંપતા પહેલા ડ્યુટીનું વર્ણન કરો"), "error"); return; }
    const num = (number || "").trim();
    const cleanName = (name || "").trim();
    if (!num) { showToast(t("Enter a buckle number", "બકલ નંબર દાખલ કરો"), "error"); return; }
    const existingStaff = data.staff[num];
    if (!existingStaff && !cleanName) { showToast(t("New number — enter the staff name too", "નવો નંબર — સ્ટાફનું નામ પણ દાખલ કરો"), "error"); return; }
    const dutyDate = date || todayStr();
    if (!confirmDutyOverride(data, num, dutyDate, MISC_CATEGORY_ID, existingStaff ? existingStaff.name : cleanName)) return;

    const hasMiscCat = (data.categories || []).some((c) => c.id === MISC_CATEGORY_ID);
    const categories = hasMiscCat ? data.categories : [...data.categories, { id: MISC_CATEGORY_ID, label: t("Miscellaneous duty", "વિવિધ ડ્યુટી") }];
    // `note` stays the required duty description ("PSO", "Escorted VIP…")
    // — every existing place in the app that reads an entry's `note`
    // (History tables, CSV exports, the person's full history modal)
    // keeps showing exactly that, unchanged. `extraNote` is new: a
    // genuinely separate, optional second field for any additional detail
    // beyond the duty type itself, shown alongside it specifically in the
    // places built to show both (see CategoryHistoryTable and
    // PersonHistoryModal below) without disturbing anywhere that only
    // knows about `note`.
    const entry = { date: dutyDate, ts: Date.now(), note: cleanType, extraNote: (extraNote || "").trim() || null, batch: uid() };
    const list = data.membership[MISC_CATEGORY_ID] || [];
    const already = list.some((m) => m.number === num);
    const updatedList = already
      ? list.map((m) => m.number === num ? { ...m, skip: false, lastDuty: dutyDate, history: [...(m.history || []), entry] } : m)
      : [...list, { number: num, lastDuty: dutyDate, history: [entry], skip: false }];
    const nextStaff = existingStaff
      ? { ...data.staff, [num]: { ...existingStaff, skip: false } }
      : { ...data.staff, [num]: { number: num, name: cleanName, phone: null, unavailable: null, designation: null } };

    persist({
      ...dataRef.current,
      categories,
      staff: nextStaff,
      membership: { ...data.membership, [MISC_CATEGORY_ID]: updatedList },
    });
    const personName = existingStaff ? existingStaff.name : cleanName;
    showToast(t(`Miscellaneous duty assigned to ${personName}: "${cleanType}"`, `${personName} ને વિવિધ ડ્યુટી સોંપાઈ: "${cleanType}"`));
  };

  // Multi-day version of assignMiscDuty — one history entry per calendar
  // day in the range, written in a single persist() (mirrors
  // assignGroupDuty's own reasoning just below: looping the single-day
  // version once per day would show a separate confirm dialog and a
  // separate success toast for every day, which is exactly the kind of
  // thing that shouldn't need N interruptions for what is, to the person
  // doing it, one action).
  const assignMiscDutyRange = (number, name, dutyType, extraNote, fromDate, toDate) => {
    if (!data) return;
    const cleanType = (dutyType || "").trim();
    if (!cleanType) { showToast(t("Describe the duty before assigning it", "સોંપતા પહેલા ડ્યુટીનું વર્ણન કરો"), "error"); return; }
    const num = (number || "").trim();
    const cleanName = (name || "").trim();
    if (!num) { showToast(t("Enter a buckle number", "બકલ નંબર દાખલ કરો"), "error"); return; }
    const existingStaff = data.staff[num];
    if (!existingStaff && !cleanName) { showToast(t("New number — enter the staff name too", "નવો નંબર — સ્ટાફનું નામ પણ દાખલ કરો"), "error"); return; }
    const from = fromDate || todayStr();
    const dutyDates = dateRangeStrs(from, toDate);
    const lastDate = dutyDates[dutyDates.length - 1];

    const conflicts = [];
    dutyDates.forEach((d) => {
      const conflict = findDutyConflict(data, num, d, MISC_CATEGORY_ID);
      if (conflict) conflicts.push({ date: d, conflict });
    });
    if (conflicts.length > 0) {
      const personLabel = existingStaff ? existingStaff.name : cleanName;
      const lines = conflicts.map((x) => `${formatDMY(x.date)} → "${x.conflict.label}"`).join("\n");
      const proceed = window.confirm(t(
        `${personLabel} already has a duty elsewhere on one or more of these days:\n${lines}\n\nAssign this anyway?`,
        `${personLabel} ને આમાંથી એક અથવા વધુ દિવસોમાં પહેલેથી જ બીજે ડ્યુટી છે:\n${lines}\n\nતેમ છતાં આ સોંપવું છે?`
      ));
      if (!proceed) return;
    }

    const hasMiscCat = (data.categories || []).some((c) => c.id === MISC_CATEGORY_ID);
    const categories = hasMiscCat ? data.categories : [...data.categories, { id: MISC_CATEGORY_ID, label: t("Miscellaneous duty", "વિવિધ ડ્યુટી") }];
    const cleanExtraNote = (extraNote || "").trim() || null;
    const baseTs = Date.now();
    const batch = uid();
    const entries = dutyDates.map((d, i) => ({ date: d, ts: baseTs + i, note: cleanType, extraNote: cleanExtraNote, batch }));
    const list = data.membership[MISC_CATEGORY_ID] || [];
    const already = list.some((m) => m.number === num);
    const updatedList = already
      ? list.map((m) => m.number === num ? { ...m, skip: false, lastDuty: lastDate, history: [...(m.history || []), ...entries] } : m)
      : [...list, { number: num, lastDuty: lastDate, history: entries, skip: false }];
    const nextStaff = existingStaff
      ? { ...data.staff, [num]: { ...existingStaff, skip: false } }
      : { ...data.staff, [num]: { number: num, name: cleanName, phone: null, unavailable: null, designation: null } };

    persist({
      ...dataRef.current,
      categories,
      staff: nextStaff,
      membership: { ...data.membership, [MISC_CATEGORY_ID]: updatedList },
    });
    const personName = existingStaff ? existingStaff.name : cleanName;
    showToast(t(
      `Miscellaneous duty assigned to ${personName} for ${dutyDates.length} days: "${cleanType}"`,
      `${personName} ને ${dutyDates.length} દિવસ માટે વિવિધ ડ્યુટી સોંપાઈ: "${cleanType}"`
    ));
  };

  // Assigns the same duty, on the same date range, to a whole typed-in
  // group at once (Group Duty) — in a single persist() rather than looping
  // the single-person assignDuty above, so every person's entry lands
  // together instead of each call's update overwriting the last one's.
  // Anyone not already on this work type's roster is added to it as part
  // of the same update; anyone with a duty elsewhere on one of the days is
  // flagged in one combined confirm instead of a dialog per person.
  // outstationTypeId is optional: when given (the Group Duty screen's
  // "Also mark as Outstation" toggle), everyone in the group is ALSO
  // marked Outstation for the exact same date range in the same update —
  // so a long out-of-town duty stint doesn't need a separate manual entry
  // per person in Manage Staff afterward.
  const assignGroupDuty = (catId, people, fromDate, toDate, note, outstationTypeId) => {
    if (!data) return;
    const cat = (data.categories || []).find((c) => c.id === catId);
    if (!cat) { showToast(t("Pick a work type first", "પહેલા કામનો પ્રકાર પસંદ કરો")); return; }
    if (!people || people.length === 0) { showToast(t("Add at least one person to the group first", "પહેલા જૂથમાં ઓછામાં ઓછી એક વ્યક્તિ ઉમેરો")); return; }
    const from = fromDate || todayStr();
    const dutyDates = dateRangeStrs(from, toDate);
    const lastDate = dutyDates[dutyDates.length - 1];

    // Conflict-check every day in the range for every person, not just the
    // first — a multi-day assignment can clash with an existing duty on
    // any one of its days even if the others are free.
    const conflicts = [];
    people.forEach((p) => {
      dutyDates.forEach((d) => {
        const conflict = findDutyConflict(data, p.number, d, catId);
        if (conflict) conflicts.push({ p, date: d, conflict });
      });
    });
    if (conflicts.length > 0) {
      const lines = conflicts.map((x) => `${x.p.name} → ${formatDMY(x.date)} → "${x.conflict.label}"`).join("\n");
      const proceed = window.confirm(t(
        `These people already have a duty elsewhere on one or more of these days:\n${lines}\n\nThis can be legitimate — assign this group duty to everyone anyway?`,
        `આ લોકોને આમાંથી એક અથવા વધુ દિવસોમાં પહેલેથી જ બીજે ડ્યુટી છે:\n${lines}\n\nઆ યોગ્ય પણ હોઈ શકે — બધાને આ જૂથ ડ્યુટી તેમ છતાં સોંપવી છે?`
      ));
      if (!proceed) return;
    }

    // One history entry per calendar day in the range — this is the only
    // thing that needs to happen for the multi-day assignment to show up
    // correctly everywhere else in the app (calendar, monthly duty counts/
    // heat, rotation fairness) automatically, since every one of those
    // views is already built from per-day history entries.
    const noteText = (note || "").trim() || null;
    const baseTs = Date.now();
    const batch = uid();
    const entries = dutyDates.map((d, i) => ({ date: d, ts: baseTs + i, note: noteText, batch }));
    const nextStaff = { ...data.staff };
    const existingList = data.membership[catId] || [];
    const existingNumbers = new Set(existingList.map((m) => m.number));
    const updatedExisting = existingList.map((m) =>
      people.some((p) => p.number === m.number)
        ? { ...m, skip: false, lastDuty: lastDate, history: [...(m.history || []), ...entries] }
        : m
    );
    const newMembers = people
      .filter((p) => !existingNumbers.has(p.number))
      .map((p) => ({ number: p.number, lastDuty: lastDate, history: [...entries], skip: false }));
    people.forEach((p) => {
      if (!nextStaff[p.number]) {
        nextStaff[p.number] = { number: p.number, name: p.name, phone: null, unavailable: null, designation: null, skip: false };
      } else if (nextStaff[p.number].skip) {
        // Same reasoning as assignDuty: being manually put on this duty is
        // an explicit statement of availability, so their global Skip
        // flag (from Manage Staff) clears too — not just the local one on
        // this work type's row above.
        nextStaff[p.number] = { ...nextStaff[p.number], skip: false };
      }
    });
    // Same "mark Outstation" logic Manage Staff uses (unavailablePeriodUpdate),
    // just applied to everyone in the group in this one update instead of
    // one at a time.
    if (outstationTypeId) {
      people.forEach((p) => {
        const rec = nextStaff[p.number];
        nextStaff[p.number] = { ...rec, ...unavailablePeriodUpdate(rec, "Outstation", outstationTypeId, from, lastDate) };
      });
    }
    persist({
      ...dataRef.current,
      staff: nextStaff,
      membership: { ...data.membership, [catId]: [...updatedExisting, ...newMembers] },
    });
    const dateRangeTxt = dutyDates.length > 1
      ? t(`from ${formatDMY(from)} to ${formatDMY(lastDate)}`, `${formatDMY(from)} થી ${formatDMY(lastDate)} સુધી`)
      : t(`on ${formatDMY(from)}`, `${formatDMY(from)} ના રોજ`);
    const outstationTxt = outstationTypeId ? t(" — also marked Outstation for the same dates", " — તે જ તારીખો માટે બહારગામ તરીકે પણ માર્ક કર્યું") : "";
    showToast(t(
      `Group duty assigned to ${people.length} ${people.length === 1 ? "person" : "people"} for ${cat.label} ${dateRangeTxt}${outstationTxt}`,
      `${cat.label} માટે ${dateRangeTxt} ${people.length} લોકોને જૂથ ડ્યુટી સોંપાઈ${outstationTxt}`
    ));
  };

  // ---------- staff directory mutations ----------
  const createStaff = (number, name, phone, designation) => {
    const num = (number || "").trim();
    const cleanName = (name || "").trim();
    const cleanPhone = (phone || "").trim();
    if (!num || !cleanName) { showToast(t("Enter both number and name", "નંબર અને નામ બંને દાખલ કરો")); return; }
    if (data.staff[num]) { showToast(t("That number is already in use", "તે નંબર પહેલેથી જ ઉપયોગમાં છે")); return; }
    persist({ ...dataRef.current, staff: { ...data.staff, [num]: { number: num, name: cleanName, phone: cleanPhone || null, unavailable: null, designation: designation || null } } });
    showToast(t(`${cleanName} added to staff directory`, `${cleanName} સ્ટાફ ડિરેક્ટરીમાં ઉમેરાયું`));
  };
  // Bulk import from CSV — entries: [{ number, name, designation, phone }]
  // where designation is a free-text label matched (case-insensitively)
  // against existing designations. Unknown/blank designations are simply
  // left unset rather than silently creating new designations from typos.
  const bulkImportStaff = (entries) => {
    if (!data || !entries || !entries.length) return;
    const desgByLabel = {};
    (data.designations || []).forEach((d) => { desgByLabel[d.label.trim().toLowerCase()] = d.id; });
    const nextStaff = { ...data.staff };
    let added = 0, updated = 0, skipped = 0, unmatchedDesg = 0;
    entries.forEach((e) => {
      const num = (e.number || "").trim();
      const cleanName = (e.name || "").trim();
      const cleanPhone = (e.phone || "").trim();
      if (!num || !cleanName) { skipped++; return; }
      let desgId = null;
      const rawDesg = (e.designation || "").trim();
      if (rawDesg) {
        desgId = desgByLabel[rawDesg.toLowerCase()] || null;
        if (!desgId) unmatchedDesg++;
      }
      if (nextStaff[num]) {
        nextStaff[num] = { ...nextStaff[num], name: cleanName, phone: cleanPhone || nextStaff[num].phone || null, designation: desgId || nextStaff[num].designation || null };
        updated++;
      } else {
        nextStaff[num] = { number: num, name: cleanName, phone: cleanPhone || null, unavailable: null, designation: desgId || null };
        added++;
      }
    });
    persist({ ...dataRef.current, staff: nextStaff });
    let msg = t(`Imported: ${added} added, ${updated} updated`, `આયાત થયું: ${added} ઉમેરાયા, ${updated} અપડેટ થયા`);
    if (skipped) msg += t(`, ${skipped} skipped (missing number/name)`, `, ${skipped} છોડી દેવાયા (નંબર/નામ ખૂટે છે)`);
    if (unmatchedDesg) msg += t(`, ${unmatchedDesg} with unrecognized designation`, `, ${unmatchedDesg} અજાણ્યા હોદ્દા સાથે`);
    showToast(msg);
  };
  const renameStaff = (number) => {
    const cur = data.staff[number];
    const next = window.prompt(t("Edit name:", "નામ સંપાદિત કરો:"), cur ? cur.name : "");
    if (!next || !next.trim()) return;
    persist({ ...dataRef.current, staff: { ...data.staff, [number]: { ...cur, name: next.trim() } } });
  };
  const setStaffPhone = (number) => {
    const cur = data.staff[number];
    const next = window.prompt(t("Mobile number (used for WhatsApp duty notices):", "મોબાઇલ નંબર (WhatsApp ડ્યુટી સૂચનાઓ માટે વપરાય છે):"), cur ? (cur.phone || "") : "");
    if (next === null) return; // cancelled
    const cleaned = next.trim();
    if (cleaned && cleaned.replace(/\D/g, "").length < 10) { showToast(t("Enter a valid mobile number", "માન્ય મોબાઇલ નંબર દાખલ કરો")); return; }
    persist({ ...dataRef.current, staff: { ...data.staff, [number]: { ...cur, phone: cleaned || null } } });
  };
  const deleteStaffGlobally = (number) => {
    const cur = data.staff[number];
    if (!window.confirm(t(`Remove ${cur ? cur.name : number} from every work type? They'll move to the Recycle bin and can be restored later.`, `${cur ? cur.name : number} ને દરેક કામના પ્રકારમાંથી કાઢી નાખવું છે? તેઓ રિસાયકલ બિનમાં જશે અને પછીથી પુનઃસ્થાપિત કરી શકાશે.`))) return;
    const nextStaff = { ...data.staff };
    delete nextStaff[number];
    const nextMembership = {};
    const removedMemberships = [];
    Object.keys(data.membership).forEach((catId) => {
      nextMembership[catId] = data.membership[catId].filter((m) => {
        if (m.number === number) { removedMemberships.push({ catId, entry: m }); return false; }
        return true;
      });
    });
    const recycled = withRecycled({ ...data, staff: nextStaff, membership: nextMembership }, {
      type: "staff",
      label: cur ? cur.name : number,
      payload: { staffRecord: cur || { number, name: number, unavailable: null }, memberships: removedMemberships },
    });
    persist(recycled);
    showToast(t(`Moved ${cur ? cur.name : number} to Recycle bin`, `${cur ? cur.name : number} રિસાયકલ બિનમાં ખસેડાયું`));
  };
  const setUnavailable = (number, kind, typeId, from, to, silent) => {
    const list = kind === "Leave" ? data.leaveTypes : data.outstationTypes;
    const found = (list || []).find((t) => t.id === typeId);
    const label = found ? found.label : kind;
    const isIndefinite = !!(found && found.indefinite);
    if (!from) { if (!silent) showToast(t("Pick a start date", "શરૂઆતની તારીખ પસંદ કરો")); return; }
    if (!isIndefinite && (!to || to < from)) { if (!silent) showToast(t("Pick a valid date range", "માન્ય તારીખ શ્રેણી પસંદ કરો")); return; }
    const finalTo = isIndefinite ? null : to;
    const isPastOnly = finalTo && finalTo < todayStr();
    // Reads from dataRef.current, not the closure `data` — critical when
    // this is called several times in a row for the SAME person (e.g.
    // Record Leave's batch queue: two different leaves for one person in
    // one sitting). `data` only reflects whatever it was when THIS
    // render started and doesn't change again until React re-renders —
    // which doesn't happen between synchronous calls in the same click
    // handler — so a second call for the same person would have read
    // prevRec from BEFORE the first call's write, silently discarding it
    // the moment the second one saved. dataRef.current is updated
    // synchronously on every persist(), so each call in a batch always
    // builds on the one immediately before it.
    const prevRec = dataRef.current.staff[number];
    if (!prevRec) { if (!silent) showToast(t("No staff found with that buckle number", "તે બકલ નંબર સાથે કોઈ સ્ટાફ મળ્યો નથી"), "error"); return; }
    // Any duty already recorded for this person, in ANY work type, that
    // falls inside the leave/outstation dates just set is now
    // impossible — they can't genuinely have been on duty and on leave
    // the same day. Removed outright rather than left for someone to
    // notice and clean up by hand later.
    const { membership: conflictFreeMembership, removedCount } = removeConflictingDutiesForLeave(dataRef.current.membership, number, from, finalTo);
    persist({
      ...dataRef.current,
      staff: {
        ...dataRef.current.staff,
        [number]: { ...prevRec, ...unavailablePeriodUpdate(prevRec, kind, typeId, from, finalTo) },
      },
      membership: conflictFreeMembership,
    });
    if (silent) return;
    const dateRangeText = isPastOnly
      ? t(` — recorded for ${formatDMY(from)}${finalTo && finalTo !== from ? " to " + formatDMY(finalTo) : ""} on the calendar; today's status is unchanged`, ` — કૅલેન્ડર પર ${formatDMY(from)}${finalTo && finalTo !== from ? " થી " + formatDMY(finalTo) : ""} માટે નોંધાયું; આજની સ્થિતિ યથાવત છે`)
      : (finalTo ? t(" until " + formatDMY(finalTo), " " + formatDMY(finalTo) + " સુધી") : t(" — no end date", " — કોઈ અંતિમ તારીખ નથી"));
    const conflictText = removedCount > 0
      ? t(` (${removedCount} conflicting duty ${removedCount === 1 ? "entry" : "entries"} removed)`, ` (${removedCount} વિરોધાભાસી ડ્યુટી નોંધ${removedCount === 1 ? "" : "ો"} દૂર કરી)`)
      : "";
    showToast(t(`${prevRec.name} marked ${label.toLowerCase()}${dateRangeText}${conflictText}`, `${prevRec.name} ને ${label.toLowerCase()} તરીકે માર્ક કર્યું${dateRangeText}${conflictText}`));
  };
  const clearUnavailable = (number) => {
    const prevRec = dataRef.current.staff[number];

    // matching entry in history at yesterday (instead of just discarding

    // up through yesterday, rather than losing that record entirely.
    const yesterday = addDaysStr(todayStr(), -1);
    const history = (prevRec.unavailableHistory || []).map((p) =>
      cur && p.kind === cur.kind && p.typeId === cur.typeId && p.from === cur.from && p.to === cur.to
        ? { ...p, to: yesterday }

  const changeUnavailableDuration = (number, kind, typeId, from, to) => {

    const finalTo = isIndefinite ? null : to;

    const history = (prevRec.unavailableHistory || []).map((p) =>
      cur && p.kind === cur.kind && p.typeId === cur.typeId && p.from === cur.from && p.to === cur.to
        ? newPeriod
        : p
    );
    const { membership: conflictFreeMembership, removedCount } = removeConflictingDutiesForLeave(dataRef.current.membership, number, from, finalTo);
    persist({ ...dataRef.current, staff: { ...dataRef.current.staff, [number]: { ...prevRec, unavailable: newPeriod, unavailableHistory: history } }, membership: conflictFreeMembership });
    const conflictText = removedCount > 0
      ? t(` (${removedCount} conflicting duty ${removedCount === 1 ? "entry" : "entries"} removed)`, ` (${removedCount} વિરોધાભાસી ડ્યુટી નોંધ${removedCount === 1 ? "" : "ો"} દૂર કરી)`)

    showToast(t(`Updated ${prevRec.name}'s dates${conflictText}`, `${prevRec.name} ની તારીખો અપડેટ થઈ${conflictText}`));

  // For fixing an accidental leave/outstation entry on the Duty calendar —
  // Undo can't help once the app's been refreshed, so this is the durable
  // fix: find and remove that one specific period from the person's

  // CURRENT status too if it happened to be the active one. Goes through

  const deleteUnavailableHistoryEntry = (number, from, to) => {
    const prevRec = dataRef.current.staff[number];

    const idx = history.findIndex((p) => p.from === from && (p.to || null) === (to || null));
    if (idx === -1) return;
    const removed = history[idx];
    const cur = prevRec.unavailable;
    const wasCurrent = !!(cur && cur.kind === removed.kind && cur.typeId === removed.typeId && cur.from === removed.from && (cur.to || null) === (removed.to || null));
    const nextHistory = history.filter((_, i) => i !== idx);
    const recycled = withRecycled({
      ...dataRef.current,
      staff: { ...dataRef.current.staff, [number]: { ...prevRec, unavailable: wasCurrent ? null : cur, unavailableHistory: nextHistory } },
    }, {
      type: "unavailable",
      label: `${prevRec.name}'s ${(removed.kind || "").toLowerCase()} record (${formatDMY(from)}${to && to !== from ? " – " + formatDMY(to) : ""})`,
      payload: { number, entry: removed, wasCurrent },
    });
    persist(recycled);
    showToast(t("Record deleted — moved to Recycle bin", "રેકોર્ડ ડિલીટ થયો — રિસાયકલ બિનમાં ખસેડાયો"));

  const renameOutstationType = (id) => {

  const deleteDesignation = (id) => {

    const nextStaff = { ...data.staff };

  const setStaffDesignation = (number, designationId) => {

  // ---------- employee events (Leave / Outstation Duty / Training) ----------
  const addEvent = (name, type, start, end, notes, number) => {

    if (!EVENT_TYPES.includes(type)) { showToast(t("Pick an event type", "ઇવેન્ટનો પ્રકાર પસંદ કરો"), "error"); return; }
    if (!start || !end) { showToast(t("Pick both a start and end date", "શરૂઆત અને અંતિમ બંને તારીખ પસંદ કરો"), "error"); return; }

    const event = { id: uid(), name: cleanName, number: (number || "").trim() || null, type, start, end, notes: (notes || "").trim(), createdAt: Date.now() };
    persist({ ...dataRef.current, events: [...(data.events || []), event] });
    showToast(t(`${EVENT_TYPE_LABEL[type]} added for ${cleanName}`, `${cleanName} માટે ${EVENT_TYPE_LABEL_GU[type]} ઉમેરાયું`));
  };
  const updateEvent = (id, patch) => {

    if (!cur) return;
    const merged = { ...cur, ...patch };
    if (!merged.name || !merged.name.trim()) { showToast(t("Enter an employee name", "કર્મચારીનું નામ દાખલ કરો"), "error"); return; }
    if (!merged.start || !merged.end) { showToast(t("Pick both a start and end date", "શરૂઆત અને અંતિમ બંને તારીખ પસંદ કરો"), "error"); return; }
    if (merged.end < merged.start) { showToast(t("End date can't be before the start date", "અંતિમ તારીખ શરૂઆતની તારીખ પહેલાં ન હોઈ શકે"), "error"); return; }
    // A changed date means the old reminder no longer describes reality —
    // clear its ack so the (now different) milestone gets a fresh reminder
    // instead of silently staying "Acknowledged" against a stale date.
    const nextAcks = { ...(data.reminderAcks || {}) };
    if (patch.start !== undefined && patch.start !== cur.start) delete nextAcks[id + ":start"];
    if (patch.end !== undefined && patch.end !== cur.end) delete nextAcks[id + ":end"];
    persist({ ...dataRef.current, events: (data.events || []).map((e) => e.id === id ? merged : e), reminderAcks: nextAcks });
    showToast(t(`Event updated for ${merged.name}`, `${merged.name} માટે ઇવેન્ટ અપડેટ થયું`));
  };
  const deleteEvent = (id) => {

    if (!window.confirm(t(`Delete this ${cur ? EVENT_TYPE_LABEL[cur.type].toLowerCase() : "event"} record${cur ? " for " + cur.name : ""}? This can't be undone from the recycle bin.`, `આ ${cur ? EVENT_TYPE_LABEL_GU[cur.type] : "ઇવેન્ટ"} રેકોર્ડ${cur ? " " + cur.name + " માટે" : ""} ડિલીટ કરવો છે? આ રિસાયકલ બિનમાંથી પુનઃસ્થાપિત કરી શકાશે નહીં.`))) return;

  };
  const acknowledgeReminder = (key) => {
    persist({ ...dataRef.current, reminderAcks: { ...(data.reminderAcks || {}), [key]: true } });
  };

  // ---------- full data backup / restore (JSON download & upload) ----------
  const importBackupRef = useRef(null);
  // Every backup gets its own uniquely-named file, timestamped down to
  // the second — matches "every time a backup is triggered, it should
  // be stored" rather than one file that keeps getting overwritten.
  const exportBackup = async () => {
    if (!data) return;
    const filename = `nokri-book-backup-${todayStr()}-${Date.now()}.json`;
    const jsonStr = JSON.stringify(data, null, 2);

    // The File System Access API (Chrome/Edge only — Safari and Firefox
    // don't support it at all) is the only way a website can write
    // directly into a real folder on the device without a fresh "Save
    // As" prompt every single time. The folder is chosen once and its
    // handle persisted in IndexedDB (see idbGetHandle/idbSetHandle
    // above); every later backup reuses it silently, asking again only
    // if permission was actually revoked or no folder was ever chosen.
    if (window.showDirectoryPicker) {
      try {
        let handle = await idbGetHandle("backupDir");
        if (handle) {
          const perm = await handle.queryPermission({ mode: "readwrite" });
          if (perm !== "granted") {
            const req = await handle.requestPermission({ mode: "readwrite" });
            if (req !== "granted") handle = null;
          }
        }
        if (!handle) {
          // First backup ever on this device/browser — explain what's
          // about to happen before the native OS folder picker pops up
          // with no context. Declining just falls straight through to a
          // plain single-file download below instead, so "no" still
          // produces a real backup.
          const wantsFolder = window.confirm(t(
            "Choose a folder on this device where every backup will be saved automatically from now on? You'll only be asked once — after this, backups happen silently. Choose Cancel to just download this one backup as a file instead.",
            "આ ડિવાઇસ પર એક ફોલ્ડર પસંદ કરવું છે જ્યાં હવેથી દરેક બેકઅપ આપમેળે સચવાય? તમને ફક્ત એક જ વાર પૂછવામાં આવશે — ત્યાર પછી, બેકઅપ ચૂપચાપ થાય છે. ફક્ત આ એક બેકઅપને ફાઇલ તરીકે ડાઉનલોડ કરવા માટે રદ કરો પસંદ કરો."
          ));
          if (!wantsFolder) throw Object.assign(new Error("declined"), { name: "AbortError" });
          handle = await window.showDirectoryPicker({ id: "nokribook-backups", mode: "readwrite" });
          await idbSetHandle("backupDir", handle);
        }
        const fileHandle = await handle.getFileHandle(filename, { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(jsonStr);
        await writable.close();
        recordBackupNow();
        showToast(t(`Backup saved to your chosen folder`, `તમારા પસંદ કરેલા ફોલ્ડરમાં બેકઅપ સચવાયો`));
        return;
      } catch (e) {
        // AbortError means they explicitly cancelled the folder picker —
        // respect that as "not now" and stop, rather than immediately
        // forcing a plain download as a consolation prize they didn't
        // ask for. Any OTHER failure (permission API hiccup, etc.) falls
        // through to the plain download below instead of leaving them
        // with nothing at all.
        if (e && e.name === "AbortError") return;
        console.error("Folder backup failed, falling back to plain download:", e);
      }
    }

    // Fallback: a plain single-file download — either this browser
    // doesn't support the folder-based path at all (Safari, Firefox), or
    // it does but something about it failed just now.
    const blob = new Blob([jsonStr], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    recordBackupNow();

  };
  // Lets someone pick a different backup folder later, or set one up for

  const chooseBackupFolder = async () => {

      return;
    }
    try {
      const handle = await window.showDirectoryPicker({ id: "nokribook-backups", mode: "readwrite" });
      await idbSetHandle("backupDir", handle);

  // Recovers the automatic local snapshot saved on every genuine

  const recoverLocalBackup = () => {
    let raw;
    try { raw = localStorage.getItem("nb_auto_backup"); } catch (e) { raw = null; }
    if (!raw) { showToast(t("No local data snapshot found on this device yet", "આ ડિવાઇસ પર હજુ કોઈ સ્થાનિક ડેટા સ્નેપશોટ મળ્યો નથી"), "error"); return; }
    let parsed;
    try { parsed = JSON.parse(raw); } catch (e) { showToast(t("The local data snapshot on this device is corrupted", "આ ડિવાઇસ પરનો સ્થાનિક ડેટા સ્નેપશોટ ખરાબ થયેલો છે"), "error"); return; }
    const when = new Date(parsed.savedAt).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
    if (!window.confirm(t(
      `Restore the local data from ${when}? It will replace ALL current data (staff, work types, history, designations, everything). You can still Ctrl+Z once right after, but do this carefully.`,
      `${when} નો સ્થાનિક ડેટા પુનઃસ્થાપિત કરવો છે? તે તમામ હાલનો ડેટા (સ્ટાફ, કામના પ્રકારો, ઇતિહાસ, હોદ્દાઓ, બધું) બદલી નાખશે. તમે તરત જ પછી એકવાર Ctrl+Z કરી શકો છો, પણ કાળજીપૂર્વક કરો.`
    ))) return;
    persist(normalizeData(parsed.data));

  };
  const importBackup = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let parsed;
      try {

      } catch (e) {

      }
      if (!parsed || typeof parsed !== "object" || !parsed.staff || !parsed.categories) {

        return;
      }
      if (!window.confirm(t("Restore this backup? It will replace ALL current data (staff, work types, history, designations, everything). You can still Ctrl+Z once right after, but do this carefully.", "આ બેકઅપ પુનઃસ્થાપિત કરવો છે? તે તમામ હાલનો ડેટા (સ્ટાફ, કામના પ્રકારો, ઇતિહાસ, હોદ્દાઓ, બધું) બદલી નાખશે. તમે તરત જ પછી એકવાર Ctrl+Z કરી શકો છો, પણ કાળજીપૂર્વક કરો."))) return;
      // Routed through the same normalizeData() every other data-load path
      // uses (initial sign-in, legacy import) instead of persisting the
      // parsed file as-is — makes sure a backup taken on an older version
      // of the app (before some field existed) comes back with the same
      // shape the rest of the app expects, rather than silently missing
      // pieces like designations or unavailableHistory.
      persist(normalizeData(parsed));
      showToast(t("Backup restored", "બેકઅપ પુનઃસ્થાપિત થયો"));
    };

  if (user === null) return <LangContext.Provider value={langCtxValue}><SignInScreen /></LangContext.Provider>;

  // longer any state where the full app renders and accepts changes without

  // whenever the connection genuinely recovers, the listener's own success

  if (!data) {

              Your data is safe — nothing has been changed or deleted. If this keeps happening, try disabling any ad-blocker or privacy extension for this site, or open it in an incognito/private window — some of them silently block a background security check this app uses. If it still fails after that, contact your administrator.
            </div>
            <button

            <button
              onClick={() => {

          </div>
        </div>
      );
    }
    return <div style={{position: "fixed", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", color: "var(--text-secondary)"}}>Loading roster…</div>;
  }

  return (
    <LangContext.Provider value={langCtxValue}>

        <div style={{ background: "var(--status-error-bg)", color: "var(--status-error-text)", padding: "10px 16px", fontSize: 13, textAlign: "center" }}>

          {" "}<button onClick={() => {

              <span

                  : langCtxValue.t("Couldn't save yet — retrying automatically. Don't close this tab until it clears.", "હજુ સાચવી શકાયું નથી — આપમેળે ફરી પ્રયાસ થઈ રહ્યો છે. આ ટેબ સાફ ન થાય ત્યાં સુધી બંધ ન કરો.")}

                  >↶ {langCtxValue.t("Undo", "પૂર્વવત્")}{undoStack.length ? ` (${undoStack.length})` : ""}</button>
                  <button onClick={() => { redo(); setUndoRedoMenuPos(null); }} disabled={redoStack.length === 0}
                    style={{ display: "block", width: "100%", textAlign: "left", padding: "9px 12px", background: "none", border: "none", fontSize: 12.5, color: redoStack.length ? "var(--text-primary)" : "var(--text-tertiary)", cursor: redoStack.length ? "pointer" : "default" }} className="gu"
                  >↷ {langCtxValue.t("Redo", "ફરીથી કરો")}{redoStack.length ? ` (${redoStack.length})` : ""}</button>

            {dataMenuPos && (

                <div onClick={() => { setDataMenuPos(null); setBackupMenuPos(null); }} style={{ position: "fixed", inset: 0, zIndex: 200 }} />
                <div style={{

                  background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 8,
                  boxShadow: "0 8px 20px rgba(0,0,0,0.15)", overflow: "hidden",
                }}>
                  <button onClick={() => { syncNow(); setDataMenuPos(null); }} disabled={syncing}
                    title={langCtxValue.t("Force a check that everything has actually reached the server", "બધું ખરેખર સર્વર સુધી પહોંચ્યું છે તે ફરજિયાત તપાસો")}
                    style={{ display: "block", width: "100%", textAlign: "left", padding: "9px 12px", background: "none", border: "none", borderBottom: "1px solid var(--border-soft)", fontSize: 12.5, cursor: syncing ? "default" : "pointer", color: syncing ? "var(--text-tertiary)" : "var(--text-primary)" }} className="gu"
                  >🔄 {syncing ? langCtxValue.t("Syncing…", "સિંક થઈ રહ્યું છે…") : langCtxValue.t("Sync", "સિંક")}</button>
                  <button
                    onClick={(e) => {
                      if (backupMenuPos) { setBackupMenuPos(null); return; }
                      const rect = e.currentTarget.getBoundingClientRect();
                      const submenuWidth = 200;
                      const opensRight = window.innerWidth - rect.right >= submenuWidth + 8;
                      setBackupMenuPos({ top: rect.top, left: opensRight ? rect.right + 4 : Math.max(8, rect.left - submenuWidth - 4) });
                    }}
                    style={{ display: "flex", justifyContent: "space-between", alignItems: "center", width: "100%", textAlign: "left", padding: "9px 12px", background: backupMenuPos ? "var(--bg-page)" : "none", border: "none", borderBottom: "1px solid var(--border-soft)", fontSize: 12.5, cursor: "pointer" }} className="gu"
                  ><span>⬇ {langCtxValue.t("Backup", "બેકઅપ")}</span><span style={{ color: "var(--text-tertiary)" }}>▸</span></button>
                  <button onClick={() => { setShowDrivePanel(true); setDataMenuPos(null); }}
                    style={{ display: "block", width: "100%", textAlign: "left", padding: "9px 12px", background: "none", border: "none", fontSize: 12.5, cursor: "pointer" }} className="gu"
                  >☁ {langCtxValue.t("Google Drive", "Google Drive")}{driveConnected && !driveNeedsReconnect ? " ✓" : ""}</button>
                </div>
              </React.Fragment>
            )}
            {backupMenuPos && (
              <div style={{
                position: "fixed", top: backupMenuPos.top, left: backupMenuPos.left, zIndex: 202, minWidth: 200,

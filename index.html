function ReportView({ data }) {
  const { t } = useLang();
  const [month, setMonth] = useState(todayStr().slice(0, 7));
  const [pdfBusy, setPdfBusy] = useState(false);
  const [sortNames, setSortNames] = useState("name"); // name | duties
  const [showInfo, setShowInfo] = useState(false);

  const desgLabelOf = useMemo(() => {
    const map = {};
    (data.designations || []).forEach((d) => { map[d.id] = d.label; });
    return (id) => (id && map[id]) || "—";
  }, [data.designations]);

  const rows = useMemo(() => {
    const out = [];
    data.categories.forEach((c) => {
      (data.membership[c.id] || []).forEach((m) => {
        const staffRec = data.staff[m.number];
        if (!staffRec) return;
        (m.history || []).forEach((entry) => {
          const date = historyDate(entry);
          if (date.slice(0, 7) === month) out.push({ name: staffRec.name, designation: desgLabelOf(staffRec.designation), category: c.label, date, note: historyNote(entry) });
        });
      });
    });
    return out.sort((a, b) => a.name.localeCompare(b.name) || a.date.localeCompare(b.date));
  }, [data, month, desgLabelOf]);

  const grouped = useMemo(() => {
    const g = {};
    rows.forEach((r) => { (g[r.name] = g[r.name] || []).push(r); });
    return g;
  }, [rows]);

  // Names ordered either alphabetically or by total duty count (most first)
  // — this is the "who does duty the most" view across every work type
  // combined, for the selected month.
  const orderedNames = useMemo(() => {
    const names = Object.keys(grouped);
    if (sortNames === "duties") return names.sort((a, b) => grouped[b].length - grouped[a].length || a.localeCompare(b));
    return names.sort();
  }, [grouped, sortNames]);

  const monthLabel = new Date(month + "-01T00:00:00").toLocaleDateString(t("en-IN", "gu-IN"), { month: "long", year: "numeric" });

  const downloadPdf = async () => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const GU_FONT = "NotoSansGujarati";
    const FONT_PT = 9;

    setPdfBusy(true);
    try {
      const base64 = await loadGujaratiFont();
      doc.addFileToVFS("NotoSansGujarati-Regular.ttf", base64);
      doc.addFont("NotoSansGujarati-Regular.ttf", GU_FONT, "normal");
      await ensureGujaratiCanvasFont();
    } catch (e) {
      setPdfBusy(false);
      window.alert(t("Could not load Gujarati font — check your internet connection and try again.", "ગુજરાતી ફોન્ટ લોડ થઈ શક્યો નહીં — તમારું ઇન્ટરનેટ કનેક્શન તપાસો અને ફરી પ્રયાસ કરો."));
      return;
    }
    setPdfBusy(false);

    doc.setFontSize(14);
    doc.text("Nokri Book — Monthly Duty Report", 14, 16);
    doc.setFontSize(10);
    doc.text(monthLabel, 14, 23);
    doc.setFontSize(8.5);
    doc.text("Generated " + new Date().toLocaleString(), 14, 28);
    // Summary table first: one row per person, total duties this month
    // across every work type combined, most duties first — the "who does
    // duty the most" answer at a glance before the full day-by-day list.
    const summaryNames = Object.keys(grouped).sort((a, b) => grouped[b].length - grouped[a].length || a.localeCompare(b));
    // Every cell that might contain Gujarati text (Name, Designation, Work
    // type, Note — basically anything that isn't a plain number or a
    // machine-formatted date) checks needsImageRender and only goes
    // through the canvas-image path if it actually contains non-ASCII
    // characters — an English work-type label right next to a Gujarati
    // name in the same row renders through jsPDF's own crisp native text
    // instead of being needlessly rasterized too, which is what was
    // making it look visually inconsistent (different weight/size) next
    // to the Gujarati cells. didParseCell blanks the cell's native text
    // only when it needs the image treatment, leaving `cell.raw` and
    // normal auto-sizing untouched either way; didDrawCell then places
    // the pre-rendered image on top only for those same cells.
    doc.autoTable({
      startY: 33,
      head: [["#", "Name", "Designation", "Total duties"]],
      body: summaryNames.map((name, i) => [i + 1, name, grouped[name][0].designation, grouped[name].length]),
      styles: { fontSize: FONT_PT },
      headStyles: { fillColor: [14, 22, 32] },
      // autoTable sizes "auto" columns from each cell's text width — but
      // didParseCell (below) blanks the Name/Designation cell text for
      // any Gujarati content so the image can be drawn instead, which
      // means autoTable would otherwise measure those cells as EMPTY and
      // size the column far too narrow for the name that's actually
      // drawn into it, forcing drawTextImageInCell to squeeze the image
      // down to fit. minCellWidth reserves enough room up front so a
      // typical full name fits without being visually cluttered.
      columnStyles: { 1: { minCellWidth: 55 }, 2: { minCellWidth: 30 } },
      didParseCell: (hookData) => {
        if (hookData.section === "body" && (hookData.column.index === 1 || hookData.column.index === 2) && needsImageRender(hookData.cell.raw)) {
          hookData.cell.text = [];
        }
      },
      didDrawCell: (hookData) => {
        if (hookData.section === "body" && (hookData.column.index === 1 || hookData.column.index === 2)) {
          const raw = hookData.cell.raw;
          if (raw != null && raw !== "" && needsImageRender(raw)) drawTextImageInCell(doc, hookData.cell, renderTextToImage(raw, FONT_PT), FONT_PT);
        }
      },
    });

    doc.setFontSize(11);
    doc.text("Full detail", 14, doc.lastAutoTable.finalY + 10);
    const collapsedRows = collapseConsecutiveDutyRows(rows);
    doc.autoTable({
      startY: doc.lastAutoTable.finalY + 14,
      head: [["#", "Name", "Designation", "Work type", "Dates", "Days", "Note"]],
      body: collapsedRows.map((r, i) => [
        i + 1, r.name, r.designation, r.category,
        r.from === r.to ? formatDMY(r.from) : `${formatDMY(r.from)} – ${formatDMY(r.to)}`,
        r.days, r.note || "",
      ]),
      styles: { fontSize: FONT_PT },
      headStyles: { fillColor: [14, 22, 32] },
      // Same reasoning as the summary table above: didParseCell blanks
      // these cells' text for the image-render path, so without an
      // explicit minCellWidth autoTable would size the column from
      // (nothing), not from the name/word that actually gets drawn —
      // this table has 7 columns competing for the same page width, so
      // it needs this even more than the 4-column summary table does.
      columnStyles: { 1: { minCellWidth: 40 }, 2: { minCellWidth: 22 }, 3: { minCellWidth: 26 }, 6: { minCellWidth: 26 } },
      // Name (1), Designation (2), Work type (3), and Note (6) can
      // contain Gujarati text, but each cell is only imaged if it
      // actually does (needsImageRender) — # (0), Dates (4), and Days
      // (5) are always plain numbers/ASCII so those never get imaged.
      didParseCell: (hookData) => {
        if (hookData.section === "body" && [1, 2, 3, 6].includes(hookData.column.index) && needsImageRender(hookData.cell.raw)) {
          hookData.cell.text = [];
        }
      },
      didDrawCell: (hookData) => {
        if (hookData.section === "body" && [1, 2, 3, 6].includes(hookData.column.index)) {
          const raw = hookData.cell.raw;
          if (raw != null && raw !== "" && needsImageRender(raw)) drawTextImageInCell(doc, hookData.cell, renderTextToImage(raw, FONT_PT), FONT_PT);
        }
      },
    });
    doc.save(`nokri-book-report-${month}-gu.pdf`);
  };

  return (
    <React.Fragment>
      <div style={{ display: "flex", alignItems: "center", marginBottom: showInfo ? 4 : 20 }}>
        <h1 className="disp gu" style={{ fontSize: 22, fontWeight: 700, margin: 0 }}>{t("Monthly report", "માસિક અહેવાલ")}</h1>
        <InfoIconButton active={showInfo} onClick={() => setShowInfo((v) => !v)} label={t("About this screen", "આ સ્ક્રીન વિશે")} />
      </div>
      {showInfo && (
        <p style={{ fontSize: 13, color: "var(--text-secondary)", margin: "0 0 20px" }} className="gu">
          {t("Shows every duty completed in the selected month, by name and work type. Buckle numbers are never included in the report.", "પસંદ કરેલા મહિનામાં પૂર્ણ થયેલી દરેક ડ્યુટી, નામ અને કામના પ્રકાર પ્રમાણે બતાવે છે. બકલ નંબરો ક્યારેય અહેવાલમાં સામેલ થતા નથી.")}
        </p>
      )}

      <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 18, flexWrap: "wrap" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
          <button
            onClick={() => setMonth((m) => shiftMonthStr(m, -1))}
            title={t("Previous month", "પાછલો મહિનો")} aria-label={t("Previous month", "પાછલો મહિનો")}
            style={{ background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 6, width: 30, height: 30, fontSize: 14, color: "var(--text-primary)", cursor: "pointer" }}
          >◀</button>
          <input type="month" value={month} onChange={(e) => setMonth(e.target.value)} />
          <button
            onClick={() => setMonth((m) => shiftMonthStr(m, 1))}
            title={t("Next month", "આગલો મહિનો")} aria-label={t("Next month", "આગલો મહિનો")}
            style={{ background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 6, width: 30, height: 30, fontSize: 14, color: "var(--text-primary)", cursor: "pointer" }}
          >▶</button>
        </div>
        <button onClick={downloadPdf} disabled={rows.length === 0 || pdfBusy} style={{ background: rows.length && !pdfBusy ? "#D98E2B" : "var(--border)", color: "#fff", border: "none", borderRadius: 7, padding: "8px 16px", fontSize: 13, fontWeight: 600 }} className="gu">{pdfBusy ? t("Preparing…", "તૈયાર થઈ રહ્યું છે…") : t("Download PDF", "PDF ડાઉનલોડ કરો")}</button>
        <div style={{ fontSize: 12, color: "var(--text-secondary)" }} className="gu">{t(`${rows.length} duty record${rows.length === 1 ? "" : "s"} in ${monthLabel}`, `${monthLabel} માં ${rows.length} ડ્યુટી રેકોર્ડ`)}</div>
      </div>

      <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
        <button onClick={() => setSortNames("name")} style={catTabBtn(sortNames === "name")} className="gu">{t("Sort: Name", "ક્રમ: નામ")}</button>
        <button onClick={() => setSortNames("duties")} style={catTabBtn(sortNames === "duties")} className="gu">{t("Sort: Most duties first", "ક્રમ: સૌથી વધુ ડ્યુટી પ્રથમ")}</button>
      </div>

      <div style={{ background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 10, overflow: "hidden" }}>
        {orderedNames.length === 0 ? (
          <div style={{ padding: "26px 0", textAlign: "center", color: "var(--text-tertiary)", fontSize: 13 }} className="gu">{t(`No duty recorded for ${monthLabel} yet.`, `${monthLabel} માટે હજુ કોઈ ડ્યુટી નોંધાયેલી નથી.`)}</div>
        ) : orderedNames.map((name, i) => (
          <div key={name} style={{ borderTop: "1px solid var(--border-soft)", padding: "12px 18px" }}>
            <div className="gu" style={{ fontWeight: 600, fontSize: 14, marginBottom: 5, display: "flex", alignItems: "center", gap: 8 }}>
              {sortNames === "duties" && <span className="mono" style={{ fontSize: 11, color: "var(--text-tertiary)" }}>#{i + 1}</span>}
              <span>{name}</span>
              {grouped[name][0].designation && grouped[name][0].designation !== "—" && (
                <span style={{ fontSize: 11, fontWeight: 500, color: "var(--status-warning-text)" }}>({grouped[name][0].designation})</span>
              )}
              <span className="mono" style={{ fontSize: 11, fontWeight: 700, background: "var(--status-warning-bg)", color: "var(--status-warning-text)", borderRadius: 10, padding: "1px 8px" }}>{grouped[name].length}</span>
            </div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
              {grouped[name].map((r, i) => (
                <span key={i} className="mono" title={r.note || ""} style={{ fontSize: 11.5, background: "var(--bg-surface-2)", border: "1px solid var(--border-soft)", borderRadius: 5, padding: "3px 8px" }}>{r.category} · {formatDMY(r.date)}{r.note ? " 📝" : ""}</span>
              ))}
            </div>
          </div>
        ))}
      </div>
    </React.Fragment>
  );
}

// ---------- Employee events (Leave / Outstation Duty / Training) + reminders ----------
function EventsView({ data, allReminders, addEvent, updateEvent, deleteEvent, acknowledgeReminder, notifPermission, requestNotifPermission }) {
  const { t } = useLang();
  const [tab, setTab] = useState("events"); // events | reminders
  const [showAcked, setShowAcked] = useState(false);
  const [showInfo, setShowInfo] = useState(false);
  const events = data.events || [];
  const pendingCount = allReminders.filter((r) => r.status === "Pending").length;
  const reminderRows = useMemo(() => (showAcked ? allReminders : allReminders.filter((r) => r.status === "Pending")), [allReminders, showAcked]);

  return (
    <React.Fragment>
      <div style={{ display: "flex", alignItems: "center", marginBottom: showInfo ? 4 : 20 }}>
        <h1 className="disp gu" style={{ fontSize: 22, fontWeight: 700, margin: 0 }}>{t("Events & reminders", "ઇવેન્ટ્સ અને રિમાઇન્ડર")}</h1>
        <InfoIconButton active={showInfo} onClick={() => setShowInfo((v) => !v)} label={t("About this screen", "આ સ્ક્રીન વિશે")} />
      </div>
      {showInfo && (
        <p style={{ fontSize: 13, color: "var(--text-secondary)", margin: "0 0 20px" }} className="gu">
          {t("Record leave, outstation duty, and training for any employee — pick them by બકલ નંબર instead of typing the name. A reminder fires automatically one day before and again on the day itself for both the start and the end (so a leave's completion is always flagged the day before and the day of), and keeps reappearing every day until you acknowledge it.", "કોઈપણ કર્મચારી માટે રજા, બહારગામ ડ્યુટી, અને તાલીમ નોંધો — નામ ટાઈપ કરવાને બદલે બકલ નંબર દ્વારા તેમને પસંદ કરો. શરૂઆત અને અંત બંને માટે એક દિવસ પહેલા અને તે જ દિવસે આપમેળે રિમાઇન્ડર આવે છે (જેથી રજા પૂરી થવાની હંમેશા એક દિવસ પહેલા અને તે દિવસે નોંધ લેવાય), અને તમે તેને સ્વીકારો નહીં ત્યાં સુધી દરરોજ ફરી દેખાય છે.")}
        </p>
      )}

      <div style={{ display: "flex", gap: 6, marginBottom: 20 }}>
        <button onClick={() => setTab("events")} style={catTabBtn(tab === "events")} className="gu">{t("Events", "ઇવેન્ટ્સ")}{events.length ? ` (${events.length})` : ""}</button>
        <button onClick={() => setTab("reminders")} style={catTabBtn(tab === "reminders")} className="gu">{t("Reminders", "રિમાઇન્ડર")}{pendingCount ? ` (${pendingCount})` : ""}</button>
      </div>

      {tab === "events" ? (
        <EventsTab data={data} events={events} addEvent={addEvent} updateEvent={updateEvent} deleteEvent={deleteEvent} />
      ) : (
        <React.Fragment>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10, marginBottom: 14 }}>
            <label style={{ fontSize: 12.5, color: "var(--text-secondary)", display: "flex", alignItems: "center", gap: 6 }} className="gu">
              <input type="checkbox" checked={showAcked} onChange={(e) => setShowAcked(e.target.checked)} />
              {t("Show acknowledged too", "સ્વીકૃત પણ બતાવો")}
            </label>
            {notifPermission !== "granted" && notifPermission !== "unsupported" && (
              <button onClick={requestNotifPermission} style={{ background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 7, padding: "6px 12px", fontSize: 12, fontWeight: 600, color: "var(--text-primary)" }} className="gu">
                {t("Enable browser notifications", "બ્રાઉઝર નોટિફિકેશન સક્ષમ કરો")}
              </button>
            )}
          </div>
          <ReminderTable rows={reminderRows} onAcknowledge={acknowledgeReminder} />
        </React.Fragment>
      )}
    </React.Fragment>
  );
}

function EventsTab({ data, events, addEvent, updateEvent, deleteEvent }) {
  const { t, lang } = useLang();
  const [number, setNumber] = useState("");
  const [name, setName] = useState("");
  const [type, setType] = useState("Leave");
  const [start, setStart] = useState(todayStr());
  const [end, setEnd] = useState(todayStr());
  const [notes, setNotes] = useState("");
  const [editingId, setEditingId] = useState(null);

  const staffList = useMemo(
    () => Object.values(data.staff || {}).sort((a, b) => (a.number || "").localeCompare(b.number || "", undefined, { numeric: true })),
    [data.staff]
  );
  const staffNames = useMemo(() => staffList.map((s) => s.name), [staffList]);
  const sorted = useMemo(() => [...events].sort((a, b) => b.start.localeCompare(a.start)), [events]);

  const resetForm = () => { setNumber(""); setName(""); setType("Leave"); setStart(todayStr()); setEnd(todayStr()); setNotes(""); };

  // Typing a badge number that matches a known employee auto-fills the name.
  // It's a free-text field (with a searchable datalist of suggestions), so
  // any number can be typed — not limited to picking from a fixed list.
  const handleNumberInput = (val) => {
    setNumber(val);
    const rec = data.staff[val];
    if (rec) setName(rec.name);
  };

  return (
    <React.Fragment>
      <datalist id="staff-name-list">
        {staffNames.map((n, i) => <option key={i} value={n} />)}
      </datalist>
      <datalist id="staff-number-list">
        {staffList.map((s) => <option key={s.number} value={s.number}>{s.number} — {s.name}</option>)}
      </datalist>

      <div style={{ background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 10, overflow: "hidden", marginBottom: 18 }}>
        <div style={{ overflowX: "auto" }}>
        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
          <thead>
            <tr style={{ background: "var(--bg-surface-2)", textAlign: "left" }} className="gu">
              <th style={th}>{t("Employee", "કર્મચારી")}</th><th style={th}>બકલ નંબર</th><th style={th}>{t("Type", "પ્રકાર")}</th><th style={th}>{t("Start", "શરૂઆત")}</th><th style={th}>{t("End", "અંત")}</th><th style={th}>{t("Notes", "નોંધ")}</th><th style={{ ...th, textAlign: "right" }}>{t("Actions", "ક્રિયાઓ")}</th>
            </tr>
          </thead>
          <tbody>
            {sorted.map((ev) => (
              editingId === ev.id ? (
                <EventEditRow key={ev.id} data={data} event={ev} onSave={(patch) => { updateEvent(ev.id, patch); setEditingId(null); }} onCancel={() => setEditingId(null)} />
              ) : (
                <tr key={ev.id} style={{ borderTop: "1px solid var(--border-soft)" }}>
                  <td style={td} className="gu">{ev.name}</td>
                  <td style={td} className="mono">{ev.number || "—"}</td>
                  <td style={td}>
                    <span className="gu" style={{ fontSize: 11.5, fontWeight: 600, padding: "3px 8px", borderRadius: 6, border: "1px solid " + EVENT_TYPE_STYLE[ev.type].border, background: EVENT_TYPE_STYLE[ev.type].bg, color: EVENT_TYPE_STYLE[ev.type].fg }}>{eventTypeLabel(ev.type, lang)}</span>
                  </td>
                  <td style={td} className="mono">{formatDMY(ev.start)}</td>
                  <td style={td} className="mono">{formatDMY(ev.end)}</td>
                  <td style={{ ...td, maxWidth: 220, color: "var(--text-secondary)" }} className="gu">{ev.notes || "—"}</td>
                  <td style={{ ...td, textAlign: "right" }}>
                    <button onClick={() => setEditingId(ev.id)} title={t("Edit", "ફેરફાર કરો")} aria-label={t("Edit", "ફેરફાર કરો")} style={iconBtn}>✎</button>
                    <button onClick={() => deleteEvent(ev.id)} title={t("Delete", "ડિલીટ કરો")} aria-label={t("Delete", "ડિલીટ કરો")} style={{ ...iconBtn, marginLeft: 4 }}>✕</button>
                  </td>
                </tr>
              )
            ))}
            {sorted.length === 0 && (
              <tr><td colSpan={7} style={{ ...td, textAlign: "center", color: "var(--text-tertiary)", padding: "26px 0" }} className="gu">{t("No events recorded yet.", "હજુ સુધી કોઈ ઇવેન્ટ નોંધાયેલ નથી.")}</td></tr>
            )}
          </tbody>
        </table>
        </div>
      </div>

      <div style={{ background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 10, padding: 16 }}>
        <div className="disp gu" style={{ fontSize: 14, fontWeight: 700, marginBottom: 10 }}>{t("+ Add event", "+ ઇવેન્ટ ઉમેરો")}</div>
        <form
          onSubmit={(e) => { e.preventDefault(); addEvent(name, type, start, end, notes, number); resetForm(); }}
          style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "flex-start" }}
        >
          <input type="text" list="staff-number-list" placeholder="બકલ નંબર" title={t("Type any badge number — fills the name in automatically if it matches", "કોઈપણ બકલ નંબર લખો — મેળ ખાય તો નામ આપમેળે ભરાશે")} value={number} onChange={(e) => handleNumberInput(e.target.value)} style={{ width: 170 }} className="gu" />
          <input type="text" list="staff-name-list" placeholder={t("Employee name", "કર્મચારીનું નામ")} value={name} onChange={(e) => { setName(e.target.value); setNumber(""); }} style={{ width: 180 }} className="gu" />
          <select value={type} onChange={(e) => setType(e.target.value)} style={{ border: "1px solid var(--border)", borderRadius: 6, padding: "7px 10px", fontSize: 13, background: "var(--bg-surface)", color: "var(--text-primary)" }} className="gu">
            {EVENT_TYPES.map((ty) => <option key={ty} value={ty}>{eventTypeLabel(ty, lang)}</option>)}
          </select>
          <input type="date" value={start} onChange={(e) => setStart(e.target.value)} title={t("Start date", "શરૂઆતની તારીખ")} />
          <input type="date" value={end} onChange={(e) => setEnd(e.target.value)} title={t("End date", "અંતિમ તારીખ")} />
          <input type="text" placeholder={t("Notes (optional)", "નોંધ (વૈકલ્પિક)")} value={notes} onChange={(e) => setNotes(e.target.value)} style={{ width: 200 }} className="gu" />
          <button type="submit" style={{ background: "#D98E2B", color: "#fff", border: "none", borderRadius: 7, padding: "8px 16px", fontSize: 13, fontWeight: 600 }} className="gu">{t("+ Add", "+ ઉમેરો")}</button>
        </form>
      </div>
    </React.Fragment>
  );
}

function EventEditRow({ data, event, onSave, onCancel }) {
  const { t, lang } = useLang();
  const [number, setNumber] = useState(event.number || "");
  const [name, setName] = useState(event.name);
  const [type, setType] = useState(event.type);
  const [start, setStart] = useState(event.start);
  const [end, setEnd] = useState(event.end);
  const [notes, setNotes] = useState(event.notes || "");

  const handleNumberInput = (val) => {
    setNumber(val);
    const rec = data ? data.staff[val] : null;
    if (rec) setName(rec.name);
  };

  return (
    <tr style={{ borderTop: "1px solid var(--border-soft)", background: "var(--highlight-bg)" }}>
      <td style={td}><input type="text" list="staff-name-list" value={name} onChange={(e) => { setName(e.target.value); setNumber(""); }} style={{ width: 130 }} /></td>
      <td style={td}>
        <input type="text" list="staff-number-list" value={number} onChange={(e) => handleNumberInput(e.target.value)} title="બકલ નંબર" style={{ width: 90 }} />
      </td>
      <td style={td}>
        <select value={type} onChange={(e) => setType(e.target.value)} style={{ border: "1px solid var(--border)", borderRadius: 6, padding: "5px 8px", fontSize: 12 }} className="gu">
          {EVENT_TYPES.map((ty) => <option key={ty} value={ty}>{eventTypeLabel(ty, lang)}</option>)}
        </select>
      </td>
      <td style={td}><input type="date" value={start} onChange={(e) => setStart(e.target.value)} /></td>
      <td style={td}><input type="date" value={end} onChange={(e) => setEnd(e.target.value)} /></td>
      <td style={td}><input type="text" value={notes} onChange={(e) => setNotes(e.target.value)} style={{ width: 160 }} /></td>
      <td style={{ ...td, textAlign: "right", whiteSpace: "nowrap" }}>
        <button onClick={() => onSave({ name: name.trim(), number: number || null, type, start, end, notes: notes.trim() })} title={t("Save", "સાચવો")} aria-label={t("Save", "સાચવો")} style={{ ...iconBtn, color: "var(--status-success-text)" }}>✓</button>
        <button onClick={onCancel} title={t("Cancel", "રદ કરો")} aria-label={t("Cancel", "રદ કરો")} style={{ ...iconBtn, marginLeft: 4 }}>✕</button>
      </td>
    </tr>
  );
}

function ReminderTable({ rows, onAcknowledge }) {
  const { t, lang } = useLang();
  return (
    <div style={{ background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 10, overflow: "hidden" }}>
      <div style={{ overflowX: "auto" }}>
      <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
        <thead>
          <tr style={{ background: "var(--bg-surface-2)", textAlign: "left" }} className="gu">
            <th style={th}>{t("Employee", "કર્મચારી")}</th><th style={th}>બકલ નંબર</th><th style={th}>{t("Event type", "ઇવેન્ટ પ્રકાર")}</th><th style={th}>{t("Start", "શરૂઆત")}</th><th style={th}>{t("End", "અંત")}</th><th style={th}>{t("Reminder", "યાદ અપાવો")}</th><th style={th}>{t("Status", "સ્થિતિ")}</th><th style={{ ...th, textAlign: "right" }}>{t("Actions", "ક્રિયાઓ")}</th>
          </tr>
        </thead>
        <tbody>
          {rows.map((r) => (
            <tr key={r.key} style={{ borderTop: "1px solid var(--border-soft)" }}>
              <td style={td} className="gu">{r.event.name}</td>
              <td style={td} className="mono">{r.event.number || "—"}</td>
              <td style={td}>
                <span className="gu" style={{ fontSize: 11.5, fontWeight: 600, padding: "3px 8px", borderRadius: 6, border: "1px solid " + EVENT_TYPE_STYLE[r.event.type].border, background: EVENT_TYPE_STYLE[r.event.type].bg, color: EVENT_TYPE_STYLE[r.event.type].fg }}>{eventTypeLabel(r.event.type, lang)}</span>
              </td>
              <td style={td} className="mono">{formatDMY(r.event.start)}</td>
              <td style={td} className="mono">{formatDMY(r.event.end)}</td>
              <td style={{ ...td, maxWidth: 260 }} className="gu">{r.message}</td>
              <td style={td}>
                <span className="gu" style={{
                  fontSize: 11.5, fontWeight: 600, padding: "3px 8px", borderRadius: 6,
                  border: "1px solid " + (r.status === "Pending" ? "var(--status-error-border)" : "var(--status-success-border)"),
                  background: r.status === "Pending" ? "var(--status-error-bg)" : "var(--status-success-bg)",
                  color: r.status === "Pending" ? "var(--status-error-text)" : "var(--status-success-text)",
                }}>{r.status === "Pending" ? t("Pending", "બાકી") : t("Acknowledged", "સ્વીકૃત")}</span>
              </td>
              <td style={{ ...td, textAlign: "right" }}>
                {r.status === "Pending" && (
                  <button onClick={() => onAcknowledge(r.key)} style={{ background: "var(--btn-dark-bg)", color: "#fff", border: "none", borderRadius: 6, padding: "6px 12px", fontSize: 12, fontWeight: 600 }}>OK</button>
                )}
              </td>
            </tr>
          ))}
          {rows.length === 0 && (
            <tr><td colSpan={8} style={{ ...td, textAlign: "center", color: "var(--text-tertiary)", padding: "26px 0" }} className="gu">{t("No reminders due.", "કોઈ યાદ અપાવો બાકી નથી.")}</td></tr>
          )}
        </tbody>
      </table>
      </div>
    </div>
  );
}

// Auto-opened whenever there's something pending (like a calendar app
// greeting you with what's due), and reachable any time via the bell button.
// Closing it only hides it for now — it comes back next time something is
// pending, and everything in it still shows in the Reminders tab.
function ReminderPanel({ reminders, onAcknowledge, onClose, onOpenEvents, notifPermission, requestNotifPermission }) {
  const { t, lang } = useLang();
  useEscToClose(onClose);
  return (
    <div role="dialog" aria-label={t("Reminders", "યાદ અપાવો")} className="modal-card" style={{
      position: "fixed", top: 18, right: 18, width: 340, maxWidth: "calc(100vw - 36px)",
      maxHeight: "calc(100vh - 36px)", overflowY: "auto", background: "var(--bg-surface)", border: "1px solid var(--border)",
      borderRadius: 12, boxShadow: "0 12px 30px rgba(0,0,0,0.18)", zIndex: 1000,
    }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 16px", borderBottom: "1px solid var(--border-soft)" }}>
        <div className="disp gu" style={{ fontSize: 14, fontWeight: 700 }}>{t("Reminders", "યાદ અપાવો")}{reminders.length ? ` (${reminders.length})` : ""}</div>
        <button onClick={onClose} title={t("Dismiss for now — reopens next time something's due", "હમણાં માટે બંધ કરો — ફરી કંઈક બાકી હોય ત્યારે ખુલશે")} aria-label={t("Dismiss for now — reopens next time something's due", "હમણાં માટે બંધ કરો — ફરી કંઈક બાકી હોય ત્યારે ખુલશે")} style={{ background: "transparent", border: "none", color: "var(--text-tertiary)", fontSize: 15 }}>✕</button>
      </div>

      {notifPermission !== "granted" && notifPermission !== "unsupported" && (
        <div style={{ padding: "10px 16px", borderBottom: "1px solid var(--border-soft)" }}>
          <button onClick={requestNotifPermission} style={{ background: "var(--bg-surface-2)", border: "1px solid var(--border)", borderRadius: 6, padding: "6px 10px", fontSize: 12, fontWeight: 600, color: "var(--text-primary)" }} className="gu">{t("Enable browser notifications", "બ્રાઉઝર સૂચનાઓ ચાલુ કરો")}</button>
        </div>
      )}

      {reminders.length === 0 ? (
        <div style={{ padding: "24px 16px", textAlign: "center", color: "var(--text-tertiary)", fontSize: 13 }} className="gu">{t("Nothing pending — you're all caught up.", "કંઈ બાકી નથી — તમે બધું પૂર્ણ કરી લીધું છે.")}</div>
      ) : (
        reminders.map((r) => (
          <div key={r.key} className="gu" style={{ padding: "12px 16px", borderBottom: "1px solid var(--border-soft)" }}>
            <div style={{ fontSize: 11, fontWeight: 600, textTransform: "uppercase", letterSpacing: 0.4, color: EVENT_TYPE_STYLE[r.event.type].fg, marginBottom: 4 }}>{eventTypeLabel(r.event.type, lang)}</div>
            <div style={{ fontSize: 13, color: "var(--text-primary)", marginBottom: 8 }}>{r.message}</div>
            <button onClick={() => onAcknowledge(r.key)} style={{ background: "var(--btn-dark-bg)", color: "#fff", border: "none", borderRadius: 6, padding: "6px 14px", fontSize: 12, fontWeight: 600 }}>OK</button>
          </div>
        ))
      )}

      <div style={{ padding: "10px 16px" }}>
        <button onClick={onOpenEvents} style={{ background: "transparent", border: "none", color: "var(--text-secondary)", fontSize: 12, textDecoration: "underline", padding: 0, cursor: "pointer" }} className="gu">{t("Open reminder dashboard →", "યાદ અપાવો ડેશબોર્ડ ખોલો →")}</button>
      </div>
    </div>
  );
}

// Ctrl/Cmd+K (or the button, or "/" when no search box is on screen)
// opens this — a single box that jumps straight to any tab/work type by
// name, or (once something's typed) finds a specific staff member or skip
// log entry and drops you into that tab with the search box already
// filled in, instead of clicking through the sidebar to find them.
function CommandPalette({ data, onNavigate, onClose }) {
  const { t } = useLang();
  useEscToClose(onClose);
  const [q, setQ] = useState("");
  const inputRef = useRef(null);
  useEffect(() => { inputRef.current && inputRef.current.focus(); }, []);

  const results = useMemo(() => {
    const query = q.trim().toLowerCase();
    const items = [];
    const jumpTargets = [
      { icon: "📝", label: t("Assign duty", "ડ્યુટી સોંપો"), view: { mode: "assignDuty" } },
      { icon: "🏠", label: t("Today's duty", "આજની ડ્યુટી"), view: { mode: "home" } },
      { icon: "👥", label: t("Group duty", "જૂથ ડ્યુટી"), view: { mode: "assignDuty" } },
      { icon: "🚨", label: t("Manage staff", "સ્ટાફ સંચાલિત કરો"), view: { mode: "staff" } },
      { icon: "📋", label: t("Skip history", "સ્કિપ ઇતિહાસ"), view: { mode: "skipHistory" } },
      { icon: "🔔", label: t("Events & reminders", "ઇવેન્ટ્સ અને રિમાઇન્ડર"), view: { mode: "events" } },
      { icon: "📅", label: t("Duty calendar", "ડ્યુટી કૅલેન્ડર"), view: { mode: "calendar" } },
      { icon: "📄", label: t("Monthly report", "માસિક અહેવાલ"), view: { mode: "report" } },
      { icon: "🗑️", label: t("Recycle bin", "રિસાયકલ બિન"), view: { mode: "recycle" } },
    ];
    (data.categories || []).forEach((c) => jumpTargets.push({ icon: "📁", label: c.label, view: { mode: "category", catId: c.id } }));
    jumpTargets.forEach((jt) => { if (!query || jt.label.toLowerCase().includes(query)) items.push({ kind: "nav", ...jt }); });

    if (query) {
      Object.values(data.staff || {}).forEach((s) => {
        if ((s.name || "").toLowerCase().includes(query) || String(s.number || "").toLowerCase().includes(query)) {
          items.push({ kind: "staff", icon: "🧑", label: `${s.name} · #${s.number}`, view: { mode: "staff", presetSearch: s.number } });
        }
      });
      (data.skipLog || []).forEach((e) => {
        if ((e.name || "").toLowerCase().includes(query) || String(e.number || "").toLowerCase().includes(query) || (e.note || "").toLowerCase().includes(query)) {
          items.push({ kind: "skip", icon: "🚫", label: `${e.name} · ${formatDMY(e.date)}${e.note ? " · " + e.note : ""}`, view: { mode: "skipHistory", presetSearch: e.number || e.name } });
        }
      });
    }
    return items.slice(0, 30);
  }, [q, data, t]);

  return (
    <div
      className="command-palette-overlay modal-backdrop"
      style={{ position: "fixed", inset: 0, background: "#00000066", display: "flex", alignItems: "flex-start", justifyContent: "center", paddingTop: "10vh", zIndex: 50 }}
      onClick={onClose}
    >
      <div
        role="dialog" aria-modal="true" aria-label={t("Command palette", "કમાન્ડ પેલેટ")}
        className="modal-card"
        style={{ background: "var(--bg-surface)", borderRadius: 12, width: 520, maxWidth: "calc(100vw - 40px)", maxHeight: "70vh", display: "flex", flexDirection: "column", overflow: "hidden", boxShadow: "0 20px 60px rgba(0,0,0,0.3)" }}
        onClick={(e) => e.stopPropagation()}
      >
        <input
          ref={inputRef} type="text" value={q} onChange={(e) => setQ(e.target.value)}
          aria-label={t("Jump to a tab, or search staff / skip log…", "ટેબ પર જાઓ, અથવા સ્ટાફ / સ્કિપ લોગ શોધો…")}
          placeholder={t("Jump to a tab, or search staff / skip log…", "ટેબ પર જાઓ, અથવા સ્ટાફ / સ્કિપ લોગ શોધો…")}
          className="gu"
          style={{ border: "none", borderBottom: "1px solid var(--border-soft)", borderRadius: 0, padding: "14px 16px", fontSize: 14, outline: "none" }}
        />
        <div style={{ overflowY: "auto", padding: "6px 0" }}>
          {results.length === 0 && (
            <div style={{ padding: "20px 16px", fontSize: 13, color: "var(--text-tertiary)", textAlign: "center" }} className="gu">{t("No matches.", "કોઈ મેળ મળ્યો નથી.")}</div>
          )}
          {results.map((r, i) => (
            <button
              key={i}
              onClick={() => { onNavigate(r.view); onClose(); }}
              className="gu"
              style={{ display: "flex", alignItems: "center", gap: 10, width: "100%", boxSizing: "border-box", padding: "9px 16px", background: "transparent", border: "none", textAlign: "left", fontSize: 13.5, color: "var(--text-primary)" }}
            >
              {r.icon && <span>{r.icon}</span>}<span style={{ minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.label}</span>
            </button>
          ))}
        </div>
        <div style={{ borderTop: "1px solid var(--border-soft)", padding: "8px 16px", fontSize: 11, color: "var(--text-tertiary)" }} className="gu">{t("Esc to close", "બંધ કરવા Esc")}</div>
      </div>
    </div>
  );
}

// Shown exactly once — the very first time a brand-new account signs in
// (see hasSeenWelcome in buildInitialData/normalizeData above) — then
// never again, even after signing out and back in, since dismissing it
// either way (✕ or the CTA) immediately persists hasSeenWelcome:true.
// Existing accounts from before this feature existed never see it at
// all (normalizeData defaults them to already-seen).
// A short multi-step tour, shown once for brand-new accounts (see
// hasSeenWelcome in buildInitialData/normalizeData). Each step covers one
// core concept — the last step's button actually navigates the user to
// Assign Duty, so the tour ends by putting them exactly where they'd
// want to be to try the app for real, not just back at whatever screen
// they started on.
const WELCOME_STEPS = [
  {
    titleEn: "Welcome to Nokri Book 👋", titleGu: "નોકરી બુકમાં આપનું સ્વાગત છે 👋",
    bodyEn: "This app picks who's next for duty automatically — whoever has waited the longest always goes next, so there's never a manual pick to argue over.",
    bodyGu: "આ એપ આપમેળે નક્કી કરે છે કે આગળ કોની ડ્યુટી છે — જે સૌથી લાંબા સમયથી રાહ જોઈ રહ્યા છે તેમનો જ વારો આવે છે, એટલે મેન્યુઅલ પસંદગી અંગે ક્યારેય ચર્ચા થતી નથી.",
  },
  {
    titleEn: "Assign Duty", titleGu: "ડ્યુટી સોંપો",
    bodyEn: "Pick a work type, and the app already tells you who's next in the rotation. One tap assigns it — no need to check who went last yourself.",
    bodyGu: "કામનો પ્રકાર પસંદ કરો, અને એપ પહેલેથી જ બતાવે છે કે વારો કોનો છે. એક ટેપથી ડ્યુટી સોંપાઈ જાય છે — કોણ છેલ્લે ગયું હતું તે જાતે તપાસવાની જરૂર નથી.",
  },
  {
    titleEn: "Manage Staff", titleGu: "સ્ટાફ સંચાલિત કરો",
    bodyEn: "Add people once here, and they're available across every work type. Mark someone on leave or outstation here too — it applies everywhere automatically.",
    bodyGu: "અહીં એક વખત લોકોને ઉમેરો, અને તેઓ દરેક કામના પ્રકારમાં ઉપલબ્ધ થાય છે. કોઈને રજા કે બહારગામ પણ અહીંથી જ સેટ કરો — તે આપમેળે બધે લાગુ પડે છે.",
  },
  {
    titleEn: "Share a read-only view", titleGu: "ફક્ત-જોવા માટેનું દૃશ્ય શેર કરો",
    bodyEn: "Turn on Share (top toolbar) to get a link anyone can open to see the current roster — no sign-in, no edit access, just the schedule.",
    bodyGu: "રોસ્ટર જોવા માટે કોઈપણ ખોલી શકે તેવી લિંક મેળવવા ટોચના ટૂલબારમાં શેર ચાલુ કરો — સાઇન-ઇન નહીં, સંપાદન પ્રવેશ નહીં, ફક્ત શેડ્યૂલ.",
  },
];
function WelcomeModal({ onGetStarted, onClose }) {
  const { t } = useLang();
  const [step, setStep] = useState(0);
  useEscToClose(onClose);
  const isLast = step === WELCOME_STEPS.length - 1;
  const cur = WELCOME_STEPS[step];
  return (
    <div role="dialog" aria-modal="true" aria-label={t("Welcome to Nokri Book", "નોકરી બુકમાં આપનું સ્વાગત છે")} className="modal-backdrop" style={{ position: "fixed", inset: 0, background: "#00000077", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 90, padding: 16 }}>
      <div className="modal-card" style={{ background: "var(--bg-surface)", borderRadius: 14, width: 440, maxWidth: "100%", padding: "28px 26px", boxShadow: "0 24px 70px rgba(0,0,0,0.35)", position: "relative" }}>
        <div style={{ position: "absolute", top: 14, right: 14, zIndex: 1, display: "flex", alignItems: "center", gap: 8 }}>
          <LangInlineToggle />
          <button onClick={onClose} title={t("Close", "બંધ કરો")} aria-label={t("Close", "બંધ કરો")} style={{ background: "transparent", border: "none", color: "var(--text-tertiary)", fontSize: 16 }}>✕</button>
        </div>
        {step === 0 && <img src="./welcome-banner.png" alt="" style={{ width: "100%", height: "auto", display: "block", marginBottom: 16 }} />}
        <div style={{ display: "flex", gap: 5, marginBottom: 16, marginTop: step === 0 ? 0 : 6, paddingRight: 152 }}>
          {WELCOME_STEPS.map((_, i) => (
            <div key={i} style={{ flex: 1, height: 4, borderRadius: 2, background: i <= step ? "#D98E2B" : "var(--border-soft)" }} />
          ))}
        </div>
        <div className="disp gu" style={{ fontSize: 20, fontWeight: 700, marginBottom: 8 }}>{t(cur.titleEn, cur.titleGu)}</div>
        <p style={{ fontSize: 13.5, color: "var(--text-secondary)", lineHeight: 1.6, margin: "0 0 22px" }} className="gu">
          {t(cur.bodyEn, cur.bodyGu)}
        </p>
        <div style={{ display: "flex", gap: 8 }}>
          {step > 0 && (
            <button onClick={() => setStep((s) => s - 1)} style={{ background: "var(--bg-page)", color: "var(--text-secondary)", border: "1px solid var(--border)", borderRadius: 8, padding: "11px 16px", fontSize: 14, fontWeight: 600 }} className="gu">
              {t("← Back", "← પાછળ")}
            </button>
          )}
          <button
            onClick={() => (isLast ? onGetStarted() : setStep((s) => s + 1))}
            style={{ flex: 1, background: "#D98E2B", color: "#fff", border: "none", borderRadius: 8, padding: "11px 16px", fontSize: 14, fontWeight: 700 }} className="gu"
          >
            {isLast ? t("Assign my first duty →", "મારી પહેલી ડ્યુટી સોંપો →") : t("Next →", "આગળ →")}
          </button>
        </div>
      </div>
    </div>
  );
}
function DriveBackupPanel({ configured, connected, enabledForAccount, busy, needsReconnect, lastBackup, onConnect, onBackupNow, onDisconnect, onClose }) {
  const { t } = useLang();
  useEscToClose(onClose);
  const lastBackupText = lastBackup
    ? new Date(lastBackup).toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })
    : t("never", "ક્યારેય નહીં");
  // Simplified to one flow: connected-and-working, or not. Whether "not"
  // means a fresh connection, a different device having set it up
  // already, or a silent daily renewal that needs a fresh sign-in all
  // used to show a different banner (one of them in alarming red) for

  const needsConnect = !connected || needsReconnect;
  return (
    <div role="dialog" aria-label={t("Google Drive backup", "ગૂગલ ડ્રાઇવ બેકઅપ")} className="modal-card" style={{
      position: "fixed", top: 18, right: 18, width: 320, maxWidth: "calc(100vw - 36px)",
      background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 12,
      boxShadow: "0 12px 30px rgba(0,0,0,0.18)", zIndex: 1000,

      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 16px", borderBottom: "1px solid var(--border-soft)" }}>
        <div className="disp gu" style={{ fontSize: 14, fontWeight: 700 }}>{t("Google Drive backup", "ગૂગલ ડ્રાઇવ બેકઅપ")}</div>
        <button onClick={onClose} title={t("Close", "બંધ કરો")} aria-label={t("Close", "બંધ કરો")} style={{ background: "transparent", border: "none", color: "var(--text-tertiary)", fontSize: 15 }}>✕</button>
      </div>

      <div style={{ padding: "14px 16px" }}>
        {!configured ? (
          <div style={{ fontSize: 12.5, color: "var(--text-secondary)", lineHeight: 1.5 }} className="gu">
            {t("Not set up yet. A Google OAuth Client ID needs to be pasted into the top of this file (see the setup guide) before daily auto-backup can be turned on.", "હજુ સેટ થયું નથી. દૈનિક ઓટો-બેકઅપ ચાલુ કરતાં પહેલાં ગૂગલ OAuth ક્લાયન્ટ ID આ ફાઇલની ટોચે પેસ્ટ કરવું જરૂરી છે (સેટઅપ ગાઇડ જુઓ).")}
          </div>
        ) : (
          <React.Fragment>
            <div style={{ fontSize: 12.5, color: "var(--text-secondary)", lineHeight: 1.5, marginBottom: 10 }} className="gu">
              {connected && !needsReconnect
                ? t("Every day, the first time this app is opened, a full backup is quietly saved to a \"Nokri Book Backups\" folder in Google Drive.", "દરરોજ, આ એપ પહેલીવાર ખોલવામાં આવે ત્યારે, ગૂગલ ડ્રાઇવમાં \"Nokri Book Backups\" ફોલ્ડરમાં સંપૂર્ણ બેકઅપ આપમેળે સાચવવામાં આવે છે.")
                : t("Connect a Google account to automatically save a daily backup to Drive — no need to remember to click Backup.", "ડ્રાઇવમાં દૈનિક બેકઅપ આપમેળે સાચવવા માટે ગૂગલ ખાતું જોડો — બેકઅપ પર ક્લિક કરવાનું યાદ રાખવાની જરૂર નથી.")}
            </div>
            {connected && !needsReconnect && (
              <div style={{ fontSize: 12, color: "var(--text-primary)", marginBottom: 12 }} className="gu">
                {t("Last backup", "છેલ્લો બેકઅપ")}: {lastBackupText}
              </div>
            )}
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              {needsConnect ? (
                <button onClick={onConnect} disabled={busy} style={{ background: "var(--btn-dark-bg)", color: "#fff", border: "none", borderRadius: 6, padding: "7px 14px", fontSize: 12.5, fontWeight: 600 }} className="gu">
                  {busy ? t("Connecting…", "જોડાઈ રહ્યું છે…") : t("Connect Google Drive", "ગૂગલ ડ્રાઇવ જોડો")}
                </button>
              ) : (
                <React.Fragment>
                  <button onClick={onBackupNow} disabled={busy} style={{ background: "var(--btn-dark-bg)", color: "#fff", border: "none", borderRadius: 6, padding: "7px 14px", fontSize: 12.5, fontWeight: 600 }} className="gu">
                    {busy ? t("Backing up…", "બેકઅપ થઈ રહ્યું છે…") : t("Back up now", "હમણાં બેકઅપ કરો")}
                  </button>
                  <button onClick={onDisconnect} style={{ background: "var(--bg-surface)", color: "var(--status-error-text)", border: "1px solid var(--status-error-border)", borderRadius: 6, padding: "7px 14px", fontSize: 12.5, fontWeight: 600 }} className="gu">
                    {t("Disconnect", "ડિસ્કનેક્ટ કરો")}
                  </button>
                </React.Fragment>
              )}
            </div>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

// SkipHistoryView — "Skip history" tab, a searchable log spanning every
// category and the global (Manage Staff) flag alike, not scoped to a person
// of any work type. Read-only, newest-first record of every time someone
// was marked Skip: the બકલ નંબર of the person who was skipped, the બકલ
// નંબર of the person who did the skipping and their note (both optional,
// so often blank), and the exact date + time it happened. This is the
// permanent record created by skipPersonWithLog / skipInCategoryWithLog —
// nothing here can be edited, only searched.
function SkipHistoryView({ data, initialSearch }) {
  const { t, lang } = useLang();
  const [query, setQuery] = useState(initialSearch || "");
  const debouncedQuery = useDebouncedValue(query);
  const [viewMode, setViewMode] = useState("list"); // list | calendar
  const [granularity, setGranularity] = useState("day"); // day | week | month
  const [month, setMonth] = useState(todayStr().slice(0, 7));
  const [selectedDate, setSelectedDate] = useState(todayStr());
  const [showInfo, setShowInfo] = useState(false);

  const entries = useMemo(() => {
    const list = [...(data.skipLog || [])].sort((a, b) => b.ts - a.ts);
    const q = debouncedQuery.trim().toLowerCase();
    if (!q) return list;
    return list.filter((e) =>
      (e.name || "").toLowerCase().includes(q) ||
      String(e.number || "").toLowerCase().includes(q) ||
      (e.note || "").toLowerCase().includes(q) ||
      (e.byName || "").toLowerCase().includes(q) ||
      String(e.byNumber || "").toLowerCase().includes(q)
    );
  }, [data.skipLog, debouncedQuery]);

  // date ("YYYY-MM-DD") -> array of skip-log entries on that date, for the
  // calendar's day cells and for filtering to whichever granularity
  // (day / week / month) is currently selected.
  const skipByDate = useMemo(() => {
    const map = {};
    (data.skipLog || []).forEach((e) => {
      if (!e.date) return;
      (map[e.date] = map[e.date] || []).push(e);
    });
    return map;
  }, [data.skipLog]);

  const cells = useMemo(() => monthMatrix(month), [month]);
  const monthLabel = new Date(month + "-01T00:00:00").toLocaleDateString(t("en-IN", "gu-IN"), { month: "long", year: "numeric" });
  const today = todayStr();

  const shiftMonth = (delta) => {
    const [y, m] = month.split("-").map(Number);
    const d = new Date(y, m - 1 + delta, 1);
    setMonth(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`);
  };

  const [weekStart, weekEnd] = useMemo(() => weekBounds(selectedDate), [selectedDate]);

  // The list shown in the side panel, scoped to whichever granularity is
  // active — Day shows just that date, Week shows the Sun-Sat week
  // containing it, Month shows every entry in the currently viewed month.
  const scopedEntries = useMemo(() => {
    const all = [...(data.skipLog || [])].sort((a, b) => b.ts - a.ts);
    if (granularity === "day") return all.filter((e) => e.date === selectedDate);
    if (granularity === "week") return all.filter((e) => e.date >= weekStart && e.date <= weekEnd);
    return all.filter((e) => (e.date || "").slice(0, 7) === month);
  }, [data.skipLog, granularity, selectedDate, weekStart, weekEnd, month]);

  const scopeLabel = granularity === "day"
    ? formatDMY(selectedDate)
    : granularity === "week"
      ? `${formatDMY(weekStart)} – ${formatDMY(weekEnd)}`
      : monthLabel;

  const segBtn = (active) => ({
    background: active ? "var(--btn-dark-bg)" : "var(--bg-surface-2)", color: active ? "#fff" : "var(--text-secondary)",
    border: "1px solid " + (active ? "var(--text-primary)" : "var(--border)"), borderRadius: 6,
    padding: "6px 12px", fontSize: 12, fontWeight: 600,
  });

  return (
    <React.Fragment>
      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 4, flexWrap: "wrap", gap: 8 }}>
        <div style={{ display: "flex", alignItems: "center" }}>
          <h1 className="disp gu" style={{ fontSize: 22, fontWeight: 700, margin: 0 }}>{t("Skip history", "સ્કિપ ઇતિહાસ")}</h1>
          <InfoIconButton active={showInfo} onClick={() => setShowInfo((v) => !v)} label={t("About this screen", "આ સ્ક્રીન વિશે")} />
        </div>
        <div style={{ fontSize: 12, color: "var(--text-secondary)" }} className="gu">{(data.skipLog || []).length} {t("total", "કુલ")}</div>
      </div>
      {showInfo && (
        <p style={{ fontSize: 13, color: "var(--text-secondary)", margin: "0 0 16px" }} className="gu">
          {t("Every time someone is marked Skip, the confirmed", "જ્યારે પણ કોઈને સ્કિપ તરીકે માર્ક કરવામાં આવે છે, ત્યારે સ્કિપ કરનારનો પુષ્ટિ થયેલ")} <span className="gu">બકલ નંબર</span> {t("of the person who performed the skip and a required note are logged here automatically with the date and time — kept separately from each work type's duty history.", "અને જરૂરી નોંધ તારીખ અને સમય સાથે અહીં આપમેળે નોંધાય છે — દરેક કામના પ્રકારના ડ્યુટી ઇતિહાસથી અલગ રાખવામાં આવે છે.")}
        </p>
      )}

      <div style={{ display: "flex", gap: 6, marginBottom: 16 }}>
        <button onClick={() => setViewMode("list")} style={segBtn(viewMode === "list")} className="gu">{t("List", "યાદી")}</button>
        <button onClick={() => setViewMode("calendar")} style={segBtn(viewMode === "calendar")} className="gu">{t("Calendar", "કૅલેન્ડર")}</button>
      </div>

      {viewMode === "list" ? (
        <React.Fragment>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", marginBottom: 16 }}>
            <input
              type="text" value={query} onChange={(e) => setQuery(e.target.value)}
              id="app-search-input"
              placeholder={t("Search by બકલ નંબર, name, or note…", "બકલ નંબર, નામ અથવા નોંધ દ્વારા શોધો…")} className="gu"
              style={{ width: "100%", maxWidth: 340, boxSizing: "border-box" }}
            />
            <button
              onClick={() => downloadCsv(
                "nokri-book-skip-history.csv",
                [["Date", "Time", "Skipped person", "Number", "Work type", "Skipped by", "By number", "Note"], ...entries.map((e) => {
                  const dt = new Date(e.ts || 0);
                  const workType = e.scope === "category" ? (e.catLabel || "") : t("All work types", "બધા કામના પ્રકારો");
                  return [formatDMY(e.date), e.ts ? dt.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }) : "", e.name || "", e.number || "", workType, e.byName || "", e.byNumber || "", e.note || ""];
                })]
              )}
              disabled={entries.length === 0}
              style={{ background: "var(--bg-surface)", color: entries.length ? "var(--text-primary)" : "var(--text-tertiary)", border: "1px solid var(--border)", borderRadius: 6, padding: "7px 12px", fontSize: 12.5, fontWeight: 600, whiteSpace: "nowrap" }} className="gu"
            >⬇ {t("Export CSV", "CSV એક્સપોર્ટ કરો")}</button>
          </div>

          <div style={{ background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 10, overflow: "hidden" }}>
            <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
              <thead>
                <tr style={{ background: "var(--bg-surface-2)", textAlign: "left" }} className="gu">
                  <th style={th}>{t("Date", "તારીખ")}</th><th style={th}>{t("Time", "સમય")}</th><th style={th}>{t("Skipped person", "સ્કિપ થયેલ વ્યક્તિ")}</th><th style={th}>બકલ નંબર</th><th style={th}>{t("Work type", "કામનો પ્રકાર")}</th><th style={th}>{t("Skipped by", "સ્કિપ કરનાર")}</th><th style={th}>{t("Note", "નોંધ")}</th>
                </tr>
              </thead>
              <tbody>
                {entries.map((e) => {
                  const dt = new Date(e.ts || 0);
                  const timeStr = e.ts ? dt.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }) : "–";
                  return (
                    <tr key={e.id} style={{ borderTop: "1px solid var(--border-soft)" }}>

                      <td style={{ ...td, minWidth: 130 }} className="gu">
                        {e.scope === "category"

                          : <span style={{ color: "var(--text-tertiary)" }}>{t("All work types", "બધા કામના પ્રકારો")}</span>}
                      </td>
                      <td style={{ ...td, minWidth: 160 }} className="gu">
                        {e.byName ? (

                      </td>
                      <td style={{ ...td, minWidth: 220 }} className="gu">{e.note || <span style={{ color: "var(--text-tertiary)" }}>–</span>}</td>
                    </tr>
                  );
                })}
                {entries.length === 0 && (
                  <tr><td colSpan={7} style={{ ...td, textAlign: "center", color: "var(--text-tertiary)", padding: "26px 0" }} className="gu">
                    {(data.skipLog || []).length === 0 ? t("No one has been marked Skip yet.", "હજુ સુધી કોઈને સ્કિપ તરીકે માર્ક કરવામાં આવ્યું નથી.") : t("No entries match your search.", "તમારી શોધ સાથે કોઈ પ્રવેશ મેળ ખાતું નથી.")}
                  </td></tr>
                )}
              </tbody>
            </table>
            </div>
          </div>

      ) : (

          <div style={{ display: "flex", gap: 24, flexWrap: "wrap", alignItems: "flex-start" }}>
            <div style={{ background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 10, padding: 16, flex: "1 1 380px", maxWidth: 460 }}>

              </div>

              <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4, marginBottom: 4 }}>
                {[["Sun","રવિ"], ["Mon","સોમ"], ["Tue","મંગળ"], ["Wed","બુધ"], ["Thu","ગુરુ"], ["Fri","શુક્ર"], ["Sat","શનિ"]].map(([en, gu]) => (
                  <div key={en} className="gu" style={{ textAlign: "center", fontSize: 10.5, color: "var(--text-tertiary)", fontWeight: 600, padding: "2px 0" }}>{t(en, gu)}</div>
                ))}
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4 }}>
                {cells.map((dateStr, i) => {
                  if (!dateStr) return <div key={i} />;
                  const count = (skipByDate[dateStr] || []).length;
                  const isToday = dateStr === today;
                  const isSelected = granularity === "week"
                    ? (dateStr >= weekStart && dateStr <= weekEnd)
                    : dateStr === selectedDate;
                  const dayNum = Number(dateStr.slice(8, 10));
                  return (
                    <button key={i} onClick={() => setSelectedDate(dateStr)} title={count ? t(`${count} skip record${count === 1 ? "" : "s"}`, `${count} સ્કિપ રેકોર્ડ`) : t("No one skipped", "કોઈને સ્કિપ કરવામાં આવ્યું નથી")} style={{
                      aspectRatio: "1", border: "1px solid " + (isSelected ? "var(--status-error-text)" : "var(--border-soft)"),
                      background: isSelected ? "var(--status-error-bg)" : (isToday ? "var(--bg-surface-2)" : "var(--bg-surface)"),
                      borderRadius: 7, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
                      padding: 2,
                    }}>
                      <span className="mono" style={{ fontSize: 12, fontWeight: isToday ? 700 : 500, color: isSelected ? "var(--status-error-text)" : "var(--text-primary)" }}>{dayNum}</span>
                      {count > 0 && <span style={{ fontSize: 9, color: "var(--status-error-text)", fontWeight: 700, marginTop: 1 }}>{count}</span>}
                    </button>
                  );
                })}
              </div>
            </div>

            <div style={{ flex: "1 1 380px", minWidth: 300 }}>
              <div style={{ background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 10, padding: "16px 18px" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10, flexWrap: "wrap", gap: 8 }}>
                  <div className="disp" style={{ fontWeight: 700, fontSize: 15 }}>{scopeLabel}</div>
                  <div style={{ display: "flex", gap: 4 }}>
                    <button onClick={() => setGranularity("day")} style={segBtn(granularity === "day")} className="gu">{t("Day", "દિવસ")}</button>
                    <button onClick={() => setGranularity("week")} style={segBtn(granularity === "week")} className="gu">{t("Week", "અઠવાડિયું")}</button>
                    <button onClick={() => setGranularity("month")} style={segBtn(granularity === "month")} className="gu">{t("Month", "મહિનો")}</button>
                  </div>
                </div>

                {scopedEntries.length === 0 ? (
                  <div style={{ fontSize: 13, color: "var(--text-tertiary)", padding: "8px 0" }} className="gu">{t("No one was marked Skip in this range.", "આ સમયગાળામાં કોઈને સ્કિપ તરીકે માર્ક કરવામાં આવ્યું નથી.")}</div>
                ) : (
                  scopedEntries.map((e, i) => {
                    const dt = new Date(e.ts || 0);
                    const timeStr = e.ts ? dt.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }) : "–";
                    return (
                      <div key={e.id || i} className="gu" style={{ padding: "8px 0", borderTop: i ? "1px solid var(--border-soft)" : "none" }}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 8 }}>
                          <span style={{ fontSize: 13, fontWeight: 600 }}>{e.name} <span className="mono" style={{ fontSize: 11, color: "var(--text-tertiary)", fontWeight: 400 }}>#{e.number}</span></span>
                          <span className="mono" style={{ fontSize: 11, color: "var(--text-tertiary)", flexShrink: 0 }}>{granularity !== "day" ? formatDMY(e.date) + " · " : ""}{timeStr}</span>
                        </div>
                        <div style={{ fontSize: 11.5, color: "var(--text-secondary)", marginTop: 2 }}>
                          {t("From", "થી")}: {e.scope === "category" ? (e.catLabel || "–") : t("All work types", "બધા કામના પ્રકારો")}
                        </div>
                        <div style={{ fontSize: 11.5, color: "var(--text-secondary)", marginTop: 2 }}>
                          {e.byName ? (
                            <React.Fragment>{t("Skipped by", "સ્કિપ કરનાર")}: {e.byName} <span className="mono" style={{ color: "var(--text-tertiary)" }}>({e.byNumber})</span></React.Fragment>
                          ) : (
                            <span style={{ color: "var(--text-tertiary)" }}>–</span>
                          )}
                        </div>
                        {e.note && <div style={{ fontSize: 11.5, color: "var(--text-tertiary)", marginTop: 2 }}>{e.note}</div>}
                      </div>
                    );
                  })
                )}
              </div>
            </div>
          </div>
        </React.Fragment>
      )}
    </React.Fragment>
  );
}

// ============================================================
// Public read-only roster view — no sign-in required.
// Reached via a link like ?view=<uid>, generated from the Share
// panel inside the app. Loads the same accounts/{uid} document
// directly (allowed by the Firestore rule only while that
// account's shareEnabled flag is true) and mirrors the same
// screens the admin sees — Home, every work type (roster +
// history), Staff, Calendar, Duty calendar report — using the
// exact same data and helper functions the admin's app uses, so
// the numbers can never drift between the two. Every button that
// would change data (Assign, Skip, add/remove staff, edit dates,
// clear history, staff/designation management, recycle bin,
// reminders, backups, settings) is simply not present here — this
// component only ever reads `data`, it never calls persist/write.
// ============================================================
function PublicRosterView({ uid }) {
  const [lang, setLang] = useState(() => { try { return localStorage.getItem("nb_lang") || "en"; } catch (e) { return "en"; } });
  useEffect(() => { try { localStorage.setItem("nb_lang", lang); } catch (e) {} }, [lang]);
  const t = useCallback((en, gu) => (lang === "gu" && gu ? gu : en), [lang]);
  const langCtxValue = useMemo(() => ({ lang, setLang, t }), [lang, t]);

  const [data, setData] = useState(undefined); // undefined = loading, null = not shared/not found
  const [view, setView] = useState({ mode: "home" });
  const [showAboutPanel, setShowAboutPanel] = useState(false);
  const [showHelpPanel, setShowHelpPanel] = useState(false);
  const [showSettingsPanel, setShowSettingsPanel] = useState(false);
  // Shared/view-only visitors get their own dark mode preference, kept
  // separate from the admin's (different device/person in the common
  // case) so toggling one never silently flips the other.
  const [darkMode, setDarkMode] = useState(() => { try { return localStorage.getItem("nb_public_dark_mode") === "1"; } catch (e) { return false; } });
  useEffect(() => { try { localStorage.setItem("nb_public_dark_mode", darkMode ? "1" : "0"); } catch (e) {} }, [darkMode]);
  // Same "force desktop layout regardless of screen size" toggle as the
  // main roster's profile menu, kept under its own storage key so it
  // never gets mixed up with the admin's own preference on a shared device.
  const [desktopView, setDesktopView] = useState(() => { try { return localStorage.getItem("nb_public_force_desktop_view") === "1"; } catch (e) { return false; } });
  useEffect(() => { try { localStorage.setItem("nb_public_force_desktop_view", desktopView ? "1" : "0"); } catch (e) {} }, [desktopView]);
  // Same mobile-only sliding drawer as the manager app — starts closed,
  // never persisted, closes itself whenever the current screen changes.
  const [mobileSidebarOpen, setMobileSidebarOpen] = useState(false);
  useEffect(() => { setMobileSidebarOpen(false); }, [view.mode, view.catId]);
  const sidebarSwipe = useSidebarSwipe(mobileSidebarOpen, setMobileSidebarOpen);
  // Used both when the link stops working and from "Sign in" inside the
  // profile menu — drops the pinned share link (if any) and sends the
  // visitor to the normal sign-in screen at the app's base URL.
  const goToLogin = useCallback(() => {
    try { localStorage.removeItem(PINNED_VIEW_KEY); } catch (e) {}
    window.location.href = window.location.origin + window.location.pathname;
  }, []);
  // data-theme has to live on <html> itself (not just a wrapper div) so it
  // reaches every CSS variable consumer on the page — same approach the
  // main admin view uses.
  useEffect(() => {
    document.documentElement.setAttribute("data-theme", darkMode ? "dark" : "light");
  }, [darkMode]);

  useEffect(() => {
    // Reads publicRosters/{uid} — a separate, deliberately public-safe
    // document (see derivePublicData / syncPublicRoster) — instead of the
    // real accounts/{uid} document. The doc's mere existence now implies
    // sharing is on: syncPublicRoster deletes it the instant Share is
    // toggled off, so there's no stale shareEnabled flag to check here
    // the way the old code checked snap.data().shareEnabled — checking a
    // flag INSIDE a document the rules already had to allow reading
    // would've protected nothing extra anyway.
    const unsub = db.collection("publicRosters").doc(uid).onSnapshot(
      (snap) => {
        if (snap.exists && snap.data().v === 2) {
          setData(normalizeData(snap.data()));
        } else {
          setData(null);
        }
      },
      () => setData(null)
    );
    return () => unsub();
  }, [uid]);

  return (
    <LangContext.Provider value={langCtxValue}>
      <div style={{ minHeight: "100vh", background: "var(--bg-page)" }}>
        {data === undefined && (
          <div style={{ padding: "3rem", textAlign: "center", color: "var(--text-secondary)" }}>{t("Loading…", "લોડ થઈ રહ્યું છે…")}</div>
        )}

        {data === null && (
          <div style={{ padding: "3rem", textAlign: "center", color: "var(--text-secondary)" }} className="gu">
            <div style={{ marginBottom: 14 }}>{t("This link isn't available. Sharing may have been turned off.", "આ લિંક ઉપલબ્ધ નથી. શેરિંગ બંધ કરવામાં આવ્યું હોઈ શકે છે.")}</div>
            <button
              onClick={goToLogin}
              className="gu"
              style={{ background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 8, padding: "8px 16px", fontSize: 13, fontWeight: 600, color: "var(--text-primary)", cursor: "pointer" }}
            >{t("Go to sign in", "સાઇન ઇન પર જાઓ")}</button>
          </div>
        )}

        {data && (
          <div className={"app-shell" + (desktopView ? " force-desktop" : "")} style={{ display: "flex", minHeight: "100vh" }} onTouchStart={sidebarSwipe.onTouchStart} onTouchEnd={sidebarSwipe.onTouchEnd}>
            <PublicSidebar data={data} view={view} setView={setView} mobileOpen={mobileSidebarOpen} onCloseMobile={() => setMobileSidebarOpen(false)} />
            {mobileSidebarOpen && <div className="mobile-sidebar-backdrop" onClick={() => setMobileSidebarOpen(false)} />}
            <div className="main-panel" style={{ flex: 1, padding: "28px 36px", maxWidth: 1040 }}>
              <button
                onClick={() => setMobileSidebarOpen(true)}
                className="mobile-menu-btn" title={t("Menu", "મેનૂ")} aria-label={t("Menu", "મેનૂ")}
                style={{ background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 7, width: 36, height: 36, alignItems: "center", justifyContent: "center", fontSize: 16, marginBottom: 12, color: "var(--text-primary)" }}
              >☰</button>
              <div style={{ display: "flex", justifyContent: "flex-end", alignItems: "center", gap: 10, marginBottom: 16, fontSize: 12, color: "var(--text-secondary)" }}>
                <span style={{ display: "inline-flex", alignItems: "center", height: 30, boxSizing: "border-box", background: "var(--status-success-bg)", color: "var(--status-success-text)", border: "1px solid var(--status-success-border)", borderRadius: 7, padding: "0 10px", fontSize: 12, fontWeight: 600 }} className="gu">{t("View only", "ફક્ત જોવા માટે")}</span>
                <LangInlineToggle />
                <button onClick={() => setShowAboutPanel(true)} title={t("About this app", "આ એપ વિશે")} aria-label={t("About this app", "આ એપ વિશે")} style={{
                  background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 7,
                  width: 30, height: 30, boxSizing: "border-box", padding: 0, fontSize: 15, lineHeight: 1, fontWeight: 700, letterSpacing: 1, color: "var(--text-primary)",
                }}>⋮</button>
                <ProfileMenu darkMode={darkMode} setDarkMode={setDarkMode} desktopView={desktopView} setDesktopView={setDesktopView} onSettings={() => setShowSettingsPanel(true)} />
              </div>

              {view.mode === "home" && (
                <PublicHomeView data={data} goToCategory={(catId) => setView({ mode: "category", catId })} />
              )}
              {view.mode === "category" && view.catId && (
                <PublicCategoryView data={data} catId={view.catId} />
              )}
              {view.mode === "staff" && <PublicStaffView data={data} />}
              {view.mode === "calendar" && <CalendarView data={data} />}
              {view.mode === "report" && <ReportView data={data} />}
              {view.mode === "skipHistory" && <SkipHistoryView data={data} />}
            </div>
          </div>
        )}

        {showAboutPanel && <AboutPanel onClose={() => setShowAboutPanel(false)} />}
        {showHelpPanel && <HelpPanel onClose={() => setShowHelpPanel(false)} sections={PUBLIC_HELP_SECTIONS} />}
        {showSettingsPanel && (
          <SettingsPanel
            onHelp={() => setShowHelpPanel(true)}
            onSignIn={goToLogin}
            onClose={() => setShowSettingsPanel(false)}
          />
        )}
      </div>
    </LangContext.Provider>
  );
}

          aria-label={mobileOpen ? t("Close menu", "મેનૂ બંધ કરો") : t("Hide sidebar", "સાઇડબાર છુપાવો")}
          style={{ background: "transparent", border: "1px solid #2E3742", borderRadius: 6, color: "#B7C2CA", width: 26, height: 26, flexShrink: 0, fontSize: 13, padding: 0, display: "flex", alignItems: "center", justifyContent: "center" }}

      <button onClick={() => setView({ mode: "calendar" })} style={navBtn(view.mode === "calendar")} className="gu">📅 {t("Duty calendar", "ડ્યુટી કૅલેન્ડર")}</button>

}

// Mirrors HomeView's cards (work type, who's on duty today / next up,
// total staff) — same computeRoster() call the admin's Home screen uses —
// just without the "Assign" button or modal.
function PublicHomeView({ data, goToCategory }) {
  const { t } = useLang();
  const today = todayStr();
  const [showInfo, setShowInfo] = useState(false);
  const cards = useMemo(() => (data.categories || []).map((c) => {
    const roster = computeRoster(data, c.id);
    const doneToday = roster.find((p) => p.lastDuty === today);
    const nextUp = roster.find((p) => p.rank === 1);
    return { cat: c, doneToday, nextUp, total: roster.length };
  }), [data]);

  return (
    <React.Fragment>
      <div style={{ display: "flex", alignItems: "center", marginBottom: showInfo ? 4 : 20 }}>
        <h1 className="disp gu" style={{ fontSize: 22, fontWeight: 700, margin: 0 }}>{t("Today's duty", "આજની ડ્યુટી")}</h1>
        <InfoIconButton active={showInfo} onClick={() => setShowInfo((v) => !v)} label={t("About this screen", "આ સ્ક્રીન વિશે")} />
      </div>
      {showInfo && (
        <p style={{ fontSize: 13, color: "var(--text-secondary)", margin: "0 0 20px" }} className="gu">
          {new Date().toLocaleDateString(undefined, { weekday: "long" })}, {formatDMY(todayStr())} — {t("every work type at a glance.", "એક નજરમાં દરેક કામનો પ્રકાર.")}
        </p>
      )}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(250px, 1fr))", gap: 14 }}>
        {cards.map(({ cat, doneToday, nextUp, total }) => (
          <div key={cat.id} style={{ background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 10, padding: "16px 18px", display: "flex", flexDirection: "column", gap: 10 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
              <div className="disp" style={{ fontWeight: 700, fontSize: 14.5 }}>{cat.label}</div>
              <div className="mono gu" style={{ fontSize: 11, color: "var(--text-tertiary)" }}>{total} {t("staff", "સ્ટાફ")}</div>
            </div>

            {total === 0 ? (
              <div style={{ fontSize: 12.5, color: "var(--text-tertiary)" }} className="gu">{t("No staff added yet.", "હજુ કોઈ સ્ટાફ ઉમેર્યો નથી.")}</div>

              <div style={{ background: "var(--status-success-bg)", border: "1px solid var(--status-success-border)", borderRadius: 8, padding: "9px 12px" }}>
                <div style={{ fontSize: 10.5, textTransform: "uppercase", letterSpacing: 0.5, color: "var(--status-success-text)", fontWeight: 700 }} className="gu">{t("On duty today", "આજે ડ્યુટી પર")}</div>
                <div className="gu" style={{ fontSize: 14.5, fontWeight: 600, marginTop: 2 }}>{doneToday.name}</div>
              </div>
            ) : nextUp ? (
              <div style={{ background: "var(--highlight-bg)", border: "1px solid var(--highlight-border)", borderRadius: 8, padding: "9px 12px" }}>
                <div style={{ fontSize: 10.5, textTransform: "uppercase", letterSpacing: 0.5, color: "var(--status-warning-text)", fontWeight: 700 }} className="gu">{t("Not assigned yet · next up", "હજુ સોંપાયું નથી · આગળ")}</div>
                <div className="gu" style={{ fontSize: 14.5, fontWeight: 600, marginTop: 2 }}>{nextUp.name}</div>
              </div>
            ) : (
              <div style={{ background: "var(--status-error-bg)", border: "1px solid var(--status-error-border)", borderRadius: 8, padding: "9px 12px", fontSize: 12.5, color: "var(--status-error-text)" }} className="gu">{t("No one available — all on leave, outstation, or skip.", "કોઈ ઉપલબ્ધ નથી — બધા રજા, બહારગામ અથવા સ્કિપ પર.")}</div>

<style>
  html { scroll-behavior: smooth; }
  body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg-page); color: var(--text-primary); -webkit-tap-highlight-color: transparent; }
  /* Noto Sans Gujarati renders noticeably smaller than Inter at the exact
     same declared font-size — a normal difference in font metrics between
     scripts, not a bug in either font, but it means Gujarati text looked
     smaller than the English throughout the app even though every element
     technically specified the same size. 1.08em scales proportionally
     off of whatever size was already set on that element (a button, a
     table cell, a heading — all wildly different base sizes), rather
     than a fixed px bump that would only be correct for one of them. */
  .gu { font-family: 'Noto Sans Gujarati', 'Inter', sans-serif; font-size: 1.08em; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .disp { font-family: 'Space Grotesk', sans-serif; }
  /* Shared entrance animations for every modal (backdrop fade + card
     scale-in) and the toast (slide up from the bottom) — plain CSS
     keyframes, not a JS animation library, since this app has no build
     step and adding a library dependency for a handful of short,
     one-shot entrance effects would be real added risk for no real
     benefit. Kept short (150-220ms) and subtle on purpose — this is a
     work tool people use many times a day, not something that should
     ever feel like it's making them wait. */
  @keyframes modalFadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes modalScaleIn { from { opacity: 0; transform: scale(0.96) translateY(6px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  @keyframes toastSlideUp { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
  .modal-backdrop { animation: modalFadeIn 0.15s ease-out; }
  .modal-card { animation: modalScaleIn 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
  .toast-anim { animation: toastSlideUp 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
  /* Slow-drifting soft blobs behind the sign-in card — pure CSS
     transform animation (GPU-accelerated, no JS/canvas needed), looped
     and offset so the motion reads as organic rather than a visibly
     repeating loop. Deliberately slow (18-26s per cycle) and low-opacity
     — this is the first thing anyone sees before they've even signed
     in, so it should feel calm and premium, not busy or distracting. */
  @keyframes blobDrift1 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(60px, -40px) scale(1.15); } }
  @keyframes blobDrift2 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-50px, 50px) scale(1.1); } }
  @keyframes blobDrift3 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(35px, 45px) scale(0.9); } }
  .signin-blob-1 { animation: blobDrift1 22s ease-in-out infinite; }
  .signin-blob-2 { animation: blobDrift2 26s ease-in-out infinite; animation-delay: -8s; }
  .signin-blob-3 { animation: blobDrift3 19s ease-in-out infinite; animation-delay: -4s; }
  @media (prefers-reduced-motion: reduce) {
    .modal-backdrop, .modal-card, .toast-anim, .signin-blob-1, .signin-blob-2, .signin-blob-3 { animation: none !important; }
    button, button:not(:disabled):active { transition: none !important; transform: none !important; }
  }
  button {
    cursor: pointer; font-family: inherit;
    transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease, transform 0.08s ease;
  }
  button:not(:disabled):active { transform: scale(0.97); }
  input[type=text], input[type=date], input[type=month], input[type=number], textarea, select {
    font-family: inherit; border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 10px; font-size: 13px; background: #fff; color: #16202B;
    transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
    /* Without this, a width:100% input's rendered width is 100% of its
       container PLUS the padding and border on top of that (the
       default content-box model), so it visibly overflows past
       whatever it's supposed to line up with — e.g. a search box that
       looks wider than the rows below it in the same panel. border-box
       makes width:100% mean "100% including padding and border",
       matching how every other width:100% element in the app already
       behaves. */
    box-sizing: border-box;
  }
  input:focus, textarea:focus, select:focus { outline: 2px solid #D98E2B55; border-color: #D98E2B; }
  select { font-family: inherit; }
  a, .clickable, [role="button"] { transition: color 0.15s ease, background-color 0.15s ease; }
  table { transition: opacity 0.15s ease; }
  tr { transition: background-color 0.12s ease; }
  @media (max-width: 860px) {
    /* Off-canvas sliding drawer instead of stacking the sidebar above the
       content: the sidebar sits fixed and pushed off-screen to the left
       by default, sliding into view only when the hamburger button opens
       it (adds .mobile-sidebar-open), with a dimmed backdrop behind it
       that closes it on tap — the same pattern most native apps and the
       reference screenshot use, rather than permanently eating the top
       ~40% of the screen the old stacked layout did.
       :not(.force-desktop) is what keeps every rule in this block from
       applying when "Desktop view" is on. */
    .app-shell:not(.force-desktop) .sidebar {
      position: fixed !important; top: 0 !important; left: 0 !important;
      height: 100vh !important; max-height: none !important; width: 260px !important;
      z-index: 400 !important; transform: translateX(-100%);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      overflow-y: auto !important;
    }
    .app-shell:not(.force-desktop) .sidebar.mobile-sidebar-open { transform: translateX(0); }
    .mobile-sidebar-backdrop { position: fixed; inset: 0; background: #00000066; z-index: 399; animation: modalFadeIn 0.2s ease-out; }
    /* Hidden entirely on desktop (see the non-media-query .mobile-menu-btn
       rule below) -- only exists as a concept once the layout is this
       narrow. */
    .app-shell:not(.force-desktop) .mobile-menu-btn { display: inline-flex !important; }
    .app-shell { flex-direction: row !important; }
    .main-panel { padding: 16px 12px !important; max-width: 100% !important; }
    table { font-size: 12px !important; }
    /* The top toolbar (Search, Undo, Backup, Drive, Share, ⋮ — around 9
       buttons) is a single flex row with no wrap by default, sized for
       desktop width. In portrait on a phone there's nowhere near enough
       width for all of it, so past a certain point the row just runs off
       the right edge of the screen with nothing to scroll it back into
       view — not just visually cramped, genuinely untouchable. Letting it
       wrap onto as many lines as it needs keeps every button reachable
       without needing to rotate to landscape for width. */
    .top-toolbar { flex-wrap: wrap !important; justify-content: flex-start !important; }
    /* Tables now scroll horizontally within their own card (see the
       overflowX:auto wrapper around each <table>) instead of being
       squeezed to fit or clipped — swipe left/right on any table to see
       columns that don't fit. */

    /* "Desktop view" toggle (profile menu → 🖥️ Desktop view): re-applies
       the normal desktop values on top of everything above, undoing the
       mobile layout entirely on request — same idea as a browser's own
       "Request desktop site". Higher selector specificity than the plain
       .sidebar/.app-shell/.main-panel/table rules above is what lets these
       win despite both sides using !important. The collapsed-rail sidebar
       width (44px) is intentionally left alone here — that's a separate,
       deliberate user choice, not part of "am I on mobile or desktop". */
    .force-desktop .sidebar:not([style*="width: 44"]) { width: 230px !important; max-height: none !important; height: 100vh !important; position: sticky !important; }
    .app-shell.force-desktop, .force-desktop.app-shell { flex-direction: row !important; }
    .force-desktop .main-panel { padding: 28px 36px !important; max-width: 1040px !important; }
    .force-desktop table { font-size: 13px !important; }
  }
  /* Hidden by default (desktop) — the mobile media query above turns this
     back on with !important once the layout is actually narrow enough
     for it to make sense, and "Desktop view" being on keeps it off even
     at a narrow width via the :not(.force-desktop) scoping there. */
  .mobile-menu-btn { display: none; }
  /* Printing a tab (Ctrl/Cmd+P) shows just that screen's data — no sidebar,
     no toolbar, no interactive buttons — full width on plain white paper. */
  @media print {
    body { background: #fff !important; }
    .sidebar, .no-print, button, .command-palette-overlay { display: none !important; }
    .app-shell { display: block !important; }
    .main-panel { max-width: 100% !important; padding: 0 !important; }
    table { font-size: 11px !important; }
    th, td { padding: 5px 7px !important; }
    tr { break-inside: avoid; }
    a[href]::after { content: ""; }
  }
  /* Dark mode: real, hand-tuned colors via CSS variables (not a filter
     trick) — components reference var(--...) for their core surface/text/
     border colors, and this block swaps what those variables point to.
     Colors that should stay constant regardless of theme (the always-dark
     sidebar, colored status badges, the brand-gold accent) are left as
     literal hex values in the components themselves, untouched here. */
  :root {
    /* Warm cream "normal mode" palette (per the reference photo) — a soft
       cream/beige surface with dark warm-brown text and a golden accent,
       instead of the cool grey-blue palette. */
    --bg-page: #F4EBDC;
    --bg-surface: #FFFDF8;
    --bg-surface-2: #F1E6D2;
    --sidebar-bg: #1E1712;
    --text-primary: #2B2116;
    --text-secondary: #6E5D49;
    --text-tertiary: #9C8B72;
    --border: #E4D5B8;
    --border-soft: #EFE4CD;
    --btn-dark-bg: #2B2116;
    --highlight-bg: #FFFBF2;
    --highlight-border: #F3DDAE;
    --status-success-bg: #EAF3DE;
    --status-success-text: #3B6D11;
    --status-success-border: #C0DD97;
    --status-error-bg: #FBEAEA;
    --status-error-text: #A32D2D;
    --status-error-border: #F0C6C6;
    --status-warning-bg: #FCEFD9;
    --status-warning-text: #8A5A16;
    --status-warning-border: #F0D6A0;
    --status-info-bg: #DCE8F5;
    --status-info-text: #1D4E89;
    --status-info-border: #A9C6E8;
    --status-purple-bg: #EFE5F7;
    --status-purple-text: #6B3FA0;
    --status-purple-border: #D3B8EC;
    --status-neutral-bg: #F1EFE8;
    --status-neutral-text: #5F5E5A;
    --status-neutral-border: #D3D1C7;
    /* Solid CTA button colors (e.g. "Backup now", "Delete selected",
       "Done editing"). Deliberately fixed rather than var(--status-*-text) —
       those flip to pale/light colors in dark mode for text-on-dark
       readability, which is exactly wrong for a solid button background
       paired with white text (pale bg + white text = invisible). A solid
       button is a small filled surface, not page text, so it keeps the
       same readable dark color in both themes. */
    --btn-warning-solid: #8A5A16;
    --btn-danger-solid: #A32D2D;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    /* Pure pitch black everywhere in dark mode — page background, every
       card/panel surface, and the sidebar all use the same #000000, with
       only the (still-visible) borders left a dark grey so panels and
       list rows keep some definition against each other. */
    --bg-page: #000000;
    --bg-surface: #000000;
    --bg-surface-2: #000000;
    --sidebar-bg: #000000;
    --text-primary: #FFFFFF;
    --text-secondary: #FFFFFF;
    --text-tertiary: #FFFFFF;
    --border: #333C48;
    --border-soft: #2A323C;
    --btn-dark-bg: #2E3742;
    --highlight-bg: #3A331F;
    --highlight-border: #5C4E27;
    --status-success-bg: #1E3320;
    --status-success-text: #E3FBE3;
    --status-success-border: #3A5C3D;
    --status-error-bg: #3A2020;
    --status-error-text: #FFE3E3;
    --status-error-border: #5C3535;
    --status-warning-bg: #3A2F18;
    --status-warning-text: #FFF0D6;
    --status-warning-border: #5C4A28;
    --status-info-bg: #1C2E42;
    --status-info-text: #E1F0FF;
    --status-info-border: #345070;
    --status-purple-bg: #2E2438;
    --status-purple-text: #F1E5FB;
    --status-purple-border: #4A3A5C;
    --status-neutral-bg: #2A2E33;
    --status-neutral-text: #EDEEF0;
    --status-neutral-border: #444B52;
  }
  [data-theme="dark"] input[type=text], [data-theme="dark"] input[type=date],
  [data-theme="dark"] input[type=month], [data-theme="dark"] input[type=number],
  [data-theme="dark"] textarea, [data-theme="dark"] select {
    background: var(--bg-surface); color: var(--text-primary); border-color: var(--border);
  }
  [data-theme="dark"] table { color: var(--text-primary); }
  /* <select> dropdown option lists and input placeholder text don't
     inherit an element's own `color` — browsers (especially Chrome on
     Windows) render option lists with native black-on-white regardless of
     CSS, and placeholders use their own separate, unthemed default. Both
     need to be targeted explicitly or they show as black text even though
     everything else on the page correctly went white. */
  [data-theme="dark"] option { background: var(--bg-surface); color: var(--text-primary); }
  [data-theme="dark"] ::placeholder { color: var(--text-tertiary); opacity: 1; }
  /* The sign-in screen's email/password pills are always a fixed light
     surface by design (in both light and dark app mode), so their
     placeholder text needs a fixed dark-on-light color here too — this
     overrides the dark-mode rule above (which would otherwise turn the
     placeholder white and make it invisible on the light pill). */
  .signin-field-input::placeholder { color: #8B958E; opacity: 1; }
  [data-theme="dark"] .signin-field-input::placeholder { color: #8B958E; opacity: 1; }
</style>

<script type="text/babel" data-type="module">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

firebase.initializeApp(window.FIREBASE_CONFIG);
// App Check: a signed token attached to every Firebase request, proving it
// came from a genuine copy of this app — not a browser-referrer check (the
// mechanism that broke login earlier), so it doesn't share that fragility.
// reCAPTCHA v3 runs invisibly, no popup or challenge a person would see.
// Still has no real effect until enforcement is turned on for Firestore/
// Auth in Firebase Console → App Check → the APIs tab — do that only after
// confirming login still works fine with this in place.
firebase.appCheck().activate(
  "6LdkZn4tAAAAAC3uwWyQCKEKpGCUvy3T73bys-l2",
  true
);
const db = firebase.firestore();
// Enables local (IndexedDB) caching of Firestore data and queuing of writes
// made while offline. Without this, a write made with no signal only lives
// in memory — a refresh or tab close before the connection returns loses
// it silently. With this on, the change is saved to disk immediately and
// synced automatically the moment connectivity comes back. Duty-room wifi
// is often patchy, so this matters more here than in a typical app.
// synchronizeTabs lets multiple open tabs of this app share one persistence
// layer instead of the second tab's setup failing; the remaining failure
// case is a browser that has no IndexedDB (e.g. some private-browsing
// modes), which just falls back to memory-only caching for that session.
db.enablePersistence({ synchronizeTabs: true }).catch((err) => {
  console.warn("Firestore offline persistence not enabled:", err.code);
});
const auth = firebase.auth();
// Explicitly request LOCAL persistence (survive full browser restarts, not
// just tab refreshes). This is Firebase Auth's default in most browsers,
// but some environments — Safari with "Prevent cross-site tracking",
// certain in-app/webview browsers, private-browsing modes — silently fall
// back to session-only persistence unless this is requested explicitly,
// which is what was causing people to appear "logged out" after closing
// and reopening the app. Set once at startup, before onAuthStateChanged is
// wired up in DutyRoster, so it applies to every sign-in on this page.
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch((err) => {
  console.warn("Could not set LOCAL auth persistence:", err.code);
});
// Old shared data (pre-accounts) lives here. Kept only so a signed-in user
// can pull it into their own account via "Import my existing roster" —
// nothing writes to this location anymore.
const LEGACY_DOC_REF = db.collection("duty-roster").doc("data");
// Each signed-in user's roster lives at accounts/{uid}, matching the

// Converts the old per-category schema (name/status stored directly on each
// row, no shared identity) into the new schema (one global staff record per
// person, referenced by buckle number, shared across every work type).
function migrateOldRoster(oldRoster) {
  const staff = {};
  const membership = {};
  const nameToNumber = {};
  let counter = 1;
  Object.keys(oldRoster).forEach((catId) => {
    const list = oldRoster[catId] || [];
    membership[catId] = list.map((p) => {
      let num = nameToNumber[p.name];
      if (!num) {
        num = "M" + String(counter++).padStart(3, "0");
        nameToNumber[p.name] = num;
        staff[num] = {
          number: num,
          name: p.name,
          phone: null,
          // Best-effort carry-over: an old "Leave" status becomes a 30-day
          // leave starting today. Please correct the actual dates in
          // Manage Staff.
          unavailable: p.status === "Leave" ? { type: "Leave", from: todayStr(), to: todayStr() } : null,
          designation: null,
        };
      }
      return { number: num, lastDuty: p.lastDuty, history: p.history || [], skip: p.status === "Skip" };

    ? DEFAULT_CATEGORIES.map((c) => ({ id: c.id, label: c.label }))
    : DEFAULT_CATEGORIES;
  // include any category ids present in old data but not in our default list
  Object.keys(oldRoster).forEach((catId) => {
    if (!categories.find((c) => c.id === catId)) categories.push({ id: catId, label: catId });

// non-empty, a person whose current live status isn't represented there

  const today = todayStr();

    const staffRec = data.staff[m.number] || { number: m.number, name: "(unknown)", unavailable: null };
    const status = effectiveStatus(staffRec, m);

// Turns a Firebase Auth error code into a short, friendly bilingual message.
// Used by every sign-in method below (Google, email) so the person
// always sees the same style of message regardless of which method they
// tried.
function mapAuthError(err, t) {
  const code = err && err.code;
  switch (code) {
    case "auth/invalid-email":
      return t("That email address doesn't look right.", "તે ઇમેઇલ સરનામું બરાબર લાગતું નથી.");
    case "auth/user-not-found":
      return t("No account found with that email.", "તે ઇમેઇલ સાથે કોઈ ખાતું મળ્યું નથી.");
    case "auth/wrong-password":
    case "auth/invalid-credential":
      return t("Incorrect email or password. Try again or reset it.", "ખોટો ઇમેઇલ અથવા પાસવર્ડ. ફરી પ્રયાસ કરો અથવા રીસેટ કરો.");
    case "auth/email-already-in-use":
      return t("An account already exists with this email — try signing in instead.", "આ ઇમેઇલ સાથે ખાતું પહેલેથી અસ્તિત્વમાં છે — તેના બદલે સાઇન ઇન કરવાનો પ્રયાસ કરો.");
    case "auth/weak-password":
      return t("Password should be at least 6 characters.", "પાસવર્ડ ઓછામાં ઓછો 6 અક્ષરોનો હોવો જોઈએ.");
    case "auth/too-many-requests":
      return t("Too many attempts — please wait a bit and try again.", "ઘણા બધા પ્રયાસો — કૃપા કરી થોડી રાહ જુઓ અને ફરી પ્રયાસ કરો.");
    case "auth/popup-closed-by-user":
    case "auth/cancelled-popup-request":
      return t("Sign-in window closed before finishing.", "સાઇન ઇન વિન્ડો પૂરી થાય તે પહેલાં બંધ થઈ ગઈ.");
    case "auth/account-exists-with-different-credential":
      return t("This email is linked to a different sign-in method. Try Google or email.", "આ ઇમેઇલ અલગ સાઇન-ઇન પદ્ધતિ સાથે જોડાયેલ છે. Google અથવા ઇમેઇલ અજમાવો.");
    case "auth/operation-not-allowed":
      return t("This sign-in method isn't turned on yet — contact the app admin.", "આ સાઇન-ઇન પદ્ધતિ હજુ ચાલુ કરવામાં આવી નથી — એપ એડમિનનો સંપર્ક કરો.");
    default:
      return t("Sign-in failed — please try again.", "સાઇન ઇન નિષ્ફળ — કૃપા કરી ફરી પ્રયાસ કરો.");
  }
}

function SignInScreen() {
  const { t } = useLang();
  const [authAction, setAuthAction] = useState("signin"); // signin | signup
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [showPassword, setShowPassword] = useState(false);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const [notice, setNotice] = useState("");

  // Belt-and-braces against a page-level scrollbar on this screen: the
  // container below is already position:fixed + overflow:hidden, which
  // should be enough on its own, but some Windows/Chrome configurations
  // still reserve a (non-overlay) scrollbar track for the underlying page
  // in edge cases that don't show up on macOS's overlay scrollbars. Locking
  // scroll on BOTH the <html> and <body> elements — not just body — covers
  // browsers that treat <html> as the actual scrolling box instead, and is
  // restored the instant the person signs in.
  useEffect(() => {
    const html = document.documentElement;
    const body = document.body;
    const prev = {
      htmlOverflow: html.style.overflow, htmlHeight: html.style.height,
      bodyOverflow: body.style.overflow, bodyHeight: body.style.height,
    };
    html.style.overflow = "hidden";
    html.style.height = "100%";
    body.style.overflow = "hidden";
    body.style.height = "100%";
    return () => {
      html.style.overflow = prev.htmlOverflow;
      html.style.height = prev.htmlHeight;
      body.style.overflow = prev.bodyOverflow;
      body.style.height = prev.bodyHeight;
    };
  }, []);

  const resetFeedback = () => { setError(""); setNotice(""); };

  const [shareLinkInput, setShareLinkInput] = useState("");
  const [shareLinkError, setShareLinkError] = useState("");
  const [showShareLink, setShowShareLink] = useState(false);
  const shareLinkInputRef = useRef(null);
  // "Viewer" (next to Forgot Password) reveals the paste-link field instead
  // of it sitting permanently on the card. Toggling it open also focuses
  // the field once it has actually mounted, hence the effect below.
  const jumpToShareLink = () => setShowShareLink((v) => !v);
  useEffect(() => {
    if (!showShareLink || !shareLinkInputRef.current) return;
    shareLinkInputRef.current.scrollIntoView({ behavior: "smooth", block: "center" });
    shareLinkInputRef.current.focus();
  }, [showShareLink]);
  const pinShareLink = () => {
    setShareLinkError("");
    const linkUid = extractShareUid(shareLinkInput);
    if (!linkUid) {
      setShareLinkError(t("Paste the share link your admin sent you.", "તમારા એડમિને મોકલેલી શેર લિંક પેસ્ટ કરો."));
      return;
    }
    try { localStorage.setItem(PINNED_VIEW_KEY, linkUid); } catch (e) { /* proceed anyway — the URL param below still gets them there this one time */ }
    window.location.href = `${window.location.origin}${window.location.pathname}?view=${encodeURIComponent(linkUid)}`;
  };

  const signInWithGoogle = () => {
    resetFeedback();
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch((e) => { console.error(e); setError(mapAuthError(e, t)); });
  };

  const handleEmailSubmit = (e) => {
    e.preventDefault();
    resetFeedback();
    if (!email.trim() || !password) {
      setError(t("Enter both email and password.", "ઇમેઇલ અને પાસવર્ડ બંને દાખલ કરો."));
      return;
    }
    setBusy(true);
    const action = authAction === "signup"
      ? auth.createUserWithEmailAndPassword(email.trim(), password)
      : auth.signInWithEmailAndPassword(email.trim(), password);
    action
      .catch((err) => { console.error(err); setError(mapAuthError(err, t)); })
      .finally(() => setBusy(false));
  };

  const handleForgotPassword = () => {
    resetFeedback();
    if (!email.trim()) {
      setError(t("Enter your email above first, then tap this.", "પહેલા ઉપર તમારો ઇમેઇલ દાખલ કરો, પછી આ ટેપ કરો."));
      return;
    }
    setBusy(true);
    auth.sendPasswordResetEmail(email.trim())
      .then(() => setNotice(t(
        "Password reset email sent. If it's not in your inbox within a minute, please check your Spam / Junk folder — mark it \"Not spam\" so future emails arrive normally.",
        "પાસવર્ડ રીસેટ ઇમેઇલ મોકલાયો. જો એક મિનિટમાં તમારા ઇનબોક્સમાં ન દેખાય, તો કૃપા કરી તમારું સ્પામ / જંક ફોલ્ડર તપાસો — તેને \"સ્પામ નથી\" તરીકે માર્ક કરો જેથી ભવિષ્યના ઇમેઇલ સામાન્ય રીતે આવે."
      )))
      .catch((err) => { console.error(err); setError(mapAuthError(err, t)); })
      .finally(() => setBusy(false));
  };

  const fieldWrap = { display: "flex", alignItems: "center", gap: 10, border: "1px solid var(--border)", borderRadius: 10, padding: "12px 14px", background: "#F8F9FB" };
  // Fixed (not theme-linked) colors: this pill is always a light surface by
  // design, in both light and dark app mode — so its text and placeholder
  // must stay fixed dark colors too, rather than following var(--text-primary)
  // (which turns white in dark mode and would be invisible against #F8F9FB).

// Same idea as LangToggle but styled for the light sign-in screen, since

function LangInlineToggle({ dark }) {
  const { lang, setLang } = useLang();
  const base = { display: "inline-flex", alignItems: "center", height: 30, boxSizing: "border-box", border: "1px solid " + (dark ? "rgba(255,255,255,0.5)" : "var(--border)"), borderRadius: 7, padding: "0 10px", fontSize: 12, fontWeight: 600 };
  const offColor = dark ? { background: "rgba(255,255,255,0.14)", color: "#fff" } : { background: "var(--bg-page)", color: "var(--text-secondary)" };
  const onColor = dark ? { background: "var(--bg-surface)", color: "var(--text-primary)" } : { background: "var(--btn-dark-bg)", color: "#fff" };
  return (
    <React.Fragment>
      <button onClick={() => setLang("en")} style={{ ...base, ...(lang === "en" ? onColor : offColor) }}>EN</button>
      <button onClick={() => setLang("gu")} className="gu" style={{ ...base, ...(lang === "gu" ? onColor : offColor) }}>ગુજરાતી</button>
    </React.Fragment>
  );
}

function DutyRoster() {
  // Bilingual UI: language choice persists locally, provided to the whole
  // tree via LangContext so any component can call useLang() and get
  // { lang, t }. SignInScreen (rendered before this provider exists further
  // down) gets its own copy wired in App() below.
  const [lang, setLang] = useState(() => { try { return localStorage.getItem("nb_lang") || "en"; } catch (e) { return "en"; } });
  useEffect(() => { try { localStorage.setItem("nb_lang", lang); } catch (e) {} }, [lang]);
  const t = useCallback((en, gu) => (lang === "gu" && gu ? gu : en), [lang]);
  const langCtxValue = useMemo(() => ({ lang, setLang, t }), [lang, t]);

  // undefined = still checking whether someone's already signed in;
  // null = signed out; object = signed-in Firebase user.
  const [user, setUser] = useState(undefined);
  useEffect(() => {
    const unsub = auth.onAuthStateChanged(setUser);
    return () => unsub();
  }, []);
  // Sign-in itself (Google / email+password) is
  // handled inside SignInScreen, which calls `auth` directly — this
  // component only needs to react once `user` changes.
  const signOutUser = () => { auth.signOut(); };
  // Stable per signed-in session — recomputed each render but points at the
  // same Firestore doc the whole time someone's signed in.
  const docRef = user ? accountDocRef(user.uid) : null;
  // The public-safe mirror of this account, kept in a SEPARATE Firestore
  // document/collection specifically so that Firestore Security Rules can
  // grant it public read access without also exposing the real
  // accounts/{uid} document (which the public view used to read directly
  // — meaning anyone with a share link, or anyone who obtained the UID
  // any other way, could read the ENTIRE account document via the
  // Firestore SDK directly, including staff phone numbers, regardless of
  // what the share view's UI chose to display). See syncPublicRoster
  // below for what actually gets written here and when.
  const publicRosterDocRef = user ? db.collection("publicRosters").doc(user.uid) : null;

  const [data, setData] = useState(null);
  const [view, setView] = useState({ mode: "assignDuty" }); // home | category | staff | report | assignDuty
  const [toast, setToast] = useState(null);
  const [connError, setConnError] = useState(false);
  // Bumping this forces the data-loading effect below to re-run and
  // re-subscribe — the retry mechanism for the "couldn't connect" screen.
  const [retryKey, setRetryKey] = useState(0);
  const [returnNotices, setReturnNotices] = useState([]);
  const [backupReminder, setBackupReminder] = useState(false);
  // Records that SOME kind of backup just happened — manual JSON download,
  // a successful Drive backup, or the silent on-close Drive backup — all
  // three write the same shared timestamp, so the "haven't backed up in a
  // while" reminder below only fires when truly none of them have run
  // recently, not just one specific method.
  const recordBackupNow = () => { try { localStorage.setItem("nb_last_backup_at", new Date().toISOString()); } catch (e) {} };
  // A gentle reminder — not a blocking dialog — if it's been 2+ days (or
  // it's never happened at all) since any backup: manual download, Drive,
  // or the silent on-close Drive save. Checked once, shortly after the
  // roster loads, so it doesn't compete with the initial render; dismissing
  // it only hides it for this session; it'll reappear next time it's due.
  useEffect(() => {
    if (!data) return;
    const check = () => {
      let last = null;
      try { last = localStorage.getItem("nb_last_backup_at"); } catch (e) {}
      const dueMs = 2 * 24 * 60 * 60 * 1000;
      if (!last || Date.now() - new Date(last).getTime() >= dueMs) setBackupReminder(true);
    };
    const t = setTimeout(check, 4000);
    return () => clearTimeout(t);
  }, [data]);
  const [showCommandPalette, setShowCommandPalette] = useState(false);
  const [darkMode, setDarkMode] = useState(() => localStorage.getItem("nb_dark_mode") === "1");
  useEffect(() => { localStorage.setItem("nb_dark_mode", darkMode ? "1" : "0"); }, [darkMode]);
  // Same idea as a browser's "Request Desktop Site" — bypasses the
  // ≤860px responsive layout (stacked sidebar, smaller table text)
  // entirely, forcing the normal side-by-side desktop layout regardless
  // of actual screen width. The device can still pinch-zoom/scroll to
  // read it, same as visiting any desktop site on a phone deliberately.
  // Persisted per device.
  const [desktopView, setDesktopView] = useState(() => localStorage.getItem("nb_force_desktop_view") === "1");
  useEffect(() => { localStorage.setItem("nb_force_desktop_view", desktopView ? "1" : "0"); }, [desktopView]);
  // The mobile-only sliding drawer (hamburger button in the top toolbar).
  // Never persisted — it always starts closed on load, the same way a
  // native app's drawer would. Closed automatically whenever the current
  // screen changes, so tapping a nav item inside it also closes it,
  // without needing to touch every individual nav button's onClick.
  const [mobileSidebarOpen, setMobileSidebarOpen] = useState(false);
  useEffect(() => { setMobileSidebarOpen(false); }, [view.mode, view.catId]);
  const sidebarSwipe = useSidebarSwipe(mobileSidebarOpen, setMobileSidebarOpen);
  // data-theme also has to live on <html> itself, not just the app's own
  // wrapper div below — CSS custom properties only cascade DOWN to
  // descendants, and <body> sits OUTSIDE that wrapper (as its parent), so
  // any text relying on inherited color (not an explicit color: var(...)
  // on itself) would keep resolving the light-mode value from body/html
  // and never see the dark override, even with the wrapper correctly
  // themed. Setting it here too makes the override visible at the actual
  // root, so inheritance works correctly everywhere, not just on elements
  // that happen to set their own color explicitly.
  useEffect(() => {
    document.documentElement.setAttribute("data-theme", darkMode ? "dark" : "light");
  }, [darkMode]);
  const notifiedRef = useRef(new Set());
  const migratedRef = useRef(false);
  const lastActionRef = useRef("");
  const [undoStack, setUndoStack] = useState([]);
  const [redoStack, setRedoStack] = useState([]);
  const MAX_HISTORY_STATES = 40;

  // ---------- connectivity / save status ----------
  // `online` follows the browser's own connectivity events (fast, but only
  // knows about this device's network interface). `hasPendingWrites` comes
  // from Firestore's snapshot metadata and is true whenever there's a local
  // change not yet confirmed by the server — the more reliable signal for
  // "did this actually save", since a wifi connection can report as
  // "online" while still failing to reach Firestore. Combined into one
  // status badge so it's obvious when it's safe to walk away vs. wait.
  const [online, setOnline] = useState(typeof navigator === "undefined" || navigator.onLine);
  useEffect(() => {
    const goOnline = () => setOnline(true);
    const goOffline = () => setOnline(false);
    window.addEventListener("online", goOnline);
    window.addEventListener("offline", goOffline);
    return () => { window.removeEventListener("online", goOnline); window.removeEventListener("offline", goOffline); };

  const [hasPendingWrites, setHasPendingWrites] = useState(false);
  const syncStatus = !online ? "offline" : hasPendingWrites ? "pending" : "synced";

  // ---------- reminders: panel visibility + browser-notification bookkeeping ----------
  const [showReminderPanel, setShowReminderPanel] = useState(false);
  const [notifPermission, setNotifPermission] = useState(
    (typeof Notification !== "undefined" && Notification.permission) || "unsupported"
  );
  const autoShownRef = useRef(false);
  const browserNotifiedRef = useRef(new Set());
  const [tick, setTick] = useState(0);
  // Reminders are date-driven, so if this tab stays open across midnight the
  // "tomorrow" wording and pending set need to refresh on their own — not
  // just when the person makes an edit.
  useEffect(() => {
    const iv = setInterval(() => setTick((t) => t + 1), 5 * 60 * 1000);
    return () => clearInterval(iv);
  }, []);
  const allReminders = useMemo(() => (data ? computeAllReminders(data, lang) : []), [data, tick, lang]);
  const pendingReminders = useMemo(() => allReminders.filter((r) => r.status === "Pending"), [allReminders]);

  // Pop the reminder panel open once per session (like a calendar app
  // greeting you with what's due) the first time there's something pending.
  useEffect(() => {
    if (!autoShownRef.current && pendingReminders.length > 0) {
      autoShownRef.current = true;
      setShowReminderPanel(true);
    }
  }, [pendingReminders]);

  // Fire a native browser notification for any pending reminder this tab
  // hasn't already notified for this session, so it also works if the app
  // is just sitting in a background tab.
  useEffect(() => {
    if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
    pendingReminders.forEach((r) => {
      if (browserNotifiedRef.current.has(r.key)) return;
      browserNotifiedRef.current.add(r.key);
      try { new Notification("Nokri Book reminder", { body: r.message, tag: r.key }); } catch (e) {}
    });
  }, [pendingReminders]);

  const requestNotifPermission = () => {
    if (typeof Notification === "undefined") { showToast(t("Browser notifications aren't supported here", "આ બ્રાઉઝરમાં નોટિફિકેશન સપોર્ટેડ નથી"), "error"); return; }
    Notification.requestPermission().then((perm) => setNotifPermission(perm));
  };

  useEffect(() => {
    if (!user) { setData(null); return; }
    setConnError(false);
    const ref = accountDocRef(user.uid);
    const unsub = ref.onSnapshot(
      { includeMetadataChanges: true },
      (snap) => {
        setHasPendingWrites(snap.metadata.hasPendingWrites);
        setConnError(false);
        if (snap.exists) {
          const d = snap.data();
          if (d.v === 2) {
            const normalized = normalizeData(d);
            const needsWrite = !d.leaveTypes || !d.outstationTypes || !d.designations || !d.recycleBin || !d.events || !d.reminderAcks
              || JSON.stringify(normalized.staff) !== JSON.stringify(d.staff);
            setData(normalized);
            confirmedRevRef.current = normalized._rev || 0;
            // Independent second safety net, deliberately separate from
            // the fromCache fix above: that fix closes the ONE specific
            // path that caused real data loss, but this is a general
            // backstop against ANY future bug (known or not yet found)
            // that might ever overwrite the real server document —
            // completely outside Firestore, so a bug that corrupts the
            // server copy can't touch this too. Only ever taken from a
            // load the server has actually confirmed (never fromCache,
            // for the same reason as everywhere else in this handler),
            // and only overwrites the PREVIOUS local snapshot when the
            // new one looks at least as substantial — so a moment where
            // the real account is legitimately empty (a fresh account)
            // never has the chance to stomp over a local backup that
            // still remembers real data from before. Recoverable via
            // Data → Recover local backup.
            try {
              const prevBackupRaw = localStorage.getItem("nb_auto_backup");
              const prevStaffCount = prevBackupRaw ? Object.keys(JSON.parse(prevBackupRaw).data.staff || {}).length : -1;
              const newStaffCount = Object.keys(normalized.staff || {}).length;
              // Only refuse a DRASTIC, suspicious drop (losing more than
              // half of a meaningfully-sized directory in one go) — the
              // previous version required the count to never decrease at
              // all, which meant something as ordinary as deleting a
              // single staff member left this backup permanently stuck
              // on an older snapshot from before that deletion, instead
              // of updating to reflect the most recent real change like

                // rather than Date.now() here — that would just be
                // whenever this device happened to load or sync, which
                // can be a much more recent, misleading time even when
                // nothing had actually changed since a real edit made a
                // while before that. Falls back to Date.now() only for
                // data saved before this field existed at all.
                localStorage.setItem("nb_auto_backup", JSON.stringify({ savedAt: normalized.lastModifiedAt || Date.now(), data: normalized }));
              }
            } catch (e) { /* localStorage full or unavailable — not worth surfacing, the Firestore data itself is unaffected either way */ }
            // Same fromCache guard as the "brand new account" branch
            // below, for the same reason: only ever write back a
            // "patched" version of data the SERVER has actually
            // confirmed, never a snapshot that's merely this device's
            // local cache (which could be older than the real current
            // document on a device that hasn't fully synced yet).
            if (needsWrite && !snap.metadata.fromCache) ref.set(normalized).catch(() => {});
            // Self-heals publicRosters/{uid} on every load/remote update,
            // not just local edits — otherwise an account that already
            // had sharing turned on BEFORE this publicRosters mechanism
            // shipped would have shareEnabled: true forever with no
            // publicRosters document ever created, since syncPublicRoster
            // previously only ran from local writeToFirestore calls. This
            // also keeps it correct if a second device changes something
            // while this one is just sitting open.
            syncPublicRoster(normalized);
          } else if (d.roster && !migratedRef.current && !snap.metadata.fromCache) {
            // Same fromCache reasoning as the "brand new account" branch
            // below: a device whose local cache still holds this
            // account's PRE-migration document (e.g. it hasn't
            // reconnected since before another device migrated the
            // account to v:2) would otherwise re-run this migration
            // against that stale snapshot and write it back, overwriting
            // whatever the real, already-migrated, possibly since-edited
            // v:2 document currently holds. Only ever migrate — and only
            // ever set migratedRef so this can't accidentally fire twice
            // later — once the server itself has actually confirmed
            // there's old-schema data here to migrate.
            migratedRef.current = true;
            const migrated = normalizeData(migrateOldRoster(d.roster));
            ref.set(migrated).catch(() => {});
            setData(migrated);
            confirmedRevRef.current = migrated._rev || 0;
            syncPublicRoster(migrated);
          }
        } else if (!snap.metadata.fromCache) {
          // Brand new account, GENUINELY confirmed by the server (not
          // just absent from this device's local cache) — start blank.
          // If they have older shared data, they can pull it in via
          // "Import my existing roster".
          //
          // This fromCache check is critical, not defensive extra
          // caution: on the very FIRST login from a device that has
          // never cached this account's document before, Firestore
          // fires an initial snapshot from the (empty) LOCAL cache —
          // snap.exists is false and fromCache is true — before the
          // real server snapshot has had a chance to arrive at all.
          // Treating that transient "don't know yet" state as "this
          // account doesn't exist" and immediately calling
          // ref.set(initial) overwrites the real account on the server
          // with a blank one, moments before the actual data would have
          // loaded — this is exactly what made switching to a new
          // device look like the previous device's changes had
          // "disappeared": they didn't disappear, they were overwritten
          // by this code within the first second of loading, before the
          // real snapshot could even render once.
          const initial = buildInitialData();
          ref.set(initial).catch(() => {});
          setData(initial);
          confirmedRevRef.current = initial._rev || 0;
        }
        // else: fromCache && !exists — genuinely don't know yet whether
        // this account exists on the server. Deliberately do nothing
        // here (data stays null, showing "Loading roster…") rather than
        // guess — the real, server-confirmed snapshot always follows
        // within moments once connected.
      },
      (err) => {
        // CRITICAL: this used to also call setData(buildInitialData()) —
        // silently swapping in a completely blank roster and letting the
        // rest of the app carry on as if that blank slate were real. The
        // banner below did say "showing local demo data", but the app
        // itself was fully interactive on top of it: if anyone touched
        // anything (or a background effect fired a write) before the
        // connection recovered, that blank state would get saved right
        // over their actual data — turning a temporary hiccup (a
        // dropped connection, an ad-blocker interfering with a security
        // check, a brief outage) into permanent, real data loss. Now the
        // real data (or lack of it, on a first load) is left completely
        // untouched — data only ever comes from a real, successful
        // snapshot — and the screen below blocks all interaction with
        // the app until the connection actually recovers.
        console.error(err);
        setConnError(true);
      }
    );
    return () => unsub();
  }, [user, retryKey]);

  // Shared write path for every mutation below — one place to surface a
  // real save failure (bad permissions, quota, etc.) as a toast instead of
  // only a console.error nobody in the field will ever see. Offline writes
  // are NOT an error here: with persistence enabled (see db.enablePersistence
  // above), the promise simply stays pending until reconnect, so this only
  // fires for a genuine, non-connectivity failure.
  const writeDoc = (ref, next) => {
    if (!ref) return;
    ref.set(next).catch((e) => {
      console.error(e);
      showToast(t("Couldn't save that change — check your connection and try again", "તે ફેરફાર સાચવી શકાયો નથી — તમારું જોડાણ તપાસો અને ફરી પ્રયાસ કરો"), "error");
    });
  };

  // Pulls the old shared duty-roster/data doc into this account, replacing
  // whatever's currently here. Only relevant for someone who used the app
  // before accounts existed.
  const importLegacyRoster = async () => {
    if (!docRef) return;
    const ok = window.confirm(
      t("This will import the older shared roster data into your account, replacing what's currently here. Continue?",
        "આ જૂનો શેર કરેલ રોસ્ટર ડેટા તમારા ખાતામાં આયાત કરશે, જે હાલમાં અહીં છે તેને બદલી નાખશે. ચાલુ રાખવું છે?")
    );
    if (!ok) return;
    try {
      const snap = await LEGACY_DOC_REF.get();
      if (!snap.exists) { showToast(t("No existing roster data was found", "કોઈ હાલનો રોસ્ટર ડેટા મળ્યો નથી"), "error"); return; }
      const d = snap.data();
      let imported;
      if (d.v === 2) imported = normalizeData(d);
      else if (d.roster) imported = normalizeData(migrateOldRoster(d.roster));
      else { showToast(t("That data isn't in a format this app recognizes", "તે ડેટા આ એપ ઓળખે તેવા ફોર્મેટમાં નથી"), "error"); return; }
      imported = { ...imported, legacyImported: true };
      await docRef.set(imported);
      setData(imported);
      showToast(t("Existing roster imported", "હાલનો રોસ્ટર આયાત થયો"));
    } catch (e) {
      console.error(e);
      showToast(t("Import failed — please try again", "આયાત નિષ્ફળ — કૃપા કરી ફરી પ્રયાસ કરો"), "error");
    }
  };

  useEffect(() => {
    if (view.mode === "category" && data && !view.catId) {
      const first = (data.categories || [])[0];
      if (first) setView({ mode: "category", catId: first.id });
    }
  }, [data, view]);

  // Auto-expire leave / outstation and surface a "back on duty" notice.
  useEffect(() => {
    if (!data) return;
    const today = todayStr();
    const expired = [];
    const expiredNumbers = [];
    Object.keys(data.staff).forEach((num) => {
      const rec = data.staff[num];
      if (rec.unavailable && rec.unavailable.to && rec.unavailable.to < today) {
        const key = num + rec.unavailable.from + rec.unavailable.to;
        if (!notifiedRef.current.has(key)) {
          notifiedRef.current.add(key);
          expired.push({ name: rec.name, type: unavailKind(rec.unavailable) });
        }
        expiredNumbers.push(num);
      }
    });
    if (expired.length) {
      setReturnNotices((prev) => [...prev, ...expired]);
      // Routed through writeToFirestore (not a raw docRef.set) so this
      // automatic background correction gets the same dataRef-sync and
      // safe-retry protection as every other write — deliberately NOT
      // through persist(), since this isn't a user action and shouldn't
      // land on the Undo stack (someone hitting Undo expecting to revert
      // their own last click shouldn't instead undo an automatic
      // leave-expiry correction).
      //
      // Built fresh from dataRef.current.staff (not a copy of data.staff
      // taken when this effect started) and only touching the specific
      // people whose leave just expired — anyone else's record, including
      // any change a concurrent duty assignment just made to it, passes
      // through completely untouched instead of being silently reverted
      // to how it looked when this effect began.
      const freshStaff = (dataRef.current && dataRef.current.staff) || data.staff;
      const nextStaff = { ...freshStaff };
      expiredNumbers.forEach((num) => {
        if (nextStaff[num]) nextStaff[num] = { ...nextStaff[num], unavailable: null };
      });
      writeToFirestore({ ...(dataRef.current || data), staff: nextStaff });
    }
  }, [data]);

  // Every mutation function in this file reads `data` from its own
  // render's closure, then spreads it as the base of what gets written to
  // Firestore. If two writes happen close together on the same screen —
  // e.g. adding a new leave type, then immediately marking two people on
  // leave with it — a later write's closure can still be holding a `data`
  // snapshot from BEFORE the earlier write's state update had committed.
  // Since every write is a full-document overwrite, not a merge, that
  // stale snapshot silently discards whatever the earlier write(s) just
  // added. dataRef is the fix: kept synchronously current (updated the
  // instant persist() runs, not waiting for React's next render), every
  // persist(...) call spreads dataRef.current instead of the closure
  // `data` — so even several rapid writes in a row always build on top of
  // whatever the most recent one actually wrote, never an outdated
  // snapshot from before this render cycle even started.
  const dataRef = useRef(data);
  // Tracks the LAST revision this tab has actually confirmed the server
  // holds — updated whenever a genuine load arrives (see the onSnapshot
  // handler below) or one of this tab's own writes succeeds. Kept
  // deliberately separate from dataRef.current._rev (the OPTIMISTIC
  // local value, bumped immediately so several rapid edits in this same
  // tab can keep building on each other before any of them has actually
  // round-tripped to the server yet) — writeToFirestore's transaction
  // checks THIS ref against the server's real current revision, which is
  // the actual fix for the bug this whole mechanism exists to close: two
  // tabs (or devices) both starting from the same base document, one
  // going stale (backgrounded, laptop asleep, simply idle for a while)
  // while the other keeps saving real changes, and the stale one
  // eventually performing its own full-document write on top of data
  // that's since moved on — silently erasing everything the other tab
  // saved in between. That failure mode is now impossible: a write whose
  // expected revision no longer matches the server's actual one is
  // rejected outright before anything is overwritten, and this tab is
  // refreshed with the real current data instead.
  const confirmedRevRef = useRef(data ? (data._rev || 0) : 0);
  // Updated directly here in the render body — NOT inside a useEffect.
  // This one line is the actual fix for "Cannot read properties of null
  // (reading 'staff')": React guarantees the render body finishes
  // completely before ANY effect fires for that render, but effects
  // among themselves only run in the order they're declared in the
  // component. dataRef used to only get updated inside its own
  // useEffect below — declared AFTER some other effects (like the
  // auto-expire one) that also read dataRef.current. On the very first
  // render where `data` goes from null to real data (right after
  // signing in), those earlier-declared effects could fire before this
  // one had a chance to run, meaning they'd read dataRef.current still
  // holding its stale initial null — despite `data` itself already
  // being the real object. Assigning it plainly during render instead
  // means it's correct before any effect anywhere in this component can
  // possibly run, regardless of declaration order.
  dataRef.current = data;

  // "idle" (nothing pending — either nothing's been changed yet, or the
  // last change is confirmed saved), "saving" (a write is in flight),
  // "error" (every retry failed so far, still retrying automatically in
  // the background). Drives both the small persistent status pill in the
  // toolbar (a 2-second toast alone isn't enough for something this
  // important — this stays up for as long as anything is actually
  // unresolved) and the tab-close warning below.
  const [saveStatus, setSaveStatus] = useState("idle");
  const pendingWritesRef = useRef(0);
  const retryTimerRef = useRef(null);

  // Shared by persist() below, undo/redo, and the auto-expire effect
  // further down — every single write this app makes, not just the
  // everyday "make a change" one, funnels through this exact same path.
  // That matters because dataRef syncing and the retry-with-fresh-state
  // logic (see the big comment inside) only protect a write if it
  // actually goes through here — a write made some other way, spreading
  // its own local `data` snapshot directly into docRef.set(), would
  // silently reintroduce the exact "rapid actions overwrite each other"
  // bug this was built to prevent. The auto-expire effect used to do
  // exactly that (a raw docRef.set() using its own closure's `data`,
  // completely bypassing this), which was a second, independent way the
  // same class of bug could happen — fixed by routing it through here.
  // Keeps publicRosters/{uid} — the document Security Rules actually grant
  // public read access to — in sync with the real account. Fire-and-forget
  // relative to the private save above: a transient failure here doesn't
  // block or retry-loop the primary save, and the very next edit (or
  // toggling Share off and back on) naturally retries it. One deliberate
  // retry after a short delay covers the more common transient case
  // without adding real complexity. Deleting the doc when sharing is off
  // — rather than merely not writing to it — is what makes turning Share
  // off actually revoke access immediately, instead of leaving stale
  // (but still real) data sitting in a document Rules still allow anyone
  // to read.
  const syncPublicRoster = (next) => {
    if (!publicRosterDocRef) return;
    const trySync = (isRetry) => {
      const op = next.shareEnabled
        ? publicRosterDocRef.set(deepStripUndefined(derivePublicData(next)))
        : publicRosterDocRef.delete();
      op.catch((e) => {
        console.error("Public roster sync failed:", e);
        if (!isRetry) setTimeout(() => trySync(true), 4000);
      });
    };
    trySync(false);
  };

  const writeToFirestore = (next) => {
    // Stamped with the actual moment this change was made on THIS
    // device, not whenever it eventually reaches the server — used so
    // the local auto-backup (and its recovery confirmation) can
    // correctly say "as of your last real edit" instead of "as of the
    // last time this device happened to sync", which could be a much
    // more recent, misleading timestamp if nothing had actually changed
    // since a genuine edit made a while ago.
    const stamped = { ...next, lastModifiedAt: Date.now() };
    dataRef.current = stamped;
    setData(stamped);
    syncPublicRoster(stamped);
    if (!docRef) return;

    pendingWritesRef.current += 1;
    setSaveStatus("saving");

    // Retries automatically on a genuine transient failure (network drop,
    // brief outage) — 2s, then 6s, then every 15s until it finally goes
    // through. A REJECTED write (the transaction below) is a different,
    // terminal outcome, not a transient one — see its own catch branch.
    //
    // Critical detail, unchanged from before: every attempt (including
    // retries) re-reads dataRef.current fresh at the moment it actually
    // fires, rather than reusing the snapshot from when this write was
    // first requested — so several rapid edits in this same tab always
    // build on each other correctly.
    //
    // What's NEW is the transaction itself. Every write now atomically
    // verifies, against the server's actual current document, that
    // nothing has changed since this tab last confirmed its own copy
    // (confirmedRevRef, updated on every genuine load and every one of
    // this tab's own successful writes — see its declaration above for
    // the full reasoning). If something HAS changed — another tab, or
    // another device, saved first — this write is rejected outright
    // before it can touch the document, this tab is refreshed with
    // whatever the other write actually saved, and the person is told
    // plainly that their last action needs to be tried again. That
    // rejection is the actual fix for the failure this whole mechanism
    // exists to close: a tab that went stale (backgrounded, laptop
    // asleep, just idle) silently overwriting real changes another tab
    // made in the meantime with its own out-of-date full snapshot.
    const attempt = (delayMs) => {
      const expectedRev = confirmedRevRef.current;
      const clean = deepStripUndefined({ ...dataRef.current, _rev: expectedRev + 1 });
      db.runTransaction(async (tx) => {
        const freshSnap = await tx.get(docRef);
        const freshData = freshSnap.exists ? freshSnap.data() : null;
        const serverRev = freshData ? (freshData._rev || 0) : 0;
        if (freshData && serverRev !== expectedRev) {
          const conflictErr = new Error("Write rejected: another tab or device saved a change first");
          conflictErr.__conflict = true;
          conflictErr.freshData = freshData;
          throw conflictErr;
        }
        tx.set(docRef, clean);
      })
        .then(() => {
          confirmedRevRef.current = expectedRev + 1;
          pendingWritesRef.current = Math.max(0, pendingWritesRef.current - 1);
          if (pendingWritesRef.current === 0) setSaveStatus("idle");
        })
        .catch((e) => {
          if (e && e.__conflict) {
            console.error("Write conflict — another tab/device saved first, this stale write was discarded instead of overwriting it:", e);
            const normalized = normalizeData(e.freshData);
            dataRef.current = normalized;
            setData(normalized);
            confirmedRevRef.current = normalized._rev || 0;
            pendingWritesRef.current = Math.max(0, pendingWritesRef.current - 1);
            if (pendingWritesRef.current === 0) setSaveStatus("idle");
            showToast(t(
              "Someone else saved a change here at the same moment — your last action wasn't applied, and the screen now shows their update instead. Please try again.",
              "કોઈ બીજાએ તે જ ક્ષણે અહીં ફેરફાર સાચવ્યો — તમારી છેલ્લી ક્રિયા લાગુ થઈ નથી, અને સ્ક્રીન હવે તેમનું અપડેટ બતાવે છે. કૃપા કરી ફરી પ્રયાસ કરો."
            ), "error");
            return;
          }
          console.error("Save failed, will retry:", e);
          setSaveStatus("error");
          retryTimerRef.current = setTimeout(() => attempt(15000), delayMs);
        });
    };
    attempt(2000);
  };

  // Every mutation in the app funnels through here, so this is the single
  // choke point where we snapshot the previous state for Undo. Undo/redo
  // history is kept locally in this browser tab only (not synced via
  // Firestore) — each device's misclick recovery is its own.
  const persist = (next) => {
    setUndoStack((prev) => {
      const stack = [...prev, dataRef.current];
      return stack.length > MAX_HISTORY_STATES ? stack.slice(stack.length - MAX_HISTORY_STATES) : stack;
    });
    setRedoStack([]);
    writeToFirestore(next);
  };

  // A native "are you sure?" browser prompt — the one guarantee that
  // actually works even if someone closes the tab without reading any
  // in-app banner. Only fires while a save is genuinely unresolved
  // (mid-retry after a failure, or a write still in flight), so it never
  // nags on a normal close.
  useEffect(() => {
    const handler = (e) => {
      if (saveStatus !== "error" && pendingWritesRef.current === 0) return;
      e.preventDefault();
      e.returnValue = "";
    };
    window.addEventListener("beforeunload", handler);
    return () => window.removeEventListener("beforeunload", handler);
  }, [saveStatus]);

  useEffect(() => () => { if (retryTimerRef.current) clearTimeout(retryTimerRef.current); }, []);

  // Every non-error toast doubles as the "what just happened" description
  // for Undo/Redo — captured here so those two actions can say exactly what
  // they're reverting instead of a generic "last change reverted". Error
  // toasts stay up longer (6s vs 2.2s) — a normal confirmation is fine to
  // glance past, but an error (e.g. why the automatic EmailJS send just
  // failed) needs enough time to actually be read.
  const showToast = (msg, type) => {
    if (type !== "error") lastActionRef.current = msg;
    setToast({ msg, type: type || "info" });
    setTimeout(() => setToast(null), type === "error" ? 6000 : 2200);
  };
  const showToastRaw = (msg, type) => { setToast({ msg, type: type || "info" }); setTimeout(() => setToast(null), type === "error" ? 6000 : 2200); };

  // Manual "Sync now": the app already syncs live and continuously via
  // the onSnapshot listener above — there's no separate "pull" step this
  // button is secretly missing. What it actually does, and the reason it
  // exists at all, is force a genuine round-trip to Firestore's SERVER
  // (source: "server" explicitly bypasses the local cache, unlike a
  // plain .get() which can silently answer from cache while offline) and
  // report plainly whether that succeeded — the same kind of explicit
  // confirmation the "couldn't connect" screen already gives when a
  // connection is lost, just available on demand instead of only when
  // something's already visibly wrong. Genuinely useful after exactly
  // the kind of situation that prompted this: unsure whether a change
  // from a few minutes ago actually made it to the server, or account
  // for flaky wifi where the browser still thinks it's "online" while
  // Firestore itself can't actually be reached.
  const [syncing, setSyncing] = useState(false);
  const syncNow = () => {
    if (!user || syncing) return;
    setSyncing(true);
    // A flaky connection (WiFi connected, but packets aren't actually
    // reaching the server) can leave Firestore's own .get() pending
    // indefinitely — there's no built-in ceiling on how long it'll keep
    // retrying underneath. Racing it against a plain 10s timer is what
    // actually guarantees this button always resolves one way or the
    // other, instead of "sometimes seconds, sometimes forever" depending
    // on how bad the connection happens to be. If the real request
    // eventually finishes after the timeout's already fired, it's simply
    // ignored — nothing here waits on it any further.
    const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error(t("Timed out after 10s", "10 સેકન્ડ પછી સમય સમાપ્ત"))), 10000));
    Promise.race([accountDocRef(user.uid).get({ source: "server" }), timeout])
      .then(() => showToast(t("Synced ✓", "સિંક થયું ✓")))
      .catch((err) => {
        console.error("Manual sync failed:", err);
        showToast(t(`Sync failed — ${err.message || "check your connection"}`, `સિંક નિષ્ફળ — ${err.message || "તમારું જોડાણ તપાસો"}`), "error");
      })
      .finally(() => setSyncing(false));
  };

  // ---------- Public view-only sharing ----------
  // A single toggle per account: when on, anyone with the link (containing
  // this account's uid) can open a read-only, unauthenticated view of the
  // roster — no sign-in, no edit access. Turning this off immediately
  // revokes the link, no token to manage: syncPublicRoster (called from
  // every persist/writeToFirestore) deletes the public-safe
  // publicRosters/{uid} document the moment shareEnabled goes false, and
  // that document — not the real accounts/{uid} — is genuinely all a
  // public reader's Firestore access can ever reach; see
  // derivePublicData for exactly what it contains.
  const [showSharePanel, setShowSharePanel] = useState(false);
  // ---------- About / credits ----------
  const [showAboutPanel, setShowAboutPanel] = useState(false);
  const [showHelpPanel, setShowHelpPanel] = useState(false);
  const [showSettingsPanel, setShowSettingsPanel] = useState(false);
  // ---------- Format all data (guarded multi-step confirmation) ----------
  const [showFormatModal, setShowFormatModal] = useState(false);
  const shareUrl = user ? `${window.location.origin}${window.location.pathname}?view=${user.uid}` : "";
  const toggleShare = () => {
    if (!data) return;
    persist({ ...dataRef.current, shareEnabled: !data.shareEnabled });
  };

  // ---------- Google Drive daily auto-backup ----------
  // Uses Google Identity Services for OAuth with the narrow "drive.file"
  // scope, so this app can only see/write files it created itself — never
  // browse the rest of the Drive. The access token itself is still kept in
  // memory only (never written to localStorage/IndexedDB) — what's
  // remembered across visits is just "connected: yes/no" and the timestamp
  // of the last successful backup.
  const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";
  const DRIVE_FOLDER_NAME = "Nokri Book Backups";
  const driveConfigured = !!(window.GOOGLE_DRIVE_CLIENT_ID && window.GOOGLE_DRIVE_CLIENT_ID.indexOf("YOUR_") !== 0);

  // ---------- EmailJS (fully automatic email on "Format all data") ----------
  // True, zero-click sending straight from the browser — no backend of this
  // app's own needed. Only active once all three placeholders in the
  // <head> config block are filled in with a real EmailJS account's
  // values; until then this silently stays off and performFormatAllData
  // below falls back to opening a pre-filled mailto draft instead.
  const emailjsConfigured = !!(
    window.EMAILJS_PUBLIC_KEY && window.EMAILJS_PUBLIC_KEY.indexOf("YOUR_") !== 0 &&
    window.EMAILJS_SERVICE_ID && window.EMAILJS_SERVICE_ID.indexOf("YOUR_") !== 0 &&
    window.EMAILJS_TEMPLATE_ID && window.EMAILJS_TEMPLATE_ID.indexOf("YOUR_") !== 0 &&
    typeof emailjs !== "undefined"
  );
  useEffect(() => {
    // v4 of the EmailJS browser SDK (the CDN build loaded in <head>) takes
    // an options OBJECT here — { publicKey: ... } — not a bare string like
    // the older v3 SDK did. Passing a bare string silently leaves the key
    // unset, so every send() call afterward fails authentication and
    // performFormatAllData's catch handler falls back to the mailto draft
    // — which is exactly the "it still opens mail to send manually" bug.
    if (emailjsConfigured) { try { emailjs.init({ publicKey: window.EMAILJS_PUBLIC_KEY }); } catch (e) { console.warn("EmailJS init failed", e); } }
  }, [emailjsConfigured]);
  const [driveConnected, setDriveConnected] = useState(() => localStorage.getItem("nb_drive_connected") === "1");
  // Whether Drive backup is turned on for THIS ACCOUNT — synced via
  // Firestore (data.driveEnabled), not localStorage, so it's the same on
  // every device signed into this account. driveConnected above stays
  // local on purpose: it tracks whether *this specific browser* currently
  // holds a usable token, which can never be shared between devices (each
  // browser has to individually grant Google access at least once — no
  // way around that without a backend server this app doesn't have). The
  // distinction matters for the panel below: "on for this account, but
  // this device needs its own one-time connect" reads very differently
  // from "not connected at all", and conflating the two was exactly what
  // made a second device look like Drive had never been set up.
  const driveEnabledForAccount = !!(data && data.driveEnabled);
  const [driveLastBackup, setDriveLastBackup] = useState(() => localStorage.getItem("nb_drive_last_backup") || "");
  const [driveBusy, setDriveBusy] = useState(false);
  const [driveNeedsReconnect, setDriveNeedsReconnect] = useState(false);
  const [showDrivePanel, setShowDrivePanel] = useState(false);
  // Compact toolbar dropdowns: Undo/Redo grouped under one button, and
  // Backup/Restore/Drive under another — position is captured fresh on
  // each open (like the Manage leave/outstation menu elsewhere in the
  // app) and the menu closes on any scroll, so it can never end up
  // visually detached from the button that opened it.
  const [undoRedoMenuPos, setUndoRedoMenuPos] = useState(null);
  const [dataMenuPos, setDataMenuPos] = useState(null);
  const [backupMenuPos, setBackupMenuPos] = useState(null);
  useEffect(() => {
    if (!undoRedoMenuPos && !dataMenuPos) return;
    const closeOnScroll = () => { setUndoRedoMenuPos(null); setDataMenuPos(null); setBackupMenuPos(null); };
    window.addEventListener("scroll", closeOnScroll, true);
    return () => window.removeEventListener("scroll", closeOnScroll, true);
  }, [undoRedoMenuPos, dataMenuPos]);
  const driveTokenClientRef = useRef(null);
  const driveFolderIdRef = useRef(localStorage.getItem("nb_drive_folder_id") || null);
  const driveAutoTriedRef = useRef(false);
  // In-memory-only cache of the last granted access token plus its expiry.
  // Reusing it (instead of asking Google for a fresh one on every single
  // backup) cuts way down on how often a silent renewal has to succeed at
  // all — each renewal is a chance for the browser to block it (third-party
  // cookie restrictions, a stale Google session, etc.), which is what was
  // showing up as "Drive keeps disconnecting itself". A 5-minute safety
  // margin is subtracted so a near-expiry token is never handed out.
  //
  // Also mirrored to sessionStorage (not localStorage — an OAuth access
  // token shouldn't outlive the tab) so a page refresh doesn't lose it:
  // driveTokenCacheRef alone is a plain in-memory ref, reset to empty on
  // every reload, which meant "Back up now" needed the full interactive
  // Google sign-in popup again after every single refresh even though
  // nothing had actually changed about the connection. Restoring from
  // sessionStorage on mount (below) fixes that — refreshing the tab keeps
  // working exactly like it did before the refresh, while closing the
  // tab (sessionStorage clears automatically) still correctly requires
  // reconnecting, same security boundary as before.
  const driveTokenCacheRef = useRef((() => {
    try {
      const raw = sessionStorage.getItem("nb_drive_token_cache");
      if (!raw) return { token: null, expiresAt: 0 };
      const parsed = JSON.parse(raw);
      if (parsed && parsed.token && Date.now() < parsed.expiresAt) return parsed;
    } catch (e) { /* corrupted or unavailable — just start fresh below */ }
    return { token: null, expiresAt: 0 };
  })());
  // Which Drive file id backs *today's* backup, and for which date — set
  // right after any successful backup so the on-close silent backup (below)
  // can update that exact file instantly, with no lookup round-trip, right
  // as the app is closing.
  const driveTodayFileRef = useRef({ date: "", fileId: null });

  const getDriveTokenClient = () => {
    if (!driveConfigured || typeof google === "undefined" || !google.accounts || !google.accounts.oauth2) return null;
    if (!driveTokenClientRef.current) {
      driveTokenClientRef.current = google.accounts.oauth2.initTokenClient({
        client_id: window.GOOGLE_DRIVE_CLIENT_ID,
        scope: DRIVE_SCOPE,
        callback: () => {}, // replaced per-request below
      });
    }
    return driveTokenClientRef.current;
  };

  const getCachedDriveToken = () => {
    const { token, expiresAt } = driveTokenCacheRef.current;
    return token && Date.now() < expiresAt ? token : null;
  };

  // interactive=true pops the Google consent screen (needed the first time,
  // or if a silent renewal fails); interactive=false tries a silent renewal
  // using the existing Google session and quietly gives up if that's not
  // possible (e.g. third-party cookies blocked, or consent was revoked).
  // A cached, still-valid token (see above) is reused first and skips
  // asking Google at all.
  const requestDriveToken = (interactive) => new Promise((resolve, reject) => {
    const cached = getCachedDriveToken();
    if (cached) { resolve(cached); return; }
    // For a non-interactive (automatic) request specifically: if there's no
    // cached token, stop here rather than calling into Google's token
    // client at all. Even with prompt:"" (meant to be silent), Google
    // Identity Services can still pop open a real, visible "choose an
    // account" window to complete the request instead of staying truly
    // invisible — especially with third-party cookie restrictions, and
    // especially for anyone who's never personally connected Drive on
    // this device. That's exactly what was happening: someone opens the
    // shared app link and immediately gets redirected into a Google
    // account chooser they never asked for. Skipping the call entirely
    // when there's nothing cached to reuse means the daily/overnight
    // auto-backup can only ever complete silently for real — never by
    // popping a window open on someone's screen unprompted. It just marks
    // "needs reconnect" instead, same as any other silent-renewal failure,
    // and the person can reconnect deliberately via the Drive panel
    // whenever they want to.
    if (!interactive) { reject(new Error("No cached Drive token — skipping silent renewal to avoid an unexpected sign-in popup")); return; }
    const client = getDriveTokenClient();
    if (!client) { reject(new Error("Google Drive isn't set up for this app yet")); return; }
    // Reconnecting after the app was closed (or the tab's session token
    // expired) doesn't mean access was actually revoked — Google still
    // remembers this app was granted drive.file permission, it's only the
    // short-lived access token that's gone. So even on a user-initiated
    // (interactive) reconnect, try a silent, no-dialog renewal first: if
    // the browser still has an active Google session, this reuses the
    // existing grant and returns a token with no popup at all — that's
    // what makes reconnecting feel instant instead of repeating full
    // account-chooser + permission-review screens every reopen. Only if
    // that silent attempt actually fails (session logged out, consent was
    // revoked, third-party cookies blocked, etc.) do we fall back to the
    // real consent prompt, since at that point Google does need the user.
    let triedSilent = false;
    client.callback = (resp) => {
      if (resp && resp.access_token) {
        // expires_in is in seconds; keep a 5-minute safety margin.
        const ttlMs = Math.max(0, ((resp.expires_in || 3300) - 300)) * 1000;
        const cacheEntry = { token: resp.access_token, expiresAt: Date.now() + ttlMs };
        driveTokenCacheRef.current = cacheEntry;
        try { sessionStorage.setItem("nb_drive_token_cache", JSON.stringify(cacheEntry)); } catch (e) { /* private browsing / storage full — the in-memory cache still works for this tab's current lifetime */ }
        resolve(resp.access_token);
      } else if (!triedSilent) {
        triedSilent = true;
        try { client.requestAccessToken({ prompt: "consent" }); }
        catch (e) { reject(e); }
      } else reject(new Error("No access token returned"));
    };
    client.error_callback = (err) => {
      if (!triedSilent) {
        triedSilent = true;
        try { client.requestAccessToken({ prompt: "consent" }); }
        catch (e) { reject(e); }
      } else reject(err || new Error("Google sign-in failed"));
    };
    try { client.requestAccessToken({ prompt: "" }); }
    catch (e) { reject(e); }
  });

  const findOrCreateDriveFolder = async (token) => {
    if (driveFolderIdRef.current) return driveFolderIdRef.current;
    const q = encodeURIComponent(`name='${DRIVE_FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
    const listRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`, {
      headers: { Authorization: `Bearer ${token}` },
    });
    const listData = await listRes.json();
    if (!listRes.ok) throw new Error(listData?.error?.message || `Drive API error (${listRes.status}) while looking up the backup folder`);
    if (listData.files && listData.files.length > 0) {
      driveFolderIdRef.current = listData.files[0].id;
    } else {
      const createRes = await fetch("https://www.googleapis.com/drive/v3/files", {
        method: "POST",
        headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({ name: DRIVE_FOLDER_NAME, mimeType: "application/vnd.google-apps.folder" }),
      });
      if (!createRes.ok) {
        const errBody = await createRes.json().catch(() => null);
        throw new Error(errBody?.error?.message || `Couldn't create the Drive backup folder (${createRes.status})`);
      }
      const created = await createRes.json();
      driveFolderIdRef.current = created.id;
    }
    localStorage.setItem("nb_drive_folder_id", driveFolderIdRef.current);
    return driveFolderIdRef.current;
  };

  // One file per calendar day: if today's backup already exists (e.g. the
  // app was opened twice today) it's updated in place rather than
  // duplicated, so the folder gains at most one new file per day. Returns
  // the file id so the caller can cache it for instant reuse later (see
  // driveTodayFileRef above).
  const uploadBackupToDrive = async (token, folderId, jsonStr, { keepalive } = {}) => {
    const fileName = `nokri-book-backup-${todayStr()}.json`;
    let existingId = driveTodayFileRef.current.date === todayStr() ? driveTodayFileRef.current.fileId : null;
    if (!existingId) {
      const q = encodeURIComponent(`name='${fileName}' and '${folderId}' in parents and trashed=false`);
      const listRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id)`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      const listData = await listRes.json();
      if (!listRes.ok) throw new Error(listData?.error?.message || `Drive API error (${listRes.status}) while checking for today's backup file`);
      existingId = listData.files && listData.files[0] && listData.files[0].id;
    }
    const boundary = "nbbackup" + uid();
    const metadata = existingId ? { name: fileName } : { name: fileName, parents: [folderId] };
    const body =
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
      `--${boundary}\r\nContent-Type: application/json\r\n\r\n${jsonStr}\r\n--${boundary}--`;
    const url = existingId
      ? `https://www.googleapis.com/upload/drive/v3/files/${existingId}?uploadType=multipart`
      : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;

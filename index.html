// Ctrl/Cmd+K (or the button, or "/" when no search box is on screen)
// opens this — a single box that jumps straight to any tab/work type by
// name, or (once something's typed) finds a specific staff member or skip
// log entry and drops you into that tab with the search box already
// filled in, instead of clicking through the sidebar to find them.
function CommandPalette({ data, onNavigate, onClose }) {
  const { t } = useLang();
  useEscToClose(onClose);
  const [q, setQ] = useState("");
  const inputRef = useRef(null);
  useEffect(() => { inputRef.current && inputRef.current.focus(); }, []);

  const results = useMemo(() => {
    const query = q.trim().toLowerCase();
    const items = [];
    const jumpTargets = [
      { icon: "📝", label: t("Assign duty", "ડ્યુટી સોંપો"), view: { mode: "assignDuty" } },
      { icon: "🏠", label: t("Today's duty", "આજની ડ્યુટી"), view: { mode: "home" } },
      { icon: "👥", label: t("Group duty", "જૂથ ડ્યુટી"), view: { mode: "assignDuty" } },
      { icon: "🚨", label: t("Manage staff", "સ્ટાફ સંચાલિત કરો"), view: { mode: "staff" } },
      { icon: "📋", label: t("Skip history", "સ્કિપ ઇતિહાસ"), view: { mode: "skipHistory" } },
      { icon: "🔔", label: t("Events & reminders", "ઇવેન્ટ્સ અને રિમાઇન્ડર"), view: { mode: "events" } },
      { icon: "📅", label: t("Duty calendar", "ડ્યુટી કૅલેન્ડર"), view: { mode: "calendar" } },
      { icon: "📄", label: t("Monthly report", "માસિક અહેવાલ"), view: { mode: "report" } },
      { icon: "🗑️", label: t("Recycle bin", "રિસાયકલ બિન"), view: { mode: "recycle" } },
    ];
    (data.categories || []).forEach((c) => jumpTargets.push({ icon: "📁", label: c.label, view: { mode: "category", catId: c.id } }));
    jumpTargets.forEach((jt) => { if (!query || jt.label.toLowerCase().includes(query)) items.push({ kind: "nav", ...jt }); });

    if (query) {
      Object.values(data.staff || {}).forEach((s) => {
        if ((s.name || "").toLowerCase().includes(query) || String(s.number || "").toLowerCase().includes(query)) {
          items.push({ kind: "staff", icon: "🧑", label: `${s.name} · #${s.number}`, view: { mode: "staff", presetSearch: s.number } });
        }
      });
      (data.skipLog || []).forEach((e) => {
        if ((e.name || "").toLowerCase().includes(query) || String(e.number || "").toLowerCase().includes(query) || (e.note || "").toLowerCase().includes(query)) {
          items.push({ kind: "skip", icon: "🚫", label: `${e.name} · ${formatDMY(e.date)}${e.note ? " · " + e.note : ""}`, view: { mode: "skipHistory", presetSearch: e.number || e.name } });
        }
      });
    }
    return items.slice(0, 30);
  }, [q, data, t]);

  return (
    <div
      className="command-palette-overlay"
      style={{ position: "fixed", inset: 0, background: "#00000066", display: "flex", alignItems: "flex-start", justifyContent: "center", paddingTop: "10vh", zIndex: 50 }}
      onClick={onClose}
    >
      <div
        role="dialog" aria-modal="true" aria-label={t("Command palette", "કમાન્ડ પેલેટ")}
        style={{ background: "var(--bg-surface)", borderRadius: 12, width: 520, maxWidth: "calc(100vw - 40px)", maxHeight: "70vh", display: "flex", flexDirection: "column", overflow: "hidden", boxShadow: "0 20px 60px rgba(0,0,0,0.3)" }}
        onClick={(e) => e.stopPropagation()}
      >
        <input
          ref={inputRef} type="text" value={q} onChange={(e) => setQ(e.target.value)}
          aria-label={t("Jump to a tab, or search staff / skip log…", "ટેબ પર જાઓ, અથવા સ્ટાફ / સ્કિપ લોગ શોધો…")}
          placeholder={t("Jump to a tab, or search staff / skip log…", "ટેબ પર જાઓ, અથવા સ્ટાફ / સ્કિપ લોગ શોધો…")}
          className="gu"
          style={{ border: "none", borderBottom: "1px solid var(--border-soft)", borderRadius: 0, padding: "14px 16px", fontSize: 14, outline: "none" }}
        />
        <div style={{ overflowY: "auto", padding: "6px 0" }}>
          {results.length === 0 && (
            <div style={{ padding: "20px 16px", fontSize: 13, color: "var(--text-tertiary)", textAlign: "center" }} className="gu">{t("No matches.", "કોઈ મેળ મળ્યો નથી.")}</div>
          )}
          {results.map((r, i) => (
            <button
              key={i}
              onClick={() => { onNavigate(r.view); onClose(); }}
              className="gu"
              style={{ display: "flex", alignItems: "center", gap: 10, width: "100%", boxSizing: "border-box", padding: "9px 16px", background: "transparent", border: "none", textAlign: "left", fontSize: 13.5, color: "var(--text-primary)" }}
            >
              {r.icon && <span>{r.icon}</span>}<span style={{ minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.label}</span>
            </button>
          ))}
        </div>
        <div style={{ borderTop: "1px solid var(--border-soft)", padding: "8px 16px", fontSize: 11, color: "var(--text-tertiary)" }} className="gu">{t("Esc to close", "બંધ કરવા Esc")}</div>
      </div>
    </div>
  );
}

function DriveBackupPanel({ configured, connected, enabledForAccount, busy, needsReconnect, lastBackup, onConnect, onBackupNow, onDisconnect, onClose }) {
  const { t } = useLang();
  useEscToClose(onClose);
  const lastBackupText = lastBackup
    ? new Date(lastBackup).toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })
    : t("never", "ક્યારેય નહીં");
  // Three real states, not two — this device already connected and
  // working; Drive turned on for the account but THIS device hasn't
  // individually connected yet (e.g. backup was set up on a different
  // phone/computer); or never turned on anywhere at all. The middle one
  // used to look identical to "never set up" — which read as Drive
  // having silently disconnected itself, when really it just needed one
  // quick sign-in on this particular device (an unavoidable one-time
  // step per device/browser — this app has no backend server to keep a
  // permanent connection alive on its own, so each browser has to prove
  // access at least once for itself).
  const thisDeviceNeedsConnecting = enabledForAccount && !connected;
  return (
    <div role="dialog" aria-label={t("Google Drive backup", "ગૂગલ ડ્રાઇવ બેકઅપ")} style={{
      position: "fixed", top: 18, right: 18, width: 320, maxWidth: "calc(100vw - 36px)",
      background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 12,
      boxShadow: "0 12px 30px rgba(0,0,0,0.18)", zIndex: 1000,
    }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 16px", borderBottom: "1px solid var(--border-soft)" }}>
        <div className="disp gu" style={{ fontSize: 14, fontWeight: 700 }}>{t("Google Drive backup", "ગૂગલ ડ્રાઇવ બેકઅપ")}</div>
        <button onClick={onClose} title={t("Close", "બંધ કરો")} aria-label={t("Close", "બંધ કરો")} style={{ background: "transparent", border: "none", color: "var(--text-tertiary)", fontSize: 15 }}>✕</button>
      </div>

      <div style={{ padding: "14px 16px" }}>
        {!configured ? (
          <div style={{ fontSize: 12.5, color: "var(--text-secondary)", lineHeight: 1.5 }} className="gu">
            {t("Not set up yet. A Google OAuth Client ID needs to be pasted into the top of this file (see the setup guide) before daily auto-backup can be turned on.", "હજુ સેટ થયું નથી. દૈનિક ઓટો-બેકઅપ ચાલુ કરતાં પહેલાં ગૂગલ OAuth ક્લાયન્ટ ID આ ફાઇલની ટોચે પેસ્ટ કરવું જરૂરી છે (સેટઅપ ગાઇડ જુઓ).")}
          </div>
        ) : (
          <React.Fragment>
            {thisDeviceNeedsConnecting ? (
              <div style={{ fontSize: 12.5, color: "var(--status-info-text)", lineHeight: 1.5, marginBottom: 10, background: "var(--status-info-bg)", border: "1px solid var(--status-info-border)", borderRadius: 8, padding: "8px 10px" }} className="gu">
                {t("Drive backup is already on for this account (set up on another device) — this device just needs its own one-time Google sign-in to start backing up from here too.", "આ ખાતા માટે ડ્રાઇવ બેકઅપ પહેલેથી ચાલુ છે (બીજા ડિવાઇસ પર સેટ કરેલું) — અહીંથી પણ બેકઅપ શરૂ કરવા આ ડિવાઇસને ફક્ત તેનું પોતાનું એક-વખતનું ગૂગલ સાઇન-ઇન જરૂરી છે.")}
              </div>
            ) : (
              <div style={{ fontSize: 12.5, color: "var(--text-secondary)", lineHeight: 1.5, marginBottom: 10 }} className="gu">
                {connected
                  ? t("Every day, the first time this app is opened, a full backup is quietly saved to a \"Nokri Book Backups\" folder in Google Drive.", "દરરોજ, આ એપ પહેલીવાર ખોલવામાં આવે ત્યારે, ગૂગલ ડ્રાઇવમાં \"Nokri Book Backups\" ફોલ્ડરમાં સંપૂર્ણ બેકઅપ આપમેળે સાચવવામાં આવે છે.")
                  : t("Connect a Google account to automatically save a daily backup to Drive — no need to remember to click Backup.", "ડ્રાઇવમાં દૈનિક બેકઅપ આપમેળે સાચવવા માટે ગૂગલ ખાતું જોડો — બેકઅપ પર ક્લિક કરવાનું યાદ રાખવાની જરૂર નથી.")}
              </div>
            )}
            {connected && (
              <div style={{ fontSize: 12, color: needsReconnect ? "var(--status-error-text)" : "var(--text-primary)", marginBottom: 12 }} className="gu">
                {needsReconnect
                  ? t("Couldn't reach Google silently — reconnect below to resume daily backups.", "ગૂગલનો ચૂપચાપ સંપર્ક થઈ શક્યો નથી — દૈનિક બેકઅપ ફરી શરૂ કરવા નીચે ફરી જોડો.")
                  : `${t("Last backup", "છેલ્લો બેકઅપ")}: ${lastBackupText}`}
              </div>
            )}
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              {!connected || needsReconnect ? (
                <button onClick={onConnect} disabled={busy} style={{ background: "var(--btn-dark-bg)", color: "#fff", border: "none", borderRadius: 6, padding: "7px 14px", fontSize: 12.5, fontWeight: 600 }} className="gu">
                  {busy
                    ? t("Connecting…", "જોડાઈ રહ્યું છે…")
                    : thisDeviceNeedsConnecting
                      ? t("Connect this device", "આ ડિવાઇસ જોડો")
                      : connected ? t("Reconnect", "ફરી જોડો") : t("Connect Google Drive", "ગૂગલ ડ્રાઇવ જોડો")}
                </button>
              ) : (
                <React.Fragment>
                  <button onClick={onBackupNow} disabled={busy} style={{ background: "var(--btn-dark-bg)", color: "#fff", border: "none", borderRadius: 6, padding: "7px 14px", fontSize: 12.5, fontWeight: 600 }} className="gu">
                    {busy ? t("Backing up…", "બેકઅપ થઈ રહ્યું છે…") : t("Back up now", "હમણાં બેકઅપ કરો")}
                  </button>
                  <button onClick={onDisconnect} style={{ background: "var(--bg-surface)", color: "var(--status-error-text)", border: "1px solid var(--status-error-border)", borderRadius: 6, padding: "7px 14px", fontSize: 12.5, fontWeight: 600 }} className="gu">
                    {t("Disconnect", "ડિસ્કનેક્ટ કરો")}
                  </button>
                </React.Fragment>
              )}
            </div>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

// SkipHistoryView — "Skip history" tab, a searchable log spanning every
// category and the global (Manage Staff) flag alike, not scoped to a person
// of any work type. Read-only, newest-first record of every time someone
// was marked Skip: the બકલ નંબર of the person who was skipped, the બકલ
// નંબર of the person who did the skipping and their note (both optional,
// so often blank), and the exact date + time it happened. This is the
// permanent record created by skipPersonWithLog / skipInCategoryWithLog —
// nothing here can be edited, only searched.
function SkipHistoryView({ data, initialSearch }) {
  const { t, lang } = useLang();
  const [query, setQuery] = useState(initialSearch || "");
  const debouncedQuery = useDebouncedValue(query);
  const [viewMode, setViewMode] = useState("list"); // list | calendar
  const [granularity, setGranularity] = useState("day"); // day | week | month
  const [month, setMonth] = useState(todayStr().slice(0, 7));
  const [selectedDate, setSelectedDate] = useState(todayStr());
  const [showInfo, setShowInfo] = useState(false);

  const entries = useMemo(() => {
    const list = [...(data.skipLog || [])].sort((a, b) => b.ts - a.ts);
    const q = debouncedQuery.trim().toLowerCase();
    if (!q) return list;
    return list.filter((e) =>
      (e.name || "").toLowerCase().includes(q) ||
      String(e.number || "").toLowerCase().includes(q) ||
      (e.note || "").toLowerCase().includes(q) ||
      (e.byName || "").toLowerCase().includes(q) ||
      String(e.byNumber || "").toLowerCase().includes(q)
    );
  }, [data.skipLog, debouncedQuery]);

  // date ("YYYY-MM-DD") -> array of skip-log entries on that date, for the
  // calendar's day cells and for filtering to whichever granularity
  // (day / week / month) is currently selected.
  const skipByDate = useMemo(() => {
    const map = {};
    (data.skipLog || []).forEach((e) => {
      if (!e.date) return;
      (map[e.date] = map[e.date] || []).push(e);
    });
    return map;
  }, [data.skipLog]);

  const cells = useMemo(() => monthMatrix(month), [month]);
  const monthLabel = new Date(month + "-01T00:00:00").toLocaleDateString(t("en-IN", "gu-IN"), { month: "long", year: "numeric" });
  const today = todayStr();

  const shiftMonth = (delta) => {
    const [y, m] = month.split("-").map(Number);
    const d = new Date(y, m - 1 + delta, 1);
    setMonth(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`);
  };

  const [weekStart, weekEnd] = useMemo(() => weekBounds(selectedDate), [selectedDate]);

  // The list shown in the side panel, scoped to whichever granularity is
  // active — Day shows just that date, Week shows the Sun-Sat week
  // containing it, Month shows every entry in the currently viewed month.
  const scopedEntries = useMemo(() => {
    const all = [...(data.skipLog || [])].sort((a, b) => b.ts - a.ts);
    if (granularity === "day") return all.filter((e) => e.date === selectedDate);
    if (granularity === "week") return all.filter((e) => e.date >= weekStart && e.date <= weekEnd);
    return all.filter((e) => (e.date || "").slice(0, 7) === month);
  }, [data.skipLog, granularity, selectedDate, weekStart, weekEnd, month]);

  const scopeLabel = granularity === "day"
    ? formatDMY(selectedDate)
    : granularity === "week"
      ? `${formatDMY(weekStart)} – ${formatDMY(weekEnd)}`
      : monthLabel;

  const segBtn = (active) => ({
    background: active ? "var(--btn-dark-bg)" : "var(--bg-surface-2)", color: active ? "#fff" : "var(--text-secondary)",
    border: "1px solid " + (active ? "var(--text-primary)" : "var(--border)"), borderRadius: 6,
    padding: "6px 12px", fontSize: 12, fontWeight: 600,
  });

  return (
    <React.Fragment>
      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 4, flexWrap: "wrap", gap: 8 }}>
        <div style={{ display: "flex", alignItems: "center" }}>
          <h1 className="disp gu" style={{ fontSize: 22, fontWeight: 700, margin: 0 }}>{t("Skip history", "સ્કિપ ઇતિહાસ")}</h1>
          <InfoIconButton active={showInfo} onClick={() => setShowInfo((v) => !v)} label={t("About this screen", "આ સ્ક્રીન વિશે")} />
        </div>
        <div style={{ fontSize: 12, color: "var(--text-secondary)" }} className="gu">{(data.skipLog || []).length} {t("total", "કુલ")}</div>
      </div>
      {showInfo && (
        <p style={{ fontSize: 13, color: "var(--text-secondary)", margin: "0 0 16px" }} className="gu">
          {t("Every time someone is marked Skip, the confirmed", "જ્યારે પણ કોઈને સ્કિપ તરીકે માર્ક કરવામાં આવે છે, ત્યારે સ્કિપ કરનારનો પુષ્ટિ થયેલ")} <span className="gu">બકલ નંબર</span> {t("of the person who performed the skip and a required note are logged here automatically with the date and time — kept separately from each work type's duty history.", "અને જરૂરી નોંધ તારીખ અને સમય સાથે અહીં આપમેળે નોંધાય છે — દરેક કામના પ્રકારના ડ્યુટી ઇતિહાસથી અલગ રાખવામાં આવે છે.")}
        </p>
      )}

      <div style={{ display: "flex", gap: 6, marginBottom: 16 }}>
        <button onClick={() => setViewMode("list")} style={segBtn(viewMode === "list")} className="gu">{t("List", "યાદી")}</button>
        <button onClick={() => setViewMode("calendar")} style={segBtn(viewMode === "calendar")} className="gu">{t("Calendar", "કૅલેન્ડર")}</button>
      </div>

      {viewMode === "list" ? (
        <React.Fragment>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", marginBottom: 16 }}>
            <input
              type="text" value={query} onChange={(e) => setQuery(e.target.value)}
              id="app-search-input"
              placeholder={t("Search by બકલ નંબર, name, or note…", "બકલ નંબર, નામ અથવા નોંધ દ્વારા શોધો…")} className="gu"
              style={{ width: "100%", maxWidth: 340, boxSizing: "border-box" }}
            />
            <button
              onClick={() => downloadCsv(
                "nokri-book-skip-history.csv",
                [["Date", "Time", "Skipped person", "Number", "Work type", "Skipped by", "By number", "Note"], ...entries.map((e) => {
                  const dt = new Date(e.ts || 0);
                  const workType = e.scope === "category" ? (e.catLabel || "") : t("All work types", "બધા કામના પ્રકારો");
                  return [formatDMY(e.date), e.ts ? dt.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }) : "", e.name || "", e.number || "", workType, e.byName || "", e.byNumber || "", e.note || ""];
                })]
              )}
              disabled={entries.length === 0}
              style={{ background: "var(--bg-surface)", color: entries.length ? "var(--text-primary)" : "var(--text-tertiary)", border: "1px solid var(--border)", borderRadius: 6, padding: "7px 12px", fontSize: 12.5, fontWeight: 600, whiteSpace: "nowrap" }} className="gu"
            >⬇ {t("Export CSV", "CSV એક્સપોર્ટ કરો")}</button>
          </div>

          <div style={{ background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 10, overflow: "hidden" }}>
            <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
              <thead>
                <tr style={{ background: "var(--bg-surface-2)", textAlign: "left" }} className="gu">
                  <th style={th}>{t("Date", "તારીખ")}</th><th style={th}>{t("Time", "સમય")}</th><th style={th}>{t("Skipped person", "સ્કિપ થયેલ વ્યક્તિ")}</th><th style={th}>બકલ નંબર</th><th style={th}>{t("Work type", "કામનો પ્રકાર")}</th><th style={th}>{t("Skipped by", "સ્કિપ કરનાર")}</th><th style={th}>{t("Note", "નોંધ")}</th>
                </tr>
              </thead>
              <tbody>
                {entries.map((e) => {
                  const dt = new Date(e.ts || 0);
                  const timeStr = e.ts ? dt.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }) : "–";
                  return (
                    <tr key={e.id} style={{ borderTop: "1px solid var(--border-soft)" }}>
                      <td style={td} className="mono">{formatDMY(e.date)}</td>
                      <td style={td} className="mono">{timeStr}</td>
                      <td style={{ ...td, minWidth: 140 }} className="gu">{e.name}</td>
                      <td style={td} className="mono">{e.number}</td>
                      <td style={{ ...td, minWidth: 130 }} className="gu">
                        {e.scope === "category"
                          ? (e.catLabel || <span style={{ color: "var(--text-tertiary)" }}>–</span>)
                          : <span style={{ color: "var(--text-tertiary)" }}>{t("All work types", "બધા કામના પ્રકારો")}</span>}
                      </td>
                      <td style={{ ...td, minWidth: 160 }} className="gu">
                        {e.byName ? (
                          <React.Fragment>{e.byName} <span className="mono" style={{ color: "var(--text-tertiary)" }}>({e.byNumber})</span></React.Fragment>
                        ) : (
                          <span style={{ color: "var(--text-tertiary)" }}>–</span>
                        )}
                      </td>
                      <td style={{ ...td, minWidth: 220 }} className="gu">{e.note || <span style={{ color: "var(--text-tertiary)" }}>–</span>}</td>
                    </tr>
                  );
                })}
                {entries.length === 0 && (
                  <tr><td colSpan={7} style={{ ...td, textAlign: "center", color: "var(--text-tertiary)", padding: "26px 0" }} className="gu">
                    {(data.skipLog || []).length === 0 ? t("No one has been marked Skip yet.", "હજુ સુધી કોઈને સ્કિપ તરીકે માર્ક કરવામાં આવ્યું નથી.") : t("No entries match your search.", "તમારી શોધ સાથે કોઈ પ્રવેશ મેળ ખાતું નથી.")}
                  </td></tr>
                )}
              </tbody>
            </table>
            </div>
          </div>
        </React.Fragment>
      ) : (
        <React.Fragment>
          <div style={{ display: "flex", gap: 24, flexWrap: "wrap", alignItems: "flex-start" }}>
            <div style={{ background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 10, padding: 16, flex: "1 1 380px", maxWidth: 460 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
                <button onClick={() => shiftMonth(-1)} title={t("Previous month", "પાછલો મહિનો")} aria-label={t("Previous month", "પાછલો મહિનો")} style={calNavBtn}>‹</button>
                <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                  <div className="disp" style={{ fontWeight: 700, fontSize: 15 }}>{monthLabel}</div>
                  <input type="month" value={month} onChange={(e) => setMonth(e.target.value)} style={{ fontSize: 11, padding: "3px 6px" }} />
                </div>
                <button onClick={() => shiftMonth(1)} title={t("Next month", "આગલો મહિનો")} aria-label={t("Next month", "આગલો મહિનો")} style={calNavBtn}>›</button>
              </div>

              <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4, marginBottom: 4 }}>
                {[["Sun","રવિ"], ["Mon","સોમ"], ["Tue","મંગળ"], ["Wed","બુધ"], ["Thu","ગુરુ"], ["Fri","શુક્ર"], ["Sat","શનિ"]].map(([en, gu]) => (
                  <div key={en} className="gu" style={{ textAlign: "center", fontSize: 10.5, color: "var(--text-tertiary)", fontWeight: 600, padding: "2px 0" }}>{t(en, gu)}</div>
                ))}
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4 }}>
                {cells.map((dateStr, i) => {
                  if (!dateStr) return <div key={i} />;
                  const count = (skipByDate[dateStr] || []).length;
                  const isToday = dateStr === today;
                  const isSelected = granularity === "week"
                    ? (dateStr >= weekStart && dateStr <= weekEnd)
                    : dateStr === selectedDate;
                  const dayNum = Number(dateStr.slice(8, 10));
                  return (
                    <button key={i} onClick={() => setSelectedDate(dateStr)} title={count ? t(`${count} skip record${count === 1 ? "" : "s"}`, `${count} સ્કિપ રેકોર્ડ`) : t("No one skipped", "કોઈને સ્કિપ કરવામાં આવ્યું નથી")} style={{
                      aspectRatio: "1", border: "1px solid " + (isSelected ? "var(--status-error-text)" : "var(--border-soft)"),
                      background: isSelected ? "var(--status-error-bg)" : (isToday ? "var(--bg-surface-2)" : "var(--bg-surface)"),
                      borderRadius: 7, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
                      padding: 2,
                    }}>
                      <span className="mono" style={{ fontSize: 12, fontWeight: isToday ? 700 : 500, color: isSelected ? "var(--status-error-text)" : "var(--text-primary)" }}>{dayNum}</span>
                      {count > 0 && <span style={{ fontSize: 9, color: "var(--status-error-text)", fontWeight: 700, marginTop: 1 }}>{count}</span>}
                    </button>
                  );
                })}
              </div>
            </div>

            <div style={{ flex: "1 1 380px", minWidth: 300 }}>
              <div style={{ background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 10, padding: "16px 18px" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10, flexWrap: "wrap", gap: 8 }}>
                  <div className="disp" style={{ fontWeight: 700, fontSize: 15 }}>{scopeLabel}</div>
                  <div style={{ display: "flex", gap: 4 }}>
                    <button onClick={() => setGranularity("day")} style={segBtn(granularity === "day")} className="gu">{t("Day", "દિવસ")}</button>
                    <button onClick={() => setGranularity("week")} style={segBtn(granularity === "week")} className="gu">{t("Week", "અઠવાડિયું")}</button>
                    <button onClick={() => setGranularity("month")} style={segBtn(granularity === "month")} className="gu">{t("Month", "મહિનો")}</button>
                  </div>
                </div>

                {scopedEntries.length === 0 ? (
                  <div style={{ fontSize: 13, color: "var(--text-tertiary)", padding: "8px 0" }} className="gu">{t("No one was marked Skip in this range.", "આ સમયગાળામાં કોઈને સ્કિપ તરીકે માર્ક કરવામાં આવ્યું નથી.")}</div>
                ) : (
                  scopedEntries.map((e, i) => {
                    const dt = new Date(e.ts || 0);
                    const timeStr = e.ts ? dt.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }) : "–";
                    return (
                      <div key={e.id || i} className="gu" style={{ padding: "8px 0", borderTop: i ? "1px solid var(--border-soft)" : "none" }}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 8 }}>
                          <span style={{ fontSize: 13, fontWeight: 600 }}>{e.name} <span className="mono" style={{ fontSize: 11, color: "var(--text-tertiary)", fontWeight: 400 }}>#{e.number}</span></span>
                          <span className="mono" style={{ fontSize: 11, color: "var(--text-tertiary)", flexShrink: 0 }}>{granularity !== "day" ? formatDMY(e.date) + " · " : ""}{timeStr}</span>
                        </div>
                        <div style={{ fontSize: 11.5, color: "var(--text-secondary)", marginTop: 2 }}>
                          {t("From", "થી")}: {e.scope === "category" ? (e.catLabel || "–") : t("All work types", "બધા કામના પ્રકારો")}
                        </div>
                        <div style={{ fontSize: 11.5, color: "var(--text-secondary)", marginTop: 2 }}>
                          {e.byName ? (
                            <React.Fragment>{t("Skipped by", "સ્કિપ કરનાર")}: {e.byName} <span className="mono" style={{ color: "var(--text-tertiary)" }}>({e.byNumber})</span></React.Fragment>
                          ) : (
                            <span style={{ color: "var(--text-tertiary)" }}>–</span>
                          )}
                        </div>
                        {e.note && <div style={{ fontSize: 11.5, color: "var(--text-tertiary)", marginTop: 2 }}>{e.note}</div>}
                      </div>
                    );
                  })
                )}
              </div>
            </div>
          </div>
        </React.Fragment>
      )}
    </React.Fragment>
  );
}

// ============================================================
// Public read-only roster view — no sign-in required.
// Reached via a link like ?view=<uid>, generated from the Share
// panel inside the app. Loads the same accounts/{uid} document
// directly (allowed by the Firestore rule only while that
// account's shareEnabled flag is true) and mirrors the same
// screens the admin sees — Home, every work type (roster +
// history), Staff, Calendar, Duty calendar report — using the
// exact same data and helper functions the admin's app uses, so
// the numbers can never drift between the two. Every button that
// would change data (Assign, Skip, add/remove staff, edit dates,
// clear history, staff/designation management, recycle bin,
// reminders, backups, settings) is simply not present here — this
// component only ever reads `data`, it never calls persist/write.
// ============================================================
function PublicRosterView({ uid }) {
  const [lang, setLang] = useState(() => { try { return localStorage.getItem("nb_lang") || "en"; } catch (e) { return "en"; } });
  useEffect(() => { try { localStorage.setItem("nb_lang", lang); } catch (e) {} }, [lang]);
  const t = useCallback((en, gu) => (lang === "gu" && gu ? gu : en), [lang]);
  const langCtxValue = useMemo(() => ({ lang, setLang, t }), [lang, t]);

  const [data, setData] = useState(undefined); // undefined = loading, null = not shared/not found
  const [view, setView] = useState({ mode: "home" });
  const [showAboutPanel, setShowAboutPanel] = useState(false);
  // Shared/view-only visitors get their own dark mode preference, kept
  // separate from the admin's (different device/person in the common
  // case) so toggling one never silently flips the other.
  const [darkMode, setDarkMode] = useState(() => { try { return localStorage.getItem("nb_public_dark_mode") === "1"; } catch (e) { return false; } });
  useEffect(() => { try { localStorage.setItem("nb_public_dark_mode", darkMode ? "1" : "0"); } catch (e) {} }, [darkMode]);
  // Same "force desktop layout regardless of screen size" toggle as the
  // main roster's profile menu, kept under its own storage key so it
  // never gets mixed up with the admin's own preference on a shared device.
  const [desktopView, setDesktopView] = useState(() => { try { return localStorage.getItem("nb_public_force_desktop_view") === "1"; } catch (e) { return false; } });
  useEffect(() => { try { localStorage.setItem("nb_public_force_desktop_view", desktopView ? "1" : "0"); } catch (e) {} }, [desktopView]);
  // Used both when the link stops working and from "Sign in" inside the
  // profile menu — drops the pinned share link (if any) and sends the
  // visitor to the normal sign-in screen at the app's base URL.
  const goToLogin = useCallback(() => {
    try { localStorage.removeItem(PINNED_VIEW_KEY); } catch (e) {}
    window.location.href = window.location.origin + window.location.pathname;
  }, []);
  // data-theme has to live on <html> itself (not just a wrapper div) so it
  // reaches every CSS variable consumer on the page — same approach the
  // main admin view uses.
  useEffect(() => {
    document.documentElement.setAttribute("data-theme", darkMode ? "dark" : "light");
  }, [darkMode]);

  useEffect(() => {
    const unsub = accountDocRef(uid).onSnapshot(
      (snap) => {
        if (snap.exists && snap.data().shareEnabled && snap.data().v === 2) {
          setData(normalizeData(snap.data()));
        } else {
          setData(null);
        }
      },
      () => setData(null)
    );
    return () => unsub();
  }, [uid]);

  return (
    <LangContext.Provider value={langCtxValue}>
      <div style={{ minHeight: "100vh", background: "var(--bg-page)" }}>
        {data === undefined && (
          <div style={{ padding: "3rem", textAlign: "center", color: "var(--text-secondary)" }}>{t("Loading…", "લોડ થઈ રહ્યું છે…")}</div>
        )}

        {data === null && (
          <div style={{ padding: "3rem", textAlign: "center", color: "var(--text-secondary)" }} className="gu">
            <div style={{ marginBottom: 14 }}>{t("This link isn't available. Sharing may have been turned off.", "આ લિંક ઉપલબ્ધ નથી. શેરિંગ બંધ કરવામાં આવ્યું હોઈ શકે છે.")}</div>
            <button
              onClick={goToLogin}
              className="gu"
              style={{ background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 8, padding: "8px 16px", fontSize: 13, fontWeight: 600, color: "var(--text-primary)", cursor: "pointer" }}
            >{t("Go to sign in", "સાઇન ઇન પર જાઓ")}</button>
          </div>
        )}

        {data && (
          <div className={"app-shell" + (desktopView ? " force-desktop" : "")} style={{ display: "flex", minHeight: "100vh" }}>
            <PublicSidebar data={data} view={view} setView={setView} />
            <div className="main-panel" style={{ flex: 1, padding: "28px 36px", maxWidth: 1040 }}>
              <div style={{ display: "flex", justifyContent: "flex-end", alignItems: "center", gap: 10, marginBottom: 16, fontSize: 12, color: "var(--text-secondary)" }}>
                <span style={{ background: "var(--status-success-bg)", color: "var(--status-success-text)", border: "1px solid var(--status-success-border)", borderRadius: 6, padding: "4px 10px", fontWeight: 600 }} className="gu">{t("View only", "ફક્ત જોવા માટે")}</span>
                <LangInlineToggle />
                <button onClick={() => setDarkMode((d) => !d)} title={t("Toggle dark mode", "ડાર્ક મોડ ટોગલ કરો")} aria-label={t("Toggle dark mode", "ડાર્ક મોડ ટોગલ કરો")} style={{
                  background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 7,
                  width: 30, height: 30, padding: 0, fontSize: 13,
                }}>{darkMode ? "☀" : "🌙"}</button>
                <button onClick={() => setShowAboutPanel(true)} title={t("About this app", "આ એપ વિશે")} aria-label={t("About this app", "આ એપ વિશે")} style={{
                  background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 7,
                  width: 30, height: 30, padding: 0, fontSize: 15, lineHeight: 1, fontWeight: 700, letterSpacing: 1, color: "var(--text-primary)",
                }}>⋮</button>
                <ProfileMenu darkMode={darkMode} setDarkMode={setDarkMode} desktopView={desktopView} setDesktopView={setDesktopView} onSignIn={goToLogin} />
              </div>

              {view.mode === "home" && (
                <PublicHomeView data={data} goToCategory={(catId) => setView({ mode: "category", catId })} />
              )}
              {view.mode === "category" && view.catId && (
                <PublicCategoryView data={data} catId={view.catId} />
              )}
              {view.mode === "staff" && <PublicStaffView data={data} />}
              {view.mode === "calendar" && <CalendarView data={data} />}
              {view.mode === "report" && <ReportView data={data} />}
              {view.mode === "skipHistory" && <SkipHistoryView data={data} />}
            </div>
          </div>
        )}

        {showAboutPanel && <AboutPanel onClose={() => setShowAboutPanel(false)} />}
      </div>
    </LangContext.Provider>
  );
}

      {showInfo && (
        <p style={{ fontSize: 13, color: "var(--text-secondary)", margin: "0 0 20px" }} className="gu">
          {new Date().toLocaleDateString(undefined, { weekday: "long" })}, {formatDMY(todayStr())} — {t("every work type at a glance.", "એક નજરમાં દરેક કામનો પ્રકાર.")}

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(250px, 1fr))", gap: 14 }}>
        {cards.map(({ cat, doneToday, nextUp, total }) => (
          <div key={cat.id} style={{ background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 10, padding: "16px 18px", display: "flex", flexDirection: "column", gap: 10 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
              <div className="disp" style={{ fontWeight: 700, fontSize: 14.5 }}>{cat.label}</div>
              <div className="mono gu" style={{ fontSize: 11, color: "var(--text-tertiary)" }}>{total} {t("staff", "સ્ટાફ")}</div>
            </div>

            {total === 0 ? (
              <div style={{ fontSize: 12.5, color: "var(--text-tertiary)" }} className="gu">{t("No staff added yet.", "હજુ કોઈ સ્ટાફ ઉમેર્યો નથી.")}</div>

                <div style={{ fontSize: 10.5, textTransform: "uppercase", letterSpacing: 0.5, color: "var(--status-warning-text)", fontWeight: 700 }} className="gu">{t("Not assigned yet · next up", "હજુ સોંપાયું નથી · આગળ")}</div>
                <div className="gu" style={{ fontSize: 14.5, fontWeight: 600, marginTop: 2 }}>{nextUp.name}</div>
              </div>
            ) : (
              <div style={{ background: "var(--status-error-bg)", border: "1px solid var(--status-error-border)", borderRadius: 8, padding: "9px 12px", fontSize: 12.5, color: "var(--status-error-text)" }} className="gu">{t("No one available — all on leave, outstation, or skip.", "કોઈ ઉપલબ્ધ નથી — બધા રજા, બહારગામ અથવા સ્કિપ પર.")}</div>
            )}

            <button onClick={() => goToCategory(cat.id)} style={{ background: "transparent", border: "none", color: "var(--text-secondary)", fontSize: 12, textAlign: "left", padding: 0, textDecoration: "underline", alignSelf: "flex-start" }} className="gu">{t("View full roster →", "સંપૂર્ણ રોસ્ટર જુઓ →")}</button>
          </div>
        ))}
        {cards.length === 0 && <div style={{ color: "var(--text-tertiary)", fontSize: 13 }} className="gu">{t("No work types yet.", "હજુ કોઈ કામનો પ્રકાર નથી.")}</div>}
      </div>
    </React.Fragment>
  );
}

// Mirrors CategoryView's roster + history tabs — same computeRoster() and

// Mirrors the staff list in StaffView (number, name, designation, current
// status) minus every create/rename/delete/leave-assignment control.
function PublicStaffView({ data }) {
  const { t } = useLang();
  const [search, setSearch] = useState("");
  const debouncedSearch = useDebouncedValue(search);
  const [sortBy, setSortBy] = useState("name");
  const [showFairnessCompare, setShowFairnessCompare] = useState(false);
  const [historyPersonNumber, setHistoryPersonNumber] = useState(null);

  const currentMonth = todayStr().slice(0, 7);
  const dutyCountByNumber = useMemo(() => {
    const counts = {};
    (data.categories || []).forEach((c) => (data.membership[c.id] || []).forEach((m) => {
      const n = monthlyGroupedDutyCount(m.history, currentMonth);
      counts[m.number] = (counts[m.number] || 0) + n;
    }));
    return counts;
  }, [data, currentMonth]);

  const rows = useMemo(() => {
    let list = Object.values(data.staff || {}).map((s) => {
      const status = effectiveStatus(s, null);
      const statusLabel = (status === "Leave" || status === "Outstation") ? unavailLabel(data, s.unavailable) : status;
      const desg = (data.designations || []).find((d) => d.id === s.designation);
      return { ...s, status, statusLabel, desgLabel: desg ? desg.label : "", dutiesThisMonth: dutyCountByNumber[s.number] || 0 };
    });
    const q = debouncedSearch.trim().toLowerCase();
    if (q) list = list.filter((s) => (s.name || "").toLowerCase().includes(q) || String(s.number || "").toLowerCase().includes(q));
    list = [...list];
    if (sortBy === "heat" || sortBy === "duties") {
      list.sort((a, b) => b.dutiesThisMonth - a.dutiesThisMonth || (a.name || "").localeCompare(b.name || ""));
    } else {
      list.sort((a, b) => (a.name || "").localeCompare(b.name || ""));
    }
    return list;
  }, [data, debouncedSearch, sortBy, dutyCountByNumber]);

  const maxDuties = useMemo(() => rows.reduce((m, s) => Math.max(m, s.dutiesThisMonth), 0), [rows]);
  const minDuties = useMemo(() => rows.length ? rows.reduce((m, s) => Math.min(m, s.dutiesThisMonth), Infinity) : 0, [rows]);

  return (
    <React.Fragment>
      <h1 className="disp gu" style={{ fontSize: 22, fontWeight: 700, margin: "0 0 16px" }}>{t("Staff", "સ્ટાફ")}</h1>
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 12 }}>
        <input
          type="text" value={search} onChange={(e) => setSearch(e.target.value)}
          placeholder={t("Search by name or number…", "નામ અથવા નંબર દ્વારા શોધો…")} className="gu"
          style={{ width: "100%", maxWidth: 320, boxSizing: "border-box" }}
        />
        <select value={sortBy} onChange={(e) => setSortBy(e.target.value)} style={{ fontSize: 13, padding: "7px 10px", border: "1px solid var(--border)", borderRadius: 6, background: "var(--bg-surface)", color: "var(--text-primary)" }} className="gu">
          <option value="name">{t("Sort: Name", "ક્રમ: નામ")}</option>
          <option value="heat">{t("Sort: Duty meter (busiest first)", "ક્રમ: ડ્યુટી મીટર (સૌથી વ્યસ્ત પ્રથમ)")}</option>
        </select>
        <button
          onClick={() => setShowFairnessCompare((v) => !v)}
          style={{
            background: showFairnessCompare ? "#D98E2B" : "var(--bg-surface)", color: showFairnessCompare ? "#fff" : "var(--text-primary)",
            border: "1px solid " + (showFairnessCompare ? "#D98E2B" : "var(--border)"), borderRadius: 6, padding: "7px 12px", fontSize: 13, fontWeight: 600, whiteSpace: "nowrap",
          }} className="gu"
        >⚖ {t("Duty fairness", "ડ્યુટી ન્યાયીપણું")}</button>
      </div>

      {showFairnessCompare && (
        <DutyFairnessCompare data={data} staffList={rows} currentMonth={currentMonth} />
      )}

      <div style={{ display: "flex", alignItems: "center", gap: 16, marginBottom: 10, fontSize: 11.5, color: "var(--text-secondary)", flexWrap: "wrap" }} className="gu">
        <span style={{ fontWeight: 600 }}>{t("Duty meter:", "ડ્યુટી મીટર:")}</span>
        <span style={{ display: "flex", alignItems: "center", gap: 5 }}><span style={{ width: 8, height: 8, borderRadius: "50%", background: "var(--status-error-text)", display: "inline-block" }} />{t("Busiest", "સૌથી વ્યસ્ત")}</span>
        <span style={{ display: "flex", alignItems: "center", gap: 5 }}><span style={{ width: 8, height: 8, borderRadius: "50%", background: "var(--status-warning-text)", display: "inline-block" }} />{t("Moderate", "મધ્યમ")}</span>
        <span style={{ display: "flex", alignItems: "center", gap: 5 }}><span style={{ width: 8, height: 8, borderRadius: "50%", background: "var(--status-success-text)", display: "inline-block" }} />{t("Least busy", "સૌથી ઓછું વ્યસ્ત")}</span>
        <span style={{ color: "var(--text-tertiary)" }}>{t("— relative to everyone shown, this month", "— આ મહિને બતાવેલ બધાની સાપેક્ષે")}</span>
      </div>

      <div style={{ background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 10, overflow: "hidden" }}>
        <div style={{ overflowX: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
            <thead>
              <tr style={{ background: "var(--bg-surface-2)", textAlign: "left" }} className="gu">
                <th style={th}>{t("Number", "નંબર")}</th><th style={th}>{t("Name", "નામ")}</th><th style={th}>{t("Designation", "હોદ્દો")}</th><th style={th}>{t("Status", "સ્થિતિ")}</th><th style={{ ...th, textAlign: "center" }}>{t("Duties (mo.)", "ડ્યુટીઓ (મહિનો)")}</th>
              </tr>
            </thead>
            <tbody>
              {rows.map((s) => {
                const sty = STATUS_STYLE[s.status] || STATUS_STYLE.Present;
                const heat = dutyHeatTier(s.dutiesThisMonth, minDuties, maxDuties);
                return (
                  <tr key={s.number} style={{ borderTop: "1px solid var(--border-soft)" }}>
                    <td style={td} className="mono">{s.number}</td>
                    <td style={{ ...td, minWidth: 160 }} className="gu">
                      <span style={{ display: "inline-block", width: 7, height: 7, borderRadius: "50%", background: DUTY_HEAT_COLOR[heat], marginRight: 7 }} />
                      <span
                        onClick={() => setHistoryPersonNumber(s.number)}
                        title={t("View full duty history across every work type", "દરેક કામના પ્રકારમાં સંપૂર્ણ ડ્યુટી ઇતિહાસ જુઓ")}
                        style={{ color: DUTY_HEAT_COLOR[heat], fontWeight: heat === "green" ? 400 : 600, cursor: "pointer", borderBottom: "1px dashed currentColor" }}
                      >{s.name}</span>
                    </td>
                    <td style={td} className="gu">{s.desgLabel || <span style={{ color: "var(--text-tertiary)" }}>–</span>}</td>
                    <td style={td}>
                      <span style={{ fontSize: 12, fontWeight: 600, padding: "5px 8px", borderRadius: 6, border: "1px solid " + sty.border, background: sty.bg, color: sty.fg }} className="gu">{s.statusLabel}</span>
                    </td>
                    <td style={{ ...td, textAlign: "center", fontSize: 12, color: "var(--text-secondary)" }} className="mono">{s.dutiesThisMonth}</td>
                  </tr>
                );
              })}
              {rows.length === 0 && (
                <tr><td colSpan={5} style={{ ...td, textAlign: "center", color: "var(--text-tertiary)", padding: "26px 0" }} className="gu">{t("No staff found.", "કોઈ સ્ટાફ મળ્યો નથી.")}</td></tr>
              )}
            </tbody>
          </table>
        </div>
      </div>

      {historyPersonNumber && data.staff[historyPersonNumber] && (
        <PersonHistoryModal data={data} number={historyPersonNumber} onClose={() => setHistoryPersonNumber(null)} />
      )}
    </React.Fragment>
  );
}

// Catches any render-time error anywhere in the tree below it instead of
// letting the whole app crash to a blank white screen — the single biggest
// "stability" gap in a page like this with no build step to catch mistakes
// ahead of time. Shows a plain recovery screen with a reload button; all
// data is safe either way since every change is already saved live as it
// happens, this only guards the CURRENT tab's rendering.
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null, info: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) {
    console.error("Nokri Book crashed:", error, info);
    this.setState({ info });
    // The actual fix here: this used to ONLY go to console.error, which is
    // gone forever the instant the tab closes or reloads — meaning the
    // *only* way to ever find out what broke was to have DevTools open and
    // watching at the exact moment it happened. Almost never true in
    // practice. Persisting the real error to localStorage (survives
    // reload/close) and showing it directly on the crash screen itself
    // means the actual cause is right there to read or copy, every time,
    // with no DevTools needed at all.
    try {
      localStorage.setItem("nb_last_crash", JSON.stringify({
        message: error && error.message,
        stack: error && error.stack,
        componentStack: info && info.componentStack,
        at: new Date().toISOString(),
        url: window.location.href,
      }));
    } catch (e) { /* storage full/unavailable — the on-screen display below still works for this session */ }
  }
  render() {
    if (this.state.error) {
      const details = `${this.state.error && this.state.error.message}\n\n${(this.state.error && this.state.error.stack) || ""}`.trim();
      return (
        <div style={{ position: "fixed", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", background: "#F4EBDC", padding: 24, overflowY: "auto" }}>
          <div style={{ maxWidth: 560, textAlign: "center" }}>
            <div style={{ fontSize: 34, marginBottom: 10 }}>⚠️</div>
            <div style={{ fontSize: 17, fontWeight: 700, color: "#2B2116", marginBottom: 8 }}>Something went wrong</div>
            <div style={{ fontSize: 13.5, color: "#6E5D49", marginBottom: 18 }}>
              This screen hit an unexpected error. Your data is safe — every change is saved as it happens. Reloading usually fixes it.
            </div>
            <div style={{ display: "flex", gap: 10, justifyContent: "center", marginBottom: 18 }}>
              <button onClick={() => window.location.reload()} style={{ background: "#D98E2B", color: "#fff", border: "none", borderRadius: 8, padding: "10px 20px", fontSize: 14, fontWeight: 700, cursor: "pointer" }}>Reload</button>
              <button
                onClick={(e) => {
                  navigator.clipboard.writeText(details).then(() => {
                    e.target.textContent = "Copied!";
                    setTimeout(() => { e.target.textContent = "Copy error details"; }, 1500);
                  }).catch(() => {});
                }}
                style={{ background: "#fff", color: "#2B2116", border: "1px solid #D9CBB0", borderRadius: 8, padding: "10px 20px", fontSize: 14, fontWeight: 700, cursor: "pointer" }}
              >Copy error details</button>
            </div>
            <pre style={{
              textAlign: "left", fontSize: 11.5, color: "#6E5D49", background: "#FFFDF8", border: "1px solid #E8DCC4",
              borderRadius: 8, padding: 12, maxHeight: 220, overflow: "auto", whiteSpace: "pre-wrap", wordBreak: "break-word",
            }}>{details || "(no error details captured)"}</pre>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

function RootApp() {
  const params = new URLSearchParams(window.location.search);
  let viewUid = params.get("view");
  // No ?view= in the URL this time — check whether this browser has a
  // share link pinned from the sign-in screen before. If so, treat it
  // exactly as if that code were in the URL, so a bare visit to the site
  // (no link needed at all) goes straight into that person's pinned
  // roster every time, on this device only.
  if (!viewUid) {
    try {
      const pinned = localStorage.getItem(PINNED_VIEW_KEY);
      if (pinned) viewUid = pinned;
    } catch (e) { /* localStorage unavailable — just fall through to normal sign-in */ }
  }
  if (viewUid) return <PublicRosterView uid={viewUid} />;
  return <DutyRoster />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><RootApp /></ErrorBoundary>);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js").then((reg) => {
        // Actively checks for a newer service-worker.js on every load
        // instead of waiting for the browser's own (much slower, often
        // 24h+) background update check — new deploys take effect the
        // next time someone opens the app, not "eventually".
        reg.update().catch(() => {});
      }).catch((e) => console.warn("SW registration failed", e));
    });
  }
</script>

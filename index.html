<style>
  html { scroll-behavior: smooth; }
  body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg-page); color: var(--text-primary); -webkit-tap-highlight-color: transparent; }
  .gu { font-family: 'Noto Sans Gujarati', 'Inter', sans-serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .disp { font-family: 'Space Grotesk', sans-serif; }
  button {
    cursor: pointer; font-family: inherit;
    transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease, transform 0.08s ease;
  }
  button:not(:disabled):active { transform: scale(0.97); }
  input[type=text], input[type=date], input[type=month], input[type=number], textarea, select {
    font-family: inherit; border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 10px; font-size: 13px; background: #fff; color: #16202B;
    transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
  }
  input:focus, textarea:focus, select:focus { outline: 2px solid #D98E2B55; border-color: #D98E2B; }
  select { font-family: inherit; }
  a, .clickable, [role="button"] { transition: color 0.15s ease, background-color 0.15s ease; }
  table { transition: opacity 0.15s ease; }
  tr { transition: background-color 0.12s ease; }
  @media (max-width: 860px) {
    /* Stack the sidebar above the content instead of squeezing both side
       by side, and let the sidebar scroll vertically within its own strip
       (max-height) instead of being forced into a cramped horizontal row —
       that horizontal-row squeeze was the main cause of things looking cut
       off with no way to scroll sideways. */
    .sidebar { width: 100% !important; max-height: 42vh; height: auto !important; overflow-y: auto !important; flex-shrink: 0 !important; position: static !important; }
    .app-shell { flex-direction: column !important; }
    .main-panel { padding: 16px 12px !important; max-width: 100% !important; }
    table { font-size: 12px !important; }
    /* The top toolbar (Search, Undo, Backup, Drive, Share, ⋮ — around 9
       buttons) is a single flex row with no wrap by default, sized for
       desktop width. In portrait on a phone there's nowhere near enough
       width for all of it, so past a certain point the row just runs off
       the right edge of the screen with nothing to scroll it back into
       view — not just visually cramped, genuinely untouchable. Letting it
       wrap onto as many lines as it needs keeps every button reachable
       without needing to rotate to landscape for width. */
    .top-toolbar { flex-wrap: wrap !important; justify-content: flex-start !important; }
    /* Tables now scroll horizontally within their own card (see the
       overflowX:auto wrapper around each <table>) instead of being
       squeezed to fit or clipped — swipe left/right on any table to see
       columns that don't fit. */

    /* "Desktop view" toggle (profile menu → 🖥️ Desktop view): re-applies
       the normal desktop values on top of everything above, undoing the
       mobile layout entirely on request — same idea as a browser's own
       "Request desktop site". Higher selector specificity than the plain
       .sidebar/.app-shell/.main-panel/table rules above is what lets these
       win despite both sides using !important. The collapsed-rail sidebar
       width (44px) is intentionally left alone here — that's a separate,
       deliberate user choice, not part of "am I on mobile or desktop". */
    .force-desktop .sidebar:not([style*="width: 44"]) { width: 230px !important; max-height: none !important; height: 100vh !important; position: sticky !important; }
    .app-shell.force-desktop, .force-desktop.app-shell { flex-direction: row !important; }
    .force-desktop .main-panel { padding: 28px 36px !important; max-width: 1040px !important; }
    .force-desktop table { font-size: 13px !important; }
  }
  /* Printing a tab (Ctrl/Cmd+P) shows just that screen's data — no sidebar,
     no toolbar, no interactive buttons — full width on plain white paper. */
  @media print {
    body { background: #fff !important; }
    .sidebar, .no-print, button, .command-palette-overlay { display: none !important; }
    .app-shell { display: block !important; }
    .main-panel { max-width: 100% !important; padding: 0 !important; }
    table { font-size: 11px !important; }
    th, td { padding: 5px 7px !important; }
    tr { break-inside: avoid; }
    a[href]::after { content: ""; }
  }
  /* Dark mode: real, hand-tuned colors via CSS variables (not a filter
     trick) — components reference var(--...) for their core surface/text/
     border colors, and this block swaps what those variables point to.
     Colors that should stay constant regardless of theme (the always-dark
     sidebar, colored status badges, the brand-gold accent) are left as
     literal hex values in the components themselves, untouched here. */
  :root {
    /* Warm cream "normal mode" palette (per the reference photo) — a soft
       cream/beige surface with dark warm-brown text and a golden accent,
       instead of the cool grey-blue palette. */
    --bg-page: #F4EBDC;
    --bg-surface: #FFFDF8;
    --bg-surface-2: #F1E6D2;
    --sidebar-bg: #1E1712;
    --text-primary: #2B2116;
    --text-secondary: #6E5D49;
    --text-tertiary: #9C8B72;
    --border: #E4D5B8;
    --border-soft: #EFE4CD;
    --btn-dark-bg: #2B2116;
    --highlight-bg: #FFFBF2;
    --highlight-border: #F3DDAE;
    --status-success-bg: #EAF3DE;
    --status-success-text: #3B6D11;
    --status-success-border: #C0DD97;
    --status-error-bg: #FBEAEA;
    --status-error-text: #A32D2D;
    --status-error-border: #F0C6C6;
    --status-warning-bg: #FCEFD9;
    --status-warning-text: #8A5A16;
    --status-warning-border: #F0D6A0;
    --status-info-bg: #DCE8F5;
    --status-info-text: #1D4E89;
    --status-info-border: #A9C6E8;
    --status-purple-bg: #EFE5F7;
    --status-purple-text: #6B3FA0;
    --status-purple-border: #D3B8EC;
    --status-neutral-bg: #F1EFE8;
    --status-neutral-text: #5F5E5A;
    --status-neutral-border: #D3D1C7;
    /* Solid CTA button colors (e.g. "Backup now", "Delete selected",
       "Done editing"). Deliberately fixed rather than var(--status-*-text) —
       those flip to pale/light colors in dark mode for text-on-dark
       readability, which is exactly wrong for a solid button background
       paired with white text (pale bg + white text = invisible). A solid
       button is a small filled surface, not page text, so it keeps the
       same readable dark color in both themes. */
    --btn-warning-solid: #8A5A16;
    --btn-danger-solid: #A32D2D;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    /* Pure pitch black everywhere in dark mode — page background, every
       card/panel surface, and the sidebar all use the same #000000, with
       only the (still-visible) borders left a dark grey so panels and
       list rows keep some definition against each other. */
    --bg-page: #000000;
    --bg-surface: #000000;
    --bg-surface-2: #000000;
    --sidebar-bg: #000000;
    --text-primary: #FFFFFF;
    --text-secondary: #FFFFFF;
    --text-tertiary: #FFFFFF;
    --border: #333C48;
    --border-soft: #2A323C;
    --btn-dark-bg: #2E3742;
    --highlight-bg: #3A331F;
    --highlight-border: #5C4E27;
    --status-success-bg: #1E3320;
    --status-success-text: #E3FBE3;
    --status-success-border: #3A5C3D;
    --status-error-bg: #3A2020;
    --status-error-text: #FFE3E3;
    --status-error-border: #5C3535;
    --status-warning-bg: #3A2F18;
    --status-warning-text: #FFF0D6;
    --status-warning-border: #5C4A28;
    --status-info-bg: #1C2E42;
    --status-info-text: #E1F0FF;
    --status-info-border: #345070;
    --status-purple-bg: #2E2438;
    --status-purple-text: #F1E5FB;
    --status-purple-border: #4A3A5C;
    --status-neutral-bg: #2A2E33;
    --status-neutral-text: #EDEEF0;
    --status-neutral-border: #444B52;
  }
  [data-theme="dark"] input[type=text], [data-theme="dark"] input[type=date],
  [data-theme="dark"] input[type=month], [data-theme="dark"] input[type=number],
  [data-theme="dark"] textarea, [data-theme="dark"] select {
    background: var(--bg-surface); color: var(--text-primary); border-color: var(--border);
  }
  [data-theme="dark"] table { color: var(--text-primary); }
  /* <select> dropdown option lists and input placeholder text don't
     inherit an element's own `color` — browsers (especially Chrome on
     Windows) render option lists with native black-on-white regardless of
     CSS, and placeholders use their own separate, unthemed default. Both
     need to be targeted explicitly or they show as black text even though
     everything else on the page correctly went white. */
  [data-theme="dark"] option { background: var(--bg-surface); color: var(--text-primary); }
  [data-theme="dark"] ::placeholder { color: var(--text-tertiary); opacity: 1; }
  /* The sign-in screen's email/password pills are always a fixed light
     surface by design (in both light and dark app mode), so their
     placeholder text needs a fixed dark-on-light color here too — this
     overrides the dark-mode rule above (which would otherwise turn the
     placeholder white and make it invisible on the light pill). */
  .signin-field-input::placeholder { color: #8B958E; opacity: 1; }
  [data-theme="dark"] .signin-field-input::placeholder { color: #8B958E; opacity: 1; }
</style>

// App Check: a signed token attached to every Firebase request, proving it
// came from a genuine copy of this app — not a browser-referrer check (the
// mechanism that broke login earlier), so it doesn't share that fragility.
// reCAPTCHA v3 runs invisibly, no popup or challenge a person would see.
// Still has no real effect until enforcement is turned on for Firestore/
// Auth in Firebase Console → App Check → the APIs tab — do that only after
// confirming login still works fine with this in place.
firebase.appCheck().activate(
  "6LdkZn4tAAAAAC3uwWyQCKEKpGCUvy3T73bys-l2",
  true
);
const db = firebase.firestore();
// Enables local (IndexedDB) caching of Firestore data and queuing of writes
// made while offline. Without this, a write made with no signal only lives
// in memory — a refresh or tab close before the connection returns loses
// it silently. With this on, the change is saved to disk immediately and
// synced automatically the moment connectivity comes back. Duty-room wifi
// is often patchy, so this matters more here than in a typical app.
// synchronizeTabs lets multiple open tabs of this app share one persistence
// layer instead of the second tab's setup failing; the remaining failure
// case is a browser that has no IndexedDB (e.g. some private-browsing
// modes), which just falls back to memory-only caching for that session.
db.enablePersistence({ synchronizeTabs: true }).catch((err) => {
  console.warn("Firestore offline persistence not enabled:", err.code);
});
const auth = firebase.auth();
// Explicitly request LOCAL persistence (survive full browser restarts, not
// just tab refreshes). This is Firebase Auth's default in most browsers,
// but some environments — Safari with "Prevent cross-site tracking",
// certain in-app/webview browsers, private-browsing modes — silently fall
// back to session-only persistence unless this is requested explicitly,
// which is what was causing people to appear "logged out" after closing
// and reopening the app. Set once at startup, before onAuthStateChanged is
// wired up in DutyRoster, so it applies to every sign-in on this page.
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch((err) => {
  console.warn("Could not set LOCAL auth persistence:", err.code);
});

// Each signed-in user's roster lives at accounts/{uid}, matching the
// Firestore rule that only allows a user to read/write their own doc.

// Pulls the account uid out of whatever someone pastes into "paste your
// share link" on the sign-in screen — the full share URL (any query
// param order), a bare "?view=..." fragment, or just the code by itself,
// since there's no way to know in advance which of those someone will
// actually paste.
function extractShareUid(input) {
  const trimmed = (input || "").trim();
  if (!trimmed) return "";
  if (/^https?:\/\//i.test(trimmed)) {
    try {
      const url = new URL(trimmed);
      const fromQuery = url.searchParams.get("view");
      if (fromQuery) return fromQuery;
    } catch (e) { /* not a parseable URL — fall through to the plainer checks below */ }
  }
  const m = trimmed.match(/[?&]view=([^&\s]+)/);
  if (m) return decodeURIComponent(m[1]);

  return trimmed.replace(/\s+/g, "");
}

// Firestore rejects the entire write outright if ANY field anywhere in
// the document is `undefined` — not just that one field, the whole
// .set() call fails. That's a silent-failure risk that's completely
// independent of network connectivity (offline persistence can't help
// with it, since it's a data-shape problem, not a connectivity one), and
// with dozens of mutation functions across this file, an accidental
// `undefined` slipping in somewhere (instead of `null`) is exactly the
// kind of one-line mistake that's easy to miss. This walks the object
// tree just before every write and converts any `undefined` it finds
// into `null`, so a stray undefined never has the chance to silently
// take an entire save down with it.
function deepStripUndefined(value) {
  if (Array.isArray(value)) return value.map(deepStripUndefined);
  if (value && typeof value === "object" && !(value instanceof Date)) {
    const out = {};
    Object.keys(value).forEach((k) => {
      out[k] = value[k] === undefined ? null : deepStripUndefined(value[k]);
    });
    return out;
  }
  return value === undefined ? null : value;
}

function buildInitialData() {

  const membership = {};
  DEFAULT_CATEGORIES.forEach((c) => {

// Converts the old per-category schema (name/status stored directly on each
// row, no shared identity) into the new schema (one global staff record per
// person, referenced by workplace number, shared across every work type).
function migrateOldRoster(oldRoster) {
  const staff = {};
  const membership = {};
  const nameToNumber = {};
  let counter = 1;
  Object.keys(oldRoster).forEach((catId) => {
    const list = oldRoster[catId] || [];
    membership[catId] = list.map((p) => {
      let num = nameToNumber[p.name];
      if (!num) {
        num = "M" + String(counter++).padStart(3, "0");
        nameToNumber[p.name] = num;
        staff[num] = {
          number: num,
          name: p.name,
          phone: null,
          // Best-effort carry-over: an old "Leave" status becomes a 30-day
          // leave starting today. Please correct the actual dates in
          // Manage Staff.
          unavailable: p.status === "Leave" ? { type: "Leave", from: todayStr(), to: todayStr() } : null,
          designation: null,
        };
      }
      return { number: num, lastDuty: p.lastDuty, history: p.history || [], skip: p.status === "Skip" };
    });
  });
  const categories = DEFAULT_CATEGORIES.filter((c) => oldRoster[c.id]).length
    ? DEFAULT_CATEGORIES.map((c) => ({ id: c.id, label: c.label }))
    : DEFAULT_CATEGORIES;
  // include any category ids present in old data but not in our default list
  Object.keys(oldRoster).forEach((catId) => {
    if (!categories.find((c) => c.id === catId)) categories.push({ id: catId, label: catId });
  });
  return { v: 2, staff, categories, membership, leaveTypes: DEFAULT_LEAVE_TYPES, outstationTypes: DEFAULT_OUTSTATION_TYPES, designations: DEFAULT_DESIGNATIONS, recycleBin: [], events: [], reminderAcks: {}, skipLog: [] };
}

  if (date < today) {
    return `Reminder: Employee ${who}'s ${label} was set to ${verb} on ${displayDate} — please acknowledge.`;
  }
  return `Reminder: Employee ${who} will ${verb} ${label} on ${displayDate}.`;
}
// A reminder "fires" the day before its date and keeps firing every day
// after that (status Pending) until it's acknowledged. Only reminders that
// have reached their trigger date are returned at all — future events with
// no due reminder yet aren't included here (they still show in the Events
// tab). Start and end reminders are both generated unless the event is a
// single day, in which case they'd be identical.
function computeAllReminders(data, lang) {
  const today = todayStr();
  const events = data.events || [];
  const acks = data.reminderAcks || {};
  const list = [];
  events.forEach((ev) => {
    if (!ev.start) return;
    const startKey = ev.id + ":start";
    if (today >= addDaysStr(ev.start, -1)) {
      list.push({ key: startKey, eventId: ev.id, milestone: "start", event: ev, message: reminderMessage(ev, "start", lang), status: acks[startKey] ? "Acknowledged" : "Pending" });
    }
    if (ev.end && ev.end !== ev.start && today >= addDaysStr(ev.end, -1)) {
      const endKey = ev.id + ":end";
      list.push({ key: endKey, eventId: ev.id, milestone: "end", event: ev, message: reminderMessage(ev, "end", lang), status: acks[endKey] ? "Acknowledged" : "Pending" });
    }
  });
  return list.sort((a, b) => (a.status === b.status ? a.event.start.localeCompare(b.event.start) : (a.status === "Pending" ? -1 : 1)));
}

// Duty meter: colours a person's name by how their monthly duty count
// compares to everyone else currently on the roster — busiest shows red,
// a middle band shows yellow, and the least-loaded shows green, so
// whoever's overloaded (or underused) is visible at a glance without
// reading every number in the table. Relative to THIS month's actual
// spread (min..max among the people being shown), not a fixed scale, so
// it stays meaningful whether the busiest person has done 3 duties or 30.
// Purely presentational — never affects rotation order or fairness logic.
function dutyHeatTier(count, min, max) {
  if (max <= min) return "green";
  const pos = (count - min) / (max - min);
  if (pos >= 2 / 3) return "red";
  if (pos >= 1 / 3) return "yellow";
  return "green";
}
const DUTY_HEAT_COLOR = {
  red: "var(--status-error-text)",
  yellow: "var(--status-warning-text)",
  green: "var(--status-success-text)",
};

// "kind" is always "Leave" or "Outstation" (drives status colour + the
// Present/Skip filter logic). "label" is the specific, admin-editable
// sub-type (e.g. "Sick Leave") shown to the user. Old records saved before
// sub-types existed only have `type`, which is used as a fallback for both.
function unavailKind(u) { return (u && (u.kind || u.type)) || null; }
function unavailLabel(data, u) {
  if (!u) return "";
  const kind = unavailKind(u);
  const list = kind === "Leave" ? data.leaveTypes : kind === "Outstation" ? data.outstationTypes : null;
  const found = list && u.typeId && list.find((t) => t.id === u.typeId);
  return found ? found.label : (u.subtype || kind || "");
}

// Looks up whichever Leave/Outstation period (if any) covers a given date
// for this person — past, present, or future — by scanning their full
// unavailableHistory AND the single "current" `unavailable` field (the one
// Manage Staff's status badge reads directly). Both are always checked and
// combined — never one OR the other — because the two can drift apart in
// practice (a record from before unavailableHistory existed, an imported
// backup, or any other path that sets `unavailable` without also logging
// it to history). If only `unavailableHistory` were trusted whenever it's
// non-empty, a person whose current live status isn't represented there
// would silently vanish from the calendar while Manage Staff still shows
// them correctly away — that's exactly the bug this guards against. The
// current field is pushed on last, so it's the first one checked below.
function unavailableOnDate(staffRec, dateStr) {
  if (!staffRec) return null;
  const periods = [...(staffRec.unavailableHistory || [])];
  if (staffRec.unavailable) periods.push(staffRec.unavailable);
  for (let i = periods.length - 1; i >= 0; i--) {
    const p = periods[i];
    if (p && p.from && dateStr >= p.from && (!p.to || dateStr <= p.to)) return p;
  }
  return null;
}

// Shared by setUnavailable (Manage Staff) and the optional "also mark
// Outstation" toggle on Group Duty — returns the { unavailable,
// unavailableHistory } pair to merge into a staff record for a newly
// entered Leave/Outstation period, without touching anything else on the
// record. A period entirely in the past never touches the "current"
// pointer (so it can't change someone's live status today); everything
// else — indefinite, or covering today/later — does, same as before.
function unavailablePeriodUpdate(staffRec, kind, typeId, from, to) {
  const period = { kind, typeId, from, to: to || null };
  const isPastOnly = period.to && period.to < todayStr();
  return {
    unavailable: isPastOnly ? staffRec.unavailable : period,
    unavailableHistory: [...(staffRec.unavailableHistory || []), period],
  };
}

// Skip has two independent scopes:
//  - GLOBAL: staffRec.skip, set from Manage Staff — pulls the person out
//    of rotation in every work type at once.
//  - LOCAL: membEntry.skip, set from inside a single work type's roster —
//    pulls them out of just that one work type's rotation, leaving every
//    other work type (and Manage Staff's own view of them) untouched.
// Either one alone is enough to make someone show as Skip *within this
// work type*; clearing one never clears the other (see setSkip vs.
// setSkipInCategory).
function effectiveStatus(staffRec, membEntry) {
  const today = todayStr();
  if (staffRec && staffRec.unavailable) {
    const { from, to } = staffRec.unavailable;
    // to === null/undefined means an indefinite (open-ended) period — it
    // stays active until someone manually ends it, no matter the date.
    if (today >= from && (!to || today <= to)) return unavailKind(staffRec.unavailable);
  }
  if (staffRec && staffRec.skip) return "Skip";
  if (membEntry && membEntry.skip) return "Skip";
  return "Present";
}

// Shared by the Home dashboard and the per-work-type view so ranking logic
// never drifts between the two screens.
function computeRoster(data, catId) {
  const membership = (data.membership && data.membership[catId]) || [];
  const today = todayStr();
  const withInfo = membership.map((m) => {
    const staffRec = data.staff[m.number] || { number: m.number, name: "(unknown)", unavailable: null };
    const status = effectiveStatus(staffRec, m);
    const statusLabel = (status === "Leave" || status === "Outstation") ? unavailLabel(data, staffRec.unavailable) : status;
    return { ...m, name: staffRec.name, staffRec, waiting: daysBetween(m.lastDuty, today), status, statusLabel };
  });
  const eligible = withInfo.filter((p) => p.status === "Present").sort((a, b) => b.waiting - a.waiting);
  const rankMap = {};
  eligible.forEach((p, i) => (rankMap[p.number] = i + 1));
  return withInfo.map((p) => ({ ...p, rank: rankMap[p.number] || null })).sort((a, b) => {
    if (a.rank && b.rank) return a.rank - b.rank;
    if (a.rank) return -1;
    if (b.rank) return 1;
    return b.waiting - a.waiting;
  });
}

// Enforces "one employee = one duty per date". The app only tracks duty at
// day granularity (no time-of-day field), so a "slot" here means one
// calendar date. Scans every OTHER work type's roster for an entry
// belonging to this staff number whose last-duty date matches the one being
// assigned, and returns that category if found (or null if the date is free
// for this person). The category being edited is excluded so re-saving a
// person's own existing date never flags itself.
function findDutyConflict(data, number, date, excludeCatId) {
  if (!date) return null;
  for (const cat of data.categories || []) {
    if (cat.id === excludeCatId) continue;
    const list = (data.membership && data.membership[cat.id]) || [];
    const clash = list.find((m) => m.number === number && m.lastDuty === date);
    if (clash) return cat;
  }
  return null;
}
// A same-day double duty is a soft warning, not a hard block — it can
// happen legitimately (e.g. someone on half-day leave covers one duty
// before it starts and a second one after it ends). So instead of
// refusing outright, this asks once via confirm and lets the person
// assigning duty make the call either way.
function confirmDutyOverride(data, number, date, excludeCatId, who) {
  const conflict = findDutyConflict(data, number, date, excludeCatId);
  if (!conflict) return true;
  let curLang = "en";
  try { curLang = localStorage.getItem("nb_lang") || "en"; } catch (e) {}
  const msg = curLang === "gu"
    ? `${who} ને પહેલેથી જ ${formatDMY(date)} ના રોજ "${conflict.label}" માં ડ્યુટી છે. આ યોગ્ય પણ હોઈ શકે (દા.ત. એક દિવસમાં બે ડ્યુટી આવરી લેતી અડધા દિવસની રજા) — શું આ પણ સોંપવું છે?`
    : `${who} already has a duty on ${formatDMY(date)} in "${conflict.label}". This can be legitimate (e.g. a half-day leave covering two duties in one day) — assign this one too?`;
  return window.confirm(msg);
}

// One switch, top of the sidebar, visible on every screen. Language choice

// current language. Falls back to the English string if no Gujarati

const LangContext = React.createContext({ lang: "en", t: (en) => en });

// Returns `value`, but only after it has stopped changing for `delay` ms.
// Used on search boxes so filtering runs once after typing pauses instead
// of re-filtering the full list on every keystroke.
function useDebouncedValue(value, delay = 250) {
  const [debounced, setDebounced] = useState(value);
  useEffect(() => {
    const id = setTimeout(() => setDebounced(value), delay);
    return () => clearTimeout(id);
  }, [value, delay]);
  return debounced;
}

  }
}

  useEffect(() => {

      bodyOverflow: body.style.overflow, bodyHeight: body.style.height,
    };
    html.style.overflow = "hidden";
    html.style.height = "100%";
    body.style.overflow = "hidden";
    body.style.height = "100%";
    return () => {
      html.style.overflow = prev.htmlOverflow;

// Same idea as LangToggle but styled for the light sign-in screen, since
// the dark sidebar toggle isn't on screen yet at that point.
function LangInlineToggle({ dark }) {
  const { lang, setLang } = useLang();
  const base = { border: "1px solid " + (dark ? "rgba(255,255,255,0.5)" : "var(--border)"), borderRadius: 6, padding: "4px 10px", fontSize: 11.5, fontWeight: 600 };
  const offColor = dark ? { background: "rgba(255,255,255,0.14)", color: "#fff" } : { background: "var(--bg-page)", color: "var(--text-secondary)" };
  const onColor = dark ? { background: "var(--bg-surface)", color: "var(--text-primary)" } : { background: "var(--btn-dark-bg)", color: "#fff" };
  return (
    <React.Fragment>
      <button onClick={() => setLang("en")} style={{ ...base, ...(lang === "en" ? onColor : offColor) }}>EN</button>
      <button onClick={() => setLang("gu")} className="gu" style={{ ...base, ...(lang === "gu" ? onColor : offColor) }}>ગુજરાતી</button>
    </React.Fragment>
  );
}

function DutyRoster() {
  // Bilingual UI: language choice persists locally, provided to the whole
  // tree via LangContext so any component can call useLang() and get
  // { lang, t }. SignInScreen (rendered before this provider exists further
  // down) gets its own copy wired in App() below.
  const [lang, setLang] = useState(() => { try { return localStorage.getItem("nb_lang") || "en"; } catch (e) { return "en"; } });
  useEffect(() => { try { localStorage.setItem("nb_lang", lang); } catch (e) {} }, [lang]);
  const t = useCallback((en, gu) => (lang === "gu" && gu ? gu : en), [lang]);
  const langCtxValue = useMemo(() => ({ lang, setLang, t }), [lang, t]);

  // undefined = still checking whether someone's already signed in;
  // null = signed out; object = signed-in Firebase user.
  const [user, setUser] = useState(undefined);
  useEffect(() => {
    const unsub = auth.onAuthStateChanged(setUser);
    return () => unsub();
  }, []);
  // Sign-in itself (Google / email+password) is
  // handled inside SignInScreen, which calls `auth` directly — this
  // component only needs to react once `user` changes.
  const signOutUser = () => { auth.signOut(); };
  // Stable per signed-in session — recomputed each render but points at the

  const [redoStack, setRedoStack] = useState([]);

  // from Firestore's snapshot metadata and is true whenever there's a local
  // change not yet confirmed by the server — the more reliable signal for
  // "did this actually save", since a wifi connection can report as
  // "online" while still failing to reach Firestore. Combined into one
  // status badge so it's obvious when it's safe to walk away vs. wait.
  const [online, setOnline] = useState(typeof navigator === "undefined" || navigator.onLine);

  const [showReminderPanel, setShowReminderPanel] = useState(false);
  const [notifPermission, setNotifPermission] = useState(

  );
  const autoShownRef = useRef(false);
  const browserNotifiedRef = useRef(new Set());
  const [tick, setTick] = useState(0);

  // just when the person makes an edit.
  useEffect(() => {
    const iv = setInterval(() => setTick((t) => t + 1), 5 * 60 * 1000);

  }, []);

  // greeting you with what's due) the first time there's something pending.
  useEffect(() => {
    if (!autoShownRef.current && pendingReminders.length > 0) {
      autoShownRef.current = true;
      setShowReminderPanel(true);
    }

      { includeMetadataChanges: true },
      (snap) => {

        // anything (or a background effect fired a write) before the
        // connection recovered, that blank state would get saved right

        // dropped connection, an ad-blocker interfering with a security
        // check, a brief outage) into permanent, real data loss. Now the
        // real data (or lack of it, on a first load) is left completely
        // untouched — data only ever comes from a real, successful

  const writeDoc = (ref, next) => {

    if (!docRef) return;

      t("This will import the older shared roster data into your account, replacing what's currently here. Continue?",

  useEffect(() => {

    const expiredNumbers = [];
    Object.keys(data.staff).forEach((num) => {

        if (!notifiedRef.current.has(key)) {

      // safe-retry protection as every other write — deliberately NOT
      // through persist(), since this isn't a user action and shouldn't
      // land on the Undo stack (someone hitting Undo expecting to revert

      // leave-expiry correction).

      // Built fresh from dataRef.current.staff (not a copy of data.staff
      // taken when this effect started) and only touching the specific
      // people whose leave just expired — anyone else's record, including
      // any change a concurrent duty assignment just made to it, passes
      // through completely untouched instead of being silently reverted
      // to how it looked when this effect began.
      const freshStaff = (dataRef.current && dataRef.current.staff) || data.staff;
      const nextStaff = { ...freshStaff };

  // render's closure, then spreads it as the base of what gets written to
  // Firestore. If two writes happen close together on the same screen —
  // e.g. adding a new leave type, then immediately marking two people on
  // leave with it — a later write's closure can still be holding a `data`
  // snapshot from BEFORE the earlier write's state update had committed.
  // Since every write is a full-document overwrite, not a merge, that
  // stale snapshot silently discards whatever the earlier write(s) just
  // added. dataRef is the fix: kept synchronously current (updated the
  // instant persist() runs, not waiting for React's next render), every
  // persist(...) call spreads dataRef.current instead of the closure

  const dataRef = useRef(data);

  // among themselves only run in the order they're declared in the

  // render where `data` goes from null to real data (right after

  // one had a chance to run, meaning they'd read dataRef.current still
  // holding its stale initial null — despite `data` itself already
  // being the real object. Assigning it plainly during render instead
  // means it's correct before any effect anywhere in this component can
  // possibly run, regardless of declaration order.
  dataRef.current = data;

  // last change is confirmed saved), "saving" (a write is in flight),
  // "error" (every retry failed so far, still retrying automatically in
  // the background). Drives both the small persistent status pill in the
  // toolbar (a 2-second toast alone isn't enough for something this
  // important — this stays up for as long as anything is actually
  // unresolved) and the tab-close warning below.
  const [saveStatus, setSaveStatus] = useState("idle");
  const pendingWritesRef = useRef(0);
  const retryTimerRef = useRef(null);

  // Shared by persist() below, undo/redo, and the auto-expire effect
  // further down — every single write this app makes, not just the
  // everyday "make a change" one, funnels through this exact same path.
  // That matters because dataRef syncing and the retry-with-fresh-state
  // logic (see the big comment inside) only protect a write if it
  // actually goes through here — a write made some other way, spreading
  // its own local `data` snapshot directly into docRef.set(), would
  // silently reintroduce the exact "rapid actions overwrite each other"
  // bug this was built to prevent. The auto-expire effect used to do
  // exactly that (a raw docRef.set() using its own closure's `data`,
  // completely bypassing this), which was a second, independent way the
  // same class of bug could happen — fixed by routing it through here.
  const writeToFirestore = (next) => {
    dataRef.current = next;
    setData(next);
    if (!docRef) return;

    pendingWritesRef.current += 1;
    setSaveStatus("saving");

    // 2s, then 6s, then every 15s until it finally goes through. Only a
    // handful of real causes make it here at all (deepStripUndefined
    // below already rules out the "malformed data" class): a genuine
    // network drop that offline persistence itself couldn't smooth over,
    // or a permissions/quota issue that a human needs to go fix — either
    // way, this keeps trying on its own rather than requiring the person
    // to notice a toast and manually retry.
    //
    // Critical detail: every attempt (including retries) re-reads
    // dataRef.current fresh at the moment it actually fires, rather than
    // reusing the snapshot from when this write was first requested.
    // Assign duty to several people quickly and it's normal for one save
    // to hit a transient hiccup while the next several succeed
    // immediately after — if THAT save's retry, firing seconds later,
    // wrote its own original (by-then outdated) snapshot instead of the
    // current one, it would silently overwrite and erase everyone
    // assigned in between. Always writing whatever dataRef.current holds
    // *right now* means a retry can only ever move the saved state
    // forward, never backward over other people's already-successful
    // saves.
    const attempt = (delayMs) => {
      const clean = deepStripUndefined(dataRef.current);
      docRef.set(clean)
        .then(() => {
          pendingWritesRef.current = Math.max(0, pendingWritesRef.current - 1);
          if (pendingWritesRef.current === 0) setSaveStatus("idle");

        .catch((e) => {

          setSaveStatus("error");

  // history is kept locally in this browser tab only (not synced via
  // Firestore) — each device's misclick recovery is its own.
  const persist = (next) => {
    setUndoStack((prev) => {
      const stack = [...prev, dataRef.current];

    writeToFirestore(next);

  // actually works even if someone closes the tab without reading any

  // (mid-retry after a failure, or a write still in flight), so it never
  // nags on a normal close.

  const [showSharePanel, setShowSharePanel] = useState(false);
  // ---------- About / credits ----------
  const [showAboutPanel, setShowAboutPanel] = useState(false);
  // ---------- Format all data (guarded multi-step confirmation) ----------
  const [showFormatModal, setShowFormatModal] = useState(false);
  const shareUrl = user ? `${window.location.origin}${window.location.pathname}?view=${user.uid}` : "";
  const toggleShare = () => {

  };

  // ---------- Google Drive daily auto-backup ----------
  // Uses Google Identity Services for OAuth with the narrow "drive.file"
  // scope, so this app can only see/write files it created itself — never
  // browse the rest of the Drive. The access token itself is still kept in
  // memory only (never written to localStorage/IndexedDB) — what's
  // remembered across visits is just "connected: yes/no" and the timestamp

  const DRIVE_FOLDER_NAME = "Nokri Book Backups";
  const driveConfigured = !!(window.GOOGLE_DRIVE_CLIENT_ID && window.GOOGLE_DRIVE_CLIENT_ID.indexOf("YOUR_") !== 0);

  // True, zero-click sending straight from the browser — no backend of this
  // app's own needed. Only active once all three placeholders in the
  // <head> config block are filled in with a real EmailJS account's
  // values; until then this silently stays off and performFormatAllData

  const emailjsConfigured = !!(

    window.EMAILJS_SERVICE_ID && window.EMAILJS_SERVICE_ID.indexOf("YOUR_") !== 0 &&

    // v4 of the EmailJS browser SDK (the CDN build loaded in <head>) takes
    // an options OBJECT here — { publicKey: ... } — not a bare string like
    // the older v3 SDK did. Passing a bare string silently leaves the key
    // unset, so every send() call afterward fails authentication and
    // performFormatAllData's catch handler falls back to the mailto draft

  const [driveConnected, setDriveConnected] = useState(() => localStorage.getItem("nb_drive_connected") === "1");

  // holds a usable token, which can never be shared between devices (each
  // browser has to individually grant Google access at least once — no
  // way around that without a backend server this app doesn't have). The
  // distinction matters for the panel below: "on for this account, but
  // this device needs its own one-time connect" reads very differently
  // from "not connected at all", and conflating the two was exactly what
  // made a second device look like Drive had never been set up.
  const driveEnabledForAccount = !!(data && data.driveEnabled);
  const [driveLastBackup, setDriveLastBackup] = useState(() => localStorage.getItem("nb_drive_last_backup") || "");
  const [driveBusy, setDriveBusy] = useState(false);
  const [driveNeedsReconnect, setDriveNeedsReconnect] = useState(false);
  const [showDrivePanel, setShowDrivePanel] = useState(false);
  const driveTokenClientRef = useRef(null);
  const driveFolderIdRef = useRef(localStorage.getItem("nb_drive_folder_id") || null);
  const driveAutoTriedRef = useRef(false);
  // In-memory-only cache of the last granted access token plus its expiry.
  // Reusing it (instead of asking Google for a fresh one on every single
  // backup) cuts way down on how often a silent renewal has to succeed at
  // all — each renewal is a chance for the browser to block it (third-party

  // showing up as "Drive keeps disconnecting itself". A 5-minute safety
  // margin is subtracted so a near-expiry token is never handed out.
  //
  // Also mirrored to sessionStorage (not localStorage — an OAuth access
  // token shouldn't outlive the tab) so a page refresh doesn't lose it:
  // driveTokenCacheRef alone is a plain in-memory ref, reset to empty on
  // every reload, which meant "Back up now" needed the full interactive
  // Google sign-in popup again after every single refresh even though
  // nothing had actually changed about the connection. Restoring from
  // sessionStorage on mount (below) fixes that — refreshing the tab keeps
  // working exactly like it did before the refresh, while closing the
  // tab (sessionStorage clears automatically) still correctly requires
  // reconnecting, same security boundary as before.
  const driveTokenCacheRef = useRef((() => {
    try {
      const raw = sessionStorage.getItem("nb_drive_token_cache");
      if (!raw) return { token: null, expiresAt: 0 };
      const parsed = JSON.parse(raw);
      if (parsed && parsed.token && Date.now() < parsed.expiresAt) return parsed;
    } catch (e) { /* corrupted or unavailable — just start fresh below */ }
    return { token: null, expiresAt: 0 };
  })());
  // Which Drive file id backs *today's* backup, and for which date — set
  // right after any successful backup so the on-close silent backup (below)
  // can update that exact file instantly, with no lookup round-trip, right
  // as the app is closing.
  const driveTodayFileRef = useRef({ date: "", fileId: null });

  const getDriveTokenClient = () => {
    if (!driveConfigured || typeof google === "undefined" || !google.accounts || !google.accounts.oauth2) return null;
    if (!driveTokenClientRef.current) {
      driveTokenClientRef.current = google.accounts.oauth2.initTokenClient({
        client_id: window.GOOGLE_DRIVE_CLIENT_ID,
        scope: DRIVE_SCOPE,
        callback: () => {}, // replaced per-request below
      });
    }
    return driveTokenClientRef.current;
  };

  const getCachedDriveToken = () => {
    const { token, expiresAt } = driveTokenCacheRef.current;
    return token && Date.now() < expiresAt ? token : null;
  };

  // interactive=true pops the Google consent screen (needed the first time,
  // or if a silent renewal fails); interactive=false tries a silent renewal
  // using the existing Google session and quietly gives up if that's not
  // possible (e.g. third-party cookies blocked, or consent was revoked).
  // A cached, still-valid token (see above) is reused first and skips
  // asking Google at all.
  const requestDriveToken = (interactive) => new Promise((resolve, reject) => {
    const cached = getCachedDriveToken();
    if (cached) { resolve(cached); return; }
    // For a non-interactive (automatic) request specifically: if there's no
    // cached token, stop here rather than calling into Google's token
    // client at all. Even with prompt:"" (meant to be silent), Google
    // Identity Services can still pop open a real, visible "choose an
    // account" window to complete the request instead of staying truly
    // invisible — especially with third-party cookie restrictions, and
    // especially for anyone who's never personally connected Drive on
    // this device. That's exactly what was happening: someone opens the
    // shared app link and immediately gets redirected into a Google
    // account chooser they never asked for. Skipping the call entirely
    // when there's nothing cached to reuse means the daily/overnight
    // auto-backup can only ever complete silently for real — never by
    // popping a window open on someone's screen unprompted. It just marks
    // "needs reconnect" instead, same as any other silent-renewal failure,
    // and the person can reconnect deliberately via the Drive panel
    // whenever they want to.
    if (!interactive) { reject(new Error("No cached Drive token — skipping silent renewal to avoid an unexpected sign-in popup")); return; }
    const client = getDriveTokenClient();
    if (!client) { reject(new Error("Google Drive isn't set up for this app yet")); return; }
    // Reconnecting after the app was closed (or the tab's session token
    // expired) doesn't mean access was actually revoked — Google still
    // remembers this app was granted drive.file permission, it's only the
    // short-lived access token that's gone. So even on a user-initiated
    // (interactive) reconnect, try a silent, no-dialog renewal first: if
    // the browser still has an active Google session, this reuses the
    // existing grant and returns a token with no popup at all — that's
    // what makes reconnecting feel instant instead of repeating full
    // account-chooser + permission-review screens every reopen. Only if
    // that silent attempt actually fails (session logged out, consent was
    // revoked, third-party cookies blocked, etc.) do we fall back to the
    // real consent prompt, since at that point Google does need the user.
    let triedSilent = false;
    client.callback = (resp) => {
      if (resp && resp.access_token) {
        // expires_in is in seconds; keep a 5-minute safety margin.
        const ttlMs = Math.max(0, ((resp.expires_in || 3300) - 300)) * 1000;
        const cacheEntry = { token: resp.access_token, expiresAt: Date.now() + ttlMs };
        driveTokenCacheRef.current = cacheEntry;
        try { sessionStorage.setItem("nb_drive_token_cache", JSON.stringify(cacheEntry)); } catch (e) { /* private browsing / storage full — the in-memory cache still works for this tab's current lifetime */ }
        resolve(resp.access_token);
      } else if (!triedSilent) {
        triedSilent = true;
        try { client.requestAccessToken({ prompt: "consent" }); }
        catch (e) { reject(e); }
      } else reject(new Error("No access token returned"));
    };
    client.error_callback = (err) => {
      if (!triedSilent) {
        triedSilent = true;
        try { client.requestAccessToken({ prompt: "consent" }); }
        catch (e) { reject(e); }
      } else reject(err || new Error("Google sign-in failed"));
    };
    try { client.requestAccessToken({ prompt: "" }); }
    catch (e) { reject(e); }
  });

  const findOrCreateDriveFolder = async (token) => {
    if (driveFolderIdRef.current) return driveFolderIdRef.current;
    const q = encodeURIComponent(`name='${DRIVE_FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
    const listRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`, {
      headers: { Authorization: `Bearer ${token}` },
    });
    const listData = await listRes.json();
    if (!listRes.ok) throw new Error(listData?.error?.message || `Drive API error (${listRes.status}) while looking up the backup folder`);
    if (listData.files && listData.files.length > 0) {
      driveFolderIdRef.current = listData.files[0].id;
    } else {
      const createRes = await fetch("https://www.googleapis.com/drive/v3/files", {
        method: "POST",
        headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({ name: DRIVE_FOLDER_NAME, mimeType: "application/vnd.google-apps.folder" }),
      });
      if (!createRes.ok) {
        const errBody = await createRes.json().catch(() => null);
        throw new Error(errBody?.error?.message || `Couldn't create the Drive backup folder (${createRes.status})`);
      }
      const created = await createRes.json();
      driveFolderIdRef.current = created.id;
    }
    localStorage.setItem("nb_drive_folder_id", driveFolderIdRef.current);
    return driveFolderIdRef.current;
  };

  // One file per calendar day: if today's backup already exists (e.g. the
  // app was opened twice today) it's updated in place rather than
  // duplicated, so the folder gains at most one new file per day. Returns
  // the file id so the caller can cache it for instant reuse later (see
  // driveTodayFileRef above).
  const uploadBackupToDrive = async (token, folderId, jsonStr, { keepalive } = {}) => {
    const fileName = `nokri-book-backup-${todayStr()}.json`;
    let existingId = driveTodayFileRef.current.date === todayStr() ? driveTodayFileRef.current.fileId : null;
    if (!existingId) {
      const q = encodeURIComponent(`name='${fileName}' and '${folderId}' in parents and trashed=false`);
      const listRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id)`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      const listData = await listRes.json();
      if (!listRes.ok) throw new Error(listData?.error?.message || `Drive API error (${listRes.status}) while checking for today's backup file`);
      existingId = listData.files && listData.files[0] && listData.files[0].id;
    }
    const boundary = "nbbackup" + uid();
    const metadata = existingId ? { name: fileName } : { name: fileName, parents: [folderId] };
    const body =
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
      `--${boundary}\r\nContent-Type: application/json\r\n\r\n${jsonStr}\r\n--${boundary}--`;
    const url = existingId
      ? `https://www.googleapis.com/upload/drive/v3/files/${existingId}?uploadType=multipart`
      : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
    const res = await fetch(url, {
      method: existingId ? "PATCH" : "POST",
      headers: { Authorization: `Bearer ${token}`, "Content-Type": `multipart/related; boundary=${boundary}` },
      body,
      // keepalive lets this request finish even after the tab has started
      // closing/navigating away — used only for the silent on-close backup.
      ...(keepalive ? { keepalive: true } : {}),
    });
    if (!res.ok) {
      const errBody = await res.json().catch(() => null);
      throw new Error(errBody?.error?.message || `Drive upload failed (${res.status})`);
    }
    const fileId = existingId || (await res.json().catch(() => null))?.id || null;
    if (fileId) driveTodayFileRef.current = { date: todayStr(), fileId };
    return fileId;
  };

  // interactive=true (from the "Connect" / "Back up now" buttons) shows
  // toasts and may pop the consent screen. interactive=false (the once-a-day
  // automatic run, the online-reconnect retry, and the on-close backup)
  // stays silent — on failure it just flags "needs reconnect" instead of
  // interrupting whoever opened the app.
  const backupToDrive = useCallback(async ({ interactive, keepalive } = {}) => {
    if (!driveConfigured) { if (interactive) showToast(t("Google Drive isn't set up for this app yet", "આ એપ માટે Google Drive હજુ સેટ થયું નથી"), "error"); return; }
    if (!data) return;
    setDriveBusy(true);
    try {
      const token = await requestDriveToken(interactive);
      setDriveNeedsReconnect(false);
      const folderId = await findOrCreateDriveFolder(token);
      await uploadBackupToDrive(token, folderId, JSON.stringify(data, null, 2), { keepalive });
      const now = new Date().toISOString();
      localStorage.setItem("nb_drive_last_backup", now);
      localStorage.setItem("nb_drive_connected", "1");
      setDriveLastBackup(now);
      setDriveConnected(true);
      // Only actually writes to Firestore the first time (or if it was
      // somehow false) — every other successful backup after that is a
      // no-op here, so this doesn't turn "back up daily" into "write an
      // extra Firestore document every single day" for no reason.
      if (!dataRef.current.driveEnabled) persist({ ...dataRef.current, driveEnabled: true });
      recordBackupNow();
      if (interactive) showToast(t("Backed up to Google Drive", "Google Drive પર બેકઅપ થયું"));
    } catch (e) {
      console.warn("Drive backup failed", e);
      if (interactive) showToast(t(`Couldn't back up to Google Drive: ${e.message || "unknown error"}`, `Google Drive પર બેકઅપ થઈ શક્યું નથી: ${e.message || "અજ્ઞાત ભૂલ"}`), "error");
      else setDriveNeedsReconnect(true);
    } finally {
      setDriveBusy(false);
    }
  }, [data, driveConfigured]);

  const disconnectDrive = () => {
    localStorage.removeItem("nb_drive_connected");
    localStorage.removeItem("nb_drive_last_backup");
    localStorage.removeItem("nb_drive_folder_id");
    driveFolderIdRef.current = null;
    driveTokenCacheRef.current = { token: null, expiresAt: 0 };
    try { sessionStorage.removeItem("nb_drive_token_cache"); } catch (e) {}
    driveTodayFileRef.current = { date: "", fileId: null };
    setDriveConnected(false);
    setDriveLastBackup("");
    setDriveNeedsReconnect(false);
    // Also turns Drive backup off for the whole account, not just this
    // device — matches what "Disconnect" reads as: stopping the feature,
    // not just forgetting this one browser's token. Any other device that
    // still has its own cached token will simply stop being asked to
    // auto-backup once it next syncs this change.
    if (dataRef.current.driveEnabled) persist({ ...dataRef.current, driveEnabled: false });
    showToast(t("Disconnected from Google Drive", "Google Drive થી ડિસકનેક્ટ થયું"));
  };

  // Once a day, quietly try to back up — no dialogs unless a reconnect turns
  // out to be needed. Only fires once per page load, a few seconds after
  // data is ready so it never competes with the initial render. Because this
  // only runs while the app is open, it backs up on the first visit each
  // day rather than at a fixed clock time.
  useEffect(() => {
    if (!data || !driveConfigured || !driveConnected || driveAutoTriedRef.current) return;
    const last = localStorage.getItem("nb_drive_last_backup");
    const lastDate = last ? last.slice(0, 10) : "";
    if (lastDate === todayStr()) return;
    driveAutoTriedRef.current = true;
    const t = setTimeout(() => { backupToDrive({ interactive: false }); }, 3000);
    return () => clearTimeout(t);
  }, [data, driveConnected, driveConfigured, backupToDrive]);

  // A specific overnight (2:00–2:04 AM local time) attempt, in addition to
  // the "first visit each day" one above — similar in spirit to how
  // WhatsApp times its own backups for a quiet window. This can only run
  // while the app/tab is actually open at 2am (there's no way for a plain
  // browser page to wake up on its own once closed — that would need a
  // background server, which this app doesn't have), so it mainly helps
  // when the app is left open overnight on a desktop, or running as an
  // installed PWA. Checks the clock once a minute rather than trying to
  // calculate an exact fire time, since the tab could be backgrounded/
  // throttled by the browser for stretches at that hour. Both this and the
  // "first visit" backup above check the same "already done today" flag,
  // so whichever happens to fire first for the day silently covers the
  // other — no duplicate backups. The manual "Backup now" button and the
  // in-app backup reminder banner are both untouched by this — they stay
  // as the reliable fallback for whenever nothing was open overnight.
  useEffect(() => {
    if (!driveConfigured || !driveConnected) return;
    const checkOvernightWindow = () => {
      if (!data) return;
      const now = new Date();
      if (now.getHours() !== 2 || now.getMinutes() >= 5) return;
      const last = localStorage.getItem("nb_drive_last_backup");
      const lastDate = last ? last.slice(0, 10) : "";
      if (lastDate === todayStr()) return;
      backupToDrive({ interactive: false });
    };
    const id = setInterval(checkOvernightWindow, 60000);
    return () => clearInterval(id);
  }, [data, driveConnected, driveConfigured, backupToDrive]);

  // Keep a valid access token cached at all times while the tab is open —
  // completely independent of whether a backup has already run today. This
  // is what actually fixes "backup on close doesn't work": the on-close
  // handler below can only send anything if a token is ALREADY cached (it
  // can't wait on an async request while the page is unloading), and the
  // once-a-day effect above skips itself entirely on a same-day revisit —
  // so without this, reopening the app later the same day (after an
  // earlier successful backup) left the in-memory token cache empty for
  // the rest of that session, and every close from then on silently had
  // nothing to send. This warms the cache shortly after connecting, then
  // re-warms it every 45 minutes (before the ~55-minute token lifetime
  // runs out) for as long as the tab stays open.
  useEffect(() => {
    if (!driveConfigured || !driveConnected) return;
    const warm = () => { if (!getCachedDriveToken()) requestDriveToken(false).catch(() => {}); };
    const t = setTimeout(warm, 1500);
    const interval = setInterval(warm, 45 * 60 * 1000);
    return () => { clearTimeout(t); clearInterval(interval); };
  }, [driveConfigured, driveConnected]);

  // If a previous silent renewal failed (driveNeedsReconnect), retry
  // automatically the moment the browser reports it's back online, instead
  // of leaving the "Drive ⚠" state sitting there until the person notices
  // and taps Connect themselves. This is what fixes most of the "silent
  // renewal fails once, so Drive just stays disconnected" cases — patchy
  // duty-room wifi dropping mid-session, not an actual revoked connection.
  useEffect(() => {
    if (!driveConfigured || !driveConnected) return;
    const onOnline = () => { if (driveNeedsReconnect) backupToDrive({ interactive: false }); };
    window.addEventListener("online", onOnline);
    return () => window.removeEventListener("online", onOnline);
  }, [driveConfigured, driveConnected, driveNeedsReconnect, backupToDrive]);

  // Silent backup the moment the app is closed, backgrounded, or the tab is
  // hidden — this is the actual "secure my data on close" safety net.
  // "visibilitychange" fires reliably when a tab is closed, switched away
  // from, or the app is backgrounded on mobile (unlike "beforeunload",
  // which mobile browsers often skip); "pagehide" is added as a second,
  // overlapping trigger for browsers that fire one but not the other. Both
  // reuse a cached access token and cached today's-file id (see above) so
  // the request can go out immediately with no round-trip, and both use a
  // keepalive fetch so the browser finishes sending it even after the page
  // has started unloading. If there's no cached token yet (nothing to reuse
  // without an interactive prompt) or Drive was never connected, this is a
  // silent no-op — the roster is still safe either way, since every change
  // is already saved live to the account's Firestore document as it
  // happens; this is only an extra copy.
  useEffect(() => {
    if (!driveConfigured) return;
    const attemptSilentClose = () => {
      if (!driveConnected || !data) return;
      const token = getCachedDriveToken();
      const folderId = driveFolderIdRef.current;
      if (!token || !folderId) return;
      uploadBackupToDrive(token, folderId, JSON.stringify(data, null, 2), { keepalive: true })
        .then(() => {
          const now = new Date().toISOString();
          try {
            localStorage.setItem("nb_drive_last_backup", now);
            localStorage.setItem("nb_drive_connected", "1");
            localStorage.setItem("nb_last_backup_at", now);
          } catch (e) {}
        })
        .catch(() => {}); // silent by design — the tab is closing regardless
    };
    const onVisibility = () => { if (document.visibilityState === "hidden") attemptSilentClose(); };
    document.addEventListener("visibilitychange", onVisibility);
    window.addEventListener("pagehide", attemptSilentClose);
    return () => {
      document.removeEventListener("visibilitychange", onVisibility);
      window.removeEventListener("pagehide", attemptSilentClose);
    };
  }, [driveConfigured, driveConnected, data]);

  const undo = useCallback(() => {
    setUndoStack((stack) => {
      if (stack.length === 0) return stack;
      const prevState = stack[stack.length - 1];
      const actionDesc = lastActionRef.current;
      setRedoStack((r) => [...r, data]);
      writeToFirestore(prevState);
      showToastRaw(actionDesc ? t(`Undone: ${actionDesc}`, `પૂર્વવત્ થયું: ${actionDesc}`) : t("Undone — last change reverted", "પૂર્વવત્ થયું — છેલ્લો ફેરફાર રદ થયો"));
      return stack.slice(0, -1);
    });
  }, [data]);

  const redo = useCallback(() => {
    setRedoStack((stack) => {
      if (stack.length === 0) return stack;
      const nextState = stack[stack.length - 1];
      const actionDesc = lastActionRef.current;
      setUndoStack((u) => [...u, data]);
      writeToFirestore(nextState);
      showToastRaw(actionDesc ? t(`Redone: ${actionDesc}`, `ફરીથી કરાયું: ${actionDesc}`) : t("Redone", "ફરીથી કરાયું"));
      return stack.slice(0, -1);
    });
  }, [data]);

  // Ctrl/Cmd+Z to undo, Ctrl/Cmd+Shift+Z or Ctrl/Cmd+Y to redo, Ctrl/Cmd+K
  // opens the command palette, and "/" jumps straight into whichever
  // search box is on screen (or opens the palette if there isn't one) —
  // all skipped while typing in a text field so they don't fight normal
  // typing or the browser's own per-input undo.
  useEffect(() => {
    const onKeyDown = (e) => {
      const tag = (e.target && e.target.tagName) || "";
      const typing = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
        e.preventDefault();
        setShowCommandPalette(true);
        return;
      }
      if (!typing && e.key === "/") {
        e.preventDefault();
        const el = document.getElementById("app-search-input");
        if (el) el.focus(); else setShowCommandPalette(true);
        return;
      }
      if (typing) return;
      if (!(e.ctrlKey || e.metaKey)) return;
      const key = e.key.toLowerCase();
      if (key === "z" && !e.shiftKey) { e.preventDefault(); undo(); }
      else if ((key === "z" && e.shiftKey) || key === "y") { e.preventDefault(); redo(); }
    };
    window.addEventListener("keydown", onKeyDown);
    return () => window.removeEventListener("keydown", onKeyDown);
  }, [undo, redo]);

  // ---------- recycle bin ----------
  const MAX_RECYCLE_ITEMS = 300;
  const withRecycled = (base, item) => {
    const entry = { id: uid(), deletedAt: todayStr(), ts: Date.now(), ...item };
    const bin = [entry, ...((base.recycleBin) || [])].slice(0, MAX_RECYCLE_ITEMS);
    return { ...base, recycleBin: bin };
  };
  const restoreFromRecycleBin = (id) => {
    if (!data) return;
    const item = (data.recycleBin || []).find((r) => r.id === id);
    if (!item) return;
    const nextBin = (data.recycleBin || []).filter((r) => r.id !== id);
    let next = { ...data, recycleBin: nextBin };
    if (item.type === "category") {
      const exists = next.categories.find((c) => c.id === item.payload.category.id);
      next.categories = exists ? next.categories : [...next.categories, item.payload.category];
      next.membership = { ...next.membership, [item.payload.category.id]: item.payload.membership };
    } else if (item.type === "staff") {
      next.staff = { ...next.staff, [item.payload.staffRecord.number]: item.payload.staffRecord };
      const nextMembership = { ...next.membership };
      (item.payload.memberships || []).forEach(({ catId, entry }) => {
        if (!nextMembership[catId]) return;
        const already = nextMembership[catId].some((m) => m.number === entry.number);
        nextMembership[catId] = already ? nextMembership[catId] : [...nextMembership[catId], entry];
      });
      next.membership = nextMembership;
    } else if (item.type === "membership") {
      const list = next.membership[item.payload.catId] || [];
      const already = list.some((m) => m.number === item.payload.entry.number);
      next.membership = { ...next.membership, [item.payload.catId]: already ? list : [...list, item.payload.entry] };
    } else if (item.type === "history") {
      const list = next.membership[item.payload.catId] || [];
      next.membership = {
        ...next.membership,
        [item.payload.catId]: list.map((m) => {
          const snap = (item.payload.snapshot || []).find((s) => s.number === m.number);
          return snap ? { ...m, history: snap.history } : m;
        }),
      };
    }
    persist(next);
    showToast(t(`Restored "${item.label}"`, `"${item.label}" પુનઃસ્થાપિત થયું`));
  };
  const deleteFromRecycleBinForever = (id) => {
    if (!data) return;
    if (!window.confirm(t("Delete this permanently? It cannot be restored after this.", "આ કાયમ માટે ડિલીટ કરવું છે? આ પછી પુનઃસ્થાપિત કરી શકાશે નહીં."))) return;
    persist({ ...dataRef.current, recycleBin: (data.recycleBin || []).filter((r) => r.id !== id) });
  };
  const emptyRecycleBin = () => {
    if (!data) return;
    if (!window.confirm(t("Empty the recycle bin? Everything in it will be permanently deleted.", "રિસાયકલ બિન ખાલી કરવું છે? તેમાંનું બધું કાયમ માટે ડિલીટ થઈ જશે."))) return;
    persist({ ...dataRef.current, recycleBin: [] });
    showToast(t("Recycle bin emptied", "રિસાયકલ બિન ખાલી થયું"));
  };

  // ---------- category / membership mutations ----------
  // Generic reorder for any array-of-{id,...} list in data (work types,
  // designations, leave types, outstation types) — moves the dragged item
  // to sit where the drop target was. Also powers the ▲/▼ buttons: those
  // pass the neighbour's id as targetId, which lands on the exact same code
  // path as a drag-and-drop.
  const reorderList = (key, draggedId, targetId) => {
    if (!data || draggedId === targetId) return;
    const list = data[key] || [];
    const fromIdx = list.findIndex((x) => x.id === draggedId);
    const toIdx = list.findIndex((x) => x.id === targetId);
    if (fromIdx === -1 || toIdx === -1) return;
    const next = [...list];
    const [moved] = next.splice(fromIdx, 1);
    next.splice(toIdx, 0, moved);
    persist({ ...dataRef.current, [key]: next });
  };

  const addCategory = (label) => {
    const clean = (label || "").trim();
    if (!clean || !data) return;
    const id = slugify(clean) + "-" + uid().slice(0, 4);
    persist({
      ...dataRef.current,
      categories: [...data.categories, { id, label: clean }],
      membership: { ...data.membership, [id]: [] },
    });
    setView({ mode: "category", catId: id });
    showToast(t(`Added work type "${clean}"`, `કામનો પ્રકાર "${clean}" ઉમેરાયો`));
  };
  const renameCategory = (id) => {
    const cur = data.categories.find((c) => c.id === id);
    const next = window.prompt(t("Rename work type:", "કામનો પ્રકાર નામ બદલો:"), cur ? cur.label : "");
    if (!next || !next.trim() || !data) return;
    persist({ ...dataRef.current, categories: data.categories.map((c) => c.id === id ? { ...c, label: next.trim() } : c) });
  };
  const deleteCategory = (id) => {
    const cur = data.categories.find((c) => c.id === id);
    if (!window.confirm(t(`Delete work type "${cur ? cur.label : id}"? It will move to the Recycle bin and can be restored later.`, `કામનો પ્રકાર "${cur ? cur.label : id}" ડિલીટ કરવો છે? તે રિસાયકલ બિનમાં જશે અને પછીથી પુનઃસ્થાપિત કરી શકાશે.`))) return;
    const nextCats = data.categories.filter((c) => c.id !== id);
    const nextMembership = { ...data.membership };
    const removedMembership = nextMembership[id] || [];
    delete nextMembership[id];
    const recycled = withRecycled({ ...data, categories: nextCats, membership: nextMembership }, {
      type: "category",
      label: cur ? cur.label : id,
      payload: { category: cur || { id, label: id }, membership: removedMembership },
    });
    persist(recycled);
    showToast(t(`Moved "${cur ? cur.label : id}" to Recycle bin`, `"${cur ? cur.label : id}" રિસાયકલ બિનમાં ખસેડાયું`));
    if (view.catId === id) setView({ mode: "category", catId: nextCats[0] ? nextCats[0].id : null });
  };

  const updateMembership = (catId, updater) => {
    if (!data) return;
    const list = data.membership[catId] || [];
    persist({ ...dataRef.current, membership: { ...data.membership, [catId]: updater(list) } });
  };

  const addToCategory = (catId, number, name, date) => {
    const num = (number || "").trim();
    const cleanName = (name || "").trim();
    if (!num) { showToast(t("Enter a workplace number", "કાર્યસ્થળ નંબર દાખલ કરો")); return; }
    const existing = data.staff[num];
    if (!existing && !cleanName) { showToast(t("New number — enter the staff name too", "નવો નંબર — સ્ટાફનું નામ પણ દાખલ કરો")); return; }
    const already = (data.membership[catId] || []).some((m) => m.number === num);
    if (already) { showToast(t("Already listed in this work type", "આ કામના પ્રકારમાં પહેલેથી સૂચિબદ્ધ છે")); return; }
    const dutyDate = date || todayStr();
    if (!confirmDutyOverride(data, num, dutyDate, catId, existing ? existing.name : cleanName)) return;
    const nextStaff = existing ? data.staff : { ...data.staff, [num]: { number: num, name: cleanName, unavailable: null, designation: null } };
    const nextMembership = {
      ...data.membership,
      [catId]: [...(data.membership[catId] || []), { number: num, lastDuty: dutyDate, history: [], skip: false }],
    };
    persist({ ...dataRef.current, staff: nextStaff, membership: nextMembership });
    showToast(t(`${existing ? existing.name : cleanName} added`, `${existing ? existing.name : cleanName} ઉમેરાયું`));
  };

  // Wipes every duty/operational record in the account back to a clean
  // slate — membership history, last-duty dates, per-work-type and global
  // Skip flags, Leave/Outstation status, the skip log, recycle bin, events,
  // and reminder acknowledgements — while deliberately keeping the setup
  // that took real effort to build: every staff member's name, buckle
  // number, phone, and designation; the designations list itself; the work
  // types (and their order); and the leave/outstation TYPE lists. This is
  // meant for "start the new rotation year clean" without re-entering the
  // whole staff roster and work-type setup from scratch. Goes through
  // persist() like every other change, so — same as any other action in
  // this app — it can still be reverted with Undo right after, as one more
  // safety net.
  //
  // Guarded by a 3-step confirmation (FormatAllDataModal, below): a plain
  // warning, typing the exact phrase "format all data", and the buckle
  // number of the person actually doing it — before anything is touched.
  // Opening that modal is all this entry point does now; the real wipe
  // happens in performFormatAllData once the modal's own confirm fires.
  const formatAllData = () => { if (data) setShowFormatModal(true); };

  // Runs the actual wipe (see formatAllData above) once the modal's 3-step
  // confirmation has completed, then records who did it (by buckle number,
  // with their name looked up from the roster that still exists at this
  // point — it's read BEFORE the wipe clears anything) and when, by email
  // to the signed-in account's own email address. Sent automatically via
  // EmailJS with zero further clicks when it's configured (see the
  // <head> config block); otherwise falls back to opening a pre-filled
  // mailto draft in the person's own mail app for them to send instead —
  // still a real record, just not a silent one.
  const performFormatAllData = (buckleNumber) => {
    if (!data) return;
    const staffRec = data.staff[buckleNumber];
    // Belt-and-braces: FormatAllDataModal already only allows Step 3 to be
    // confirmed with a buckle number that matches someone on the staff
    // list, but the actual wipe checks that match again right here too,
    // rather than trusting the modal was the only possible caller.
    if (!staffRec) return;
    const personName = staffRec.name;
    const whenText = new Date().toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
    const cleanStaff = {};
    Object.values(data.staff || {}).forEach((s) => {
      cleanStaff[s.number] = { number: s.number, name: s.name, phone: s.phone || null, designation: s.designation || null, unavailable: null, unavailableHistory: [] };
    });
    const cleanMembership = {};
    Object.keys(data.membership || {}).forEach((catId) => {
      cleanMembership[catId] = (data.membership[catId] || []).map((m) => ({ number: m.number, lastDuty: null, history: [], skip: false }));
    });
    persist({
      ...dataRef.current,
      staff: cleanStaff,
      membership: cleanMembership,
      skipLog: [],
      recycleBin: [],
      events: [],
      reminderAcks: {},
    });
    if (user && user.email) {
      const subject = "Nokri Book — all duty data was formatted";
      const performedByLine = `Performed by: ${personName} (buckle number ${buckleNumber})`;
      const bodyLines = [
        "This confirms that all duty data in Nokri Book was cleared.",
        "",
        performedByLine,
        `Time: ${whenText}`,
        "",
        "Staff names, designations, and work types were kept. All duty history, last-duty dates, Skip status, Leave/Outstation records, skip history, recycle bin, and events were erased.",
      ];
      const messageText = bodyLines.join("\n");
      if (emailjsConfigured) {
        emailjs.send(window.EMAILJS_SERVICE_ID, window.EMAILJS_TEMPLATE_ID, {
          to_email: user.email,
          subject,
          message: messageText,
          person_name: personName || "",
          buckle_number: buckleNumber,
          time: whenText,
        }).then(() => {
          showToastRaw(t("Confirmation email sent automatically.", "પુષ્ટિ ઈમેલ આપમેળે મોકલાયો."));
        }).catch((e) => {
          console.warn("EmailJS send failed, falling back to mailto", e);
          const reason = (e && (e.text || e.message)) || t("unknown error", "અજ્ઞાત ભૂલ");
          showToastRaw(t(`Automatic email failed (${reason}) — opening a draft to send manually instead.`, `આપમેળે ઈમેલ મોકલવામાં નિષ્ફળ (${reason}) — તેના બદલે જાતે મોકલવા માટે ડ્રાફ્ટ ખોલી રહ્યા છીએ.`), "error");
          const mailtoUrl = `mailto:${encodeURIComponent(user.email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(messageText)}`;
          const a = document.createElement("a");
          a.href = mailtoUrl;
          a.click();
        });
      } else {
        const mailtoUrl = `mailto:${encodeURIComponent(user.email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(messageText)}`;
        const a = document.createElement("a");
        a.href = mailtoUrl;
        a.click();
      }
    }
    showToastRaw(t("All duty data cleared — staff, designations, and work types kept.", "બધો ડ્યુટી ડેટા સાફ થયો — સ્ટાફ, હોદ્દાઓ અને કામના પ્રકારો સચવાયા."));
  };


  const clearCategoryHistory = (catId) => {
    const cur = data.categories.find((c) => c.id === catId);
    const label = cur ? cur.label : catId;
    if (!window.confirm(t(`Clear all duty history for "${label}"? Last duty dates and the roster stay the same — the cleared entries move to the Recycle bin and can be restored.`, `"${label}" માટેનો બધો ડ્યુટી ઇતિહાસ સાફ કરવો છે? છેલ્લી ડ્યુટીની તારીખો અને રોસ્ટર એ જ રહેશે — સાફ કરેલી એન્ટ્રીઓ રિસાયકલ બિનમાં જશે અને પુનઃસ્થાપિત કરી શકાશે.`))) return;
    const list = data.membership[catId] || [];
    const nextMembership = { ...data.membership, [catId]: list.map((m) => ({ ...m, history: [] })) };
    const recycled = withRecycled({ ...data, membership: nextMembership }, {
      type: "history",
      label: `${label} history (${list.reduce((n, m) => n + (m.history || []).length, 0)} entries)`,
      payload: { catId, catLabel: label, snapshot: list },
    });
    persist(recycled);
    showToast(t(`History cleared for "${label}" — moved to Recycle bin`, `"${label}" માટે ઇતિહાસ સાફ થયો — રિસાયકલ બિનમાં ખસેડાયો`));
  };
  // Deletes just the picked history entries (gallery-style multi-select),
  // leaving the rest of each member's history untouched. Identified by
  // number + their position in that member's own history array, so the
  // deletion is exact regardless of how entries are sorted for display.
  const deleteHistoryEntries = (catId, selectedKeys) => {
    if (!selectedKeys || selectedKeys.size === 0) return;
    const cur = data.categories.find((c) => c.id === catId);
    const label = cur ? cur.label : catId;
    const list = data.membership[catId] || [];
    const byNumber = {};
    selectedKeys.forEach((key) => {
      const sep = key.lastIndexOf("#");
      const number = key.slice(0, sep);
      const idx = parseInt(key.slice(sep + 1), 10);
      (byNumber[number] = byNumber[number] || new Set()).add(idx);
    });
    const affectedNumbers = new Set(Object.keys(byNumber));
    const snapshot = list.filter((m) => affectedNumbers.has(m.number)).map((m) => ({ number: m.number, history: m.history || [] }));
    const nextMembership = {
      ...data.membership,
      [catId]: list.map((m) => {
        const idxSet = byNumber[m.number];
        if (!idxSet) return m;
        return { ...m, history: (m.history || []).filter((_, i) => !idxSet.has(i)) };
      }),
    };
    const count = selectedKeys.size;
    const recycled = withRecycled({ ...data, membership: nextMembership }, {
      type: "history",
      label: `${label} history (${count} ${count === 1 ? "entry" : "entries"} deleted)`,
      payload: { catId, catLabel: label, snapshot },
    });
    persist(recycled);
    showToast(t(`${count} history ${count === 1 ? "entry" : "entries"} deleted — moved to Recycle bin`, `${count} ઇતિહાસ ${count === 1 ? "એન્ટ્રી" : "એન્ટ્રીઓ"} ડિલીટ થઈ — રિસાયકલ બિનમાં ખસેડાયું`));
  };
  const removeFromCategory = (catId, number) => {
    const cur = data.categories.find((c) => c.id === catId);
    const label = cur ? cur.label : catId;
    const list = data.membership[catId] || [];
    const entry = list.find((m) => m.number === number);
    if (!entry) return;
    const staffRec = data.staff[number];
    const nextMembership = { ...data.membership, [catId]: list.filter((m) => m.number !== number) };
    const recycled = withRecycled({ ...data, membership: nextMembership }, {
      type: "membership",
      label: `${staffRec ? staffRec.name : number} — ${label}`,
      payload: { catId, catLabel: label, entry },
    });
    persist(recycled);
    showToast(t(`Removed from "${label}" — moved to Recycle bin`, `"${label}" માંથી કાઢી નાખ્યું — રિસાયકલ બિનમાં ખસેડાયું`));
  };
  // "Skip" (marked absent) set from Manage Staff is a GLOBAL flag on the
  // person, not on a single work type's membership row — so marking
  // someone absent here reflects everywhere they're rostered (the duty
  // calendar deliberately excludes skipped people entirely, though — see
  // awayForDate in CalendarView). Un-marking Skip (putting someone back to
  // Present) needs no confirmation or note — only turning Skip ON does, via
  // skipPersonWithLog below. See setSkipInCategory / skipInCategoryWithLog
  // just below for the work-type-scoped equivalent of this pair.
  const setSkip = (number, skip) => {
    const staffRec = data.staff[number];
    if (!staffRec) return;
    persist({ ...dataRef.current, staff: { ...data.staff, [number]: { ...staffRec, skip } } });
  };
  // "Set Present" from Manage Staff needs to be a full reset, not just
  // the global flag — otherwise anyone who also has a local (per-work-type)
  // skip flag set stays stuck showing Skip in that work type even after
  // this clears the global one. Sets skip=false on the staff record AND
  // on every membership row for this number, across every work type, in
  // one persist.
  const setPresentEverywhere = (number) => {
    const staffRec = data.staff[number];
    const nextMembership = {};
    Object.keys(data.membership || {}).forEach((catId) => {
      nextMembership[catId] = (data.membership[catId] || []).map((m) => m.number === number ? { ...m, skip: false } : m);
    });
    persist({
      ...dataRef.current,
      staff: staffRec ? { ...data.staff, [number]: { ...staffRec, skip: false } } : data.staff,
      membership: nextMembership,
    });
  };
  // Marks someone Skip globally — this always runs instantly, no
  // confirmation step (byNumber/byName/note are always blank from every
  // current caller; the fields still exist in skipLog in case a future
  // caller wants to pass them, but nothing in the UI does right now).
  // Flips the flag and permanently records the entry — who was skipped
  // and date + time — in data.skipLog, stored in the app's own data,
  // synced like everything else, so it can never be lost when the browser
  // closes.

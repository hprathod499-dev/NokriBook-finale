  const skipPersonWithLog = (number, name, note, byNumber, byName) => {
    const staffRec = data.staff[number];
    if (!staffRec) return;
    const now = Date.now();
    const logEntry = { id: uid(), number, name, note: note.trim(), date: todayStr(), ts: now, byNumber, byName, scope: "global" };
    persist({
      ...dataRef.current,
      staff: { ...data.staff, [number]: { ...staffRec, skip: true } },
      skipLog: [...(data.skipLog || []), logEntry],
    });
    showToast(t(`${name} marked Skip (all work types) — logged in Skip history`, `${name} ને સ્કિપ તરીકે માર્ક કર્યું (બધા કામના પ્રકારો) — સ્કિપ ઇતિહાસમાં નોંધાયું`));
  };
  // The work-type-scoped counterpart of setSkip: flips the skip flag on
  // just this one category's membership row, leaving the person's global
  // flag and every other work type's row untouched. Used for turning Skip
  // OFF from inside a work type (no confirmation needed, same as setSkip),
  // and internally by skipInCategoryWithLog below for turning it ON.
  const setSkipInCategory = (catId, number, skip) => {
    updateMembership(catId, (list) => list.map((m) => m.number === number ? { ...m, skip } : m));
  };
  // "Present" clicked from inside a work type needs to actually make the
  // person show as Present *in that work type*, no matter which of the
  // two independent flags (see effectiveStatus) put them on Skip — the
  // global one from Manage Staff, the local one on this category's row,
  // or (from old/edge-case data) both at once. Clearing only one of them
  // left people stuck showing Skip when the other flag was still set, so
  // this clears both in a single persist rather than leaving it to
  // whichever single flag happened to be the one that mattered here.
  const setPresentInCategory = (catId, number) => {
    const staffRec = data.staff[number];
    const list = data.membership[catId] || [];
    persist({
      ...dataRef.current,
      staff: staffRec ? { ...data.staff, [number]: { ...staffRec, skip: false } } : data.staff,
      membership: { ...data.membership, [catId]: list.map((m) => m.number === number ? { ...m, skip: false } : m) },
    });
  };
  // Marks someone Skip within a single work type — same optional
  // badge-number/note as the global version above, just scoped to this one
  // category's membership row; every other work type this person is on
  // keeps rostering them normally. Still logged to the shared
  // data.skipLog (tagged with which work type), so Skip history stays the
  // one place that records every Skip, global or local.
  const skipInCategoryWithLog = (catId, catLabel, number, name, note, byNumber, byName) => {
    const now = Date.now();
    const logEntry = { id: uid(), number, name, note: note.trim(), date: todayStr(), ts: now, byNumber, byName, scope: "category", catId, catLabel };
    const list = data.membership[catId] || [];
    persist({
      ...dataRef.current,
      membership: { ...data.membership, [catId]: list.map((m) => m.number === number ? { ...m, skip: true } : m) },
      skipLog: [...(data.skipLog || []), logEntry],
    });
    showToast(t(`${name} marked Skip in "${catLabel}" — logged in Skip history`, `${name} ને "${catLabel}" માં સ્કિપ તરીકે માર્ક કર્યું — સ્કિપ ઇતિહાસમાં નોંધાયું`));
  };
  const setLastDuty = (catId, number, date) => {
    if (!date) return;
    const staffRec = data.staff[number];
    if (!confirmDutyOverride(data, number, date, catId, staffRec ? staffRec.name : number)) return;
    updateMembership(catId, (list) => list.map((m) => m.number === number ? { ...m, lastDuty: date } : m));
  };
  // date defaults to today but can be any date (e.g. tomorrow, for the
  // nightly "assign tomorrow's duty" workflow) — set via the calendar
  // field in AssignDutyModal.
  //
  // Manually assigning someone a duty needs to also clear both of their
  // Skip flags (global, from Manage Staff, AND local, from this one work
  // type's roster) — otherwise the duty gets logged fine, but they keep
  // showing as Skip afterward (effectiveStatus checks skip before
  // anything else), which reads as "the duty is assigned but Skip isn't
  // changing." Assigning them a duty is an explicit statement that
  // they're available, so both flags come off in the same update, same
  // as setPresentInCategory already does for the status dropdown.
  const assignDuty = (catId, number, name, note, date) => {
    const dutyDate = date || todayStr();
    if (!confirmDutyOverride(data, number, dutyDate, catId, name)) return;
    const entry = { date: dutyDate, ts: Date.now(), note: (note || "").trim() || null, batch: uid() };
    const staffRec = data.staff[number];
    const list = data.membership[catId] || [];
    persist({
      ...dataRef.current,
      staff: staffRec ? { ...data.staff, [number]: { ...staffRec, skip: false } } : data.staff,
      membership: {
        ...data.membership,
        [catId]: list.map((m) => m.number === number ? { ...m, skip: false, lastDuty: dutyDate, history: [...(m.history || []), entry] } : m),
      },
    });
    showToast(t(`Duty assigned to ${name} for ${formatDMY(dutyDate)}`, `${formatDMY(dutyDate)} માટે ${name} ને ડ્યુટી સોંપાઈ`));
  };

  // A fixed, always-the-same category id — auto-created the first time
  // anyone assigns a Miscellaneous duty, so it behaves exactly like any
  // other work type from then on (shows up in the sidebar, has its own
  // roster/history/fairness tabs) without needing to be set up by hand
  // first. The point of this whole feature: for a one-off task that
  // doesn't deserve a permanent work type of its own (escorting someone,
  // a single errand, a court summons that's a one-time thing), you
  // describe *what* the duty actually was in the required text field
  // below instead — that description is what gets stored as the entry's
  // note, so History and this person's full record both show exactly
  // what they were sent to do, not just "Miscellaneous duty" with no
  // detail. Reuses the exact same conflict-check/skip-clearing behavior
  // as assignDuty above; the only real difference is handling someone
  // who isn't already on this category's roster yet, which for a brand
  // new (or rarely used) category is the common case.
  const MISC_CATEGORY_ID = "misc-duty";
  const assignMiscDuty = (number, name, dutyType, extraNote, date) => {
    if (!data) return;
    const cleanType = (dutyType || "").trim();
    if (!cleanType) { showToast(t("Describe the duty before assigning it", "સોંપતા પહેલા ડ્યુટીનું વર્ણન કરો"), "error"); return; }
    const num = (number || "").trim();
    const cleanName = (name || "").trim();
    if (!num) { showToast(t("Enter a workplace number", "કાર્યસ્થળ નંબર દાખલ કરો"), "error"); return; }
    const existingStaff = data.staff[num];
    if (!existingStaff && !cleanName) { showToast(t("New number — enter the staff name too", "નવો નંબર — સ્ટાફનું નામ પણ દાખલ કરો"), "error"); return; }
    const dutyDate = date || todayStr();
    if (!confirmDutyOverride(data, num, dutyDate, MISC_CATEGORY_ID, existingStaff ? existingStaff.name : cleanName)) return;

    const hasMiscCat = (data.categories || []).some((c) => c.id === MISC_CATEGORY_ID);
    const categories = hasMiscCat ? data.categories : [...data.categories, { id: MISC_CATEGORY_ID, label: t("Miscellaneous duty", "વિવિધ ડ્યુટી") }];
    // `note` stays the required duty description ("PSO", "Escorted VIP…")
    // — every existing place in the app that reads an entry's `note`
    // (History tables, CSV exports, the person's full history modal)
    // keeps showing exactly that, unchanged. `extraNote` is new: a
    // genuinely separate, optional second field for any additional detail
    // beyond the duty type itself, shown alongside it specifically in the
    // places built to show both (see CategoryHistoryTable and
    // PersonHistoryModal below) without disturbing anywhere that only
    // knows about `note`.
    const entry = { date: dutyDate, ts: Date.now(), note: cleanType, extraNote: (extraNote || "").trim() || null, batch: uid() };
    const list = data.membership[MISC_CATEGORY_ID] || [];
    const already = list.some((m) => m.number === num);
    const updatedList = already
      ? list.map((m) => m.number === num ? { ...m, skip: false, lastDuty: dutyDate, history: [...(m.history || []), entry] } : m)
      : [...list, { number: num, lastDuty: dutyDate, history: [entry], skip: false }];
    const nextStaff = existingStaff
      ? { ...data.staff, [num]: { ...existingStaff, skip: false } }
      : { ...data.staff, [num]: { number: num, name: cleanName, phone: null, unavailable: null, designation: null } };

    persist({
      ...dataRef.current,
      categories,
      staff: nextStaff,
      membership: { ...data.membership, [MISC_CATEGORY_ID]: updatedList },
    });
    const personName = existingStaff ? existingStaff.name : cleanName;
    showToast(t(`Miscellaneous duty assigned to ${personName}: "${cleanType}"`, `${personName} ને વિવિધ ડ્યુટી સોંપાઈ: "${cleanType}"`));
  };

  // Assigns the same duty, on the same date range, to a whole typed-in
  // group at once (Group Duty) — in a single persist() rather than looping
  // the single-person assignDuty above, so every person's entry lands
  // together instead of each call's update overwriting the last one's.
  // Anyone not already on this work type's roster is added to it as part
  // of the same update; anyone with a duty elsewhere on one of the days is
  // flagged in one combined confirm instead of a dialog per person.
  // outstationTypeId is optional: when given (the Group Duty screen's
  // "Also mark as Outstation" toggle), everyone in the group is ALSO
  // marked Outstation for the exact same date range in the same update —
  // so a long out-of-town duty stint doesn't need a separate manual entry
  // per person in Manage Staff afterward.
  const assignGroupDuty = (catId, people, fromDate, toDate, note, outstationTypeId) => {
    if (!data) return;
    const cat = (data.categories || []).find((c) => c.id === catId);
    if (!cat) { showToast(t("Pick a work type first", "પહેલા કામનો પ્રકાર પસંદ કરો")); return; }
    if (!people || people.length === 0) { showToast(t("Add at least one person to the group first", "પહેલા જૂથમાં ઓછામાં ઓછી એક વ્યક્તિ ઉમેરો")); return; }
    const from = fromDate || todayStr();
    const dutyDates = dateRangeStrs(from, toDate);
    const lastDate = dutyDates[dutyDates.length - 1];

    // Conflict-check every day in the range for every person, not just the
    // first — a multi-day assignment can clash with an existing duty on
    // any one of its days even if the others are free.
    const conflicts = [];
    people.forEach((p) => {
      dutyDates.forEach((d) => {
        const conflict = findDutyConflict(data, p.number, d, catId);
        if (conflict) conflicts.push({ p, date: d, conflict });
      });
    });
    if (conflicts.length > 0) {
      const lines = conflicts.map((x) => `${x.p.name} → ${formatDMY(x.date)} → "${x.conflict.label}"`).join("\n");
      const proceed = window.confirm(t(
        `These people already have a duty elsewhere on one or more of these days:\n${lines}\n\nThis can be legitimate — assign this group duty to everyone anyway?`,
        `આ લોકોને આમાંથી એક અથવા વધુ દિવસોમાં પહેલેથી જ બીજે ડ્યુટી છે:\n${lines}\n\nઆ યોગ્ય પણ હોઈ શકે — બધાને આ જૂથ ડ્યુટી તેમ છતાં સોંપવી છે?`
      ));
      if (!proceed) return;
    }

    // One history entry per calendar day in the range — this is the only
    // thing that needs to happen for the multi-day assignment to show up
    // correctly everywhere else in the app (calendar, monthly duty counts/
    // heat, rotation fairness) automatically, since every one of those
    // views is already built from per-day history entries.
    const noteText = (note || "").trim() || null;
    const baseTs = Date.now();
    const batch = uid();
    const entries = dutyDates.map((d, i) => ({ date: d, ts: baseTs + i, note: noteText, batch }));
    const nextStaff = { ...data.staff };
    const existingList = data.membership[catId] || [];
    const existingNumbers = new Set(existingList.map((m) => m.number));
    const updatedExisting = existingList.map((m) =>
      people.some((p) => p.number === m.number)
        ? { ...m, skip: false, lastDuty: lastDate, history: [...(m.history || []), ...entries] }
        : m
    );
    const newMembers = people
      .filter((p) => !existingNumbers.has(p.number))
      .map((p) => ({ number: p.number, lastDuty: lastDate, history: [...entries], skip: false }));
    people.forEach((p) => {
      if (!nextStaff[p.number]) {
        nextStaff[p.number] = { number: p.number, name: p.name, phone: null, unavailable: null, designation: null, skip: false };
      } else if (nextStaff[p.number].skip) {
        // Same reasoning as assignDuty: being manually put on this duty is
        // an explicit statement of availability, so their global Skip
        // flag (from Manage Staff) clears too — not just the local one on
        // this work type's row above.
        nextStaff[p.number] = { ...nextStaff[p.number], skip: false };
      }
    });
    // Same "mark Outstation" logic Manage Staff uses (unavailablePeriodUpdate),
    // just applied to everyone in the group in this one update instead of
    // one at a time.
    if (outstationTypeId) {
      people.forEach((p) => {
        const rec = nextStaff[p.number];
        nextStaff[p.number] = { ...rec, ...unavailablePeriodUpdate(rec, "Outstation", outstationTypeId, from, lastDate) };
      });
    }
    persist({
      ...dataRef.current,
      staff: nextStaff,
      membership: { ...data.membership, [catId]: [...updatedExisting, ...newMembers] },
    });
    const dateRangeTxt = dutyDates.length > 1
      ? t(`from ${formatDMY(from)} to ${formatDMY(lastDate)}`, `${formatDMY(from)} થી ${formatDMY(lastDate)} સુધી`)
      : t(`on ${formatDMY(from)}`, `${formatDMY(from)} ના રોજ`);
    const outstationTxt = outstationTypeId ? t(" — also marked Outstation for the same dates", " — તે જ તારીખો માટે બહારગામ તરીકે પણ માર્ક કર્યું") : "";
    showToast(t(
      `Group duty assigned to ${people.length} ${people.length === 1 ? "person" : "people"} for ${cat.label} ${dateRangeTxt}${outstationTxt}`,
      `${cat.label} માટે ${dateRangeTxt} ${people.length} લોકોને જૂથ ડ્યુટી સોંપાઈ${outstationTxt}`
    ));
  };

  // ---------- staff directory mutations ----------
  const createStaff = (number, name, phone) => {
    const num = (number || "").trim();
    const cleanName = (name || "").trim();
    const cleanPhone = (phone || "").trim();
    if (!num || !cleanName) { showToast(t("Enter both number and name", "નંબર અને નામ બંને દાખલ કરો")); return; }
    if (data.staff[num]) { showToast(t("That number is already in use", "તે નંબર પહેલેથી જ ઉપયોગમાં છે")); return; }
    persist({ ...dataRef.current, staff: { ...data.staff, [num]: { number: num, name: cleanName, phone: cleanPhone || null, unavailable: null, designation: null } } });
    showToast(t(`${cleanName} added to staff directory`, `${cleanName} સ્ટાફ ડિરેક્ટરીમાં ઉમેરાયું`));
  };
  // Bulk import from CSV — entries: [{ number, name, designation, phone }]
  // where designation is a free-text label matched (case-insensitively)
  // against existing designations. Unknown/blank designations are simply
  // left unset rather than silently creating new designations from typos.
  const bulkImportStaff = (entries) => {
    if (!data || !entries || !entries.length) return;
    const desgByLabel = {};
    (data.designations || []).forEach((d) => { desgByLabel[d.label.trim().toLowerCase()] = d.id; });
    const nextStaff = { ...data.staff };
    let added = 0, updated = 0, skipped = 0, unmatchedDesg = 0;
    entries.forEach((e) => {
      const num = (e.number || "").trim();
      const cleanName = (e.name || "").trim();
      const cleanPhone = (e.phone || "").trim();
      if (!num || !cleanName) { skipped++; return; }
      let desgId = null;
      const rawDesg = (e.designation || "").trim();
      if (rawDesg) {
        desgId = desgByLabel[rawDesg.toLowerCase()] || null;
        if (!desgId) unmatchedDesg++;
      }
      if (nextStaff[num]) {
        nextStaff[num] = { ...nextStaff[num], name: cleanName, phone: cleanPhone || nextStaff[num].phone || null, designation: desgId || nextStaff[num].designation || null };
        updated++;
      } else {
        nextStaff[num] = { number: num, name: cleanName, phone: cleanPhone || null, unavailable: null, designation: desgId || null };
        added++;
      }
    });
    persist({ ...dataRef.current, staff: nextStaff });
    let msg = t(`Imported: ${added} added, ${updated} updated`, `આયાત થયું: ${added} ઉમેરાયા, ${updated} અપડેટ થયા`);
    if (skipped) msg += t(`, ${skipped} skipped (missing number/name)`, `, ${skipped} છોડી દેવાયા (નંબર/નામ ખૂટે છે)`);
    if (unmatchedDesg) msg += t(`, ${unmatchedDesg} with unrecognized designation`, `, ${unmatchedDesg} અજાણ્યા હોદ્દા સાથે`);
    showToast(msg);
  };
  const renameStaff = (number) => {
    const cur = data.staff[number];
    const next = window.prompt(t("Edit name:", "નામ સંપાદિત કરો:"), cur ? cur.name : "");
    if (!next || !next.trim()) return;
    persist({ ...dataRef.current, staff: { ...data.staff, [number]: { ...cur, name: next.trim() } } });
  };
  const setStaffPhone = (number) => {
    const cur = data.staff[number];
    const next = window.prompt(t("Mobile number (used for WhatsApp duty notices):", "મોબાઇલ નંબર (WhatsApp ડ્યુટી સૂચનાઓ માટે વપરાય છે):"), cur ? (cur.phone || "") : "");
    if (next === null) return; // cancelled
    const cleaned = next.trim();
    if (cleaned && cleaned.replace(/\D/g, "").length < 10) { showToast(t("Enter a valid mobile number", "માન્ય મોબાઇલ નંબર દાખલ કરો")); return; }
    persist({ ...dataRef.current, staff: { ...data.staff, [number]: { ...cur, phone: cleaned || null } } });
  };
  const deleteStaffGlobally = (number) => {
    const cur = data.staff[number];
    if (!window.confirm(t(`Remove ${cur ? cur.name : number} from every work type? They'll move to the Recycle bin and can be restored later.`, `${cur ? cur.name : number} ને દરેક કામના પ્રકારમાંથી કાઢી નાખવું છે? તેઓ રિસાયકલ બિનમાં જશે અને પછીથી પુનઃસ્થાપિત કરી શકાશે.`))) return;
    const nextStaff = { ...data.staff };
    delete nextStaff[number];
    const nextMembership = {};
    const removedMemberships = [];
    Object.keys(data.membership).forEach((catId) => {
      nextMembership[catId] = data.membership[catId].filter((m) => {
        if (m.number === number) { removedMemberships.push({ catId, entry: m }); return false; }
        return true;
      });
    });
    const recycled = withRecycled({ ...data, staff: nextStaff, membership: nextMembership }, {
      type: "staff",
      label: cur ? cur.name : number,
      payload: { staffRecord: cur || { number, name: number, unavailable: null }, memberships: removedMemberships },
    });
    persist(recycled);
    showToast(t(`Moved ${cur ? cur.name : number} to Recycle bin`, `${cur ? cur.name : number} રિસાયકલ બિનમાં ખસેડાયું`));
  };
  const setUnavailable = (number, kind, typeId, from, to) => {
    const list = kind === "Leave" ? data.leaveTypes : data.outstationTypes;
    const found = (list || []).find((t) => t.id === typeId);
    const label = found ? found.label : kind;
    const isIndefinite = !!(found && found.indefinite);
    if (!from) { showToast(t("Pick a start date", "શરૂઆતની તારીખ પસંદ કરો")); return; }
    if (!isIndefinite && (!to || to < from)) { showToast(t("Pick a valid date range", "માન્ય તારીખ શ્રેણી પસંદ કરો")); return; }
    const finalTo = isIndefinite ? null : to;
    const isPastOnly = finalTo && finalTo < todayStr();
    const prevRec = data.staff[number];
    persist({
      ...dataRef.current,
      staff: {
        ...data.staff,
        [number]: { ...prevRec, ...unavailablePeriodUpdate(prevRec, kind, typeId, from, finalTo) },
      },
    });
    const dateRangeText = isPastOnly
      ? t(` — recorded for ${formatDMY(from)}${finalTo && finalTo !== from ? " to " + formatDMY(finalTo) : ""} on the calendar; today's status is unchanged`, ` — કૅલેન્ડર પર ${formatDMY(from)}${finalTo && finalTo !== from ? " થી " + formatDMY(finalTo) : ""} માટે નોંધાયું; આજની સ્થિતિ યથાવત છે`)
      : (finalTo ? t(" until " + formatDMY(finalTo), " " + formatDMY(finalTo) + " સુધી") : t(" — no end date", " — કોઈ અંતિમ તારીખ નથી"));
    showToast(t(`${prevRec.name} marked ${label.toLowerCase()}${dateRangeText}`, `${prevRec.name} ને ${label.toLowerCase()} તરીકે માર્ક કર્યું${dateRangeText}`));
  };
  const clearUnavailable = (number) => {
    const prevRec = data.staff[number];
    const cur = prevRec.unavailable;
    // "End now": the person is back on duty starting today. Cap the
    // matching entry in history at yesterday (instead of just discarding
    // it) so the calendar still correctly shows them as away for every day
    // up through yesterday, rather than losing that record entirely.
    const yesterday = addDaysStr(todayStr(), -1);
    const history = (prevRec.unavailableHistory || []).map((p) =>
      cur && p.kind === cur.kind && p.typeId === cur.typeId && p.from === cur.from && p.to === cur.to
        ? { ...p, to: yesterday }
        : p
    );
    persist({ ...dataRef.current, staff: { ...data.staff, [number]: { ...prevRec, unavailable: null, unavailableHistory: history } } });
  };
  const renameLeaveType = (id) => {
    const cur = (data.leaveTypes || []).find((t) => t.id === id);
    const next = window.prompt(t("Rename leave type:", "રજાનો પ્રકાર નામ બદલો:"), cur ? cur.label : "");
    if (!next || !next.trim()) return;
    persist({ ...dataRef.current, leaveTypes: (data.leaveTypes || DEFAULT_LEAVE_TYPES).map((t) => t.id === id ? { ...t, label: next.trim() } : t) });
  };
  const renameOutstationType = (id) => {
    const cur = (data.outstationTypes || []).find((t) => t.id === id);
    const next = window.prompt(t("Rename outstation type:", "બહારગામનો પ્રકાર નામ બદલો:"), cur ? cur.label : "");
    if (!next || !next.trim()) return;
    persist({ ...dataRef.current, outstationTypes: (data.outstationTypes || DEFAULT_OUTSTATION_TYPES).map((t) => t.id === id ? { ...t, label: next.trim() } : t) });
  };
  const addLeaveType = (label, indefinite) => {
    const clean = (label || "").trim();
    if (!clean || !data) { showToast(t("Enter a leave type name", "રજાના પ્રકારનું નામ દાખલ કરો")); return; }
    const id = "leave-" + uid();
    persist({ ...dataRef.current, leaveTypes: [...(data.leaveTypes || DEFAULT_LEAVE_TYPES), { id, label: clean, indefinite: !!indefinite }] });
    showToast(t(`Added leave type "${clean}"`, `રજાનો પ્રકાર "${clean}" ઉમેરાયો`));
  };
  const deleteLeaveType = (id) => {
    const list = data.leaveTypes || DEFAULT_LEAVE_TYPES;
    const cur = list.find((t) => t.id === id);
    if (list.length <= 1) { showToast(t("Keep at least one leave type", "ઓછામાં ઓછો એક રજાનો પ્રકાર રાખો")); return; }
    if (!window.confirm(t(`Delete leave type "${cur ? cur.label : id}"? Anyone currently marked with it will just show as "Leave".`, `રજાનો પ્રકાર "${cur ? cur.label : id}" ડિલીટ કરવો છે? હાલમાં તેની સાથે માર્ક થયેલા લોકો ફક્ત "રજા" તરીકે દેખાશે.`))) return;
    persist({ ...dataRef.current, leaveTypes: list.filter((t) => t.id !== id) });
    showToast(t(`Deleted leave type "${cur ? cur.label : id}"`, `રજાનો પ્રકાર "${cur ? cur.label : id}" ડિલીટ થયો`));
  };
  const toggleLeaveTypeIndefinite = (id) => {
    const list = data.leaveTypes || DEFAULT_LEAVE_TYPES;
    persist({ ...dataRef.current, leaveTypes: list.map((t) => t.id === id ? { ...t, indefinite: !t.indefinite } : t) });
  };
  const addOutstationType = (label, indefinite) => {
    const clean = (label || "").trim();
    if (!clean || !data) { showToast(t("Enter an outstation type name", "બહારગામનો પ્રકારનું નામ દાખલ કરો")); return; }
    const id = "out-" + uid();
    persist({ ...dataRef.current, outstationTypes: [...(data.outstationTypes || DEFAULT_OUTSTATION_TYPES), { id, label: clean, indefinite: !!indefinite }] });
    showToast(t(`Added outstation type "${clean}"`, `બહારગામનો પ્રકાર "${clean}" ઉમેરાયો`));
  };
  const deleteOutstationType = (id) => {
    const list = data.outstationTypes || DEFAULT_OUTSTATION_TYPES;
    const cur = list.find((t) => t.id === id);
    if (list.length <= 1) { showToast(t("Keep at least one outstation type", "ઓછામાં ઓછો એક બહારગામનો પ્રકાર રાખો")); return; }
    if (!window.confirm(t(`Delete outstation type "${cur ? cur.label : id}"? Anyone currently marked with it will just show as "Outstation".`, `બહારગામનો પ્રકાર "${cur ? cur.label : id}" ડિલીટ કરવો છે? હાલમાં તેની સાથે માર્ક થયેલા લોકો ફક્ત "બહારગામ" તરીકે દેખાશે.`))) return;
    persist({ ...dataRef.current, outstationTypes: list.filter((t) => t.id !== id) });
    showToast(t(`Deleted outstation type "${cur ? cur.label : id}"`, `બહારગામનો પ્રકાર "${cur ? cur.label : id}" ડિલીટ થયો`));
  };
  const toggleOutstationTypeIndefinite = (id) => {
    const list = data.outstationTypes || DEFAULT_OUTSTATION_TYPES;
    persist({ ...dataRef.current, outstationTypes: list.map((t) => t.id === id ? { ...t, indefinite: !t.indefinite } : t) });
  };

  // ---------- designations (fully custom, user-defined) ----------
  const addDesignation = (label) => {
    const clean = (label || "").trim();
    if (!clean || !data) { showToast(t("Enter a designation name", "હોદ્દાનું નામ દાખલ કરો")); return; }
    const list = data.designations || DEFAULT_DESIGNATIONS;
    if (list.some((x) => x.label.toLowerCase() === clean.toLowerCase())) { showToast(t("That designation already exists", "તે હોદ્દો પહેલેથી અસ્તિત્વમાં છે")); return; }
    const id = "desg-" + uid();
    persist({ ...dataRef.current, designations: [...list, { id, label: clean }] });
    showToast(t(`Added designation "${clean}"`, `હોદ્દો "${clean}" ઉમેરાયો`));
  };
  const renameDesignation = (id) => {
    const list = data.designations || DEFAULT_DESIGNATIONS;
    const cur = list.find((t) => t.id === id);
    const next = window.prompt(t("Rename designation:", "હોદ્દાનું નામ બદલો:"), cur ? cur.label : "");
    if (!next || !next.trim()) return;
    persist({ ...dataRef.current, designations: list.map((t) => t.id === id ? { ...t, label: next.trim() } : t) });
  };
  const deleteDesignation = (id) => {
    const list = data.designations || DEFAULT_DESIGNATIONS;
    const cur = list.find((t) => t.id === id);
    if (!window.confirm(t(`Delete designation "${cur ? cur.label : id}"? Anyone currently holding it will show as "No designation".`, `હોદ્દો "${cur ? cur.label : id}" ડિલીટ કરવો છે? હાલમાં તે ધરાવતા લોકો "કોઈ હોદ્દો નથી" તરીકે દેખાશે.`))) return;
    const nextStaff = { ...data.staff };
    Object.keys(nextStaff).forEach((num) => {
      if (nextStaff[num].designation === id) nextStaff[num] = { ...nextStaff[num], designation: null };
    });
    persist({ ...dataRef.current, staff: nextStaff, designations: list.filter((t) => t.id !== id) });
    showToast(t(`Deleted designation "${cur ? cur.label : id}"`, `હોદ્દો "${cur ? cur.label : id}" ડિલીટ થયો`));
  };
  const setStaffDesignation = (number, designationId) => {
    const cur = data.staff[number];
    if (!cur) return;
    persist({ ...dataRef.current, staff: { ...data.staff, [number]: { ...cur, designation: designationId || null } } });
  };

  // ---------- employee events (Leave / Outstation Duty / Training) ----------
  const addEvent = (name, type, start, end, notes, number) => {
    const cleanName = (name || "").trim();
    if (!cleanName) { showToast(t("Enter an employee name", "કર્મચારીનું નામ દાખલ કરો"), "error"); return; }
    if (!EVENT_TYPES.includes(type)) { showToast(t("Pick an event type", "ઇવેન્ટનો પ્રકાર પસંદ કરો"), "error"); return; }
    if (!start || !end) { showToast(t("Pick both a start and end date", "શરૂઆત અને અંતિમ બંને તારીખ પસંદ કરો"), "error"); return; }
    if (end < start) { showToast(t("End date can't be before the start date", "અંતિમ તારીખ શરૂઆતની તારીખ પહેલાં ન હોઈ શકે"), "error"); return; }
    const event = { id: uid(), name: cleanName, number: (number || "").trim() || null, type, start, end, notes: (notes || "").trim(), createdAt: Date.now() };
    persist({ ...dataRef.current, events: [...(data.events || []), event] });
    showToast(t(`${EVENT_TYPE_LABEL[type]} added for ${cleanName}`, `${cleanName} માટે ${EVENT_TYPE_LABEL_GU[type]} ઉમેરાયું`));
  };
  const updateEvent = (id, patch) => {
    const cur = (data.events || []).find((e) => e.id === id);
    if (!cur) return;
    const merged = { ...cur, ...patch };
    if (!merged.name || !merged.name.trim()) { showToast(t("Enter an employee name", "કર્મચારીનું નામ દાખલ કરો"), "error"); return; }
    if (!merged.start || !merged.end) { showToast(t("Pick both a start and end date", "શરૂઆત અને અંતિમ બંને તારીખ પસંદ કરો"), "error"); return; }
    if (merged.end < merged.start) { showToast(t("End date can't be before the start date", "અંતિમ તારીખ શરૂઆતની તારીખ પહેલાં ન હોઈ શકે"), "error"); return; }
    // A changed date means the old reminder no longer describes reality —
    // clear its ack so the (now different) milestone gets a fresh reminder
    // instead of silently staying "Acknowledged" against a stale date.
    const nextAcks = { ...(data.reminderAcks || {}) };
    if (patch.start !== undefined && patch.start !== cur.start) delete nextAcks[id + ":start"];
    if (patch.end !== undefined && patch.end !== cur.end) delete nextAcks[id + ":end"];
    persist({ ...dataRef.current, events: (data.events || []).map((e) => e.id === id ? merged : e), reminderAcks: nextAcks });
    showToast(t(`Event updated for ${merged.name}`, `${merged.name} માટે ઇવેન્ટ અપડેટ થયું`));
  };
  const deleteEvent = (id) => {
    const cur = (data.events || []).find((e) => e.id === id);
    if (!window.confirm(t(`Delete this ${cur ? EVENT_TYPE_LABEL[cur.type].toLowerCase() : "event"} record${cur ? " for " + cur.name : ""}? This can't be undone from the recycle bin.`, `આ ${cur ? EVENT_TYPE_LABEL_GU[cur.type] : "ઇવેન્ટ"} રેકોર્ડ${cur ? " " + cur.name + " માટે" : ""} ડિલીટ કરવો છે? આ રિસાયકલ બિનમાંથી પુનઃસ્થાપિત કરી શકાશે નહીં.`))) return;
    const nextAcks = { ...(data.reminderAcks || {}) };
    delete nextAcks[id + ":start"];
    delete nextAcks[id + ":end"];
    persist({ ...dataRef.current, events: (data.events || []).filter((e) => e.id !== id), reminderAcks: nextAcks });
    showToast(t("Event deleted", "ઇવેન્ટ ડિલીટ થયું"));
  };
  const acknowledgeReminder = (key) => {
    persist({ ...dataRef.current, reminderAcks: { ...(data.reminderAcks || {}), [key]: true } });
  };

  // ---------- full data backup / restore (JSON download & upload) ----------
  const importBackupRef = useRef(null);
  const exportBackup = () => {
    if (!data) return;
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `nokri-book-backup-${todayStr()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    recordBackupNow();
    showToast(t("Backup downloaded", "બેકઅપ ડાઉનલોડ થયું"));
  };
  const importBackup = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let parsed;
      try {
        parsed = JSON.parse(reader.result);
      } catch (e) {
        showToast(t("Couldn't read that file — is it a valid backup JSON?", "તે ફાઇલ વાંચી શકાઈ નથી — શું તે માન્ય બેકઅપ JSON છે?"), "error");
        return;
      }
      if (!parsed || typeof parsed !== "object" || !parsed.staff || !parsed.categories) {
        showToast(t("That doesn't look like a valid Nokri Book backup file", "તે માન્ય Nokri Book બેકઅપ ફાઇલ હોય તેમ લાગતું નથી"), "error");
        return;
      }
      if (!window.confirm(t("Restore this backup? It will replace ALL current data (staff, work types, history, designations, everything). You can still Ctrl+Z once right after, but do this carefully.", "આ બેકઅપ પુનઃસ્થાપિત કરવો છે? તે તમામ હાલનો ડેટા (સ્ટાફ, કામના પ્રકારો, ઇતિહાસ, હોદ્દાઓ, બધું) બદલી નાખશે. તમે તરત જ પછી એકવાર Ctrl+Z કરી શકો છો, પણ કાળજીપૂર્વક કરો."))) return;
      // Routed through the same normalizeData() every other data-load path
      // uses (initial sign-in, legacy import) instead of persisting the
      // parsed file as-is — makes sure a backup taken on an older version
      // of the app (before some field existed) comes back with the same
      // shape the rest of the app expects, rather than silently missing
      // pieces like designations or unavailableHistory.
      persist(normalizeData(parsed));
      showToast(t("Backup restored", "બેકઅપ પુનઃસ્થાપિત થયો"));
    };
    reader.readAsText(file);
  };

  if (user === undefined) return <div style={{position: "fixed", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", color: "var(--text-secondary)"}}>Loading…</div>;
  if (user === null) return <LangContext.Provider value={langCtxValue}><SignInScreen /></LangContext.Provider>;
  // Data hasn't loaded yet, for one of two very different reasons — genuinely
  // still loading (normal, resolves in a moment), or the connection actually
  // failed (connError, set by the listener's error handler above). Blocking
  // here on connError specifically, instead of quietly falling through to
  // the ordinary interactive app on top of no real data, is what closes off
  // the failure mode described in the long comment above: there is no
  // longer any state where the full app renders and accepts changes without
  // confirmed real data underneath it. A manual retry re-subscribes;
  // whenever the connection genuinely recovers, the listener's own success
  // callback clears connError and loads the real data automatically anyway.
  if (!data) {
    if (connError) {
      return (
        <div style={{ position: "fixed", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
          <div style={{ maxWidth: 440, textAlign: "center" }}>
            <div style={{ fontSize: 15, fontWeight: 700, color: "var(--text-primary)", marginBottom: 10 }}>Couldn't connect to the shared database</div>
            <div style={{ fontSize: 13, color: "var(--text-secondary)", marginBottom: 18, lineHeight: 1.6 }}>
              Your data is safe — nothing has been changed or deleted. If this keeps happening, try disabling any ad-blocker or privacy extension for this site, or open it in an incognito/private window — some of them silently block a background security check this app uses. If it still fails after that, contact your administrator.
            </div>
            <button
              onClick={() => setRetryKey((k) => k + 1)}
              style={{ background: "var(--btn-dark-bg)", color: "#fff", border: "none", borderRadius: 8, padding: "10px 20px", fontSize: 13.5, fontWeight: 600, cursor: "pointer" }}
            >Retry connection</button>
          </div>
        </div>
      );
    }
    return <div style={{position: "fixed", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", color: "var(--text-secondary)"}}>Loading roster…</div>;
  }

  return (
    <LangContext.Provider value={langCtxValue}>
    <div data-theme={darkMode ? "dark" : "light"} style={{ minHeight: "100vh", background: "var(--bg-page)" }}>
      {connError && (
        <div style={{ background: "var(--status-error-bg)", color: "var(--status-error-text)", padding: "10px 16px", fontSize: 13, textAlign: "center" }}>
          Couldn't reconnect to the shared database — showing the last data received. Your changes may not be saving right now. If this keeps happening, try disabling any ad-blocker or privacy extension for this site, or open it in an incognito/private window — some of them silently block a background security check this app uses.
        </div>
      )}
      {returnNotices.map((n, i) => (
        <div key={i} style={{ background: "var(--status-info-bg)", color: "var(--status-info-text)", padding: "9px 16px", fontSize: 13, textAlign: "center", display: "flex", justifyContent: "center", gap: 10, alignItems: "center" }}>
          <span className="gu">{n.name}'s {n.type.toLowerCase()} period has ended — back on duty.</span>
          <button onClick={() => setReturnNotices((prev) => prev.filter((_, idx) => idx !== i))} title={t("Dismiss", "બંધ કરો")} aria-label={t("Dismiss", "બંધ કરો")} style={{ background: "transparent", border: "none", color: "var(--status-info-text)", fontWeight: 700 }}>✕</button>
        </div>
      ))}
      {backupReminder && (
        <div style={{ background: "var(--status-warning-bg)", color: "var(--status-warning-text)", padding: "9px 16px", fontSize: 13, textAlign: "center", display: "flex", justifyContent: "center", gap: 10, alignItems: "center", flexWrap: "wrap" }} className="no-print">
          <span className="gu">{t("It's been a couple of days since your last backup — worth taking one now.", "તમારા છેલ્લા બેકઅપને થોડા દિવસ થઈ ગયા છે — હમણાં એક લેવો યોગ્ય રહેશે.")}</span>
          <button onClick={() => { exportBackup(); setBackupReminder(false); }} style={{ background: "var(--btn-warning-solid)", color: "#fff", border: "none", borderRadius: 6, padding: "4px 12px", fontSize: 12, fontWeight: 700, cursor: "pointer" }} className="gu">⬇ {t("Backup now", "હમણાં બેકઅપ કરો")}</button>
          <button onClick={() => setBackupReminder(false)} title={t("Dismiss", "બંધ કરો")} aria-label={t("Dismiss", "બંધ કરો")} style={{ background: "transparent", border: "none", color: "var(--status-warning-text)", fontWeight: 700, cursor: "pointer" }}>✕</button>
        </div>
      )}

      <div className={"app-shell" + (desktopView ? " force-desktop" : "")} style={{ display: "flex", minHeight: "100vh" }}>
        <Sidebar data={data} view={view} setView={setView} addCategory={addCategory} renameCategory={renameCategory} deleteCategory={deleteCategory} reorderCategories={(from, to) => reorderList("categories", from, to)} pendingReminderCount={pendingReminders.length} user={user} signOutUser={signOutUser} darkMode={darkMode} setDarkMode={setDarkMode} formatAllData={formatAllData} desktopView={desktopView} setDesktopView={setDesktopView} />

        <div className="main-panel" style={{ flex: 1, padding: "28px 36px", maxWidth: 1040 }}>
          <div className="no-print top-toolbar" style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginBottom: 16, alignItems: "center" }}>
            {saveStatus !== "idle" && (
              <span
                className="gu"
                title={saveStatus === "saving"
                  ? langCtxValue.t("Saving your last change…", "તમારો છેલ્લો ફેરફાર સાચવાઈ રહ્યો છે…")
                  : langCtxValue.t("Couldn't save yet — retrying automatically. Don't close this tab until it clears.", "હજુ સાચવી શકાયું નથી — આપમેળે ફરી પ્રયાસ થઈ રહ્યો છે. આ ટેબ સાફ ન થાય ત્યાં સુધી બંધ ન કરો.")}
                style={{
                  display: "flex", alignItems: "center", gap: 6, fontSize: 11.5, fontWeight: 600, padding: "5px 10px", borderRadius: 20,
                  background: saveStatus === "saving" ? "var(--status-info-bg)" : "var(--status-error-bg)",
                  color: saveStatus === "saving" ? "var(--status-info-text)" : "var(--status-error-text)",
                  border: "1px solid " + (saveStatus === "saving" ? "var(--status-info-border)" : "var(--status-error-border)"),
                }}
              >
                {saveStatus === "saving" ? "☁️ " + langCtxValue.t("Saving…", "સાચવાઈ રહ્યું છે…") : "⚠️ " + langCtxValue.t("Not saved — retrying…", "સચવાયું નથી — ફરી પ્રયાસ...")}
              </span>
            )}
            <button onClick={() => setDarkMode((d) => !d)} title={langCtxValue.t("Toggle dark mode", "ડાર્ક મોડ ટોગલ કરો")} style={undoRedoBtn(true)} className="gu">{darkMode ? "☀" : "🌙"}</button>
            <button onClick={() => setShowCommandPalette(true)} title={langCtxValue.t("Search everything (Ctrl+K)", "બધું શોધો (Ctrl+K)")} style={undoRedoBtn(true)} className="gu">{langCtxValue.t("Search", "શોધો")}</button>
            <button onClick={() => setShowReminderPanel(true)} title={langCtxValue.t("Show pending reminders", "બાકી રિમાઇન્ડર બતાવો")} style={{
              ...undoRedoBtn(true),
              background: pendingReminders.length ? "var(--status-warning-bg)" : "var(--bg-surface)",
              borderColor: pendingReminders.length ? "var(--status-warning-border)" : "var(--border)",
              color: pendingReminders.length ? "var(--status-warning-text)" : "var(--text-primary)",
            }} className="gu">{langCtxValue.t("Reminders", "રિમાઇન્ડર")}{pendingReminders.length ? ` (${pendingReminders.length})` : ""}</button>
            <button onClick={undo} disabled={undoStack.length === 0} title={langCtxValue.t("Undo last change (Ctrl+Z)", "છેલ્લો ફેરફાર પૂર્વવત્ કરો (Ctrl+Z)")}
              style={undoRedoBtn(undoStack.length > 0)} className="gu">↶ {langCtxValue.t("Undo", "પૂર્વવત્")}{undoStack.length ? ` (${undoStack.length})` : ""}</button>
            <button onClick={redo} disabled={redoStack.length === 0} title={langCtxValue.t("Redo (Ctrl+Shift+Z)", "ફરીથી કરો (Ctrl+Shift+Z)")}
              style={undoRedoBtn(redoStack.length > 0)} className="gu">↷ {langCtxValue.t("Redo", "ફરીથી કરો")}{redoStack.length ? ` (${redoStack.length})` : ""}</button>
            <button onClick={exportBackup} title={langCtxValue.t("Download a full backup of all data as a JSON file", "તમામ ડેટાનો સંપૂર્ણ બેકઅપ JSON ફાઇલ તરીકે ડાઉનલોડ કરો")} style={undoRedoBtn(true)} className="gu">⬇ {langCtxValue.t("Backup", "બેકઅપ")}</button>
            <input
              ref={importBackupRef} type="file" accept="application/json,.json"
              style={{ display: "none" }}
              onChange={(e) => { importBackup(e.target.files[0]); e.target.value = ""; }}
            />
            <button onClick={() => importBackupRef.current && importBackupRef.current.click()} title={langCtxValue.t("Restore all data from a backup JSON file", "બેકઅપ JSON ફાઇલમાંથી તમામ ડેટા પુનઃસ્થાપિત કરો")} style={undoRedoBtn(true)} className="gu">⬆ {langCtxValue.t("Restore", "પુનઃસ્થાપિત કરો")}</button>
            <button onClick={() => setShowDrivePanel(true)} title={
              driveConnected && !driveNeedsReconnect && driveLastBackup
                ? `${langCtxValue.t("Last Drive backup", "છેલ્લો ડ્રાઇવ બેકઅપ")}: ${new Date(driveLastBackup).toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}`
                : driveEnabledForAccount && !driveConnected
                  ? langCtxValue.t("Drive backup is on for this account — connect this device too", "આ ખાતા માટે ડ્રાઇવ બેકઅપ ચાલુ છે — આ ડિવાઇસ પણ જોડો")
                  : langCtxValue.t("Google Drive daily auto-backup", "Google Drive દૈનિક ઓટો-બેકઅપ")
            } style={{
              ...undoRedoBtn(true),
              background: driveConnected ? (driveNeedsReconnect ? "var(--status-warning-bg)" : "var(--status-success-bg)") : (driveEnabledForAccount ? "var(--status-info-bg)" : "var(--bg-surface)"),
              borderColor: driveConnected ? (driveNeedsReconnect ? "var(--status-warning-border)" : "var(--status-success-border)") : (driveEnabledForAccount ? "var(--status-info-border)" : "var(--border)"),
              color: driveConnected && !driveNeedsReconnect ? "var(--status-success-text)" : (driveEnabledForAccount && !driveConnected ? "var(--status-info-text)" : "var(--text-primary)"),
            }}>Drive{driveConnected ? (driveNeedsReconnect ? " ⚠" : " ✓") : (driveEnabledForAccount ? " •" : "")}</button>
            <button onClick={() => setShowSharePanel(true)} title={langCtxValue.t("Share a read-only view of the roster", "રોસ્ટરનું ફક્ત-જોવા માટેનું દૃશ્ય શેર કરો")} style={{
              ...undoRedoBtn(true),
              background: data.shareEnabled ? "var(--status-success-bg)" : "var(--bg-surface)",
              borderColor: data.shareEnabled ? "var(--status-success-border)" : "var(--border)",
              color: data.shareEnabled ? "var(--status-success-text)" : "var(--text-primary)",
            }}>{langCtxValue.t("Share", "શેર")}{data.shareEnabled ? " ✓" : ""}</button>
            <button onClick={() => setShowAboutPanel(true)} title={langCtxValue.t("About this app", "આ એપ વિશે")} aria-label={langCtxValue.t("About this app", "આ એપ વિશે")} style={{
              ...undoRedoBtn(true),
              width: 34, padding: 0, fontSize: 17, lineHeight: 1, fontWeight: 700, letterSpacing: 1,
            }}>⋮</button>
          </div>
          {view.mode === "home" && (
            <HomeView data={data} goToCategory={(catId) => setView({ mode: "category", catId })} />
          )}
          {view.mode === "assignDuty" && (
            <AssignDutyView data={data} assignDuty={assignDuty} assignGroupDuty={assignGroupDuty} assignMiscDuty={assignMiscDuty} goToCategory={(catId) => setView({ mode: "category", catId })} />
          )}
          {view.mode === "category" && view.catId && (
            <CategoryView
              data={data} catId={view.catId}
              addToCategory={addToCategory} removeFromCategory={removeFromCategory}
              setSkipInCategory={setSkipInCategory} skipInCategoryWithLog={skipInCategoryWithLog} setPresentInCategory={setPresentInCategory}
              setLastDuty={setLastDuty} assignDuty={assignDuty}
              clearCategoryHistory={clearCategoryHistory}
              deleteHistoryEntries={deleteHistoryEntries}
              undo={undo} redo={redo} canUndo={undoStack.length > 0} canRedo={redoStack.length > 0}
            />
          )}
          {view.mode === "staff" && (
            <StaffView
              key={view.presetSearch || ""}
              data={data} createStaff={createStaff} renameStaff={renameStaff} setStaffPhone={setStaffPhone}
              deleteStaffGlobally={deleteStaffGlobally} setUnavailable={setUnavailable} clearUnavailable={clearUnavailable}
              setPresentEverywhere={setPresentEverywhere}
              renameLeaveType={renameLeaveType} renameOutstationType={renameOutstationType}
              addLeaveType={addLeaveType} deleteLeaveType={deleteLeaveType} toggleLeaveTypeIndefinite={toggleLeaveTypeIndefinite}
              addOutstationType={addOutstationType} deleteOutstationType={deleteOutstationType} toggleOutstationTypeIndefinite={toggleOutstationTypeIndefinite}
              addDesignation={addDesignation} renameDesignation={renameDesignation} deleteDesignation={deleteDesignation} setStaffDesignation={setStaffDesignation}
              reorderList={reorderList}
              initialSearch={view.presetSearch}
            />
          )}
          {view.mode === "calendar" && <CalendarView data={data} />}
          {view.mode === "report" && <ReportView data={data} />}
          {view.mode === "events" && (
            <EventsView
              data={data} allReminders={allReminders}
              addEvent={addEvent} updateEvent={updateEvent} deleteEvent={deleteEvent}
              acknowledgeReminder={acknowledgeReminder}
              notifPermission={notifPermission} requestNotifPermission={requestNotifPermission}
            />
          )}
          {view.mode === "skipHistory" && (
            <SkipHistoryView key={view.presetSearch || ""} data={data} initialSearch={view.presetSearch} />
          )}
          {view.mode === "recycle" && (
            <RecycleBinView
              data={data} onRestore={restoreFromRecycleBin}
              onDeleteForever={deleteFromRecycleBinForever} onEmpty={emptyRecycleBin}
            />
          )}
        </div>
      </div>

      {showReminderPanel && (
        <ReminderPanel
          reminders={pendingReminders}
          onAcknowledge={acknowledgeReminder}
          onClose={() => setShowReminderPanel(false)}
          onOpenEvents={() => { setShowReminderPanel(false); setView({ mode: "events", tab: "reminders" }); }}
          notifPermission={notifPermission}
          requestNotifPermission={requestNotifPermission}
        />
      )}

      {showDrivePanel && (
        <DriveBackupPanel
          configured={driveConfigured}
          connected={driveConnected}
          enabledForAccount={driveEnabledForAccount}
          busy={driveBusy}
          needsReconnect={driveNeedsReconnect}
          lastBackup={driveLastBackup}
          onConnect={() => backupToDrive({ interactive: true })}
          onBackupNow={() => backupToDrive({ interactive: true })}
          onDisconnect={disconnectDrive}
          onClose={() => setShowDrivePanel(false)}
        />
      )}

      {showSharePanel && (
        <SharePanel
          enabled={!!data.shareEnabled}
          shareUrl={shareUrl}
          onToggle={toggleShare}
          onClose={() => setShowSharePanel(false)}
          showToast={showToast}
        />
      )}

      {showAboutPanel && <AboutPanel onClose={() => setShowAboutPanel(false)} />}

      {showFormatModal && (
        <FormatAllDataModal
          data={data}
          staffCount={Object.keys(data.staff || {}).length}
          dutyCount={Object.values(data.membership || {}).reduce((n, list) => n + list.reduce((m, mem) => m + (mem.history || []).length, 0), 0)}
          onConfirm={(buckleNumber) => { setShowFormatModal(false); performFormatAllData(buckleNumber); }}
          onCancel={() => setShowFormatModal(false)}
        />
      )}

      {showCommandPalette && (
        <CommandPalette
          data={data}
          onNavigate={(v) => setView(v)}
          onClose={() => setShowCommandPalette(false)}
        />
      )}

      {toast && (
        <div className="gu" style={{
          position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)",
          // Fixed colors here on purpose, not the usual var(--text-primary)/
          // var(--status-error-text) — those are TEXT-color variables,
          // correctly meant to flip between dark and light per theme. Used
          // as a BACKGROUND (as this was before) they flip too: in dark
          // mode --text-primary becomes white, giving a white toast with
          // white text on top of it — completely unreadable. A floating
          // toast is a small overlay surface, not page content, so it
          // stays the same dark color regardless of the app's theme,
          // exactly like most OS/app toast notifications do.
          background: toast.type === "error" ? "#A32D2D" : "#2B2116", color: "#fff",
          padding: "10px 18px", borderRadius: 8, fontSize: 13, maxWidth: "min(90vw, 420px)", textAlign: "center",
          boxShadow: "0 6px 18px rgba(0,0,0,0.25)",
        }}>{toast.msg}</div>

      )}
    </div>
    </LangContext.Provider>
  );
}

function undoRedoBtn(enabled) {

function navBtn(active) {

// "Today's duty" — a read-only snapshot of who is actually on duty today.
// Only work types that have someone assigned *today* show up here at all;
// anything not yet assigned today is left out entirely (use Assign Duty
// for that). Kept deliberately simple: no Assign controls here.
function HomeView({ data, goToCategory }) {
  const { t, lang } = useLang();
  const today = todayStr();
  const [showInfo, setShowInfo] = useState(false);
  const cards = useMemo(() => (data.categories || []).map((c) => {
    const roster = computeRoster(data, c.id);
    const doneToday = roster.find((p) => p.lastDuty === today);
    return { cat: c, doneToday };
  }).filter((x) => x.doneToday), [data]);

  return (
    <React.Fragment>
      <div style={{ display: "flex", alignItems: "center", marginBottom: showInfo ? 4 : 20 }}>
        <h1 className="disp gu" style={{ fontSize: 22, fontWeight: 700, margin: 0 }}>{t("Today's duty", "આજની ડ્યુટી")}</h1>
        <InfoIconButton active={showInfo} onClick={() => setShowInfo((v) => !v)} label={t("About this screen", "આ સ્ક્રીન વિશે")} />
      </div>
      {showInfo && (
        <p style={{ fontSize: 13, color: "var(--text-secondary)", margin: "0 0 20px" }} className="gu">
          {new Date().toLocaleDateString(undefined, { weekday: "long" })}, {formatDMY(todayStr())} — {t("only work types with a duty assigned today are shown here.", "ફક્ત જેમાં આજે ડ્યુટી સોંપાયેલી છે તે કામના પ્રકારો અહીં બતાવાય છે.")}
        </p>
      )}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(250px, 1fr))", gap: 14 }}>
        {cards.map(({ cat, doneToday }) => {
          const phone = doneToday.staffRec && doneToday.staffRec.phone;
          return (
            <div key={cat.id} style={{ background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 10, padding: "16px 18px", display: "flex", flexDirection: "column", gap: 10 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
                <div className="disp" style={{ fontWeight: 700, fontSize: 14.5 }}>{cat.label}</div>
              </div>

              <div style={{ background: "var(--status-success-bg)", border: "1px solid var(--status-success-border)", borderRadius: 8, padding: "9px 12px", display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
                <div>
                  <div style={{ fontSize: 10.5, textTransform: "uppercase", letterSpacing: 0.5, color: "var(--status-success-text)", fontWeight: 700 }} className="gu">{t("On duty today", "આજે ડ્યુટી પર")}</div>
                  <div className="gu" style={{ fontSize: 14.5, fontWeight: 600, marginTop: 2 }}>{doneToday.name}</div>
                </div>
                <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
                  {phone && (
                    <a href={`tel:${phone}`} title={t("Call", "કૉલ કરો")} aria-label={t("Call", "કૉલ કરો")} style={{ background: "var(--bg-surface)", color: "var(--status-success-text)", border: "1px solid var(--status-success-border)", borderRadius: 6, padding: "6px 8px", fontSize: 12, textDecoration: "none", display: "inline-flex", alignItems: "center" }}>📞</a>
                  )}
                  <button onClick={() => shareDutyOnWhatsApp({ lang, name: doneToday.name, number: doneToday.number, catLabel: cat.label, date: doneToday.lastDuty, phone, kind: "assigned" })} title={t("Share via WhatsApp", "WhatsApp પર શેર કરો")} aria-label={t("Share via WhatsApp", "WhatsApp પર શેર કરો")} style={{ background: "var(--bg-surface)", color: "var(--status-success-text)", border: "1px solid var(--status-success-border)", borderRadius: 6, padding: "6px 8px", fontSize: 12 }}>📲</button>
                </div>
              </div>

              <button onClick={() => goToCategory(cat.id)} style={{ background: "transparent", border: "none", color: "var(--text-secondary)", fontSize: 12, textAlign: "left", padding: 0, textDecoration: "underline", alignSelf: "flex-start" }} className="gu">{t("View full roster →", "સંપૂર્ણ રોસ્ટર જુઓ →")}</button>
            </div>
          );
        })}
        {cards.length === 0 && <div style={{ color: "var(--text-tertiary)", fontSize: 13 }} className="gu">{t("No duties assigned yet today — use Assign duty.", "આજે હજુ કોઈ ડ્યુટી સોંપાયેલી નથી — Assign duty વાપરો.")}</div>}
      </div>
    </React.Fragment>
  );
}

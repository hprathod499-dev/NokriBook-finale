            <div style={{ fontSize: 12, color: "var(--text-tertiary)", padding: "6px 0", borderTop: "1px solid var(--border-soft)" }} className="gu">{t("No designations yet — add your own below.", "હજુ કોઈ હોદ્દા નથી — નીચે તમારો પોતાનો ઉમેરો.")}</div>
          )}
          <div style={{ display: "flex", gap: 6, alignItems: "center", marginTop: 10, flexWrap: "wrap" }}>
            <input type="text" placeholder={t("New designation", "નવો હોદ્દો")} value={newDesgLabel} onChange={(e) => setNewDesgLabel(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter") { addDesignation(newDesgLabel); setNewDesgLabel(""); } }}
              style={{ flex: 1, minWidth: 120, fontSize: 12 }} className="gu" />
            <button onClick={() => { addDesignation(newDesgLabel); setNewDesgLabel(""); }} style={{ background: "#D98E2B", color: "#fff", border: "none", borderRadius: 6, padding: "6px 10px", fontSize: 12, fontWeight: 600 }} className="gu">+ {t("Add", "ઉમેરો")}</button>
          </div>
        </div>
      </div>

      {modalFor && (
        <div style={{ position: "fixed", inset: 0, background: "#00000055", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 10 }}>
          <div role="dialog" aria-modal="true" aria-label={t("Mark leave or outstation", "રજા અથવા બહારગામ માર્ક કરો")} style={{ background: "var(--bg-surface)", borderRadius: 10, padding: 22, width: 320 }}>
            <div className="disp gu" style={{ fontWeight: 700, fontSize: 15, marginBottom: 12 }}>{t("Mark", "માર્ક કરો")} {data.staff[modalFor].name}</div>
            <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
              <button onClick={() => { setModalKind("Leave"); setModalTypeId(leaveTypes[0] ? leaveTypes[0].id : ""); }} style={{ flex: 1, padding: "7px 0", borderRadius: 6, border: "1px solid var(--border)", background: modalKind === "Leave" ? "var(--status-info-bg)" : "var(--bg-surface)", fontWeight: 600, fontSize: 12 }} className="gu">{t("Leave", "રજા")}</button>
              <button onClick={() => { setModalKind("Outstation"); setModalTypeId(outstationTypes[0] ? outstationTypes[0].id : ""); }} style={{ flex: 1, padding: "7px 0", borderRadius: 6, border: "1px solid var(--border)", background: modalKind === "Outstation" ? "var(--status-purple-bg)" : "var(--bg-surface)", fontWeight: 600, fontSize: 12 }} className="gu">{t("Outstation", "બહારગામ")}</button>
            </div>
            <label style={{ fontSize: 12, color: "var(--text-secondary)" }} className="gu">{t("Type", "પ્રકાર")}</label>
            <select value={modalTypeId} onChange={(e) => setModalTypeId(e.target.value)} style={{ width: "100%", marginBottom: 8, marginTop: 3, padding: "7px 10px", border: "1px solid var(--border)", borderRadius: 6, fontSize: 13, background: "var(--bg-surface)" }} className="gu">
              {modalTypeList.map((mt) => (
                <option key={mt.id} value={mt.id}>{mt.label}{mt.indefinite ? ` (${t("no end date", "કોઈ અંતિમ તારીખ નથી")})` : ""}</option>
              ))}
            </select>
            <label style={{ fontSize: 12, color: "var(--text-secondary)" }} className="gu">{t("From", "થી")}</label>
            <input type="date" value={modalFrom} onChange={(e) => setModalFrom(e.target.value)} style={{ width: "100%", marginBottom: 8, marginTop: 3 }} />
            {modalIsIndefinite ? (
              <div style={{ fontSize: 11.5, color: "var(--text-secondary)", background: "var(--bg-surface-2)", border: "1px solid var(--border-soft)", borderRadius: 6, padding: "8px 10px", marginBottom: 16 }} className="gu">
                {t("This type has no fixed end date —", "આ પ્રકારની કોઈ નિશ્ચિત અંતિમ તારીખ નથી —")} {data.staff[modalFor].name} {t("will stay marked", "તરીકે માર્ક રહેશે")} "{selectedType.label}" {t("until you press", "જ્યાં સુધી તમે દબાવો નહીં")} <strong>{t("End now", "હમણાં સમાપ્ત કરો")}</strong> {t("for them.", "તેમના માટે.")}
              </div>
            ) : (
              <React.Fragment>
                <label style={{ fontSize: 12, color: "var(--text-secondary)" }} className="gu">{t("To", "સુધી")}</label>
                <input type="date" value={modalTo} onChange={(e) => setModalTo(e.target.value)} style={{ width: "100%", marginBottom: 8, marginTop: 3 }} />
              </React.Fragment>
            )}
            {!modalIsIndefinite && modalTo && modalTo < todayStr() && (
              <div style={{ fontSize: 11.5, color: "var(--status-info-text)", background: "var(--status-info-bg)", border: "1px solid var(--status-info-border)", borderRadius: 6, padding: "8px 10px", marginBottom: 16 }} className="gu">
                {t("This is a past date range — it'll be recorded and shown on the calendar for those days, but won't change ", "આ ભૂતકાળની તારીખ શ્રેણી છે — તે નોંધાશે અને તે દિવસો માટે કૅલેન્ડર પર બતાવાશે, પરંતુ ")}{data.staff[modalFor].name}{t("'s current status today.", "ની આજની સ્થિતિ બદલશે નહીં.")}
              </div>
            )}
            <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
              <button onClick={() => setModalFor(null)} style={{ background: "transparent", border: "1px solid var(--border)", borderRadius: 7, padding: "8px 14px", fontSize: 13 }} className="gu">{t("Cancel", "રદ કરો")}</button>
              <button onClick={() => { setUnavailable(modalFor, modalKind, modalTypeId, modalFrom, modalTo); setModalFor(null); }} style={{ background: "#D98E2B", color: "#fff", border: "none", borderRadius: 7, padding: "8px 14px", fontSize: 13, fontWeight: 600 }} className="gu">{t("Save", "સાચવો")}</button>
            </div>
          </div>
        </div>
      )}

      {historyPersonNumber && data.staff[historyPersonNumber] && (
        <PersonHistoryModal data={data} number={historyPersonNumber} onClose={() => setHistoryPersonNumber(null)} />
      )}
    </React.Fragment>
  );
}

// One click from Manage Staff → a person's complete duty record, across
// every work type, in one place — a per-category breakdown plus the full
// chronological list (spans, same as the per-work-type History tab).
function PersonHistoryModal({ data, number, onClose }) {
  const { t } = useLang();
  useEscToClose(onClose);
  const staffRec = data.staff[number];
  const currentMonth = todayStr().slice(0, 7);

  const { groups, byCategory, totalAllTime, totalThisMonth } = useMemo(() => {
    const allRows = [];
    (data.categories || []).forEach((c) => {
      const m = (data.membership[c.id] || []).find((x) => x.number === number);
      if (!m) return;
      (m.history || []).forEach((entry, idx) => {
        allRows.push({ number, idx, name: staffRec.name, date: historyDate(entry), ts: historyTs(entry), note: historyNote(entry), extraNote: historyExtraNote(entry), batch: historyBatch(entry), catLabel: c.label });
      });
    });
    const sorted = allRows.sort((a, b) => (b.date === a.date ? b.ts - a.ts : b.date.localeCompare(a.date)));
    const grouped = groupHistoryRows(sorted);
    const byCat = {};
    let thisMonth = 0;
    grouped.forEach((g) => {
      const cat = byCat[g.catLabel] || { assignments: 0, days: 0 };
      cat.assignments += 1;
      cat.days += g.days;
      byCat[g.catLabel] = cat;
      const [monthStart, monthEnd] = monthBounds(currentMonth);
      if (g.from <= monthEnd && g.to >= monthStart) thisMonth += 1;
    });
    return { groups: grouped, byCategory: byCat, totalAllTime: grouped.length, totalThisMonth: thisMonth };
  }, [data, number, staffRec, currentMonth]);

  return (
    <div role="dialog" aria-modal="true" aria-label={t("Full duty history", "સંપૂર્ણ ડ્યુટી ઇતિહાસ")} style={{ position: "fixed", inset: 0, background: "#00000066", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 60, padding: 16 }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} style={{ background: "var(--bg-surface)", borderRadius: 12, width: 640, maxWidth: "100%", maxHeight: "86vh", display: "flex", flexDirection: "column", overflow: "hidden", boxShadow: "0 20px 60px rgba(0,0,0,0.3)" }}>
        <div style={{ padding: "16px 20px", borderBottom: "1px solid var(--border-soft)", display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
          <div>
            <div className="disp gu" style={{ fontSize: 16, fontWeight: 700 }}>{staffRec.name}</div>
            <div className="mono" style={{ fontSize: 11.5, color: "var(--text-tertiary)" }}>#{number}</div>
          </div>
          <button onClick={onClose} title={t("Close", "બંધ કરો")} aria-label={t("Close", "બંધ કરો")} style={{ background: "transparent", border: "none", color: "var(--text-tertiary)", fontSize: 16 }}>✕</button>
        </div>

        <div style={{ padding: "14px 20px", borderBottom: "1px solid var(--border-soft)", display: "flex", gap: 10, flexWrap: "wrap" }}>
          <div style={{ background: "var(--bg-surface-2)", borderRadius: 8, padding: "8px 14px" }}>
            <div className="mono" style={{ fontSize: 18, fontWeight: 700, color: "#D98E2B" }}>{totalThisMonth}</div>
            <div className="gu" style={{ fontSize: 10.5, color: "var(--text-tertiary)" }}>{t("This month", "આ મહિને")}</div>
          </div>
          <div style={{ background: "var(--bg-surface-2)", borderRadius: 8, padding: "8px 14px" }}>
            <div className="mono" style={{ fontSize: 18, fontWeight: 700 }}>{totalAllTime}</div>
            <div className="gu" style={{ fontSize: 10.5, color: "var(--text-tertiary)" }}>{t("All-time assignments", "કુલ સોંપણીઓ")}</div>
          </div>
          {Object.keys(byCategory).length > 0 && (
            <div style={{ flex: 1, minWidth: 200, display: "flex", flexWrap: "wrap", gap: 6, alignContent: "flex-start" }}>
              {Object.entries(byCategory).map(([catLabel, info]) => (
                <span key={catLabel} className="gu" style={{ fontSize: 11, background: "var(--status-info-bg)", color: "var(--status-info-text)", border: "1px solid var(--status-info-border)", borderRadius: 20, padding: "4px 10px" }}>
                  {catLabel}: {info.assignments} ({info.days}{t("d", "દિ")})
                </span>
              ))}
            </div>
          )}
        </div>

        <div style={{ overflowY: "auto", flex: 1 }}>
          {groups.length === 0 ? (
            <div style={{ padding: "30px 20px", textAlign: "center", color: "var(--text-tertiary)" }} className="gu">{t("No duty history recorded yet.", "હજુ સુધી કોઈ ડ્યુટી ઇતિહાસ નોંધાયો નથી.")}</div>
          ) : (
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
              <thead>
                <tr style={{ background: "var(--bg-surface-2)", textAlign: "left" }} className="gu">
                  <th style={th}>{t("Date", "તારીખ")}</th><th style={th}>{t("Work type", "કામનો પ્રકાર")}</th><th style={th}>{t("Note", "નોંધ")}</th>
                </tr>
              </thead>
              <tbody>
                {groups.map((g) => (
                  <tr key={`${g.catLabel}#${g.idxs.join(",")}`} style={{ borderTop: "1px solid var(--border-soft)" }}>
                    <td style={td} className="mono">
                      {g.days > 1 ? `${formatDMY(g.from)} – ${formatDMY(g.to)}` : formatDMY(g.to)}
                      {g.days > 1 && <span style={{ marginLeft: 6, fontSize: 10, fontWeight: 700, color: "var(--status-info-text)", background: "var(--status-info-bg)", border: "1px solid var(--status-info-border)", borderRadius: 10, padding: "1px 6px" }}>{g.days}{t("d", "દિ")}</span>}
                    </td>
                    <td style={td} className="gu">{g.catLabel}</td>
                    <td style={{ ...td, color: "var(--text-secondary)" }}>
                      {g.note || "—"}
                      {g.extraNote && <div style={{ fontSize: 11, color: "var(--text-tertiary)", marginTop: 2 }} className="gu">{g.extraNote}</div>}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      </div>
    </div>
  );
}

// The "Duty Fairness comparison" panel — three lenses (person / designation
// / work type) on this month's Duty meter counts, all shown as % bars
// relative to whoever/whatever is busiest in that lens, plus a two-person
// side-by-side compare tool with a per-work-type breakdown for each.
function DutyFairnessCompare({ data, staffList, currentMonth }) {
  const { t } = useLang();
  const [view, setView] = useState("person"); // person | designation | worktype
  const [compareInput, setCompareInput] = useState("");

  const personRows = useMemo(() => [...staffList].sort((a, b) => b.dutiesThisMonth - a.dutiesThisMonth), [staffList]);
  const maxPerson = useMemo(() => staffList.reduce((m, s) => Math.max(m, s.dutiesThisMonth), 0), [staffList]);

  const desgRows = useMemo(() => {
    const map = {};
    staffList.forEach((s) => {
      const key = s.desgLabel || t("No designation", "કોઈ હોદ્દો નથી");
      map[key] = (map[key] || 0) + s.dutiesThisMonth;
    });
    return Object.entries(map).map(([label, count]) => ({ label, count })).sort((a, b) => b.count - a.count);
  }, [staffList, t]);
  const maxDesg = useMemo(() => desgRows.reduce((m, r) => Math.max(m, r.count), 0), [desgRows]);

  const catRows = useMemo(() => {
    return (data.categories || []).map((c) => ({
      label: c.label,
      count: (data.membership[c.id] || []).reduce((sum, m) => sum + monthlyGroupedDutyCount(m.history, currentMonth), 0),
    })).sort((a, b) => b.count - a.count);
  }, [data, currentMonth]);
  const maxCat = useMemo(() => catRows.reduce((m, r) => Math.max(m, r.count), 0), [catRows]);

  const personCatBreakdown = (number) => (data.categories || [])
    .map((c) => {
      const m = (data.membership[c.id] || []).find((x) => x.number === number);
      return { label: c.label, count: m ? monthlyGroupedDutyCount(m.history, currentMonth) : 0 };
    })
    .filter((r) => r.count > 0)
    .sort((a, b) => b.count - a.count);

  const compareNumbers = useMemo(
    () => Array.from(new Set(compareInput.split(/[,\s]+/).map((s) => s.trim()).filter(Boolean))),
    [compareInput]
  );
  const compareMatches = useMemo(
    () => compareNumbers.map((num) => ({ num, person: staffList.find((s) => s.number === num) })),
    [compareNumbers, staffList]
  );
  const compareFound = compareMatches.filter((m) => m.person).map((m) => m.person);
  const compareNotFound = compareMatches.filter((m) => !m.person).map((m) => m.num);
  const maxCompare = Math.max(1, ...compareFound.map((p) => p.dutiesThisMonth));

  const Bar = ({ pct, color }) => (
    <div style={{ flex: 1, height: 7, borderRadius: 4, background: "var(--border-soft)", overflow: "hidden" }}>
      <div style={{ width: `${pct}%`, height: "100%", background: color || "#D98E2B", borderRadius: 4 }} />
    </div>
  );
  const barRow = (key, label, count, pct, color) => (
    <div key={key} style={{ display: "flex", alignItems: "center", gap: 10 }}>
      <span className="gu" style={{ width: 150, fontSize: 12.5, flexShrink: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }} title={label}>{label}</span>
      <Bar pct={pct} color={color} />
      <span className="mono" style={{ width: 66, fontSize: 11.5, color: "var(--text-secondary)", textAlign: "right", flexShrink: 0 }}>{count} ({pct}%)</span>
    </div>
  );

  return (
    <div style={{ background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 10, padding: 16, marginBottom: 20 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4, flexWrap: "wrap", gap: 8 }}>
        <div className="disp gu" style={{ fontWeight: 700, fontSize: 14 }}>⚖ {t("Duty fairness", "ડ્યુટી ન્યાયીપણું")}</div>
        <div style={{ display: "flex", gap: 6 }}>
          <button onClick={() => setView("person")} style={catTabBtn(view === "person")} className="gu">{t("By person", "વ્યક્તિ પ્રમાણે")}</button>
          <button onClick={() => setView("designation")} style={catTabBtn(view === "designation")} className="gu">{t("By designation", "હોદ્દા પ્રમાણે")}</button>
          <button onClick={() => setView("worktype")} style={catTabBtn(view === "worktype")} className="gu">{t("By work type", "કામના પ્રકાર પ્રમાણે")}</button>
        </div>
      </div>
      <p style={{ fontSize: 11.5, color: "var(--text-tertiary)", margin: "4px 0 14px" }} className="gu">
        {t("Based on the Duty meter (duty assignments this month, not raw days). Bars are relative to whoever/whatever is busiest in this view — 100% is the busiest, not a hard cap.", "ડ્યુટી મીટર (આ મહિનાની ડ્યુટી સોંપણીઓ, રો ડેઝ નહીં) ના આધારે. બાર આ દૃશ્યમાં સૌથી વ્યસ્તની સાપેક્ષે છે — 100% એટલે સૌથી વ્યસ્ત, કોઈ નિશ્ચિત મર્યાદા નહીં.")}
      </p>

      {view === "person" && (
        <React.Fragment>
          <div style={{ display: "flex", flexDirection: "column", gap: 7, marginBottom: 18 }}>
            {personRows.map((s) => barRow(s.number, s.name, s.dutiesThisMonth, maxPerson > 0 ? Math.round((s.dutiesThisMonth / maxPerson) * 100) : 0))}
            {personRows.length === 0 && <div style={{ fontSize: 12, color: "var(--text-tertiary)" }} className="gu">{t("No staff yet.", "હજુ કોઈ સ્ટાફ નથી.")}</div>}
          </div>

          <div style={{ borderTop: "1px solid var(--border-soft)", paddingTop: 14 }}>
            <div className="gu" style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 8 }}>{t("Compare by બકલ નંબર", "બકલ નંબર દ્વારા સરખામણી કરો")}</div>
            <p style={{ fontSize: 11, color: "var(--text-tertiary)", margin: "0 0 8px" }} className="gu">
              {t("Type or paste multiple buckle numbers, separated by commas or spaces, to compare any number of people at once.", "કોઈપણ સંખ્યામાં લોકોની સરખામણી કરવા માટે, અલ્પવિરામ અથવા સ્પેસથી અલગ કરીને બહુવિધ બકલ નંબર ટાઈપ કરો અથવા પેસ્ટ કરો.")}
            </p>
            <input
              type="text"
              value={compareInput}
              onChange={(e) => setCompareInput(e.target.value)}
              placeholder={t("e.g. 1023, 1044, 1090…", "દા.ત. 1023, 1044, 1090…")}
              className="gu mono"
              style={{ width: "100%", maxWidth: 420, fontSize: 12.5, marginBottom: 12 }}
            />
            {compareNotFound.length > 0 && (
              <div style={{ fontSize: 11.5, color: "var(--status-error-text)", marginBottom: 10 }} className="gu">
                {t("Not found", "મળ્યું નથી")}: <span className="mono">{compareNotFound.join(", ")}</span>
              </div>
            )}
            {compareFound.length > 0 && (
              <div style={{ display: "flex", gap: 16, flexWrap: "wrap" }}>
                {compareFound.map((p) => {
                  const pct = maxCompare > 0 ? Math.round((p.dutiesThisMonth / maxCompare) * 100) : 0;
                  const breakdown = personCatBreakdown(p.number);
                  return (
                    <div key={p.number} style={{ flex: "1 1 220px", background: "var(--bg-surface-2)", borderRadius: 8, padding: 12 }}>
                      <div className="gu" style={{ fontWeight: 700, fontSize: 13, marginBottom: 4 }}>{p.name} <span className="mono" style={{ fontWeight: 400, fontSize: 11, color: "var(--text-tertiary)" }}>#{p.number}</span></div>
                      <div className="mono" style={{ fontSize: 20, fontWeight: 700, color: "#D98E2B" }}>{p.dutiesThisMonth}</div>
                      <div className="gu" style={{ fontSize: 10.5, color: "var(--text-tertiary)", marginBottom: 8 }}>{t("duties this month", "આ મહિનાની ડ્યુટીઓ")} · {pct}% {t("of the busiest in this comparison", "આ સરખામણીમાં સૌથી વ્યસ્તની સાપેક્ષે")}</div>
                      {breakdown.length > 0 ? breakdown.map((b) => (
                        <div key={b.label} style={{ display: "flex", justifyContent: "space-between", fontSize: 11.5, marginBottom: 3 }} className="gu">
                          <span style={{ color: "var(--text-secondary)" }}>{b.label}</span>
                          <span className="mono" style={{ fontWeight: 600 }}>{b.count}</span>
                        </div>
                      )) : <div style={{ fontSize: 11, color: "var(--text-tertiary)" }} className="gu">{t("No duties this month", "આ મહિને કોઈ ડ્યુટી નથી")}</div>}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </React.Fragment>
      )}

      {view === "designation" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 7 }}>
          {desgRows.map((r) => barRow(r.label, r.label, r.count, maxDesg > 0 ? Math.round((r.count / maxDesg) * 100) : 0, "var(--status-purple-text)"))}
          {desgRows.length === 0 && <div style={{ fontSize: 12, color: "var(--text-tertiary)" }} className="gu">{t("No staff yet.", "હજુ કોઈ સ્ટાફ નથી.")}</div>}
        </div>
      )}

      {view === "worktype" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 7 }}>
          {catRows.map((r) => barRow(r.label, r.label, r.count, maxCat > 0 ? Math.round((r.count / maxCat) * 100) : 0, "var(--status-info-text)"))}
          {catRows.length === 0 && <div style={{ fontSize: 12, color: "var(--text-tertiary)" }} className="gu">{t("No work types yet.", "હજુ કોઈ કામનો પ્રકાર નથી.")}</div>}
        </div>
      )}
    </div>
  );
}

// ---------- Duty calendar (look up who was on duty on any given date) ----------
// Builds the Sun-Sat grid of date strings ("YYYY-MM-DD") for a given
// "YYYY-MM" month, padding the start/end with nulls so the grid always
// lines up under the weekday headers.
function monthMatrix(monthStr) {
  const [y, m] = monthStr.split("-").map(Number);
  const first = new Date(y, m - 1, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) {
    cells.push(`${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`);
  }
  while (cells.length % 7 !== 0) cells.push(null);
  return cells;
}
// Sun-Sat bounds ("YYYY-MM-DD" each) of the week containing a given date —
// shared by any calendar-style view that offers a "week" granularity
// (e.g. Skip history) alongside its day/month views.
function weekBounds(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const day = d.getDay();
  const start = new Date(d);
  start.setDate(d.getDate() - day);
  const end = new Date(start);
  end.setDate(start.getDate() + 6);
  const toStr = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
  return [toStr(start), toStr(end)];
}
// Shared by every modal/panel in the app: pressing Esc calls the given
// close/cancel handler, so there's one consistent way out of any overlay
// instead of having to hunt for its Cancel/✕ button.
function useEscToClose(onClose) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);
}
// Shared by every reorderable list in the app (work types, designations,
// leave types, outstation types) — drag-and-drop for mouse/desktop, via
// each row's onDragStart/onDragOver/onDrop. Touch devices don't support
// native HTML5 drag-and-drop reliably, so callers also get moveUp/moveDown
// to wire into ▲/▼ buttons as a touch-friendly fallback that does the same
// reorder. onReorder(draggedId, targetId) does the actual persist.
function useDragReorder(onReorder) {
  const [draggedId, setDraggedId] = useState(null);
  const dragProps = (id) => ({
    draggable: true,
    onDragStart: () => setDraggedId(id),
    onDragOver: (e) => e.preventDefault(),
    onDrop: (e) => { e.preventDefault(); if (draggedId && draggedId !== id) onReorder(draggedId, id); setDraggedId(null); },
    onDragEnd: () => setDraggedId(null),
  });
  return { draggedId, dragProps };
}
const calNavBtn = {
  background: "var(--bg-surface-2)", border: "1px solid var(--border)", borderRadius: 6, width: 26, height: 26,
  fontSize: 14, color: "var(--text-primary)", display: "flex", alignItems: "center", justifyContent: "center",
};
function CalendarView({ data }) {
  const { t, lang } = useLang();
  const [month, setMonth] = useState(todayStr().slice(0, 7));
  const [selectedDate, setSelectedDate] = useState(todayStr());
  const [pdfBusy, setPdfBusy] = useState(false);
  const [showInfo, setShowInfo] = useState(false);

  const desgLabelOf = useMemo(() => {
    const map = {};
    (data.designations || []).forEach((d) => { map[d.id] = d.label; });
    return (id) => (id && map[id]) || "";
  }, [data.designations]);

  // date ("YYYY-MM-DD") -> array of duty records, built once from every
  // category's history so the whole calendar (and the day-count badges)
  // stays accurate no matter which month is being viewed.
  const dutyByDate = useMemo(() => {
    const map = {};
    (data.categories || []).forEach((c) => {
      (data.membership[c.id] || []).forEach((m) => {
        const staffRec = data.staff[m.number];
        const name = staffRec ? staffRec.name : m.number;
        (m.history || []).forEach((entry) => {
          const date = historyDate(entry);
          if (!map[date]) map[date] = [];
          map[date].push({
            catId: c.id, catLabel: c.label, number: m.number, name,
            designation: staffRec ? desgLabelOf(staffRec.designation) : "",
            note: historyNote(entry),
          });
        });
      });
    });
    return map;
  }, [data, desgLabelOf]);

  // catId|number -> that person's duty history in that work type collapsed
  // into spans (via groupHistoryRows) — e.g. an 11-day Group Duty
  // assignment becomes one { from, to } span instead of 11 separate days.
  // Lets the day-detail panel show "X days left" next to a name when the
  // selected date falls inside a multi-day assigned stint.
  const dutySpansByKey = useMemo(() => {
    const map = {};
    (data.categories || []).forEach((c) => {
      (data.membership[c.id] || []).forEach((m) => {
        const rows = (m.history || [])
          .map((entry, idx) => ({ number: m.number, name: m.number, catLabel: c.label, date: historyDate(entry), ts: historyTs(entry), note: historyNote(entry), batch: historyBatch(entry), idx }))
          .sort((a, b) => (b.date === a.date ? b.ts - a.ts : b.date.localeCompare(a.date)));
        map[c.id + "|" + m.number] = groupHistoryRows(rows);
      });
    });
    return map;
  }, [data]);
  // Days remaining (inclusive of the selected date, 0 = last day) until a
  // multi-day duty span ends — null if the date isn't inside a span, or
  // the span is only a single day (nothing to count down).
  const dutyDaysRemaining = (catId, number, date) => {
    const spans = dutySpansByKey[catId + "|" + number] || [];
    const span = spans.find((g) => date >= g.from && date <= g.to);
    if (!span || span.from === span.to) return null;
    return daysBetween(date, span.to);
  };
  // The full { from, to } of the multi-day span the selected date falls
  // inside — null for a single-day duty (nothing to show a range for).
  // Lets any day within a Group Duty assignment show "05/08/2026 –
  // 15/08/2026" next to the name, not just the one date being viewed, so
  // it's clear at a glance the whole stint even from a day in the middle.
  const dutySpanRange = (catId, number, date) => {
    const spans = dutySpansByKey[catId + "|" + number] || [];
    const span = spans.find((g) => date >= g.from && date <= g.to);
    if (!span || span.from === span.to) return null;
    return { from: span.from, to: span.to };
  };

  // A person can be marked away either from "Events & reminders" (a dated
  // Leave/Outstation/Training record) or from "Manage staff" (any Leave/
  // Outstation period ever entered for them — past, current, or future,
  // via unavailableHistory). Both are checked so the calendar shows someone
  // as away on EVERY day their Leave or Outstation period covers — a
  // 10-day outstation (individual or via Group Duty's "mark Outstation"
  // toggle) shows the person away on all 10 days, same for a long leave.
  // Skip is intentionally never shown here — a skipped person is simply
  // left out of the duty calendar entirely, same as if they weren't
  // scheduled at all.
  const awayForDate = (date) => {
    const map = {};
    (data.events || []).forEach((ev) => {
      if (ev.start && ev.end && date >= ev.start && date <= ev.end) {
        map[ev.number || ev.name] = { number: ev.number, name: ev.name, type: ev.type, label: eventTypeLabel(ev.type, lang), from: ev.start, to: ev.end };
      }
    });
    Object.values(data.staff || {}).forEach((s) => {
      if (map[s.number]) return;
      const u = unavailableOnDate(s, date);
      if (!u) return;
      const kind = unavailKind(u);
      if (kind === "Outstation" || kind === "Leave") {
        map[s.number] = { number: s.number, name: s.name, type: kind, label: unavailLabel(data, u) || kind, from: u.from, to: u.to || null };
      }
    });
    return Object.values(map);
  };

  // Every Leave / Outstation / Training event (from Events & reminders)
  // whose date range overlaps the selected month, plus every Leave/
  // Outstation period on record for anyone in Manage staff (past, current,
  // or future — from unavailableHistory) whose period overlaps it — the
  // source list for the "export leave/outstation calendar" PDF below.
  const monthStart = month + "-01";
  const monthEnd = (() => {
    const [y, m] = month.split("-").map(Number);
    const d = new Date(y, m, 0);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  })();
  const monthAwayRows = useMemo(() => {
    const rows = [];
    const seen = new Set();
    (data.events || []).forEach((ev) => {
      if (!ev.start) return;
      const end = ev.end || ev.start;
      if (ev.start <= monthEnd && end >= monthStart) {
        rows.push({ name: ev.name, number: ev.number || "", type: eventTypeLabel(ev.type, lang), start: ev.start, end });
        seen.add((ev.number || ev.name) + "|" + ev.start);
      }
    });
    Object.values(data.staff || {}).forEach((s) => {
      const periods = [...(s.unavailableHistory || [])];
      if (s.unavailable) periods.push(s.unavailable);
      periods.forEach((u) => {
        if (!u || !u.from) return;
        const end = u.to || monthEnd;
        const key = s.number + "|" + u.from;
        if (u.from <= monthEnd && end >= monthStart && !seen.has(key)) {
          const kind = unavailKind(u);
          if (kind === "Leave" || kind === "Outstation") {
            rows.push({ name: s.name, number: s.number, type: unavailLabel(data, u) || kind, start: u.from, end: u.to || "" });
            seen.add(key);
          }
        }
      });
    });
    return rows.sort((a, b) => a.start.localeCompare(b.start) || a.name.localeCompare(b.name));
  }, [data, monthStart, monthEnd, lang]);

  const downloadCalendarPdf = async () => {
    setPdfBusy(true);
    const CAL_FONT_PT = 9;
    try {
      await ensureGujaratiCanvasFont();
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.setFontSize(14);
      doc.text("Nokri Book — Leave / Outstation Calendar", 14, 16);
      doc.setFontSize(10);
      doc.text(monthLabel, 14, 23);
      doc.setFontSize(8.5);
      doc.text("Generated " + new Date().toLocaleString(), 14, 28);
      doc.autoTable({
        startY: 33,
        head: [["#", "Name", "Number", "Type", "From", "To"]],
        body: monthAwayRows.map((r, i) => [i + 1, r.name, r.number, r.type, formatDMY(r.start), r.end ? formatDMY(r.end) : "Ongoing"]),
        styles: { fontSize: CAL_FONT_PT },
        headStyles: { fillColor: [14, 22, 32] },
        // Name (1) and Type (3) can contain Gujarati text — rendered the
        // same way as the Monthly report PDF (real browser text shaping
        // baked into an image) so a name here always matches the app,
        // instead of jsPDF drawing the raw string itself.
        didParseCell: (hookData) => {
          if (hookData.section === "body" && (hookData.column.index === 1 || hookData.column.index === 3)) {
            hookData.cell.text = [];
          }
        },
        didDrawCell: (hookData) => {
          if (hookData.section === "body" && (hookData.column.index === 1 || hookData.column.index === 3)) {
            const raw = hookData.cell.raw;
            if (raw != null && raw !== "") drawTextImageInCell(doc, hookData.cell, renderTextToImage(raw, CAL_FONT_PT), CAL_FONT_PT);
          }
        },
      });
      doc.save(`nokri-book-calendar-${month}.pdf`);
    } catch (e) {
      window.alert(t("Could not load Gujarati font — check your internet connection and try again.", "ગુજરાતી ફોન્ટ લોડ થઈ શક્યો નહીં — તમારું ઇન્ટરનેટ કનેક્શન તપાસો અને ફરી પ્રયાસ કરો."));
    } finally {
      setPdfBusy(false);
    }
  };

  const cells = useMemo(() => monthMatrix(month), [month]);
  const monthLabel = new Date(month + "-01T00:00:00").toLocaleDateString(t("en-IN", "gu-IN"), { month: "long", year: "numeric" });
  const today = todayStr();

  // date -> { count, hasOutstation, hasLeave } for every day shown in the
  // visible month grid, so each cell can show a small dot for "someone was
  // on leave/outstation that day" at a glance — without this, that only
  // showed up after clicking into a day's detail panel. Outstation takes
  // visual priority (purple) since that's usually the more operationally
  // significant one (whole group away, out of town), then Leave (blue).
  const monthAwaySummary = useMemo(() => {
    const map = {};
    cells.forEach((d) => {
      if (!d) return;
      const away = awayForDate(d);
      if (!away.length) return;
      map[d] = {
        count: away.length,
        hasOutstation: away.some((a) => a.type === "Outstation"),
        hasLeave: away.some((a) => a.type === "Leave"),
      };
    });
    return map;
  }, [cells, data, lang]);

  const shiftMonth = (delta) => {
    const [y, m] = month.split("-").map(Number);
    const d = new Date(y, m - 1 + delta, 1);
    setMonth(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`);
  };

  const selDuties = dutyByDate[selectedDate] || [];
  const selAway = awayForDate(selectedDate);
  const selGrouped = useMemo(() => {
    const g = {};
    selDuties.forEach((r) => { (g[r.catLabel] = g[r.catLabel] || []).push(r); });
    return g;
  }, [selDuties]);

  return (
    <React.Fragment>
      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", flexWrap: "wrap", gap: 10 }}>
        <div style={{ display: "flex", alignItems: "center" }}>
          <h1 className="disp gu" style={{ fontSize: 22, fontWeight: 700, margin: 0 }}>{t("Duty calendar", "ડ્યુટી કૅલેન્ડર")}</h1>
          <InfoIconButton active={showInfo} onClick={() => setShowInfo((v) => !v)} label={t("About this screen", "આ સ્ક્રીન વિશે")} />
        </div>
        <button onClick={downloadCalendarPdf} disabled={monthAwayRows.length === 0 || pdfBusy} style={{ background: monthAwayRows.length && !pdfBusy ? "#D98E2B" : "var(--border)", color: "#fff", border: "none", borderRadius: 7, padding: "8px 14px", fontSize: 12.5, fontWeight: 600 }} className="gu">{pdfBusy ? t("Preparing…", "તૈયાર થઈ રહ્યું છે…") : t("Export leave/outstation PDF", "રજા/બહારગામ PDF એક્સપોર્ટ કરો")}</button>
      </div>
      {showInfo && (
        <p style={{ fontSize: 13, color: "var(--text-secondary)", margin: "0 0 20px" }} className="gu">
          {t("Pick any date to see exactly who was on duty (and who was on leave/outstation/training) that day — useful proof if someone questions you later.", "તે દિવસે ડ્યુટી પર બરાબર કોણ હતું (અને કોણ રજા/બહારગામ/તાલીમ પર હતું) તે જોવા માટે કોઈપણ તારીખ પસંદ કરો — પછીથી કોઈ પ્રશ્ન કરે તો ઉપયોગી પુરાવો.")}
        </p>
      )}

      <div style={{ display: "flex", gap: 24, flexWrap: "wrap", alignItems: "flex-start" }}>
        <div style={{ background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 10, padding: 16, flex: "1 1 380px", maxWidth: 460 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <button onClick={() => shiftMonth(-1)} title={t("Previous month", "પાછલો મહિનો")} aria-label={t("Previous month", "પાછલો મહિનો")} style={calNavBtn}>‹</button>
            <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
              <div className="disp" style={{ fontWeight: 700, fontSize: 15 }}>{monthLabel}</div>
              <input type="month" value={month} onChange={(e) => setMonth(e.target.value)} style={{ fontSize: 11, padding: "3px 6px" }} />
            </div>
            <button onClick={() => shiftMonth(1)} title={t("Next month", "આગલો મહિનો")} aria-label={t("Next month", "આગલો મહિનો")} style={calNavBtn}>›</button>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4, marginBottom: 4 }}>
            {[["Sun","રવિ"], ["Mon","સોમ"], ["Tue","મંગળ"], ["Wed","બુધ"], ["Thu","ગુરુ"], ["Fri","શુક્ર"], ["Sat","શનિ"]].map(([en, gu]) => (
              <div key={en} className="gu" style={{ textAlign: "center", fontSize: 10.5, color: "var(--text-tertiary)", fontWeight: 600, padding: "2px 0" }}>{t(en, gu)}</div>
            ))}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4 }}>
            {cells.map((dateStr, i) => {
              if (!dateStr) return <div key={i} />;
              const count = (dutyByDate[dateStr] || []).length;
              const awaySummary = monthAwaySummary[dateStr];
              const isToday = dateStr === today;
              const isSelected = dateStr === selectedDate;
              const dayNum = Number(dateStr.slice(8, 10));
              const dotColor = awaySummary
                ? (awaySummary.hasOutstation ? "var(--status-purple-text)" : awaySummary.hasLeave ? "var(--status-info-text)" : "var(--text-tertiary)")
                : null;
              const awayTitle = awaySummary
                ? t(`${awaySummary.count} away (leave/outstation)`, `${awaySummary.count} ગેરહાજર (રજા/બહારગામ)`)
                : "";
              return (
                <button key={i} onClick={() => setSelectedDate(dateStr)} title={
                  (count ? t(`${count} duty record${count === 1 ? "" : "s"}`, `${count} ડ્યુટી રેકોર્ડ`) : t("No duty recorded", "કોઈ ડ્યુટી નોંધાયેલી નથી"))
                  + (awaySummary ? " · " + awayTitle : "")
                } style={{
                  aspectRatio: "1", border: "1px solid " + (isSelected ? "#D98E2B" : "var(--border-soft)"),
                  background: isSelected ? "var(--status-warning-bg)" : (isToday ? "var(--bg-surface-2)" : "var(--bg-surface)"),
                  borderRadius: 7, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
                  padding: 2, position: "relative",
                }}>
                  {awaySummary && (
                    <span style={{ position: "absolute", top: 3, right: 3, width: 6, height: 6, borderRadius: "50%", background: dotColor }} />
                  )}
                  <span className="mono" style={{ fontSize: 12, fontWeight: isToday ? 700 : 500, color: isSelected ? "var(--status-warning-text)" : "var(--text-primary)" }}>{dayNum}</span>
                  {count > 0 && <span style={{ fontSize: 9, color: "#D98E2B", fontWeight: 700, marginTop: 1 }}>{count}</span>}
                </button>
              );
            })}
          </div>
        </div>

        <div style={{ flex: "1 1 380px", minWidth: 300 }}>
          <div style={{ background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 10, padding: "16px 18px" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4, flexWrap: "wrap", gap: 8 }}>
              <div className="disp" style={{ fontWeight: 700, fontSize: 15 }}>{formatDMY(selectedDate)}</div>
              <input type="date" value={selectedDate} onChange={(e) => { setSelectedDate(e.target.value); setMonth(e.target.value.slice(0, 7)); }} style={{ fontSize: 12 }} />
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 10, fontSize: 11, color: "var(--text-tertiary)" }} className="gu">
              <span style={{ display: "flex", alignItems: "center", gap: 5 }}><span style={{ width: 7, height: 7, borderRadius: "50%", background: "var(--status-purple-text)", display: "inline-block" }} />{t("Outstation", "બહારગામ")}</span>
              <span style={{ display: "flex", alignItems: "center", gap: 5 }}><span style={{ width: 7, height: 7, borderRadius: "50%", background: "var(--status-info-text)", display: "inline-block" }} />{t("Leave", "રજા")}</span>
            </div>

            {Object.keys(selGrouped).length === 0 ? (
              <div style={{ fontSize: 13, color: "var(--text-tertiary)", padding: "8px 0" }} className="gu">{t("No duty recorded on this date.", "આ તારીખે કોઈ ડ્યુટી નોંધાયેલી નથી.")}</div>
            ) : (
              Object.keys(selGrouped).sort().map((cat) => (
                <div key={cat} style={{ marginBottom: 12 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11.5, fontWeight: 700, color: "var(--text-secondary)", textTransform: "uppercase", letterSpacing: 0.3, marginBottom: 5 }}>
                    <span style={{ width: 6, height: 6, borderRadius: "50%", background: "#D98E2B", display: "inline-block", flexShrink: 0 }} />
                    {cat}
                  </div>
                  {selGrouped[cat].map((r, i) => {
                    const remaining = dutyDaysRemaining(r.catId, r.number, selectedDate);
                    const range = dutySpanRange(r.catId, r.number, selectedDate);
                    return (
                      <div key={i} className="gu" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 13, padding: "5px 0", borderTop: i ? "1px solid var(--border-soft)" : "none", gap: 8 }}>
                        <span>
                          {r.name} <span className="mono" style={{ fontSize: 11, color: "var(--text-tertiary)" }}>#{r.number}</span>{r.designation ? <span style={{ fontSize: 11, color: "var(--status-warning-text)" }}> · {r.designation}</span> : null}
                          {range && (
                            <span style={{ display: "block", fontSize: 10.5, color: "var(--text-tertiary)", marginTop: 1 }}>{formatDMY(range.from)} – {formatDMY(range.to)}</span>
                          )}
                        </span>
                        <span style={{ display: "flex", alignItems: "center", gap: 6, flexShrink: 0 }}>
                          {remaining !== null && (
                            <span style={{ fontSize: 10.5, fontWeight: 700, background: "var(--status-warning-bg)", color: "var(--status-warning-text)", border: "1px solid var(--status-warning-border)", borderRadius: 10, padding: "2px 8px", whiteSpace: "nowrap" }} className="gu">
                              {remaining === 0 ? t("last day", "છેલ્લો દિવસ") : t(`${remaining} day${remaining === 1 ? "" : "s"} left`, `${remaining} દિવસ બાકી`)}
                            </span>

                          {r.note && <span style={{ fontSize: 11.5, color: "var(--text-tertiary)" }} title={r.note}>📝</span>}
                        </span>
                      </div>
                    );
                  })}
                </div>
              ))
            )}

            {selAway.length > 0 && (
              <div style={{ marginTop: 14, paddingTop: 12, borderTop: "1px solid var(--border-soft)" }}>
                <div style={{ fontSize: 11.5, fontWeight: 700, color: "var(--text-secondary)", textTransform: "uppercase", letterSpacing: 0.3, marginBottom: 5 }} className="gu">{t("Not present that day (leave / outstation)", "તે દિવસે હાજર નથી (રજા / બહારગામ)")}</div>
                {selAway.map((a) => {
                  const style = EVENT_TYPE_STYLE[a.type] || STATUS_STYLE[a.type] || {};
                  const remaining = a.to ? daysBetween(selectedDate, a.to) : null;
                  return (
                    <div key={a.number || a.name} className="gu" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 13, padding: "5px 0" }}>
                      <span>{a.name}{a.number ? <span className="mono" style={{ fontSize: 11, color: "var(--text-tertiary)" }}> #{a.number}</span> : null}</span>

                            {remaining === 0 ? t("returns tomorrow", "આવતીકાલે પાછા ફરશે") : t(`${remaining} day${remaining === 1 ? "" : "s"} until return`, `${remaining} દિવસમાં પાછા ફરશે`)}
                          </span>
                        )}
                        <span style={{ fontSize: 10.5, fontWeight: 700, background: style.bg, color: style.fg, border: "1px solid " + style.border, borderRadius: 10, padding: "2px 8px" }}>{a.label}</span>
                      </span>
                    </div>
                  );
                })}
              </div>
            )}

            {selDuties.length > 0 && (
              <div style={{ marginTop: 14, paddingTop: 12, borderTop: "1px solid var(--border-soft)", fontSize: 12, color: "var(--text-secondary)" }} className="gu">
                {t(`${selDuties.length} employee${selDuties.length === 1 ? "" : "s"} on duty across ${Object.keys(selGrouped).length} work type${Object.keys(selGrouped).length === 1 ? "" : "s"} on ${formatDMY(selectedDate)}.`, `${formatDMY(selectedDate)} ના રોજ ${Object.keys(selGrouped).length} કામના પ્રકારોમાં ${selDuties.length} કર્મચારીઓ ડ્યુટી પર હતા.`)}
              </div>
            )}
          </div>
        </div>
      </div>
    </React.Fragment>
  );
}

function ReportView({ data }) {
  const { t } = useLang();
  const [month, setMonth] = useState(todayStr().slice(0, 7));
  const [pdfBusy, setPdfBusy] = useState(false);
  const [sortNames, setSortNames] = useState("name"); // name | duties
  const [showInfo, setShowInfo] = useState(false);

  const desgLabelOf = useMemo(() => {
    const map = {};
    (data.designations || []).forEach((d) => { map[d.id] = d.label; });
    return (id) => (id && map[id]) || "—";
  }, [data.designations]);

  const rows = useMemo(() => {
    const out = [];
    data.categories.forEach((c) => {
      (data.membership[c.id] || []).forEach((m) => {
        const staffRec = data.staff[m.number];
        if (!staffRec) return;
        (m.history || []).forEach((entry) => {
          const date = historyDate(entry);
          if (date.slice(0, 7) === month) out.push({ name: staffRec.name, designation: desgLabelOf(staffRec.designation), category: c.label, date, note: historyNote(entry) });
        });
      });
    });
    return out.sort((a, b) => a.name.localeCompare(b.name) || a.date.localeCompare(b.date));
  }, [data, month, desgLabelOf]);

  const grouped = useMemo(() => {
    const g = {};
    rows.forEach((r) => { (g[r.name] = g[r.name] || []).push(r); });
    return g;
  }, [rows]);

  // Names ordered either alphabetically or by total duty count (most first)
  // — this is the "who does duty the most" view across every work type
  // combined, for the selected month.
  const orderedNames = useMemo(() => {
    const names = Object.keys(grouped);
    if (sortNames === "duties") return names.sort((a, b) => grouped[b].length - grouped[a].length || a.localeCompare(b));
    return names.sort();
  }, [grouped, sortNames]);

  const monthLabel = new Date(month + "-01T00:00:00").toLocaleDateString(t("en-IN", "gu-IN"), { month: "long", year: "numeric" });

  const downloadPdf = async () => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const GU_FONT = "NotoSansGujarati";
    const FONT_PT = 9;

    setPdfBusy(true);
    try {
      const base64 = await loadGujaratiFont();
      doc.addFileToVFS("NotoSansGujarati-Regular.ttf", base64);
      doc.addFont("NotoSansGujarati-Regular.ttf", GU_FONT, "normal");
      await ensureGujaratiCanvasFont();
    } catch (e) {
      setPdfBusy(false);
      window.alert(t("Could not load Gujarati font — check your internet connection and try again.", "ગુજરાતી ફોન્ટ લોડ થઈ શક્યો નહીં — તમારું ઇન્ટરનેટ કનેક્શન તપાસો અને ફરી પ્રયાસ કરો."));
      return;
    }
    setPdfBusy(false);

    doc.setFontSize(14);
    doc.text("Nokri Book — Monthly Duty Report", 14, 16);
    doc.setFontSize(10);
    doc.text(monthLabel, 14, 23);
    doc.setFontSize(8.5);
    doc.text("Generated " + new Date().toLocaleString(), 14, 28);
    // Summary table first: one row per person, total duties this month
    // across every work type combined, most duties first — the "who does
    // duty the most" answer at a glance before the full day-by-day list.
    const summaryNames = Object.keys(grouped).sort((a, b) => grouped[b].length - grouped[a].length || a.localeCompare(b));
    // Every cell that might contain Gujarati text (Name, Designation, Work
    // type, Note — basically anything that isn't a plain number or a
    // machine-formatted date) is rendered to an image up front via
    // renderTextToImage, using the browser's own text shaping, rather than
    // letting jsPDF draw the raw string itself — see the long comment on
    // renderTextToImage for why that's the part that was actually causing
    // names to come out wrong in the PDF. didParseCell blanks the cell's
    // native text (so jsPDF never draws its own, incorrect version) while
    // still leaving `cell.raw` and normal auto-sizing untouched;
    // didDrawCell then places the correct pre-rendered image on top.
    doc.autoTable({
      startY: 33,
      head: [["#", "Name", "Designation", "Total duties"]],
      body: summaryNames.map((name, i) => [i + 1, name, grouped[name][0].designation, grouped[name].length]),
      styles: { fontSize: FONT_PT },
      headStyles: { fillColor: [14, 22, 32] },
      didParseCell: (hookData) => {
        if (hookData.section === "body" && (hookData.column.index === 1 || hookData.column.index === 2)) {
          hookData.cell.text = [];
        }
      },
      didDrawCell: (hookData) => {
        if (hookData.section === "body" && (hookData.column.index === 1 || hookData.column.index === 2)) {
          const raw = hookData.cell.raw;
          if (raw != null && raw !== "") drawTextImageInCell(doc, hookData.cell, renderTextToImage(raw, FONT_PT), FONT_PT);
        }
      },
    });

    doc.setFontSize(11);
    doc.text("Full detail", 14, doc.lastAutoTable.finalY + 10);
    doc.autoTable({
      startY: doc.lastAutoTable.finalY + 14,
      head: [["#", "Name", "Designation", "Work type", "Date", "Note"]],
      body: rows.map((r, i) => [i + 1, r.name, r.designation, r.category, formatDMY(r.date), r.note || ""]),
      styles: { fontSize: FONT_PT },
      headStyles: { fillColor: [14, 22, 32] },
      // Name (1), Designation (2), Work type (3), and Note (5) can all
      // contain Gujarati text — Date (4) and # (0) are always plain
      // numbers/ASCII, so those stay on jsPDF's normal text rendering.
      didParseCell: (hookData) => {
        if (hookData.section === "body" && [1, 2, 3, 5].includes(hookData.column.index)) {
          hookData.cell.text = [];
        }
      },
      didDrawCell: (hookData) => {
        if (hookData.section === "body" && [1, 2, 3, 5].includes(hookData.column.index)) {
          const raw = hookData.cell.raw;
          if (raw != null && raw !== "") drawTextImageInCell(doc, hookData.cell, renderTextToImage(raw, FONT_PT), FONT_PT);
        }
      },
    });
    doc.save(`nokri-book-report-${month}-gu.pdf`);
  };

  return (
    <React.Fragment>
      <div style={{ display: "flex", alignItems: "center", marginBottom: showInfo ? 4 : 20 }}>
        <h1 className="disp gu" style={{ fontSize: 22, fontWeight: 700, margin: 0 }}>{t("Monthly report", "માસિક અહેવાલ")}</h1>
        <InfoIconButton active={showInfo} onClick={() => setShowInfo((v) => !v)} label={t("About this screen", "આ સ્ક્રીન વિશે")} />
      </div>
      {showInfo && (
        <p style={{ fontSize: 13, color: "var(--text-secondary)", margin: "0 0 20px" }} className="gu">
          {t("Shows every duty completed in the selected month, by name and work type. Workplace numbers are never included in the report.", "પસંદ કરેલા મહિનામાં પૂર્ણ થયેલી દરેક ડ્યુટી, નામ અને કામના પ્રકાર પ્રમાણે બતાવે છે. કાર્યસ્થળ નંબરો ક્યારેય અહેવાલમાં સામેલ થતા નથી.")}
        </p>
      )}

      <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 18, flexWrap: "wrap" }}>
        <input type="month" value={month} onChange={(e) => setMonth(e.target.value)} />
        <button onClick={downloadPdf} disabled={rows.length === 0 || pdfBusy} style={{ background: rows.length && !pdfBusy ? "#D98E2B" : "var(--border)", color: "#fff", border: "none", borderRadius: 7, padding: "8px 16px", fontSize: 13, fontWeight: 600 }} className="gu">{pdfBusy ? t("Preparing…", "તૈયાર થઈ રહ્યું છે…") : t("Download PDF (Gujarati)", "PDF ડાઉનલોડ કરો (ગુજરાતી)")}</button>
        <div style={{ fontSize: 12, color: "var(--text-secondary)" }} className="gu">{t(`${rows.length} duty record${rows.length === 1 ? "" : "s"} in ${monthLabel}`, `${monthLabel} માં ${rows.length} ડ્યુટી રેકોર્ડ`)}</div>
      </div>

      <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
        <button onClick={() => setSortNames("name")} style={catTabBtn(sortNames === "name")} className="gu">{t("Sort: Name", "ક્રમ: નામ")}</button>
        <button onClick={() => setSortNames("duties")} style={catTabBtn(sortNames === "duties")} className="gu">{t("Sort: Most duties first", "ક્રમ: સૌથી વધુ ડ્યુટી પ્રથમ")}</button>
      </div>

      <div style={{ background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 10, overflow: "hidden" }}>
        {orderedNames.length === 0 ? (
          <div style={{ padding: "26px 0", textAlign: "center", color: "var(--text-tertiary)", fontSize: 13 }} className="gu">{t(`No duty recorded for ${monthLabel} yet.`, `${monthLabel} માટે હજુ કોઈ ડ્યુટી નોંધાયેલી નથી.`)}</div>
        ) : orderedNames.map((name, i) => (
          <div key={name} style={{ borderTop: "1px solid var(--border-soft)", padding: "12px 18px" }}>
            <div className="gu" style={{ fontWeight: 600, fontSize: 14, marginBottom: 5, display: "flex", alignItems: "center", gap: 8 }}>
              {sortNames === "duties" && <span className="mono" style={{ fontSize: 11, color: "var(--text-tertiary)" }}>#{i + 1}</span>}
              <span>{name}</span>
              {grouped[name][0].designation && grouped[name][0].designation !== "—" && (
                <span style={{ fontSize: 11, fontWeight: 500, color: "var(--status-warning-text)" }}>({grouped[name][0].designation})</span>
              )}
              <span className="mono" style={{ fontSize: 11, fontWeight: 700, background: "var(--status-warning-bg)", color: "var(--status-warning-text)", borderRadius: 10, padding: "1px 8px" }}>{grouped[name].length}</span>
            </div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
              {grouped[name].map((r, i) => (
                <span key={i} className="mono" title={r.note || ""} style={{ fontSize: 11.5, background: "var(--bg-surface-2)", border: "1px solid var(--border-soft)", borderRadius: 5, padding: "3px 8px" }}>{r.category} · {formatDMY(r.date)}{r.note ? " 📝" : ""}</span>
              ))}
            </div>
          </div>
        ))}
      </div>
    </React.Fragment>
  );
}

// ---------- Employee events (Leave / Outstation Duty / Training) + reminders ----------
function EventsView({ data, allReminders, addEvent, updateEvent, deleteEvent, acknowledgeReminder, notifPermission, requestNotifPermission }) {
  const { t } = useLang();
  const [tab, setTab] = useState("events"); // events | reminders
  const [showAcked, setShowAcked] = useState(false);
  const [showInfo, setShowInfo] = useState(false);
  const events = data.events || [];
  const pendingCount = allReminders.filter((r) => r.status === "Pending").length;
  const reminderRows = useMemo(() => (showAcked ? allReminders : allReminders.filter((r) => r.status === "Pending")), [allReminders, showAcked]);

  return (
    <React.Fragment>
      <div style={{ display: "flex", alignItems: "center", marginBottom: showInfo ? 4 : 20 }}>
        <h1 className="disp gu" style={{ fontSize: 22, fontWeight: 700, margin: 0 }}>{t("Events & reminders", "ઇવેન્ટ્સ અને રિમાઇન્ડર")}</h1>
        <InfoIconButton active={showInfo} onClick={() => setShowInfo((v) => !v)} label={t("About this screen", "આ સ્ક્રીન વિશે")} />
      </div>
      {showInfo && (
        <p style={{ fontSize: 13, color: "var(--text-secondary)", margin: "0 0 20px" }} className="gu">
          {t("Record leave, outstation duty, and training for any employee — pick them by બકલ નંબર instead of typing the name. A reminder fires automatically one day before and again on the day itself for both the start and the end (so a leave's completion is always flagged the day before and the day of), and keeps reappearing every day until you acknowledge it.", "કોઈપણ કર્મચારી માટે રજા, બહારગામ ડ્યુટી, અને તાલીમ નોંધો — નામ ટાઈપ કરવાને બદલે બકલ નંબર દ્વારા તેમને પસંદ કરો. શરૂઆત અને અંત બંને માટે એક દિવસ પહેલા અને તે જ દિવસે આપમેળે રિમાઇન્ડર આવે છે (જેથી રજા પૂરી થવાની હંમેશા એક દિવસ પહેલા અને તે દિવસે નોંધ લેવાય), અને તમે તેને સ્વીકારો નહીં ત્યાં સુધી દરરોજ ફરી દેખાય છે.")}
        </p>
      )}

      <div style={{ display: "flex", gap: 6, marginBottom: 20 }}>
        <button onClick={() => setTab("events")} style={catTabBtn(tab === "events")} className="gu">{t("Events", "ઇવેન્ટ્સ")}{events.length ? ` (${events.length})` : ""}</button>
        <button onClick={() => setTab("reminders")} style={catTabBtn(tab === "reminders")} className="gu">{t("Reminders", "રિમાઇન્ડર")}{pendingCount ? ` (${pendingCount})` : ""}</button>
      </div>

      {tab === "events" ? (
        <EventsTab data={data} events={events} addEvent={addEvent} updateEvent={updateEvent} deleteEvent={deleteEvent} />
      ) : (
        <React.Fragment>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10, marginBottom: 14 }}>
            <label style={{ fontSize: 12.5, color: "var(--text-secondary)", display: "flex", alignItems: "center", gap: 6 }} className="gu">
              <input type="checkbox" checked={showAcked} onChange={(e) => setShowAcked(e.target.checked)} />
              {t("Show acknowledged too", "સ્વીકૃત પણ બતાવો")}
            </label>
            {notifPermission !== "granted" && notifPermission !== "unsupported" && (
              <button onClick={requestNotifPermission} style={{ background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 7, padding: "6px 12px", fontSize: 12, fontWeight: 600, color: "var(--text-primary)" }} className="gu">
                {t("Enable browser notifications", "બ્રાઉઝર નોટિફિકેશન સક્ષમ કરો")}
              </button>
            )}
          </div>
          <ReminderTable rows={reminderRows} onAcknowledge={acknowledgeReminder} />
        </React.Fragment>
      )}
    </React.Fragment>
  );
}

function EventsTab({ data, events, addEvent, updateEvent, deleteEvent }) {
  const { t, lang } = useLang();
  const [number, setNumber] = useState("");
  const [name, setName] = useState("");
  const [type, setType] = useState("Leave");
  const [start, setStart] = useState(todayStr());
  const [end, setEnd] = useState(todayStr());
  const [notes, setNotes] = useState("");
  const [editingId, setEditingId] = useState(null);

  const staffList = useMemo(
    () => Object.values(data.staff || {}).sort((a, b) => (a.number || "").localeCompare(b.number || "", undefined, { numeric: true })),
    [data.staff]
  );
  const staffNames = useMemo(() => staffList.map((s) => s.name), [staffList]);
  const sorted = useMemo(() => [...events].sort((a, b) => b.start.localeCompare(a.start)), [events]);

  const resetForm = () => { setNumber(""); setName(""); setType("Leave"); setStart(todayStr()); setEnd(todayStr()); setNotes(""); };

  // Typing a badge number that matches a known employee auto-fills the name.
  // It's a free-text field (with a searchable datalist of suggestions), so
  // any number can be typed — not limited to picking from a fixed list.
  const handleNumberInput = (val) => {
    setNumber(val);
    const rec = data.staff[val];
    if (rec) setName(rec.name);
  };

  return (
    <React.Fragment>
      <datalist id="staff-name-list">
        {staffNames.map((n, i) => <option key={i} value={n} />)}
      </datalist>
      <datalist id="staff-number-list">
        {staffList.map((s) => <option key={s.number} value={s.number}>{s.number} — {s.name}</option>)}
      </datalist>

      <div style={{ background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 10, overflow: "hidden", marginBottom: 18 }}>
        <div style={{ overflowX: "auto" }}>
        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
          <thead>
            <tr style={{ background: "var(--bg-surface-2)", textAlign: "left" }} className="gu">
              <th style={th}>{t("Employee", "કર્મચારી")}</th><th style={th}>બકલ નંબર</th><th style={th}>{t("Type", "પ્રકાર")}</th><th style={th}>{t("Start", "શરૂઆત")}</th><th style={th}>{t("End", "અંત")}</th><th style={th}>{t("Notes", "નોંધ")}</th><th style={{ ...th, textAlign: "right" }}>{t("Actions", "ક્રિયાઓ")}</th>
            </tr>
          </thead>
          <tbody>
            {sorted.map((ev) => (
              editingId === ev.id ? (
                <EventEditRow key={ev.id} data={data} event={ev} onSave={(patch) => { updateEvent(ev.id, patch); setEditingId(null); }} onCancel={() => setEditingId(null)} />
              ) : (
                <tr key={ev.id} style={{ borderTop: "1px solid var(--border-soft)" }}>
                  <td style={td} className="gu">{ev.name}</td>
                  <td style={td} className="mono">{ev.number || "—"}</td>
                  <td style={td}>
                    <span className="gu" style={{ fontSize: 11.5, fontWeight: 600, padding: "3px 8px", borderRadius: 6, border: "1px solid " + EVENT_TYPE_STYLE[ev.type].border, background: EVENT_TYPE_STYLE[ev.type].bg, color: EVENT_TYPE_STYLE[ev.type].fg }}>{eventTypeLabel(ev.type, lang)}</span>
                  </td>
                  <td style={td} className="mono">{formatDMY(ev.start)}</td>
                  <td style={td} className="mono">{formatDMY(ev.end)}</td>
                  <td style={{ ...td, maxWidth: 220, color: "var(--text-secondary)" }} className="gu">{ev.notes || "—"}</td>
                  <td style={{ ...td, textAlign: "right" }}>
                    <button onClick={() => setEditingId(ev.id)} title={t("Edit", "ફેરફાર કરો")} aria-label={t("Edit", "ફેરફાર કરો")} style={iconBtn}>✎</button>
                    <button onClick={() => deleteEvent(ev.id)} title={t("Delete", "ડિલીટ કરો")} aria-label={t("Delete", "ડિલીટ કરો")} style={{ ...iconBtn, marginLeft: 4 }}>✕</button>
                  </td>
                </tr>
              )
            ))}
            {sorted.length === 0 && (
              <tr><td colSpan={7} style={{ ...td, textAlign: "center", color: "var(--text-tertiary)", padding: "26px 0" }} className="gu">{t("No events recorded yet.", "હજુ સુધી કોઈ ઇવેન્ટ નોંધાયેલ નથી.")}</td></tr>
            )}
          </tbody>
        </table>
        </div>
      </div>

      <div style={{ background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 10, padding: 16 }}>
        <div className="disp gu" style={{ fontSize: 14, fontWeight: 700, marginBottom: 10 }}>{t("+ Add event", "+ ઇવેન્ટ ઉમેરો")}</div>
        <form
          onSubmit={(e) => { e.preventDefault(); addEvent(name, type, start, end, notes, number); resetForm(); }}
          style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "flex-start" }}
        >
          <input type="text" list="staff-number-list" placeholder="બકલ નંબર" title={t("Type any badge number — fills the name in automatically if it matches", "કોઈપણ બકલ નંબર લખો — મેળ ખાય તો નામ આપમેળે ભરાશે")} value={number} onChange={(e) => handleNumberInput(e.target.value)} style={{ width: 170 }} className="gu" />
          <input type="text" list="staff-name-list" placeholder={t("Employee name", "કર્મચારીનું નામ")} value={name} onChange={(e) => { setName(e.target.value); setNumber(""); }} style={{ width: 180 }} className="gu" />
          <select value={type} onChange={(e) => setType(e.target.value)} style={{ border: "1px solid var(--border)", borderRadius: 6, padding: "7px 10px", fontSize: 13, background: "var(--bg-surface)", color: "var(--text-primary)" }} className="gu">
            {EVENT_TYPES.map((ty) => <option key={ty} value={ty}>{eventTypeLabel(ty, lang)}</option>)}
          </select>
          <input type="date" value={start} onChange={(e) => setStart(e.target.value)} title={t("Start date", "શરૂઆતની તારીખ")} />
          <input type="date" value={end} onChange={(e) => setEnd(e.target.value)} title={t("End date", "અંતિમ તારીખ")} />
          <input type="text" placeholder={t("Notes (optional)", "નોંધ (વૈકલ્પિક)")} value={notes} onChange={(e) => setNotes(e.target.value)} style={{ width: 200 }} className="gu" />

      </div>

}

function EventEditRow({ data, event, onSave, onCancel }) {
  const { t, lang } = useLang();
  const [number, setNumber] = useState(event.number || "");
  const [name, setName] = useState(event.name);
  const [type, setType] = useState(event.type);
  const [start, setStart] = useState(event.start);
  const [end, setEnd] = useState(event.end);
  const [notes, setNotes] = useState(event.notes || "");

  const handleNumberInput = (val) => {
    setNumber(val);
    const rec = data ? data.staff[val] : null;
    if (rec) setName(rec.name);
  };

  return (
    <tr style={{ borderTop: "1px solid var(--border-soft)", background: "var(--highlight-bg)" }}>
      <td style={td}><input type="text" list="staff-name-list" value={name} onChange={(e) => { setName(e.target.value); setNumber(""); }} style={{ width: 130 }} /></td>
      <td style={td}>
        <input type="text" list="staff-number-list" value={number} onChange={(e) => handleNumberInput(e.target.value)} title="બકલ નંબર" style={{ width: 90 }} />
      </td>
      <td style={td}>
        <select value={type} onChange={(e) => setType(e.target.value)} style={{ border: "1px solid var(--border)", borderRadius: 6, padding: "5px 8px", fontSize: 12 }} className="gu">
          {EVENT_TYPES.map((ty) => <option key={ty} value={ty}>{eventTypeLabel(ty, lang)}</option>)}
        </select>
      </td>
      <td style={td}><input type="date" value={start} onChange={(e) => setStart(e.target.value)} /></td>
      <td style={td}><input type="date" value={end} onChange={(e) => setEnd(e.target.value)} /></td>
      <td style={td}><input type="text" value={notes} onChange={(e) => setNotes(e.target.value)} style={{ width: 160 }} /></td>
      <td style={{ ...td, textAlign: "right", whiteSpace: "nowrap" }}>
        <button onClick={() => onSave({ name: name.trim(), number: number || null, type, start, end, notes: notes.trim() })} title={t("Save", "સાચવો")} aria-label={t("Save", "સાચવો")} style={{ ...iconBtn, color: "var(--status-success-text)" }}>✓</button>
        <button onClick={onCancel} title={t("Cancel", "રદ કરો")} aria-label={t("Cancel", "રદ કરો")} style={{ ...iconBtn, marginLeft: 4 }}>✕</button>
      </td>
    </tr>
  );
}

function ReminderTable({ rows, onAcknowledge }) {

// Auto-opened whenever there's something pending (like a calendar app
// greeting you with what's due), and reachable any time via the bell button.
// Closing it only hides it for now — it comes back next time something is

  const { t, lang } = useLang();
  useEscToClose(onClose);
  return (
    <div role="dialog" aria-label={t("Reminders", "યાદ અપાવો")} style={{
      position: "fixed", top: 18, right: 18, width: 340, maxWidth: "calc(100vw - 36px)",
      maxHeight: "calc(100vh - 36px)", overflowY: "auto", background: "var(--bg-surface)", border: "1px solid var(--border)",

      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 16px", borderBottom: "1px solid var(--border-soft)" }}>
        <div className="disp gu" style={{ fontSize: 14, fontWeight: 700 }}>{t("Reminders", "યાદ અપાવો")}{reminders.length ? ` (${reminders.length})` : ""}</div>
        <button onClick={onClose} title={t("Dismiss for now — reopens next time something's due", "હમણાં માટે બંધ કરો — ફરી કંઈક બાકી હોય ત્યારે ખુલશે")} aria-label={t("Dismiss for now — reopens next time something's due", "હમણાં માટે બંધ કરો — ફરી કંઈક બાકી હોય ત્યારે ખુલશે")} style={{ background: "transparent", border: "none", color: "var(--text-tertiary)", fontSize: 15 }}>✕</button>
      </div>

      {notifPermission !== "granted" && notifPermission !== "unsupported" && (
        <div style={{ padding: "10px 16px", borderBottom: "1px solid var(--border-soft)" }}>
          <button onClick={requestNotifPermission} style={{ background: "var(--bg-surface-2)", border: "1px solid var(--border)", borderRadius: 6, padding: "6px 10px", fontSize: 12, fontWeight: 600, color: "var(--text-primary)" }} className="gu">{t("Enable browser notifications", "બ્રાઉઝર સૂચનાઓ ચાલુ કરો")}</button>
        </div>
      )}

      {reminders.length === 0 ? (
        <div style={{ padding: "24px 16px", textAlign: "center", color: "var(--text-tertiary)", fontSize: 13 }} className="gu">{t("Nothing pending — you're all caught up.", "કંઈ બાકી નથી — તમે બધું પૂર્ણ કરી લીધું છે.")}</div>
      ) : (
        reminders.map((r) => (
          <div key={r.key} className="gu" style={{ padding: "12px 16px", borderBottom: "1px solid var(--border-soft)" }}>
            <div style={{ fontSize: 11, fontWeight: 600, textTransform: "uppercase", letterSpacing: 0.4, color: EVENT_TYPE_STYLE[r.event.type].fg, marginBottom: 4 }}>{eventTypeLabel(r.event.type, lang)}</div>
            <div style={{ fontSize: 13, color: "var(--text-primary)", marginBottom: 8 }}>{r.message}</div>
            <button onClick={() => onAcknowledge(r.key)} style={{ background: "var(--btn-dark-bg)", color: "#fff", border: "none", borderRadius: 6, padding: "6px 14px", fontSize: 12, fontWeight: 600 }}>OK</button>
          </div>
        ))
      )}

      <div style={{ padding: "10px 16px" }}>

      </div>

  );

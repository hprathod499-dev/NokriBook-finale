              }}>
                <button onClick={() => { exportBackup(); setDataMenuPos(null); setBackupMenuPos(null); }}
                  style={{ display: "block", width: "100%", textAlign: "left", padding: "9px 12px", background: "none", border: "none", borderBottom: "1px solid var(--border-soft)", fontSize: 12.5, cursor: "pointer" }} className="gu"
                >⬇ {langCtxValue.t("Backup", "બેકઅપ")}</button>
                <button onClick={() => { setDataMenuPos(null); setBackupMenuPos(null); importBackupRef.current && importBackupRef.current.click(); }}
                  style={{ display: "block", width: "100%", textAlign: "left", padding: "9px 12px", background: "none", border: "none", borderBottom: "1px solid var(--border-soft)", fontSize: 12.5, cursor: "pointer" }} className="gu"
                >⬆ {langCtxValue.t("Restore", "પુનઃસ્થાપિત કરો")}</button>
                <button onClick={() => { recoverLocalBackup(); setDataMenuPos(null); setBackupMenuPos(null); }}
                  title={langCtxValue.t("Restore from an automatic local snapshot saved on this device, independent of the server", "સર્વરથી સ્વતંત્ર, આ ડિવાઇસ પર સચવાયેલા આપમેળે સ્થાનિક સ્નેપશોટમાંથી પુનઃસ્થાપિત કરો")}
                  style={{ display: "block", width: "100%", textAlign: "left", padding: "9px 12px", background: "none", border: "none", fontSize: 12.5, cursor: "pointer" }} className="gu"
                >🛟 {langCtxValue.t("Recover local data", "સ્થાનિક ડેટા પુનઃપ્રાપ્ત કરો")}</button>
              </div>
            )}
            <input
              ref={importBackupRef} type="file" accept="application/json,.json"
              style={{ display: "none" }}
              onChange={(e) => { importBackup(e.target.files[0]); e.target.value = ""; }}
            />
            <button onClick={() => setShowSharePanel(true)} title={langCtxValue.t("Share a read-only view of the roster", "રોસ્ટરનું ફક્ત-જોવા માટેનું દૃશ્ય શેર કરો")} style={{
              ...undoRedoBtn(true),
              background: data.shareEnabled ? "var(--status-success-bg)" : "var(--bg-surface)",
              borderColor: data.shareEnabled ? "var(--status-success-border)" : "var(--border)",
              color: data.shareEnabled ? "var(--status-success-text)" : "var(--text-primary)",
            }}>{langCtxValue.t("Share", "શેર")}{data.shareEnabled ? " ✓" : ""}</button>
            <button onClick={() => setShowAboutPanel(true)} title={langCtxValue.t("About this app", "આ એપ વિશે")} aria-label={langCtxValue.t("About this app", "આ એપ વિશે")} style={{
              ...undoRedoBtn(true),
              // Deliberately keeps the same 6px top/bottom padding as
              // every sibling button in this row (only the horizontal
              // padding is tightened, for a squarer icon-only look) — the
              // previous padding: 0 dropped that shared vertical padding
              // without an explicit height to compensate, making this one
              // button a different overall height than its neighbors even
              // though every button here is centered in the same flex
              // row. That mismatched height, not the centering itself,
              // was what made it look misaligned.
              padding: "6px 9px", fontSize: 17, lineHeight: 1, fontWeight: 700, letterSpacing: 1,
            }}>⋮</button>
          </div>
          {data.hasSeenWelcome && SECTION_TIPS[view.mode] && !(data.seenSections && data.seenSections[view.mode]) && (
            <SectionTip
              tipKey={view.mode}
              onDismiss={() => persist({ ...dataRef.current, seenSections: { ...(dataRef.current.seenSections || {}), [view.mode]: true } })}
            />
          )}
          {view.mode === "home" && (
            <HomeView data={data} goToCategory={(catId) => setView({ mode: "category", catId })} />
          )}
          {view.mode === "assignDuty" && (
            <AssignDutyView data={data} assignDuty={assignDuty} assignGroupDuty={assignGroupDuty} assignMiscDuty={assignMiscDuty} assignMiscDutyRange={assignMiscDutyRange} setUnavailable={setUnavailable} showToast={showToast} goToCategory={(catId) => setView({ mode: "category", catId })} />
          )}
          {view.mode === "category" && view.catId && (
            <CategoryView
              data={data} catId={view.catId}
              addToCategory={addToCategory} removeFromCategory={removeFromCategory}
              importStaffToCategory={importStaffToCategory}
              setSkipInCategory={setSkipInCategory} skipInCategoryWithLog={skipInCategoryWithLog} setPresentInCategory={setPresentInCategory}
              setLastDuty={setLastDuty} assignDuty={assignDuty}
              clearCategoryHistory={clearCategoryHistory}
              deleteHistoryEntries={deleteHistoryEntries}
              undo={undo} redo={redo} canUndo={undoStack.length > 0} canRedo={redoStack.length > 0}
            />
          )}
          {view.mode === "staff" && (
            <StaffView
              key={view.presetSearch || ""}
              data={data} createStaff={createStaff} renameStaff={renameStaff} setStaffPhone={setStaffPhone}
              deleteStaffGlobally={deleteStaffGlobally} setUnavailable={setUnavailable} clearUnavailable={clearUnavailable}
              changeUnavailableDuration={changeUnavailableDuration}
              setPresentEverywhere={setPresentEverywhere}
              renameLeaveType={renameLeaveType} renameOutstationType={renameOutstationType}
              addLeaveType={addLeaveType} deleteLeaveType={deleteLeaveType} toggleLeaveTypeIndefinite={toggleLeaveTypeIndefinite}
              addOutstationType={addOutstationType} deleteOutstationType={deleteOutstationType} toggleOutstationTypeIndefinite={toggleOutstationTypeIndefinite}
              addDesignation={addDesignation} renameDesignation={renameDesignation} deleteDesignation={deleteDesignation} setStaffDesignation={setStaffDesignation}
              reorderList={reorderList}
              initialSearch={view.presetSearch}
            />
          )}
          {view.mode === "calendar" && <CalendarView data={data} deleteHistoryEntries={deleteHistoryEntries} deleteUnavailableHistoryEntry={deleteUnavailableHistoryEntry} />}
          {view.mode === "report" && <ReportView data={data} />}
          {view.mode === "events" && (
            <EventsView
              data={data} allReminders={allReminders}
              addEvent={addEvent} updateEvent={updateEvent} deleteEvent={deleteEvent}
              acknowledgeReminder={acknowledgeReminder}
              notifPermission={notifPermission} requestNotifPermission={requestNotifPermission}
            />
          )}
          {view.mode === "skipHistory" && (
            <SkipHistoryView key={view.presetSearch || ""} data={data} initialSearch={view.presetSearch} />
          )}
          {view.mode === "recycle" && (
            <RecycleBinView
              data={data} onRestore={restoreFromRecycleBin}
              onDeleteForever={deleteFromRecycleBinForever} onEmpty={emptyRecycleBin}
            />
          )}
        </div>
      </div>

      {showReminderPanel && (
        <ReminderPanel
          reminders={pendingReminders}
          onAcknowledge={acknowledgeReminder}
          onClose={() => setShowReminderPanel(false)}
          onOpenEvents={() => { setShowReminderPanel(false); setView({ mode: "events", tab: "reminders" }); }}
          notifPermission={notifPermission}
          requestNotifPermission={requestNotifPermission}
        />
      )}

      {showDrivePanel && (
        <DriveBackupPanel
          configured={driveConfigured}
          connected={driveConnected}
          enabledForAccount={driveEnabledForAccount}
          busy={driveBusy}
          needsReconnect={driveNeedsReconnect}
          lastBackup={driveLastBackup}
          onConnect={() => backupToDrive({ interactive: true })}
          onBackupNow={() => backupToDrive({ interactive: true })}
          onDisconnect={disconnectDrive}
          onClose={() => setShowDrivePanel(false)}
        />
      )}

      {showSharePanel && (
        <SharePanel
          enabled={!!data.shareEnabled}
          shareUrl={shareUrl}
          onToggle={toggleShare}
          onClose={() => setShowSharePanel(false)}
          showToast={showToast}
        />
      )}

      {showAboutPanel && <AboutPanel onClose={() => setShowAboutPanel(false)} />}
      {showHelpPanel && <HelpPanel onClose={() => setShowHelpPanel(false)} />}
      {showSettingsPanel && (
        <SettingsPanel
          user={user} signOutUser={signOutUser} formatAllData={formatAllData}
          onHelp={() => setShowHelpPanel(true)}
          onChooseBackupFolder={chooseBackupFolder}
          onClose={() => setShowSettingsPanel(false)}
        />
      )}

      {showFormatModal && (
        <FormatAllDataModal
          data={data}
          staffCount={Object.keys(data.staff || {}).length}
          dutyCount={Object.values(data.membership || {}).reduce((n, list) => n + list.reduce((m, mem) => m + (mem.history || []).length, 0), 0)}
          onConfirm={(buckleNumber) => { setShowFormatModal(false); performFormatAllData(buckleNumber); }}
          onCancel={() => setShowFormatModal(false)}
        />
      )}

      {showCommandPalette && (
        <CommandPalette
          data={data}
          onNavigate={(v) => setView(v)}
          onClose={() => setShowCommandPalette(false)}
        />
      )}

      {data.hasSeenWelcome === false && (
        <WelcomeModal
          onGetStarted={() => { persist({ ...dataRef.current, hasSeenWelcome: true }); setView({ mode: "assignDuty" }); }}
          onClose={() => persist({ ...dataRef.current, hasSeenWelcome: true })}
        />
      )}

      {toast && (
        <div className="gu toast-anim" style={{
          position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)",
          // Fixed colors here on purpose, not the usual var(--text-primary)/
          // var(--status-error-text) — those are TEXT-color variables,
          // correctly meant to flip between dark and light per theme. Used
          // as a BACKGROUND (as this was before) they flip too: in dark
          // mode --text-primary becomes white, giving a white toast with
          // white text on top of it — completely unreadable. A floating
          // toast is a small overlay surface, not page content, so it
          // stays the same dark color regardless of the app's theme,
          // exactly like most OS/app toast notifications do.
          background: toast.type === "error" ? "#A32D2D" : "#2B2116", color: "#fff",
          padding: "10px 18px", borderRadius: 8, fontSize: 13, maxWidth: "min(90vw, 420px)", textAlign: "center",
          boxShadow: "0 6px 18px rgba(0,0,0,0.25)",
        }}>{toast.msg}</div>

      )}
    </div>
    </LangContext.Provider>
  );
}

function Sidebar({ data, view, setView, addCategory, renameCategory, deleteCategory, reorderCategories, pendingReminderCount, user, signOutUser, darkMode, setDarkMode, formatAllData, desktopView, setDesktopView, onHelp, onSettings, mobileOpen, onCloseMobile }) {
  const { t } = useLang();
  const [editing, setEditing] = useState(false);
  const [adding, setAdding] = useState(false);
  const [newLabel, setNewLabel] = useState("");
  const { draggedId, dragProps } = useDragReorder(reorderCategories);
  // Collapsing the sidebar to a narrow rail — same idea as Claude's own
  // collapsible sidebar: the sidebar's width shrinks (230px → 44px) and
  // the main content area, already flex:1 in the same row, automatically
  // expands sideways to fill the space that frees up — e.g. collapse
  // while on 112 emergency and that screen's table gets the extra width,
  // not just a narrower empty sidebar. Remembered per device.
  const [collapsed, setCollapsed] = useState(() => localStorage.getItem("nb_sidebar_collapsed") === "1");
  useEffect(() => { localStorage.setItem("nb_sidebar_collapsed", collapsed ? "1" : "0"); }, [collapsed]);

  // On mobile, the sidebar is an open/closed drawer, not a collapsible
  // rail — the two concepts don't compose (a 44px rail sliding in as a
  // "drawer" would show nothing usable). While actually open as a mobile
  // drawer, the collapsed-rail state is ignored entirely and the full
  // sidebar always renders; it only matters again once back on desktop.
  if (collapsed && !mobileOpen) {
    return (
      <div className="sidebar" style={{ width: 44, background: "var(--sidebar-bg)", flexShrink: 0, display: "flex", flexDirection: "column", alignItems: "center", position: "sticky", top: 0, alignSelf: "flex-start", height: "100vh", paddingTop: 14 }}>
        <button
          onClick={() => setCollapsed(false)}
          title={t("Show sidebar", "સાઇડબાર બતાવો")}
          aria-label={t("Show sidebar", "સાઇડબાર બતાવો")}
          style={{ background: "transparent", border: "1px solid #2E3742", borderRadius: 6, color: "#B7C2CA", width: 26, height: 26, fontSize: 13, padding: 0, display: "flex", alignItems: "center", justifyContent: "center" }}
        >▸</button>
      </div>
    );
  }

  return (
    <div className={"sidebar" + (mobileOpen ? " mobile-sidebar-open" : "")} style={{ width: 230, background: "var(--sidebar-bg)", color: "#EAEDEB", flexShrink: 0, display: "flex", flexDirection: "column", position: "sticky", top: 0, alignSelf: "flex-start", height: "100vh", overflowY: "auto" }}>
      <div style={{ padding: "18px 18px 14px", borderBottom: "1px solid #1B2733", display: "flex", alignItems: "center", gap: 10 }}>
        {user && <ProfileMenu user={user} darkMode={darkMode} setDarkMode={setDarkMode} desktopView={desktopView} setDesktopView={setDesktopView} onSettings={onSettings} />}
        <div style={{ flex: 1, minWidth: 0 }}>
          <div className="disp" style={{ fontSize: 15, fontWeight: 700 }}>Nokri Book</div>
          <div style={{ fontSize: 11, color: "#8FA0AC", marginTop: 2 }} className="gu">{t("Fair rotation console", "ન્યાયી રોટેશન કન્સોલ")}</div>
        </div>
        <button
          onClick={() => (mobileOpen ? onCloseMobile() : setCollapsed(true))}
          title={mobileOpen ? t("Close menu", "મેનૂ બંધ કરો") : t("Hide sidebar", "સાઇડબાર છુપાવો")}
          aria-label={mobileOpen ? t("Close menu", "મેનૂ બંધ કરો") : t("Hide sidebar", "સાઇડબાર છુપાવો")}
          style={{ background: "transparent", border: "1px solid #2E3742", borderRadius: 6, color: "#B7C2CA", width: 26, height: 26, flexShrink: 0, fontSize: 13, padding: 0, display: "flex", alignItems: "center", justifyContent: "center" }}
        >{mobileOpen ? "✕" : "◂"}</button>
      </div>

      <div style={{ padding: "8px 0", borderBottom: "1px solid #1B2733" }}>
        <button onClick={() => setView({ mode: "assignDuty" })} style={navBtn(view.mode === "assignDuty")} className="gu">📝 {t("Assign duty", "ડ્યુટી સોંપો")}</button>
        <button onClick={() => setView({ mode: "home" })} style={navBtn(view.mode === "home")} className="gu">🏠 {t("Today's duty", "આજની ડ્યુટી")}</button>
        <button onClick={() => setView({ mode: "calendar" })} style={navBtn(view.mode === "calendar")} className="gu">📅 {t("Duty calendar", "ડ્યુટી કૅલેન્ડર")}</button>
      </div>

      <div style={{ padding: "8px 0", flex: 1, overflowY: "auto" }}>
        {(data.categories || []).map((c, i) => {
          const count = (data.membership[c.id] || []).length;
          const active = view.mode === "category" && c.id === view.catId;
          return (
            <div key={c.id} {...(editing ? dragProps(c.id) : {})} style={{
              display: "flex", alignItems: "center", margin: editing ? "2px 8px" : 0, borderRadius: editing ? 8 : 0,
              background: draggedId === c.id ? "#1B2733" : "transparent", opacity: draggedId === c.id ? 0.55 : 1,
              transition: "opacity 0.12s ease",
            }}>
              {editing && (
                <span style={{
                  cursor: "grab", color: "var(--text-secondary)", fontSize: 14, letterSpacing: -1, lineHeight: 1,
                  padding: "0 4px 0 10px", userSelect: "none", display: "flex", flexDirection: "column", gap: 2,
                }} title={t("Drag to reorder", "ફરીથી ગોઠવવા ખેંચો")}>
                  <span style={{ display: "flex", gap: 2 }}><i style={dotStyle} /><i style={dotStyle} /></span>
                  <span style={{ display: "flex", gap: 2 }}><i style={dotStyle} /><i style={dotStyle} /></span>
                  <span style={{ display: "flex", gap: 2 }}><i style={dotStyle} /><i style={dotStyle} /></span>
                </span>
              )}
              <button onClick={() => setView({ mode: "category", catId: c.id })} style={{
                flex: 1, textAlign: "left", background: active ? "#1B2733" : "transparent",
                border: "none", borderLeft: active ? "3px solid #D98E2B" : "3px solid transparent", borderRadius: editing ? 6 : 0,
                color: active ? "#fff" : "#B7C2CA", padding: editing ? "8px 10px 8px 4px" : "9px 16px 9px 15px", fontSize: 13,
                fontWeight: active ? 600 : 400, display: "flex", justifyContent: "space-between", alignItems: "center",
              }}>
                <span>{c.label}</span>
                <span className="mono" style={{ fontSize: 11, color: "#6B7A85" }}>{count}</span>
              </button>
              {editing && (
                <div style={{ display: "flex", gap: 2, paddingRight: 8 }}>
                  <button onClick={() => renameCategory(c.id)} title={t("Rename", "નામ બદલો")} aria-label={t("Rename", "નામ બદલો")} style={{ background: "transparent", border: "none", color: "#8FA0AC", fontSize: 12 }}>✎</button>
                  <button onClick={() => deleteCategory(c.id)} title={t("Delete", "કાઢી નાખો")} aria-label={t("Delete", "કાઢી નાખો")} style={{ background: "transparent", border: "none", color: "#D98E8E", fontSize: 12 }}>✕</button>
                </div>
              )}
            </div>
          );
        })}

        {adding ? (
          <div style={{ padding: "8px 16px", display: "flex", gap: 6 }}>
            <input type="text" autoFocus value={newLabel} placeholder={t("New work type", "નવો કામનો પ્રકાર")} className="gu"
              onChange={(e) => setNewLabel(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter") { addCategory(newLabel); setNewLabel(""); setAdding(false); } if (e.key === "Escape") { setNewLabel(""); setAdding(false); } }}
              style={{ flex: 1, minWidth: 0, fontSize: 12 }} />
            <button onClick={() => { addCategory(newLabel); setNewLabel(""); setAdding(false); }} title={t("Add", "ઉમેરો")} aria-label={t("Add", "ઉમેરો")} style={{ flexShrink: 0, background: "#D98E2B", color: "#fff", border: "none", borderRadius: 6, padding: "0 8px", fontSize: 12 }}>+</button>
            <button onClick={() => { setNewLabel(""); setAdding(false); }} title={t("Cancel", "રદ કરો")} aria-label={t("Cancel", "રદ કરો")} style={{ flexShrink: 0, background: "transparent", color: "#8FA0AC", border: "1px solid #2E3742", borderRadius: 6, padding: "0 8px", fontSize: 12 }}>✕</button>
          </div>
        ) : (
          <button onClick={() => setAdding(true)} style={{ width: "100%", textAlign: "left", background: "transparent", border: "none", color: "#8FA0AC", padding: "9px 16px", fontSize: 12.5 }} className="gu">+ {t("Add work type", "કામનો પ્રકાર ઉમેરો")}</button>
        )}
        <button onClick={() => setEditing((v) => !v)} style={{ width: "100%", textAlign: "left", background: "transparent", border: "none", color: "#6B7A85", padding: "6px 16px", fontSize: 11.5 }} className="gu">
          {editing ? t("Done editing", "સંપાદન પૂર્ણ") : t("Edit work types", "કામના પ્રકારો સંપાદિત કરો")}
        </button>
      </div>

      <div style={{ borderTop: "1px solid #1B2733", padding: "8px 0" }}>
        <button onClick={() => setView({ mode: "staff" })} style={navBtn(view.mode === "staff")} className="gu">🚨 {t("Manage staff", "સ્ટાફ સંચાલિત કરો")}</button>
        <button onClick={() => setView({ mode: "skipHistory" })} style={navBtn(view.mode === "skipHistory")} className="gu">📋 {t("Skip history", "સ્કિપ ઇતિહાસ")}</button>
        <button onClick={() => setView({ mode: "events" })} style={{ ...navBtn(view.mode === "events"), display: "flex", justifyContent: "space-between", alignItems: "center" }} className="gu">

          {pendingReminderCount > 0 && (
            <span className="mono" style={{ fontSize: 10.5, background: "#D98E2B", color: "var(--text-primary)", borderRadius: 10, padding: "1px 7px", fontWeight: 700 }}>{pendingReminderCount}</span>

        </button>
        <button onClick={() => setView({ mode: "report" })} style={navBtn(view.mode === "report")} className="gu">📄 {t("Monthly report", "માસિક અહેવાલ")}</button>
        <button onClick={() => setView({ mode: "recycle" })} style={navBtn(view.mode === "recycle")} className="gu">🗑️ {t("Recycle bin", "રિસાયકલ બિન")}</button>
      </div>
    </div>
  );
}
function undoRedoBtn(enabled) {
  return {
    background: "var(--bg-surface)", color: enabled ? "var(--text-primary)" : "var(--text-tertiary)",
    border: "1px solid " + (enabled ? "var(--border)" : "var(--border-soft)"), borderRadius: 7,
    padding: "6px 12px", fontSize: 12.5, fontWeight: 600, cursor: enabled ? "pointer" : "default",
  };
}
function navBtn(active) {
  return { width: "100%", textAlign: "left", background: active ? "#1B2733" : "transparent", border: "none",
    borderLeft: active ? "3px solid #D98E2B" : "3px solid transparent", color: active ? "#fff" : "#B7C2CA",
    padding: "9px 16px 9px 15px", fontSize: 13, fontWeight: active ? 600 : 400 };
}

// "Today's duty" — a read-only snapshot of who is actually on duty today.
// Only work types that have someone assigned *today* show up here at all;
// anything not yet assigned today is left out entirely (use Assign Duty
// for that). Kept deliberately simple: no Assign controls here.
function HomeView({ data, goToCategory }) {
  const { t, lang } = useLang();
  const today = todayStr();
  const [showInfo, setShowInfo] = useState(false);
  const cards = useMemo(() => (data.categories || []).map((c) => {
    const roster = computeRoster(data, c.id);
    const doneToday = roster.find((p) => p.lastDuty === today);
    return { cat: c, doneToday };
  }).filter((x) => x.doneToday), [data]);

  return (
    <React.Fragment>
      <div style={{ display: "flex", alignItems: "center", marginBottom: showInfo ? 4 : 20 }}>
        <h1 className="disp gu" style={{ fontSize: 22, fontWeight: 700, margin: 0 }}>{t("Today's duty", "આજની ડ્યુટી")}</h1>
        <InfoIconButton active={showInfo} onClick={() => setShowInfo((v) => !v)} label={t("About this screen", "આ સ્ક્રીન વિશે")} />
      </div>
      {showInfo && (
        <p style={{ fontSize: 13, color: "var(--text-secondary)", margin: "0 0 20px" }} className="gu">
          {new Date().toLocaleDateString(undefined, { weekday: "long" })}, {formatDMY(todayStr())} — {t("only work types with a duty assigned today are shown here.", "ફક્ત જેમાં આજે ડ્યુટી સોંપાયેલી છે તે કામના પ્રકારો અહીં બતાવાય છે.")}
        </p>
      )}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(250px, 1fr))", gap: 14 }}>
        {cards.map(({ cat, doneToday }) => {
          const phone = doneToday.staffRec && doneToday.staffRec.phone;
          return (
            <div key={cat.id} style={{ background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 10, padding: "16px 18px", display: "flex", flexDirection: "column", gap: 10 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
                <div className="disp" style={{ fontWeight: 700, fontSize: 14.5 }}>{cat.label}</div>
              </div>

              <div style={{ background: "var(--status-success-bg)", border: "1px solid var(--status-success-border)", borderRadius: 8, padding: "9px 12px", display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
                <div>
                  <div style={{ fontSize: 10.5, textTransform: "uppercase", letterSpacing: 0.5, color: "var(--status-success-text)", fontWeight: 700 }} className="gu">{t("On duty today", "આજે ડ્યુટી પર")}</div>
                  <div className="gu" style={{ fontSize: 14.5, fontWeight: 600, marginTop: 2 }}>{doneToday.name}</div>
                  {(doneToday.status === "Leave" || doneToday.status === "Outstation") && (
                    <div className="gu" style={{ fontSize: 11, color: "var(--status-error-text)", fontWeight: 700, marginTop: 3 }}>
                      ⚠ {t(`Also marked ${doneToday.statusLabel} today`, `આજે ${doneToday.statusLabel} તરીકે પણ નોંધાયેલ`)}
                    </div>
                  )}
                </div>
                <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
                  {phone && (
                    <a href={`tel:${phone}`} title={t("Call", "કૉલ કરો")} aria-label={t("Call", "કૉલ કરો")} style={{ background: "var(--bg-surface)", color: "var(--status-success-text)", border: "1px solid var(--status-success-border)", borderRadius: 6, padding: "6px 8px", fontSize: 12, textDecoration: "none", display: "inline-flex", alignItems: "center" }}>📞</a>
                  )}
                  <button onClick={() => shareDutyOnWhatsApp({ lang, name: doneToday.name, number: doneToday.number, catLabel: cat.label, date: doneToday.lastDuty, phone, kind: "assigned" })} title={t("Share via WhatsApp", "WhatsApp પર શેર કરો")} aria-label={t("Share via WhatsApp", "WhatsApp પર શેર કરો")} style={{ background: "var(--bg-surface)", color: "var(--status-success-text)", border: "1px solid var(--status-success-border)", borderRadius: 6, padding: "6px 8px", fontSize: 12 }}>📲</button>
                </div>
              </div>

              <button onClick={() => goToCategory(cat.id)} style={{ background: "transparent", border: "none", color: "var(--text-secondary)", fontSize: 12, textAlign: "left", padding: 0, textDecoration: "underline", alignSelf: "flex-start" }} className="gu">{t("View full roster →", "સંપૂર્ણ રોસ્ટર જુઓ →")}</button>
            </div>
          );
        })}
        {cards.length === 0 && <div style={{ color: "var(--text-tertiary)", fontSize: 13 }} className="gu">{t("No duties assigned yet today — use Assign duty.", "આજે હજુ કોઈ ડ્યુટી સોંપાયેલી નથી — Assign duty વાપરો.")}</div>}
      </div>
    </React.Fragment>
  );
}

// "Assign duty" — the working tab: per-work-type next-up + Assign button,
// with Group duty and Miscellaneous duty tucked in as extra sub-tabs so
// every assignment flow lives in one place.
function AssignDutyView({ data, assignDuty, assignGroupDuty, assignMiscDuty, assignMiscDutyRange, setUnavailable, showToast, goToCategory }) {
  const { t, lang } = useLang();
  const [subTab, setSubTab] = useState("individual"); // individual | group | misc
  const today = todayStr();
  const [assignTarget, setAssignTarget] = useState(null); // { catId, number, name }
  const [showInfo, setShowInfo] = useState(false);
  const cards = useMemo(() => (data.categories || []).map((c) => {
    const roster = computeRoster(data, c.id);
    const doneToday = roster.find((p) => p.lastDuty === today);
    const nextUp = roster.find((p) => p.rank === 1);
    return { cat: c, doneToday, nextUp, total: roster.length };
  }), [data]);

  return (
    <React.Fragment>
      <div style={{ display: "flex", alignItems: "center", marginBottom: showInfo ? 4 : 16 }}>
        <h1 className="disp gu" style={{ fontSize: 22, fontWeight: 700, margin: 0 }}>{t("Assign duty", "ડ્યુટી સોંપો")}</h1>
        <InfoIconButton active={showInfo} onClick={() => setShowInfo((v) => !v)} label={t("About this screen", "આ સ્ક્રીન વિશે")} />
      </div>
      {showInfo && (
        <p style={{ fontSize: 13, color: "var(--text-secondary)", margin: "0 0 16px" }} className="gu">
          {new Date().toLocaleDateString(undefined, { weekday: "long" })}, {formatDMY(todayStr())} — {t("every work type at a glance.", "એક નજરમાં દરેક કામનો પ્રકાર.")}
        </p>
      )}

      <div style={{ display: "flex", gap: 6, marginBottom: 18 }}>
        <button onClick={() => setSubTab("individual")} style={catTabBtn(subTab === "individual")} className="gu">{t("By work type", "કામના પ્રકાર પ્રમાણે")}</button>
        <button onClick={() => setSubTab("group")} style={catTabBtn(subTab === "group")} className="gu">👥 {t("Group duty", "જૂથ ડ્યુટી")}</button>
        <button onClick={() => setSubTab("misc")} style={catTabBtn(subTab === "misc")} className="gu">🗂️ {t("Miscellaneous", "વિવિધ")}</button>
        <button onClick={() => setSubTab("leave")} style={catTabBtn(subTab === "leave")} className="gu">🌴 {t("Record Leave", "રજા નોંધો")}</button>
      </div>

      {subTab === "group" ? (
        <GroupDutyView data={data} assignGroupDuty={assignGroupDuty} />
      ) : subTab === "misc" ? (
        <MiscDutyView data={data} assignMiscDuty={assignMiscDuty} assignMiscDutyRange={assignMiscDutyRange} />
      ) : subTab === "leave" ? (
        <RecordLeaveView data={data} setUnavailable={setUnavailable} showToast={showToast} />
      ) : (
        <React.Fragment>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(250px, 1fr))", gap: 14 }}>
            {cards.map(({ cat, doneToday, nextUp, total }) => {
              const nextPhone = nextUp && nextUp.staffRec && nextUp.staffRec.phone;
              return (
              <div key={cat.id} style={{ background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 10, padding: "16px 18px", display: "flex", flexDirection: "column", gap: 10 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
                  <div className="disp" style={{ fontWeight: 700, fontSize: 14.5 }}>{cat.label}</div>
                  <div className="mono gu" style={{ fontSize: 11, color: "var(--text-tertiary)" }}>{total} {t("staff", "સ્ટાફ")}</div>
                </div>

                {total === 0 ? (
                  <div style={{ fontSize: 12.5, color: "var(--text-tertiary)" }} className="gu">{t("No staff added yet.", "હજુ કોઈ સ્ટાફ ઉમેર્યો નથી.")}</div>
                ) : doneToday ? (
                  <div style={{ background: "var(--status-success-bg)", border: "1px solid var(--status-success-border)", borderRadius: 8, padding: "9px 12px" }}>
                    <div style={{ fontSize: 10.5, textTransform: "uppercase", letterSpacing: 0.5, color: "var(--status-success-text)", fontWeight: 700 }} className="gu">{t("On duty today", "આજે ડ્યુટી પર")}</div>
                    <div className="gu" style={{ fontSize: 14.5, fontWeight: 600, marginTop: 2 }}>{doneToday.name}</div>
                  </div>
                ) : nextUp ? (
                  <div style={{ background: "var(--highlight-bg)", border: "1px solid var(--highlight-border)", borderRadius: 8, padding: "9px 12px", display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
                    <div>
                      <div style={{ fontSize: 10.5, textTransform: "uppercase", letterSpacing: 0.5, color: "var(--status-warning-text)", fontWeight: 700 }} className="gu">{t("Not assigned yet · next up", "હજુ સોંપાયું નથી · આગળ")}</div>

                ) : (
                  <div style={{ background: "var(--status-error-bg)", border: "1px solid var(--status-error-border)", borderRadius: 8, padding: "9px 12px", fontSize: 12.5, color: "var(--status-error-text)" }} className="gu">{t("No one available — all on leave, outstation, or skip.", "કોઈ ઉપલબ્ધ નથી — બધા રજા, બહારગામ અથવા સ્કિપ પર.")}</div>
                )}

                <button onClick={() => goToCategory(cat.id)} style={{ background: "transparent", border: "none", color: "var(--text-secondary)", fontSize: 12, textAlign: "left", padding: 0, textDecoration: "underline", alignSelf: "flex-start" }} className="gu">{t("View full roster →", "સંપૂર્ણ રોસ્ટર જુઓ →")}</button>
              </div>
            );})}
            {cards.length === 0 && <div style={{ color: "var(--text-tertiary)", fontSize: 13 }} className="gu">{t("No work types yet — add one from the sidebar.", "હજુ કોઈ કામનો પ્રકાર નથી — સાઇડબાર પરથી ઉમેરો.")}</div>}
          </div>

          {assignTarget && (
            <AssignDutyModal
              name={assignTarget.name}
              onConfirm={(note, date) => { assignDuty(assignTarget.catId, assignTarget.number, assignTarget.name, note, date); setAssignTarget(null); }}

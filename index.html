  const desgLabelById = useMemo(() => {
    const map = {};
    (data.designations || []).forEach((d) => { map[d.id] = d.label; });
    return map;
  }, [data.designations]);

  // Duty-count fairness indicator ("Duty meter"): how many duty
  // ASSIGNMENTS (not raw days — an 11-day Group Duty span counts as 1, via
  // monthlyGroupedDutyCount) each person has logged across every work
  // type so far in the current month. Lets you glance down the staff list
  // and confirm rotation looks fair without digging into each work type's
  // history separately.
  const currentMonth = todayStr().slice(0, 7);
  const dutyCountByNumber = useMemo(() => {
    const counts = {};
    data.categories.forEach((c) => (data.membership[c.id] || []).forEach((m) => {
      const n = monthlyGroupedDutyCount(m.history, currentMonth);
      counts[m.number] = (counts[m.number] || 0) + n;
    }));
    return counts;
  }, [data, currentMonth]);

  const staffList = useMemo(() => {
    const catByNumber = {};
    data.categories.forEach((c) => (data.membership[c.id] || []).forEach((m) => {
      (catByNumber[m.number] = catByNumber[m.number] || []).push(c.label);
    }));
    return Object.values(data.staff).map((s) => ({
      ...s,
      cats: catByNumber[s.number] || [],
      desgLabel: s.designation ? (desgLabelById[s.designation] || "") : "",
      dutiesThisMonth: dutyCountByNumber[s.number] || 0,
      // Same "currently active" check used for the Status badge elsewhere
      // in this view — an unavailable record with no end date, or one
      // whose end date hasn't passed yet, counts as active right now.
      activeUnavailable: !!(s.unavailable && (!s.unavailable.to || s.unavailable.to >= todayStr())),
    }));
  }, [data, dutyCountByNumber, desgLabelById]);

  const maxDuties = useMemo(() => staffList.reduce((m, s) => Math.max(m, s.dutiesThisMonth), 0), [staffList]);
  const minDuties = useMemo(() => staffList.length ? staffList.reduce((m, s) => Math.min(m, s.dutiesThisMonth), Infinity) : 0, [staffList]);

  const filteredStaffList = useMemo(() => {
    const q = debouncedSearch.trim().toLowerCase();
    let list = staffList;
    if (q) list = list.filter((s) => s.number.toLowerCase().includes(q) || (s.name || "").toLowerCase().includes(q));
    if (desgFilter) list = desgFilter === "__none__" ? list.filter((s) => !s.designation) : list.filter((s) => s.designation === desgFilter);
    list = [...list];
    // "present" and "unavailable" filter the list down to just that group
    // (sorted by name within it) rather than merely re-ordering everyone
    // — that's what actually makes "who's available right now" or "who's
    // currently on leave/outstation" quick to read at a glance, which a
    // pure sort wouldn't give you with a long staff list.
    if (sortBy === "present") {
      list = list.filter((s) => !s.activeUnavailable && !s.skip).sort((a, b) => a.name.localeCompare(b.name));
    } else if (sortBy === "unavailable") {
      list = list.filter((s) => s.activeUnavailable).sort((a, b) => a.name.localeCompare(b.name));
    } else if (sortBy === "designation") {
      list.sort((a, b) => a.desgLabel.localeCompare(b.desgLabel) || a.name.localeCompare(b.name));
    } else if (sortBy === "heat") {
      list.sort((a, b) => b.dutiesThisMonth - a.dutiesThisMonth || a.name.localeCompare(b.name));
    } else {
      list.sort((a, b) => a.name.localeCompare(b.name));
    }
    return list;
  }, [staffList, debouncedSearch, desgFilter, sortBy]);

  const fairnessByDesg = useMemo(() => {
    const groups = {};
    staffList.forEach((s) => {
      const key = s.desgLabel || t("No designation", "કોઈ હોદ્દો નથી");
      (groups[key] = groups[key] || []).push(s.dutiesThisMonth);
    });
    return Object.keys(groups).sort().map((label) => {
      const counts = groups[label];
      const total = counts.reduce((a, b) => a + b, 0);
      return {
        label, people: counts.length,
        avg: counts.length ? total / counts.length : 0,
        min: Math.min(...counts), max: Math.max(...counts),
      };
    });
  }, [staffList, t]);

  const openModal = (s) => { setModalFor(s.number); setModalMode("new"); setModalKind("Leave"); setModalTypeId(leaveTypes[0] ? leaveTypes[0].id : ""); setModalFrom(todayStr()); setModalTo(todayStr()); setManageLeaveMenuFor(null); setManageLeaveMenuPos(null); };
  // "Change duration" from the Manage leave menu — same modal as above,
  // but pre-filled with the CURRENTLY ACTIVE period's own kind/type/dates
  // instead of blank defaults, and modalMode "edit" so the Save button
  // below calls changeUnavailableDuration (replaces that period in
  // place) instead of setUnavailable (which would log an entirely new,
  // separate one).
  const openChangeDurationModal = (s) => {
    const cur = s.unavailable;
    if (!cur) return;
    setModalFor(s.number);
    setModalMode("edit");
    setModalKind(cur.kind || "Leave");
    setModalTypeId(cur.typeId || "");
    setModalFrom(cur.from || todayStr());
    setModalTo(cur.to || todayStr());
    setManageLeaveMenuPos(null);
    setManageLeaveMenuFor(null);
  };
  useEscToClose(useCallback(() => setModalFor(null), []));

  const modalTypeList = modalKind === "Leave" ? leaveTypes : outstationTypes;
  const selectedType = modalTypeList.find((mt) => mt.id === modalTypeId);
  const modalIsIndefinite = !!(selectedType && selectedType.indefinite);

  return (
    <React.Fragment>
      <div style={{ display: "flex", alignItems: "center", marginBottom: showInfo ? 4 : 20, gap: 4 }}>
        <h1 className="disp gu" style={{ fontSize: 22, fontWeight: 700, margin: 0 }}>{t("Manage staff", "સ્ટાફ સંચાલિત કરો")}</h1>
        <InfoIconButton active={showInfo} onClick={() => setShowInfo((v) => !v)} label={t("About this screen", "આ સ્ક્રીન વિશે")} />
        <button
          onClick={() => setShowFullActions((v) => !v)}
          title={t("Show Edit name and Remove entirely for each person in the table below", "નીચેના કોષ્ટકમાં દરેક વ્યક્તિ માટે નામ સંપાદિત કરો અને સંપૂર્ણપણે કાઢી નાખો બતાવો")}
          style={{
            marginLeft: 8, fontSize: 12.5, fontWeight: 600, padding: "6px 12px", borderRadius: 7,
            background: showFullActions ? "#D98E2B" : "var(--bg-surface)",
            color: showFullActions ? "#fff" : "var(--text-secondary)",
            border: "1px solid " + (showFullActions ? "#D98E2B" : "var(--border)"),
          }} className="gu"
        >{t("Edit staff", "સ્ટાફ સંપાદિત કરો")}</button>
      </div>
      {showInfo && (
        <p style={{ fontSize: 13, color: "var(--text-secondary)", margin: "0 0 20px" }} className="gu">
          {t("Each person has one buckle number shared across every work type. Leave and outstation set here apply everywhere automatically. Assign a designation per person from the dropdown in the table. Add, edit (✎), or delete (✕) leave/outstation types and designations below — changes apply instantly to anyone currently marked with them.", "દરેક વ્યક્તિનો એક બકલ નંબર છે જે દરેક કામના પ્રકારમાં શેર થાય છે. અહીં સેટ કરેલી રજા અને બહારગામ આપમેળે બધે લાગુ પડે છે. કોષ્ટકમાંના ડ્રોપડાઉનમાંથી દરેક વ્યક્તિને હોદ્દો સોંપો. નીચે રજા/બહારગામના પ્રકારો અને હોદ્દાઓ ઉમેરો, સંપાદિત કરો (✎), અથવા ડિલીટ કરો (✕) — ફેરફારો હાલમાં તેની સાથે માર્ક થયેલા કોઈપણને તરત જ લાગુ પડે છે.")}
        </p>
      )}

      <div style={{ marginBottom: 12, display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
        <input
          type="text"
          id="app-search-input"
          placeholder={t("Search by બકલ નંબર (buckle number) or name…", "બકલ નંબર અથવા નામથી શોધો…")}
          value={search}
          onChange={(e) => setSearch(e.target.value)}
          className="gu"
          style={{ width: "100%", maxWidth: 380, fontSize: 13 }}
        />
        <select value={desgFilter} onChange={(e) => setDesgFilter(e.target.value)} style={{ fontSize: 13, padding: "7px 10px", border: "1px solid var(--border)", borderRadius: 6, background: "var(--bg-surface)", color: "var(--text-primary)" }} className="gu">
          <option value="">{t("All designations", "બધા હોદ્દાઓ")}</option>
          <option value="__none__">{t("No designation", "કોઈ હોદ્દો નથી")}</option>
          {designations.map((d) => (
            <option key={d.id} value={d.id}>{d.label}</option>
          ))}
        </select>
        <select value={sortBy} onChange={(e) => setSortBy(e.target.value)} style={{ fontSize: 13, padding: "7px 10px", border: "1px solid var(--border)", borderRadius: 6, background: "var(--bg-surface)", color: "var(--text-primary)" }} className="gu">
          <option value="name">{t("Sort: Name", "ક્રમ: નામ")}</option>
          <option value="designation">{t("Sort: Designation", "ક્રમ: હોદ્દો")}</option>
          <option value="heat">{t("Sort: Duty meter (busiest first)", "ક્રમ: ડ્યુટી મીટર (સૌથી વ્યસ્ત પ્રથમ)")}</option>
          <option value="present">{t("Show: Present only", "બતાવો: ફક્ત હાજર")}</option>
          <option value="unavailable">{t("Show: Leave/Outstation only", "બતાવો: ફક્ત રજા/બહારગામ")}</option>
        </select>
        <button
          onClick={() => setShowFairnessCompare((v) => !v)}
          style={{
            background: showFairnessCompare ? "#D98E2B" : "var(--bg-surface)", color: showFairnessCompare ? "#fff" : "var(--text-primary)",
            border: "1px solid " + (showFairnessCompare ? "#D98E2B" : "var(--border)"), borderRadius: 6, padding: "7px 12px", fontSize: 13, fontWeight: 600, whiteSpace: "nowrap",
          }} className="gu"
        >⚖ {t("Duty fairness", "ડ્યુટી ન્યાયીપણું")}</button>
        <button
          onClick={() => downloadCsv(
            "nokri-book-staff-directory.csv",
            [["Number", "Name", "Mobile", "Designation", "Status", "Duties this month"], ...filteredStaffList.map((s) => {
              const active = s.unavailable && (!s.unavailable.to || s.unavailable.to >= todayStr());
              const label = active ? unavailLabel(data, s.unavailable) : (s.skip ? "Skip" : "Present");
              return [s.number, s.name, s.phone || "", s.desgLabel || "", label, s.dutiesThisMonth];
            })]
          )}
          disabled={filteredStaffList.length === 0}
          style={{ background: "var(--bg-surface)", color: filteredStaffList.length ? "var(--text-primary)" : "var(--text-tertiary)", border: "1px solid var(--border)", borderRadius: 6, padding: "7px 12px", fontSize: 13, fontWeight: 600, whiteSpace: "nowrap" }} className="gu"
        >⬇ {t("Export CSV", "CSV એક્સપોર્ટ કરો")}</button>
      </div>

      {showFairnessCompare && (
        <DutyFairnessCompare data={data} staffList={staffList} currentMonth={currentMonth} />
      )}

      <div style={{ display: "flex", alignItems: "center", gap: 16, marginBottom: 10, fontSize: 11.5, color: "var(--text-secondary)" }} className="gu">
        <span style={{ fontWeight: 600 }}>{t("Duty meter:", "ડ્યુટી મીટર:")}</span>
        <span style={{ display: "flex", alignItems: "center", gap: 5 }}><span style={{ width: 8, height: 8, borderRadius: "50%", background: "var(--status-error-text)", display: "inline-block" }} />{t("Busiest", "સૌથી વ્યસ્ત")}</span>
        <span style={{ display: "flex", alignItems: "center", gap: 5 }}><span style={{ width: 8, height: 8, borderRadius: "50%", background: "var(--status-warning-text)", display: "inline-block" }} />{t("Moderate", "મધ્યમ")}</span>
        <span style={{ display: "flex", alignItems: "center", gap: 5 }}><span style={{ width: 8, height: 8, borderRadius: "50%", background: "var(--status-success-text)", display: "inline-block" }} />{t("Least busy", "સૌથી ઓછું વ્યસ્ત")}</span>
        <span style={{ color: "var(--text-tertiary)" }}>{t("— relative to everyone shown, this month", "— આ મહિને બતાવેલ બધાની સાપેક્ષે")}</span>
      </div>

      <div style={{ background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 10, overflow: "hidden", marginBottom: 20 }}>
        <div style={{ overflowX: "auto" }}>
        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
          <thead>
            <tr style={{ background: "var(--bg-surface-2)", textAlign: "left" }} className="gu">
              <th style={th}>{t("Number", "નંબર")}</th><th style={th}>{t("Name", "નામ")}</th><th style={th}>{t("Designation", "હોદ્દો")}</th><th style={th}>{t("Mobile", "મોબાઇલ")}</th><th style={th}>{t("Status", "સ્થિતિ")}</th><th style={{ ...th, textAlign: "center" }}>{t("Duties (mo.)", "ડ્યુટીઓ (મહિનો)")}</th><th style={{ ...th, textAlign: "right" }}>{t("Actions", "ક્રિયાઓ")}</th>
            </tr>
          </thead>
          <tbody>
            {filteredStaffList.map((s) => {
              const active = s.unavailable && (!s.unavailable.to || s.unavailable.to >= todayStr());
              // Skip is a separate flag from Leave/Outstation (someone can
              // be marked absent from rotation without a dated Leave/
              // Outstation record) — checked here the same way
              // effectiveStatus() does, so this badge always matches what
              // the rest of the app considers their current status,
              // instead of Manage Staff quietly showing "Present" for
              // someone who's actually Skipped.
              const kind = active ? unavailKind(s.unavailable) : (s.skip ? "Skip" : "Present");
              const label = active ? unavailLabel(data, s.unavailable) : (s.skip ? t("Skip", "સ્કિપ") : t("Present", "હાજર"));
              const sty = STATUS_STYLE[kind] || STATUS_STYLE.Present;
              const heat = dutyHeatTier(s.dutiesThisMonth, minDuties, maxDuties);
              return (
                <tr key={s.number} style={{ borderTop: "1px solid var(--border-soft)" }}>
                  <td style={td} className="mono">{s.number}</td>
                  <td style={{ ...td, minWidth: 160 }} className="gu">
                    <span style={{ display: "inline-block", width: 7, height: 7, borderRadius: "50%", background: DUTY_HEAT_COLOR[heat], marginRight: 7 }} title={t(`Duty meter: ${heat}`, `ડ્યુટી મીટર: ${heat}`)} />
                    <span
                      onClick={() => setHistoryPersonNumber(s.number)}
                      title={t("View full duty history across every work type", "દરેક કામના પ્રકારમાં સંપૂર્ણ ડ્યુટી ઇતિહાસ જુઓ")}
                      style={{ color: DUTY_HEAT_COLOR[heat], fontWeight: heat === "green" ? 400 : 600, cursor: "pointer", borderBottom: "1px dashed currentColor" }}
                    >{s.name}</span>
                  </td>
                  <td style={{ ...td, minWidth: 140 }}>
                    <select
                      value={s.designation || ""}
                      onChange={(e) => setStaffDesignation(s.number, e.target.value)}
                      style={{ fontSize: 12, padding: "5px 6px", maxWidth: 150 }}
                      className="gu"
                    >
                      <option value="">{t("— None —", "— કોઈ નહીં —")}</option>
                      {designations.map((d) => (
                        <option key={d.id} value={d.id}>{d.label}</option>
                      ))}
                    </select>
                  </td>
                  <td style={{ ...td, minWidth: 120 }} className="mono">
                    {s.phone ? (
                      <span onClick={() => setStaffPhone(s.number)} style={{ cursor: "pointer", borderBottom: "1px dashed var(--text-tertiary)" }} title={t("Click to edit", "સંપાદિત કરવા ક્લિક કરો")}>{s.phone}</span>
                    ) : (
                      <button onClick={() => setStaffPhone(s.number)} style={{ background: "transparent", border: "none", color: "var(--text-tertiary)", fontSize: 12, textDecoration: "underline", padding: 0 }} className="gu">+ {t("Add number", "નંબર ઉમેરો")}</button>
                    )}
                  </td>
                  <td style={td}>
                    <span style={{ fontSize: 12, fontWeight: 600, padding: "5px 8px", borderRadius: 6, border: "1px solid " + sty.border, background: sty.bg, color: sty.fg }} className="gu">{label}</span>
                    {s.unavailable && (
                      <div style={{ fontSize: 11, color: "var(--text-tertiary)", marginTop: 6 }} className="gu">
                        {s.unavailable.from > todayStr()
                          ? `${t("starts", "શરૂ થાય છે")} ${formatDMY(s.unavailable.from)}${s.unavailable.to ? ` – ${formatDMY(s.unavailable.to)}` : ""}`
                          : s.unavailable.to
                            ? `${formatDMY(s.unavailable.from)} – ${formatDMY(s.unavailable.to)}`
                            : `${t("from", "થી")} ${formatDMY(s.unavailable.from)} · ${t("no end date", "કોઈ અંતિમ તારીખ નથી")}`}
                      </div>
                    )}
                  </td>
                  <td style={{ ...td, textAlign: "center" }} title={t("Duty count for the current month", "ચાલુ મહિનાની ડ્યુટીની ગણતરી")}>
                    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 3 }}>
                      <span style={{ fontSize: 12, color: "var(--text-secondary)", fontWeight: 600 }}>{s.dutiesThisMonth}</span>
                      <div style={{ width: 46, height: 4, borderRadius: 2, background: "var(--border-soft)", overflow: "hidden" }}>
                        <div style={{
                          width: maxDuties > 0 ? `${Math.max(6, (s.dutiesThisMonth / maxDuties) * 100)}%` : "0%",
                          height: "100%", borderRadius: 2,
                          background: maxDuties > 0 && s.dutiesThisMonth === 0 ? "var(--border)" : "#D98E2B",
                        }} />
                      </div>
                    </div>
                  </td>
                  <td style={{ ...td, textAlign: "left", whiteSpace: "nowrap", position: "relative" }}>
                    {s.unavailable ? (
                      <React.Fragment>
                        <button
                          onClick={(e) => {
                            if (manageLeaveMenuFor === s.number) {
                              setManageLeaveMenuFor(null);
                              setManageLeaveMenuPos(null);
                              return;
                            }
                            const rect = e.currentTarget.getBoundingClientRect();
                            const menuWidth = 190;
                            setManageLeaveMenuPos({
                              top: rect.bottom + 4,
                              // Clamp so the menu never opens off the right edge of the
                              // screen on a narrow phone, with 8px breathing room on both
                              // sides.
                              left: Math.max(8, Math.min(rect.left, window.innerWidth - menuWidth - 8)),
                            });
                            setManageLeaveMenuFor(s.number);
                          }}
                          style={{ ...iconBtnWide, minWidth: 150 }} className="gu"
                        >
                          {kind === "Outstation" ? t("Manage outstation", "બહારગામ સંચાલિત કરો") : t("Manage leave", "રજા સંચાલિત કરો")} ▾
                        </button>
                        {manageLeaveMenuFor === s.number && manageLeaveMenuPos && (
                          <React.Fragment>
                            <div onClick={() => { setManageLeaveMenuFor(null); setManageLeaveMenuPos(null); }} style={{ position: "fixed", inset: 0, zIndex: 200 }} />
                            <div style={{
                              position: "fixed", top: manageLeaveMenuPos.top, left: manageLeaveMenuPos.left, zIndex: 201,
                              background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 8,
                              boxShadow: "0 8px 20px rgba(0,0,0,0.15)", minWidth: 190, overflow: "hidden",
                            }}>
                              <button
                                onClick={() => { clearUnavailable(s.number); setManageLeaveMenuFor(null); setManageLeaveMenuPos(null); }}
                                style={{ display: "block", width: "100%", textAlign: "left", padding: "9px 12px", background: "none", border: "none", borderBottom: "1px solid var(--border-soft)", fontSize: 12.5, cursor: "pointer" }}
                                className="gu"
                              >{kind === "Outstation" ? t("End outstation now", "હમણાં બહારગામ સમાપ્ત કરો") : t("End leave now", "હમણાં રજા સમાપ્ત કરો")}</button>
                              <button
                                onClick={() => openChangeDurationModal(s)}
                                style={{ display: "block", width: "100%", textAlign: "left", padding: "9px 12px", background: "none", border: "none", borderBottom: "1px solid var(--border-soft)", fontSize: 12.5, cursor: "pointer" }}
                                className="gu"
                              >{t("Change duration", "સમયગાળો બદલો")}</button>
                              <button
                                onClick={() => openModal(s)}
                                style={{ display: "block", width: "100%", textAlign: "left", padding: "9px 12px", background: "none", border: "none", fontSize: 12.5, cursor: "pointer" }}
                                className="gu"
                              >{kind === "Outstation" ? t("Log another outstation", "બીજું બહારગામ નોંધો") : t("Log another leave", "બીજી રજા નોંધો")}</button>
                            </div>
                          </React.Fragment>
                        )}
                      </React.Fragment>
                    ) : (
                      <button onClick={() => openModal(s)} style={{ ...iconBtnWide, minWidth: 150 }} className="gu">{t("Set leave/outstation", "રજા/બહારગામ સેટ કરો")}</button>
                    )}
                    {s.skip && (
                      // Skip is a separate flag from Leave/Outstation, set
                      // from a work type's roster (Skip needs a reason
                      // logged there) — but un-skipping needs no reason,
                      // so it's available right here too. This is the fix
                      // for someone getting "stuck" Skipped with no way

                {t("This is a past date range — it'll be recorded and shown on the calendar for those days, but won't change ", "આ ભૂતકાળની તારીખ શ્રેણી છે — તે નોંધાશે અને તે દિવસો માટે કૅલેન્ડર પર બતાવાશે, પરંતુ ")}{data.staff[modalFor].name}{t("'s current status today.", "ની આજની સ્થિતિ બદલશે નહીં.")}
              </div>
            )}
            <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
              <button onClick={() => setModalFor(null)} style={{ background: "transparent", border: "1px solid var(--border)", borderRadius: 7, padding: "8px 14px", fontSize: 13 }} className="gu">{t("Cancel", "રદ કરો")}</button>
              <button
                onClick={() => {
                  if (modalMode === "edit") changeUnavailableDuration(modalFor, modalKind, modalTypeId, modalFrom, modalTo);
                  else setUnavailable(modalFor, modalKind, modalTypeId, modalFrom, modalTo);
                  setModalFor(null);
                }}
                style={{ background: "#D98E2B", color: "#fff", border: "none", borderRadius: 7, padding: "8px 14px", fontSize: 13, fontWeight: 600 }} className="gu"
              >{t("Save", "સાચવો")}</button>
            </div>
          </div>
        </div>
      )}

      {historyPersonNumber && data.staff[historyPersonNumber] && (
        <PersonHistoryModal data={data} number={historyPersonNumber} onClose={() => setHistoryPersonNumber(null)} />
      )}
    </React.Fragment>
  );
}

// One click from Manage Staff → a person's complete duty record, across
// every work type, in one place — a per-category breakdown plus the full
// chronological list (spans, same as the per-work-type History tab).
// Single-person duty history PDF — reached from PersonHistoryModal's
// Download PDF button, next to its period dropdown. Filtered to
// whichever period is currently selected there, same as the on-screen
// table. Uses the same Gujarati-safe canvas-image pipeline as every
// other PDF in the app (native jsPDF text for headers/dates, rendered
// images only for cells that actually contain Gujarati).
async function downloadPersonHistoryPdf(staffRec, number, filteredGroups, period) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const FONT_PT = 9;

  const base64 = await loadGujaratiFont();
  doc.addFileToVFS("NotoSansGujarati-Regular.ttf", base64);
  doc.addFont("NotoSansGujarati-Regular.ttf", "NotoSansGujarati", "normal");
  await ensureGujaratiCanvasFont();

  doc.setFontSize(14);
  doc.text("Nokri Book — Duty History", 14, 16);
  // The name needs the same canvas-image treatment as every Gujarati
  // cell in the table below — jsPDF's own font (used by plain doc.text)
  // has no Gujarati glyphs at all, which is exactly what garbled the
  // title while the table itself rendered correctly.
  if (needsImageRender(staffRec.name)) {
    const rendered = renderTextToImage(staffRec.name, 13);
    drawTextImageInCell(doc, { x: 14, y: 19, width: 300, height: 9 }, rendered, 13);
    doc.setFontSize(10);
    doc.text(`#${number}`, 14, 32);
  } else {
    doc.setFontSize(13);
    doc.text(`${staffRec.name}  #${number}`, 14, 25);
  }
  doc.setFontSize(10);
  doc.text(periodLabelEn(period), 14, 39);
  doc.setFontSize(8.5);
  doc.text("Generated " + new Date().toLocaleString(), 14, 44);

  doc.autoTable({
    startY: 52,
    head: [["Date", "Work type", "Days", "Note"]],
    body: filteredGroups.map((g) => [
      g.days > 1 ? `${formatDMY(g.from)} – ${formatDMY(g.to)}` : formatDMY(g.to),
      g.catLabel, g.days, g.note || "",
    ]),
    styles: { fontSize: FONT_PT },
    headStyles: { fillColor: [14, 22, 32] },
    columnStyles: { 1: { minCellWidth: 30 }, 3: { minCellWidth: 30 } },
    didParseCell: (hookData) => {
      if (hookData.section === "body" && [1, 3].includes(hookData.column.index) && needsImageRender(hookData.cell.raw)) {
        hookData.cell.text = [];
      }
    },
    didDrawCell: (hookData) => {
      if (hookData.section === "body" && [1, 3].includes(hookData.column.index)) {
        const raw = hookData.cell.raw;
        if (raw != null && raw !== "" && needsImageRender(raw)) drawTextImageInCell(doc, hookData.cell, renderTextToImage(raw, FONT_PT), FONT_PT);
      }
    },
  });

  const slug = String(staffRec.name).toLowerCase().trim().replace(/\s+/g, "-").replace(/[^a-z0-9\u0A80-\u0AFF-]/g, "");
  doc.save(`nokri-book-${slug || number}-history.pdf`);
}
function PersonHistoryModal({ data, number, onClose }) {
  const { t } = useLang();
  useEscToClose(onClose);
  const staffRec = data.staff[number];
  const currentMonth = todayStr().slice(0, 7);
  const [period, setPeriod] = useState({ key: "month", customFrom: todayStr(), customTo: todayStr() });
  const [periodFrom, periodTo] = periodRangeOf(period);
  const [pdfBusy, setPdfBusy] = useState(false);

  const { groups, byCategory, totalLast3Months, totalThisMonth } = useMemo(() => {
    const allRows = [];
    (data.categories || []).forEach((c) => {
      const m = (data.membership[c.id] || []).find((x) => x.number === number);
      if (!m) return;
      (m.history || []).forEach((entry, idx) => {
        allRows.push({ number, idx, name: staffRec.name, date: historyDate(entry), ts: historyTs(entry), note: historyNote(entry), extraNote: historyExtraNote(entry), batch: historyBatch(entry), catLabel: c.label });
      });
    });
    const sorted = allRows.sort((a, b) => (b.date === a.date ? b.ts - a.ts : b.date.localeCompare(a.date)));
    const grouped = groupHistoryRows(sorted);
    const byCat = {};
    let thisMonth = 0;
    let last3Months = 0;
    const [monthStart, monthEnd] = monthBounds(currentMonth);
    const [last3Start, last3End] = periodBounds("3m");
    grouped.forEach((g) => {
      const cat = byCat[g.catLabel] || { assignments: 0, days: 0 };
      cat.assignments += 1;
      cat.days += g.days;
      byCat[g.catLabel] = cat;
      if (g.from <= monthEnd && g.to >= monthStart) thisMonth += 1;
      if (g.from <= last3End && g.to >= last3Start) last3Months += 1;
    });
    return { groups: grouped, byCategory: byCat, totalLast3Months: last3Months, totalThisMonth: thisMonth };
  }, [data, number, staffRec, currentMonth]);

  // The full "all-time" list above is what actually gets cluttered on
  // anyone with a long history — this is the filtered view the table
  // below actually renders, driven by the period picker next to the
  // name. The two summary numbers above (This month / All-time) stay
  // fixed reference points regardless of what's selected here.
  const filteredGroups = useMemo(
    () => groups.filter((g) => g.from <= periodTo && g.to >= periodFrom),
    [groups, periodFrom, periodTo]
  );

  const handleDownloadPdf = async () => {
    setPdfBusy(true);
    try {
      await downloadPersonHistoryPdf(staffRec, number, filteredGroups, period);
    } catch (e) {
      window.alert(t("Could not load Gujarati font — check your internet connection and try again.", "ગુજરાતી ફોન્ટ લોડ થઈ શક્યો નહીં — તમારું ઇન્ટરનેટ કનેક્શન તપાસો અને ફરી પ્રયાસ કરો."));
    } finally {
      setPdfBusy(false);
    }
  };

  return (
    <div role="dialog" aria-modal="true" aria-label={t("Full duty history", "સંપૂર્ણ ડ્યુટી ઇતિહાસ")} className="modal-backdrop" style={{ position: "fixed", inset: 0, background: "#00000066", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 60, padding: 16 }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} className="modal-card" style={{ background: "var(--bg-surface)", borderRadius: 12, width: 640, maxWidth: "100%", maxHeight: "86vh", display: "flex", flexDirection: "column", overflow: "hidden", boxShadow: "0 20px 60px rgba(0,0,0,0.3)" }}>
        <div style={{ padding: "16px 20px", borderBottom: "1px solid var(--border-soft)", display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12, flexWrap: "wrap" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
            <div>
              <div className="disp gu" style={{ fontSize: 16, fontWeight: 700 }}>{staffRec.name}</div>
              <div className="mono" style={{ fontSize: 11.5, color: "var(--text-tertiary)" }}>#{number}</div>
            </div>
            <PeriodFilterSelect period={period} setPeriod={setPeriod} />
            <button
              onClick={handleDownloadPdf} disabled={pdfBusy}
              title={t("Download this duty history as a PDF for the selected period", "પસંદ કરેલ સમયગાળા માટે આ ડ્યુટી ઇતિહાસ PDF તરીકે ડાઉનલોડ કરો")}
              style={{ background: "#D98E2B", color: "#fff", border: "none", borderRadius: 7, padding: "6px 12px", fontSize: 12, fontWeight: 600, whiteSpace: "nowrap", opacity: pdfBusy ? 0.7 : 1 }} className="gu"
            >{pdfBusy ? t("Preparing…", "તૈયાર થઈ રહ્યું છે…") : "⬇ " + t("Download PDF", "PDF ડાઉનલોડ કરો")}</button>
          </div>
          <button onClick={onClose} title={t("Close", "બંધ કરો")} aria-label={t("Close", "બંધ કરો")} style={{ background: "transparent", border: "none", color: "var(--text-tertiary)", fontSize: 16 }}>✕</button>
        </div>

        <div style={{ padding: "14px 20px", borderBottom: "1px solid var(--border-soft)", display: "flex", gap: 10, flexWrap: "wrap" }}>
          <div style={{ background: "var(--bg-surface-2)", borderRadius: 8, padding: "8px 14px" }}>
            <div className="mono" style={{ fontSize: 18, fontWeight: 700, color: "#D98E2B" }}>{totalThisMonth}</div>
            <div className="gu" style={{ fontSize: 10.5, color: "var(--text-tertiary)" }}>{t("This month", "આ મહિને")}</div>
          </div>
          <div style={{ background: "var(--bg-surface-2)", borderRadius: 8, padding: "8px 14px" }}>
            <div className="mono" style={{ fontSize: 18, fontWeight: 700 }}>{totalLast3Months}</div>
            <div className="gu" style={{ fontSize: 10.5, color: "var(--text-tertiary)" }}>{t("Last 3 months", "છેલ્લા 3 મહિના")}</div>
          </div>
          {Object.keys(byCategory).length > 0 && (
            <div style={{ flex: 1, minWidth: 200, display: "flex", flexWrap: "wrap", gap: 6, alignContent: "flex-start" }}>
              {Object.entries(byCategory).map(([catLabel, info]) => (
                <span key={catLabel} className="gu" style={{ fontSize: 11, background: "var(--status-info-bg)", color: "var(--status-info-text)", border: "1px solid var(--status-info-border)", borderRadius: 20, padding: "4px 10px" }}>
                  {catLabel}: {info.assignments} ({info.days}{t("d", "દિ")})
                </span>
              ))}
            </div>
          )}
        </div>

        <div style={{ overflowY: "auto", flex: 1 }}>
          {filteredGroups.length === 0 ? (
            <div style={{ padding: "30px 20px", textAlign: "center", color: "var(--text-tertiary)" }} className="gu">
              {groups.length === 0
                ? t("No duty history recorded yet.", "હજુ સુધી કોઈ ડ્યુટી ઇતિહાસ નોંધાયો નથી.")
                : t(`No duty history in ${periodLabel(t, period)}.`, `${periodLabel(t, period)} કોઈ ડ્યુટી ઇતિહાસ નથી.`)}
            </div>
          ) : (
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
              <thead>
                <tr style={{ background: "var(--bg-surface-2)", textAlign: "left" }} className="gu">
                  <th style={th}>{t("Date", "તારીખ")}</th><th style={th}>{t("Work type", "કામનો પ્રકાર")}</th><th style={th}>{t("Note", "નોંધ")}</th>
                </tr>
              </thead>
              <tbody>
                {filteredGroups.map((g) => (
                  <tr key={`${g.catLabel}#${g.idxs.join(",")}`} style={{ borderTop: "1px solid var(--border-soft)" }}>
                    <td style={td} className="mono">
                      {g.days > 1 ? `${formatDMY(g.from)} – ${formatDMY(g.to)}` : formatDMY(g.to)}
                      {g.days > 1 && <span style={{ marginLeft: 6, fontSize: 10, fontWeight: 700, color: "var(--status-info-text)", background: "var(--status-info-bg)", border: "1px solid var(--status-info-border)", borderRadius: 10, padding: "1px 6px" }}>{g.days}{t("d", "દિ")}</span>}
                    </td>
                    <td style={td} className="gu">{g.catLabel}</td>
                    <td style={{ ...td, color: "var(--text-secondary)" }}>
                      {g.note || "—"}
                      {g.extraNote && <div style={{ fontSize: 11, color: "var(--text-tertiary)", marginTop: 2 }} className="gu">{g.extraNote}</div>}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      </div>
    </div>
  );
}

// The "Duty Fairness comparison" panel — three lenses (person / designation
// / work type) on this month's Duty meter counts, all shown as % bars
// relative to whoever/whatever is busiest in that lens, plus a two-person
// side-by-side compare tool with a per-work-type breakdown for each.
function DutyFairnessCompare({ data, staffList }) {
  const { t } = useLang();
  const [view, setView] = useState("person"); // person | designation | worktype
  const [compareInput, setCompareInput] = useState("");
  const [showInfo, setShowInfo] = useState(false);
  const [period, setPeriod] = useState({ key: "month", customFrom: todayStr(), customTo: todayStr() });
  const [periodFrom, periodTo] = periodRangeOf(period);

  // Per-person duty count for the selected period — recomputed directly
  // from the raw category/membership data rather than the incoming
  // staffList's dutiesThisMonth (which is always calendar-month-only), so
  // every lens below (person / designation / work type / compare) responds
  // to the period picker instead of being stuck on "this month" the way
  // this panel used to be.
  const countByNumber = useMemo(() => {
    const counts = {};
    (data.categories || []).forEach((c) => (data.membership[c.id] || []).forEach((m) => {
      counts[m.number] = (counts[m.number] || 0) + groupedDutyCountInRange(m.history, periodFrom, periodTo);
    }));
    return counts;
  }, [data, periodFrom, periodTo]);

  const personRows = useMemo(
    () => staffList.map((s) => ({ ...s, periodCount: countByNumber[s.number] || 0 })).sort((a, b) => b.periodCount - a.periodCount),
    [staffList, countByNumber]
  );
  const maxPerson = useMemo(() => personRows.reduce((m, s) => Math.max(m, s.periodCount), 0), [personRows]);

  const desgRows = useMemo(() => {
    const map = {};
    personRows.forEach((s) => {
      const key = s.desgLabel || t("No designation", "કોઈ હોદ્દો નથી");
      map[key] = (map[key] || 0) + s.periodCount;
    });
    return Object.entries(map).map(([label, count]) => ({ label, count })).sort((a, b) => b.count - a.count);
  }, [personRows, t]);
  const maxDesg = useMemo(() => desgRows.reduce((m, r) => Math.max(m, r.count), 0), [desgRows]);

  const catRows = useMemo(() => {
    return (data.categories || []).map((c) => ({
      label: c.label,
      count: (data.membership[c.id] || []).reduce((sum, m) => sum + groupedDutyCountInRange(m.history, periodFrom, periodTo), 0),
    })).sort((a, b) => b.count - a.count);
  }, [data, periodFrom, periodTo]);
  const maxCat = useMemo(() => catRows.reduce((m, r) => Math.max(m, r.count), 0), [catRows]);

  const personCatBreakdown = (number) => (data.categories || [])
    .map((c) => {
      const m = (data.membership[c.id] || []).find((x) => x.number === number);
      return { label: c.label, count: m ? groupedDutyCountInRange(m.history, periodFrom, periodTo) : 0 };
    })
    .filter((r) => r.count > 0)
    .sort((a, b) => b.count - a.count);

  const compareNumbers = useMemo(
    () => Array.from(new Set(compareInput.split(/[,\s]+/).map((s) => s.trim()).filter(Boolean))),
    [compareInput]
  );
  const compareMatches = useMemo(
    () => compareNumbers.map((num) => ({ num, person: personRows.find((s) => s.number === num) })),
    [compareNumbers, personRows]
  );
  const compareFound = compareMatches.filter((m) => m.person).map((m) => m.person);
  const compareNotFound = compareMatches.filter((m) => !m.person).map((m) => m.num);
  const maxCompare = Math.max(1, ...compareFound.map((p) => p.periodCount));

  const Bar = ({ pct, color }) => (
    <div style={{ flex: 1, height: 7, borderRadius: 4, background: "var(--border-soft)", overflow: "hidden" }}>
      <div style={{ width: `${pct}%`, height: "100%", background: color || "#D98E2B", borderRadius: 4 }} />
    </div>
  );
  const barRow = (key, label, count, pct, color) => (
    <div key={key} style={{ display: "flex", alignItems: "center", gap: 10 }}>
      <span className="gu" style={{ width: 150, fontSize: 12.5, flexShrink: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }} title={label}>{label}</span>
      <Bar pct={pct} color={color} />
      <span className="mono" style={{ width: 66, fontSize: 11.5, color: "var(--text-secondary)", textAlign: "right", flexShrink: 0 }}>{count} ({pct}%)</span>
    </div>
  );

  return (
    <div style={{ background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 10, padding: 16, marginBottom: 20 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4, flexWrap: "wrap", gap: 8 }}>
        <div style={{ display: "flex", alignItems: "center" }}>
          <div className="disp gu" style={{ fontWeight: 700, fontSize: 14 }}>⚖ {t("Duty fairness", "ડ્યુટી ન્યાયીપણું")}</div>
          <InfoIconButton active={showInfo} onClick={() => setShowInfo((v) => !v)} label={t("About this panel", "આ પેનલ વિશે")} />
        </div>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center" }}>
          <PeriodFilterSelect period={period} setPeriod={setPeriod} />
          <button onClick={() => setView("person")} style={catTabBtn(view === "person")} className="gu">{t("By person", "વ્યક્તિ પ્રમાણે")}</button>
          <button onClick={() => setView("designation")} style={catTabBtn(view === "designation")} className="gu">{t("By designation", "હોદ્દા પ્રમાણે")}</button>
          <button onClick={() => setView("worktype")} style={catTabBtn(view === "worktype")} className="gu">{t("By work type", "કામના પ્રકાર પ્રમાણે")}</button>
        </div>
      </div>
      {showInfo && (
        <p style={{ fontSize: 11.5, color: "var(--text-tertiary)", margin: "4px 0 14px" }} className="gu">
          {t(`Based on the Duty meter (duty assignments in ${periodLabel(t, period)}, not raw days). Bars are relative to whoever/whatever is busiest in this view — 100% is the busiest, not a hard cap.`, `ડ્યુટી મીટર (${periodLabel(t, period)} ડ્યુટી સોંપણીઓ, રો ડેઝ નહીં) ના આધારે. બાર આ દૃશ્યમાં સૌથી વ્યસ્તની સાપેક્ષે છે — 100% એટલે સૌથી વ્યસ્ત, કોઈ નિશ્ચિત મર્યાદા નહીં.`)}
        </p>
      )}

      {view === "person" && (
        <React.Fragment>
          <div style={{ display: "flex", flexDirection: "column", gap: 7, marginBottom: 18 }}>
            {personRows.map((s) => barRow(s.number, s.name, s.periodCount, maxPerson > 0 ? Math.round((s.periodCount / maxPerson) * 100) : 0))}
            {personRows.length === 0 && <div style={{ fontSize: 12, color: "var(--text-tertiary)" }} className="gu">{t("No staff yet.", "હજુ કોઈ સ્ટાફ નથી.")}</div>}
          </div>

          <div style={{ borderTop: "1px solid var(--border-soft)", paddingTop: 14 }}>
            <div className="gu" style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 8 }}>{t("Compare by બકલ નંબર", "બકલ નંબર દ્વારા સરખામણી કરો")}</div>
            <p style={{ fontSize: 11, color: "var(--text-tertiary)", margin: "0 0 8px" }} className="gu">
              {t("Type or paste multiple buckle numbers, separated by commas or spaces, to compare any number of people at once.", "કોઈપણ સંખ્યામાં લોકોની સરખામણી કરવા માટે, અલ્પવિરામ અથવા સ્પેસથી અલગ કરીને બહુવિધ બકલ નંબર ટાઈપ કરો અથવા પેસ્ટ કરો.")}
            </p>
            <input
              type="text"
              value={compareInput}
              onChange={(e) => setCompareInput(e.target.value)}
              placeholder={t("e.g. 1023, 1044, 1090…", "દા.ત. 1023, 1044, 1090…")}
              className="gu mono"
              style={{ width: "100%", maxWidth: 420, fontSize: 12.5, marginBottom: 12 }}
            />
            {compareNotFound.length > 0 && (
              <div style={{ fontSize: 11.5, color: "var(--status-error-text)", marginBottom: 10 }} className="gu">
                {t("Not found", "મળ્યું નથી")}: <span className="mono">{compareNotFound.join(", ")}</span>
              </div>
            )}
            {compareFound.length > 0 && (
              <div style={{ display: "flex", gap: 16, flexWrap: "wrap" }}>
                {compareFound.map((p) => {
                  const pct = maxCompare > 0 ? Math.round((p.periodCount / maxCompare) * 100) : 0;
                  const breakdown = personCatBreakdown(p.number);
                  return (
                    <div key={p.number} style={{ flex: "1 1 220px", background: "var(--bg-surface-2)", borderRadius: 8, padding: 12 }}>
                      <div className="gu" style={{ fontWeight: 700, fontSize: 13, marginBottom: 4 }}>{p.name} <span className="mono" style={{ fontWeight: 400, fontSize: 11, color: "var(--text-tertiary)" }}>#{p.number}</span></div>
                      <div className="mono" style={{ fontSize: 20, fontWeight: 700, color: "#D98E2B" }}>{p.periodCount}</div>
                      <div className="gu" style={{ fontSize: 10.5, color: "var(--text-tertiary)", marginBottom: 8 }}>{t(`duties in ${periodLabel(t, period)}`, `${periodLabel(t, period)} ડ્યુટીઓ`)} · {pct}% {t("of the busiest in this comparison", "આ સરખામણીમાં સૌથી વ્યસ્તની સાપેક્ષે")}</div>
                      {breakdown.length > 0 ? breakdown.map((b) => (
                        <div key={b.label} style={{ display: "flex", justifyContent: "space-between", fontSize: 11.5, marginBottom: 3 }} className="gu">
                          <span style={{ color: "var(--text-secondary)" }}>{b.label}</span>
                          <span className="mono" style={{ fontWeight: 600 }}>{b.count}</span>
                        </div>
                      )) : <div style={{ fontSize: 11, color: "var(--text-tertiary)" }} className="gu">{t(`No duties in ${periodLabel(t, period)}`, `${periodLabel(t, period)} કોઈ ડ્યુટી નથી`)}</div>}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </React.Fragment>
      )}

      {view === "designation" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 7 }}>
          {desgRows.map((r) => barRow(r.label, r.label, r.count, maxDesg > 0 ? Math.round((r.count / maxDesg) * 100) : 0, "var(--status-purple-text)"))}
          {desgRows.length === 0 && <div style={{ fontSize: 12, color: "var(--text-tertiary)" }} className="gu">{t("No staff yet.", "હજુ કોઈ સ્ટાફ નથી.")}</div>}
        </div>
      )}

      {view === "worktype" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 7 }}>
          {catRows.map((r) => barRow(r.label, r.label, r.count, maxCat > 0 ? Math.round((r.count / maxCat) * 100) : 0, "var(--status-info-text)"))}
          {catRows.length === 0 && <div style={{ fontSize: 12, color: "var(--text-tertiary)" }} className="gu">{t("No work types yet.", "હજુ કોઈ કામનો પ્રકાર નથી.")}</div>}
        </div>
      )}
    </div>
  );
}

// ---------- Duty calendar (look up who was on duty on any given date) ----------
// Builds the Sun-Sat grid of date strings ("YYYY-MM-DD") for a given
// "YYYY-MM" month, padding the start/end with nulls so the grid always
// lines up under the weekday headers.
function monthMatrix(monthStr) {
  const [y, m] = monthStr.split("-").map(Number);
  const first = new Date(y, m - 1, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) {
    cells.push(`${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`);
  }
  while (cells.length % 7 !== 0) cells.push(null);
  return cells;
}
// Sun-Sat bounds ("YYYY-MM-DD" each) of the week containing a given date —
// shared by any calendar-style view that offers a "week" granularity
// (e.g. Skip history) alongside its day/month views.
function weekBounds(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const day = d.getDay();
  const start = new Date(d);
  start.setDate(d.getDate() - day);
  const end = new Date(start);
  end.setDate(start.getDate() + 6);
  const toStr = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
  return [toStr(start), toStr(end)];
}
// Shared by every modal/panel in the app: pressing Esc calls the given
// close/cancel handler, so there's one consistent way out of any overlay
// instead of having to hunt for its Cancel/✕ button.
function useEscToClose(onClose) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);
}
// Shared by every reorderable list in the app (work types, designations,
// leave types, outstation types) — drag-and-drop for mouse/desktop, via
// each row's onDragStart/onDragOver/onDrop. Touch devices don't support
// native HTML5 drag-and-drop reliably, so callers also get moveUp/moveDown
// to wire into ▲/▼ buttons as a touch-friendly fallback that does the same
// reorder. onReorder(draggedId, targetId) does the actual persist.
function useDragReorder(onReorder) {
  const [draggedId, setDraggedId] = useState(null);
  const dragProps = (id) => ({
    draggable: true,
    onDragStart: () => setDraggedId(id),
    onDragOver: (e) => e.preventDefault(),
    onDrop: (e) => { e.preventDefault(); if (draggedId && draggedId !== id) onReorder(draggedId, id); setDraggedId(null); },
    onDragEnd: () => setDraggedId(null),
  });
  return { draggedId, dragProps };
}
const calNavBtn = {
  background: "var(--bg-surface-2)", border: "1px solid var(--border)", borderRadius: 6, width: 26, height: 26,
  fontSize: 14, color: "var(--text-primary)", display: "flex", alignItems: "center", justifyContent: "center",
};
function CalendarView({ data, deleteHistoryEntries, deleteUnavailableHistoryEntry }) {
  const { t, lang } = useLang();
  const [month, setMonth] = useState(todayStr().slice(0, 7));
  const [selectedDate, setSelectedDate] = useState(todayStr());
  const [pdfBusy, setPdfBusy] = useState(false);
  const [showInfo, setShowInfo] = useState(false);
  // Per-entry ✕ buttons stay hidden by default — a day with several
  // people on it otherwise ends up with a delete icon next to every
  // single row, which reads as cluttered/risky to tap near by accident.
  // One "Delete entry" toggle next to the date reveals them all together
  // when actually needed, same pattern as Manage Staff's own Edit toggle.
  const [deleteMode, setDeleteMode] = useState(false);
  const [exportKind, setExportKind] = useState("both"); // both | leave | outstation
  // Which duty entry's note is currently shown in the popup — null when
  // closed. Only ever set from a click on a name that HAS a note (see
  // the onClick below), so there's never a popup with nothing to show.
  const [noteFor, setNoteFor] = useState(null);

  const desgLabelOf = useMemo(() => {
    const map = {};
    (data.designations || []).forEach((d) => { map[d.id] = d.label; });
    return (id) => (id && map[id]) || "";
  }, [data.designations]);

  // date ("YYYY-MM-DD") -> array of duty records, built once from every
  // category's history so the whole calendar (and the day-count badges)
  // stays accurate no matter which month is being viewed.
  const dutyByDate = useMemo(() => {
    const map = {};
    (data.categories || []).forEach((c) => {
      (data.membership[c.id] || []).forEach((m) => {
        const staffRec = data.staff[m.number];
        const name = staffRec ? staffRec.name : m.number;
        (m.history || []).forEach((entry, idx) => {
          const date = historyDate(entry);
          if (!map[date]) map[date] = [];
          map[date].push({
            catId: c.id, catLabel: c.label, number: m.number, name,
            designation: staffRec ? desgLabelOf(staffRec.designation) : "",
            note: historyNote(entry), idx,
          });
        });
      });
    });
    return map;
  }, [data, desgLabelOf]);

  // catId|number -> that person's duty history in that work type collapsed
  // into spans (via groupHistoryRows) — e.g. an 11-day Group Duty
  // assignment becomes one { from, to } span instead of 11 separate days.
  // Lets the day-detail panel show "X days left" next to a name when the
  // selected date falls inside a multi-day assigned stint.
  const dutySpansByKey = useMemo(() => {
    const map = {};
    (data.categories || []).forEach((c) => {
      (data.membership[c.id] || []).forEach((m) => {
        const rows = (m.history || [])
          .map((entry, idx) => ({ number: m.number, name: m.number, catLabel: c.label, date: historyDate(entry), ts: historyTs(entry), note: historyNote(entry), batch: historyBatch(entry), idx }))
          .sort((a, b) => (b.date === a.date ? b.ts - a.ts : b.date.localeCompare(a.date)));
        map[c.id + "|" + m.number] = groupHistoryRows(rows);
      });
    });
    return map;
  }, [data]);
  // Days remaining (inclusive of the selected date, 0 = last day) until a
  // multi-day duty span ends — null if the date isn't inside a span, or
  // the span is only a single day (nothing to count down).
  const dutyDaysRemaining = (catId, number, date) => {
    const spans = dutySpansByKey[catId + "|" + number] || [];
    const span = spans.find((g) => date >= g.from && date <= g.to);
    if (!span || span.from === span.to) return null;
    return daysBetween(date, span.to);
  };
  // The full { from, to } of the multi-day span the selected date falls
  // inside — null for a single-day duty (nothing to show a range for).
  // Lets any day within a Group Duty assignment show "05/08/2026 –
  // 15/08/2026" next to the name, not just the one date being viewed, so
  // it's clear at a glance the whole stint even from a day in the middle.
  const dutySpanRange = (catId, number, date) => {
    const spans = dutySpansByKey[catId + "|" + number] || [];
    const span = spans.find((g) => date >= g.from && date <= g.to);
    if (!span || span.from === span.to) return null;
    return { from: span.from, to: span.to };
  };

  // A person can be marked away either from "Events & reminders" (a dated
  // Leave/Outstation/Training record) or from "Manage staff" (any Leave/
  // Outstation period ever entered for them — past, current, or future,
  // via unavailableHistory). Both are checked so the calendar shows someone
  // as away on EVERY day their Leave or Outstation period covers — a
  // 10-day outstation (individual or via Group Duty's "mark Outstation"
  // toggle) shows the person away on all 10 days, same for a long leave.
  // Skip is intentionally never shown here — a skipped person is simply
  // left out of the duty calendar entirely, same as if they weren't
  // scheduled at all.
  const awayForDate = (date) => {
    const map = {};
    (data.events || []).forEach((ev) => {
      if (ev.start && ev.end && date >= ev.start && date <= ev.end) {
        map[ev.number || ev.name] = { number: ev.number, name: ev.name, type: ev.type, label: eventTypeLabel(ev.type, lang), from: ev.start, to: ev.end, source: "event" };
      }
    });
    Object.values(data.staff || {}).forEach((s) => {
      if (map[s.number]) return;
      const u = unavailableOnDate(s, date);
      if (!u) return;
      const kind = unavailKind(u);
      if (kind === "Outstation" || kind === "Leave") {
        map[s.number] = { number: s.number, name: s.name, type: kind, label: unavailLabel(data, u) || kind, from: u.from, to: u.to || null, source: "unavailable" };
      }
    });
    return Object.values(map);
  };

  // Every Leave / Outstation / Training event (from Events & reminders)
  // whose date range overlaps the selected month, plus every Leave/
  // Outstation period on record for anyone in Manage staff (past, current,
  // or future — from unavailableHistory) whose period overlaps it — the
  // source list for the "export leave/outstation calendar" PDF below.
  const monthStart = month + "-01";
  const monthEnd = (() => {
    const [y, m] = month.split("-").map(Number);
    const d = new Date(y, m, 0);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  })();
  const monthAwayRows = useMemo(() => {
    const rows = [];
    const seen = new Set();
    (data.events || []).forEach((ev) => {
      if (!ev.start) return;
      const end = ev.end || ev.start;
      if (ev.start <= monthEnd && end >= monthStart) {
        rows.push({ name: ev.name, number: ev.number || "", type: eventTypeLabel(ev.type, lang), kind: "Event", start: ev.start, end });
        seen.add((ev.number || ev.name) + "|" + ev.start);
      }
    });
    Object.values(data.staff || {}).forEach((s) => {
      const periods = [...(s.unavailableHistory || [])];
      if (s.unavailable) periods.push(s.unavailable);
      periods.forEach((u) => {
        if (!u || !u.from) return;
        const end = u.to || monthEnd;
        const key = s.number + "|" + u.from;
        if (u.from <= monthEnd && end >= monthStart && !seen.has(key)) {
          const kind = unavailKind(u);
          if (kind === "Leave" || kind === "Outstation") {
            rows.push({ name: s.name, number: s.number, type: unavailLabel(data, u) || kind, kind, start: u.from, end: u.to || "" });
            seen.add(key);
          }
        }
      });
    });
    return rows.sort((a, b) => a.start.localeCompare(b.start) || a.name.localeCompare(b.name));
  }, [data, monthStart, monthEnd, lang]);

  // The dropdown next to "Export leave/outstation PDF" — "Both" (default,
  // unchanged from before), or narrow the export down to just one kind.
  // Events (Training etc., from Events & reminders) only show up under
  // "Both", since they're not really a Leave/Outstation choice at all.
  const exportRows = useMemo(() => {
    if (exportKind === "both") return monthAwayRows;
    return monthAwayRows.filter((r) => r.kind === (exportKind === "leave" ? "Leave" : "Outstation"));
  }, [monthAwayRows, exportKind]);

  const downloadCalendarPdf = async () => {
    setPdfBusy(true);
    const CAL_FONT_PT = 9;
    try {
      await ensureGujaratiCanvasFont();
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.setFontSize(14);
      doc.text("Nokri Book — Leave / Outstation Calendar", 14, 16);
      doc.setFontSize(10);
      doc.text(monthLabel, 14, 23);
      doc.setFontSize(8.5);
      doc.text("Generated " + new Date().toLocaleString(), 14, 28);
      doc.autoTable({
        startY: 33,
        head: [["#", "Name", "Number", "Type", "From", "To"]],
        body: exportRows.map((r, i) => [i + 1, r.name, r.number, r.type, formatDMY(r.start), r.end ? formatDMY(r.end) : "Ongoing"]),
        styles: { fontSize: CAL_FONT_PT },
        headStyles: { fillColor: [14, 22, 32] },
        // Same reasoning as the Monthly Report and per-work-type PDFs:
        // didParseCell blanks these cells' native text so the image can
        // be drawn instead, which would otherwise make autoTable size
        // the column from nothing rather than from the name/type that
        // actually gets drawn into it.
        columnStyles: { 1: { minCellWidth: 42 }, 3: { minCellWidth: 26 } },
        // Name (1) and Type (3) CAN contain Gujarati text — but not
        // always (an English work-type/leave-type label has none), so
        // needsImageRender checks the actual value each time rather than
        // blanket-imaging every cell in these columns regardless of
        // script.
        didParseCell: (hookData) => {
          if (hookData.section === "body" && (hookData.column.index === 1 || hookData.column.index === 3) && needsImageRender(hookData.cell.raw)) {
            hookData.cell.text = [];
          }
        },
        didDrawCell: (hookData) => {
          if (hookData.section === "body" && (hookData.column.index === 1 || hookData.column.index === 3)) {
            const raw = hookData.cell.raw;
            if (raw != null && raw !== "" && needsImageRender(raw)) drawTextImageInCell(doc, hookData.cell, renderTextToImage(raw, CAL_FONT_PT), CAL_FONT_PT);
          }
        },
      });
      doc.save(`nokri-book-calendar-${month}.pdf`);
    } catch (e) {
      window.alert(t("Could not load Gujarati font — check your internet connection and try again.", "ગુજરાતી ફોન્ટ લોડ થઈ શક્યો નહીં — તમારું ઇન્ટરનેટ કનેક્શન તપાસો અને ફરી પ્રયાસ કરો."));
    } finally {
      setPdfBusy(false);
    }
  };

  const cells = useMemo(() => monthMatrix(month), [month]);
  const monthLabel = new Date(month + "-01T00:00:00").toLocaleDateString(t("en-IN", "gu-IN"), { month: "long", year: "numeric" });
  const today = todayStr();

  // date -> { count, hasOutstation, hasLeave } for every day shown in the
  // visible month grid, so each cell can show a small dot for "someone was
  // on leave/outstation that day" at a glance — without this, that only
  // showed up after clicking into a day's detail panel. Outstation takes
  // visual priority (purple) since that's usually the more operationally
  // significant one (whole group away, out of town), then Leave (blue).
  const monthAwaySummary = useMemo(() => {
    const map = {};
    cells.forEach((d) => {
      if (!d) return;
      const away = awayForDate(d);
      if (!away.length) return;
      map[d] = {
        count: away.length,
        hasOutstation: away.some((a) => a.type === "Outstation"),
        hasLeave: away.some((a) => a.type === "Leave"),
      };
    });
    return map;
  }, [cells, data, lang]);

  const shiftMonth = (delta) => {
    const [y, m] = month.split("-").map(Number);
    const d = new Date(y, m - 1 + delta, 1);
    setMonth(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`);
  };

  const selDuties = dutyByDate[selectedDate] || [];
  const selAway = awayForDate(selectedDate);
  const selGrouped = useMemo(() => {

    selDuties.forEach((r) => { (g[r.catLabel] = g[r.catLabel] || []).push(r); });
    return g;
  }, [selDuties]);

  return (
    <React.Fragment>
      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", flexWrap: "wrap", gap: 10 }}>

          <h1 className="disp gu" style={{ fontSize: 22, fontWeight: 700, margin: 0 }}>{t("Duty calendar", "ડ્યુટી કૅલેન્ડર")}</h1>
          <InfoIconButton active={showInfo} onClick={() => setShowInfo((v) => !v)} label={t("About this screen", "આ સ્ક્રીન વિશે")} />

          <select
            value={exportKind} onChange={(e) => setExportKind(e.target.value)}

              fontSize: 12.5, padding: "8px 6px 8px 10px", border: "none", borderRadius: 0, borderRight: "1px solid rgba(255,255,255,0.4)",
              background: exportRows.length && !pdfBusy ? "#D98E2B" : "var(--border)", color: "#fff", fontWeight: 600, cursor: "pointer",
            }} className="gu"
          >
            <option value="both">{t("Leave + Outstation", "રજા + બહારગામ")}</option>
            <option value="leave">{t("Leave only", "ફક્ત રજા")}</option>
            <option value="outstation">{t("Outstation only", "ફક્ત બહારગામ")}</option>

          <button
            onClick={downloadCalendarPdf} disabled={exportRows.length === 0 || pdfBusy}
            style={{
              background: exportRows.length && !pdfBusy ? "#D98E2B" : "var(--border)", color: "#fff", border: "none", borderRadius: 0,
              padding: "8px 14px", fontSize: 12.5, fontWeight: 600, cursor: exportRows.length && !pdfBusy ? "pointer" : "default",
            }} className="gu"
          >{pdfBusy ? t("Preparing…", "તૈયાર થઈ રહ્યું છે…") : t("Export PDF", "PDF એક્સપોર્ટ કરો")}</button>
        </div>
      </div>
      {showInfo && (
        <p style={{ fontSize: 13, color: "var(--text-secondary)", margin: "0 0 20px" }} className="gu">
          {t("Pick any date to see exactly who was on duty (and who was on leave/outstation/training) that day — useful proof if someone questions you later.", "તે દિવસે ડ્યુટી પર બરાબર કોણ હતું (અને કોણ રજા/બહારગામ/તાલીમ પર હતું) તે જોવા માટે કોઈપણ તારીખ પસંદ કરો — પછીથી કોઈ પ્રશ્ન કરે તો ઉપયોગી પુરાવો.")}
        </p>
      )}

      <div style={{ display: "flex", gap: 24, flexWrap: "wrap", alignItems: "flex-start" }}>
        <div style={{ background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 10, padding: 16, flex: "1 1 380px", maxWidth: 460 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <button onClick={() => shiftMonth(-1)} title={t("Previous month", "પાછલો મહિનો")} aria-label={t("Previous month", "પાછલો મહિનો")} style={calNavBtn}>‹</button>
            <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
              <div className="disp" style={{ fontWeight: 700, fontSize: 15 }}>{monthLabel}</div>
              <input type="month" value={month} onChange={(e) => setMonth(e.target.value)} style={{ fontSize: 11, padding: "3px 6px" }} />
            </div>
            <button onClick={() => shiftMonth(1)} title={t("Next month", "આગલો મહિનો")} aria-label={t("Next month", "આગલો મહિનો")} style={calNavBtn}>›</button>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4, marginBottom: 4 }}>
            {[["Sun","રવિ"], ["Mon","સોમ"], ["Tue","મંગળ"], ["Wed","બુધ"], ["Thu","ગુરુ"], ["Fri","શુક્ર"], ["Sat","શનિ"]].map(([en, gu]) => (
              <div key={en} className="gu" style={{ textAlign: "center", fontSize: 10.5, color: "var(--text-tertiary)", fontWeight: 600, padding: "2px 0" }}>{t(en, gu)}</div>
            ))}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4 }}>
            {cells.map((dateStr, i) => {
              if (!dateStr) return <div key={i} />;
              const count = (dutyByDate[dateStr] || []).length;
              const awaySummary = monthAwaySummary[dateStr];
              const isToday = dateStr === today;
              const isSelected = dateStr === selectedDate;
              const dayNum = Number(dateStr.slice(8, 10));
              const dotColor = awaySummary
                ? (awaySummary.hasOutstation ? "var(--status-purple-text)" : awaySummary.hasLeave ? "var(--status-info-text)" : "var(--text-tertiary)")
                : null;
              const awayTitle = awaySummary
                ? t(`${awaySummary.count} away (leave/outstation)`, `${awaySummary.count} ગેરહાજર (રજા/બહારગામ)`)

              return (
                <button key={i} onClick={() => setSelectedDate(dateStr)} title={
                  (count ? t(`${count} duty record${count === 1 ? "" : "s"}`, `${count} ડ્યુટી રેકોર્ડ`) : t("No duty recorded", "કોઈ ડ્યુટી નોંધાયેલી નથી"))
                  + (awaySummary ? " · " + awayTitle : "")
                } style={{
                  aspectRatio: "1", border: "1px solid " + (isSelected ? "#D98E2B" : "var(--border-soft)"),
                  background: isSelected ? "var(--status-warning-bg)" : (isToday ? "var(--bg-surface-2)" : "var(--bg-surface)"),
                  borderRadius: 7, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
                  padding: 2, position: "relative",
                }}>
                  {awaySummary && (
                    <span style={{ position: "absolute", top: 3, right: 3, width: 6, height: 6, borderRadius: "50%", background: dotColor }} />
                  )}
                  <span className="mono" style={{ fontSize: 12, fontWeight: isToday ? 700 : 500, color: isSelected ? "var(--status-warning-text)" : "var(--text-primary)" }}>{dayNum}</span>
                  {count > 0 && <span style={{ fontSize: 9, color: "#D98E2B", fontWeight: 700, marginTop: 1 }}>{count}</span>}
                </button>
              );
            })}
          </div>
        </div>

        <div style={{ flex: "1 1 380px", minWidth: 300 }}>
          <div style={{ background: "var(--bg-surface)", border: "1px solid var(--border)", borderRadius: 10, padding: "16px 18px" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4, flexWrap: "wrap", gap: 8 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <div className="disp" style={{ fontWeight: 700, fontSize: 15 }}>{formatDMY(selectedDate)}</div>
                <button
                  onClick={() => setDeleteMode((v) => !v)}
                  title={t("Show a delete button next to each entry below, to remove one you logged by mistake", "નીચેની દરેક એન્ટ્રીની બાજુમાં ડિલીટ બટન બતાવો, જેથી ભૂલથી નોંધેલી કોઈ એન્ટ્રી કાઢી શકાય")}
                  style={{
                    fontSize: 11, fontWeight: 600, padding: "3px 9px", borderRadius: 20,
                    background: deleteMode ? "var(--status-error-text)" : "var(--bg-surface)",
                    color: deleteMode ? "#fff" : "var(--text-secondary)",
                    border: "1px solid " + (deleteMode ? "var(--status-error-text)" : "var(--border)"),
                  }} className="gu"
                >{t("Delete entry", "નોંધ ડીલીટ કરો")}</button>
              </div>
              <input type="date" value={selectedDate} onChange={(e) => { setSelectedDate(e.target.value); setMonth(e.target.value.slice(0, 7)); }} style={{ fontSize: 12 }} />
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 10, fontSize: 11, color: "var(--text-tertiary)" }} className="gu">
              <span style={{ display: "flex", alignItems: "center", gap: 5 }}><span style={{ width: 7, height: 7, borderRadius: "50%", background: "var(--status-purple-text)", display: "inline-block" }} />{t("Outstation", "બહારગામ")}</span>
              <span style={{ display: "flex", alignItems: "center", gap: 5 }}><span style={{ width: 7, height: 7, borderRadius: "50%", background: "var(--status-info-text)", display: "inline-block" }} />{t("Leave", "રજા")}</span>
            </div>

            {Object.keys(selGrouped).length === 0 ? (
              <div style={{ fontSize: 13, color: "var(--text-tertiary)", padding: "8px 0" }} className="gu">{t("No duty recorded on this date.", "આ તારીખે કોઈ ડ્યુટી નોંધાયેલી નથી.")}</div>
            ) : (
              Object.keys(selGrouped).sort().map((cat) => (
                <div key={cat} style={{ marginBottom: 12 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11.5, fontWeight: 700, color: "var(--text-secondary)", textTransform: "uppercase", letterSpacing: 0.3, marginBottom: 5 }}>
                    <span style={{ width: 6, height: 6, borderRadius: "50%", background: "#D98E2B", display: "inline-block", flexShrink: 0 }} />
                    {cat}
                  </div>
                  {selGrouped[cat].map((r, i) => {
                    const remaining = dutyDaysRemaining(r.catId, r.number, selectedDate);
                    const range = dutySpanRange(r.catId, r.number, selectedDate);
                    return (
                      <div key={i} className="gu" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 13, padding: "5px 0", borderTop: i ? "1px solid var(--border-soft)" : "none", gap: 8 }}>
                        <span>
                          {r.note ? (
                            <span
                              onClick={() => setNoteFor(r)}
                              style={{ cursor: "pointer", borderBottom: "1px dashed var(--text-tertiary)" }}
                              title={t("Tap to see the full note for this duty", "આ ડ્યુટીની સંપૂર્ણ નોંધ જોવા ટેપ કરો")}
                            >{r.name}</span>
                          ) : r.name} <span className="mono" style={{ fontSize: 11, color: "var(--text-tertiary)" }}>#{r.number}</span>{r.designation ? <span style={{ fontSize: 11, color: "var(--status-warning-text)" }}> · {r.designation}</span> : null}
                          {range && (
                            <span style={{ display: "block", fontSize: 10.5, color: "var(--text-tertiary)", marginTop: 1 }}>{formatDMY(range.from)} – {formatDMY(range.to)}</span>
                          )}
                          {/* The note itself, shown plainly — for Miscellaneous
                              duty specifically this IS the duty description
                              ("What is this duty?"), not an optional
                              afterthought, so hiding it behind a tap (the old
                              behavior) meant the single most important piece
                              of information about the entry was invisible by
                              default. */}
                          {r.note && (
                            <span className="gu" style={{ display: "block", fontSize: 11.5, color: "var(--text-secondary)", marginTop: 1, fontStyle: "italic" }}>{r.note}</span>
                          )}
                        </span>
                        <span style={{ display: "flex", alignItems: "center", gap: 6, flexShrink: 0 }}>
                          {remaining !== null && (
                            <span style={{ fontSize: 10.5, fontWeight: 700, background: "var(--status-warning-bg)", color: "var(--status-warning-text)", border: "1px solid var(--status-warning-border)", borderRadius: 10, padding: "2px 8px", whiteSpace: "nowrap" }} className="gu">
                              {remaining === 0 ? t("last day", "છેલ્લો દિવસ") : t(`${remaining} day${remaining === 1 ? "" : "s"} left`, `${remaining} દિવસ બાકી`)}
                            </span>
                          )}
                          {r.note && (
                            <span
                              onClick={() => setNoteFor(r)}
                              style={{ fontSize: 11.5, color: "var(--text-tertiary)", cursor: "pointer" }}
                              title={t("Tap to see the note for this duty", "આ ડ્યુટીની નોંધ જોવા ટેપ કરો")}
                            >📝</span>
                          )}
                          {deleteMode && deleteHistoryEntries && (
                            <button
                              onClick={() => {
                                if (!window.confirm(t(`Delete this duty entry for ${r.name}? It moves to the Recycle bin, so it can still be restored.`, `${r.name} માટે આ ડ્યુટી એન્ટ્રી ડિલીટ કરવી છે? તે રિસાયકલ બિનમાં ખસેડાય છે, જેથી પુનઃસ્થાપિત કરી શકાય.`))) return;
                                deleteHistoryEntries(r.catId, new Set([`${r.number}#${r.idx}`]));
                              }}
                              title={t("Delete this entry", "આ એન્ટ્રી ડિલીટ કરો")}
                              aria-label={t("Delete this entry", "આ એન્ટ્રી ડિલીટ કરો")}
                              style={{ ...iconBtn, padding: "3px 6px", fontSize: 11 }}
                            >✕</button>
                          )}
                        </span>
                      </div>
                    );
                  })}
                </div>
              ))
            )}

            {selAway.length > 0 && (
              <div style={{ marginTop: 14, paddingTop: 12, borderTop: "1px solid var(--border-soft)" }}>
                <div style={{ fontSize: 11.5, fontWeight: 700, color: "var(--text-secondary)", textTransform: "uppercase", letterSpacing: 0.3, marginBottom: 5 }} className="gu">{t("Not present that day (leave / outstation)", "તે દિવસે હાજર નથી (રજા / બહારગામ)")}</div>
                {selAway.map((a) => {
                  const style = EVENT_TYPE_STYLE[a.type] || STATUS_STYLE[a.type] || {};
                  const remaining = a.to ? daysBetween(selectedDate, a.to) : null;
                  return (
                    <div key={a.number || a.name} className="gu" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 13, padding: "5px 0" }}>
                      <span>{a.name}{a.number ? <span className="mono" style={{ fontSize: 11, color: "var(--text-tertiary)" }}> #{a.number}</span> : null}</span>
                      <span style={{ display: "flex", alignItems: "center", gap: 6 }}>
                        {remaining !== null && (
                          <span style={{ fontSize: 10.5, fontWeight: 700, background: "var(--bg-surface-2)", color: "var(--text-secondary)", border: "1px solid var(--border)", borderRadius: 10, padding: "2px 8px" }} className="gu">
                            {remaining === 0 ? t("returns tomorrow", "આવતીકાલે પાછા ફરશે") : t(`${remaining} day${remaining === 1 ? "" : "s"} until return`, `${remaining} દિવસમાં પાછા ફરશે`)}
                          </span>
                        )}
                        <span style={{ fontSize: 10.5, fontWeight: 700, background: style.bg, color: style.fg, border: "1px solid " + style.border, borderRadius: 10, padding: "2px 8px" }}>{a.label}</span>
                        {deleteMode && deleteUnavailableHistoryEntry && a.source === "unavailable" && (
                          <button
                            onClick={() => {
                              if (!window.confirm(t(`Delete this ${a.type.toLowerCase()} record for ${a.name}? It moves to the Recycle bin, so it can still be restored.`, `${a.name} માટે આ ${a.label} રેકોર્ડ ડિલીટ કરવો છે? તે રિસાયકલ બિનમાં ખસેડાય છે, જેથી પુનઃસ્થાપિત કરી શકાય.`))) return;
                              deleteUnavailableHistoryEntry(a.number, a.from, a.to);
                            }}
                            title={t("Delete this record", "આ રેકોર્ડ ડિલીટ કરો")}
                            aria-label={t("Delete this record", "આ રેકોર્ડ ડિલીટ કરો")}
                            style={{ ...iconBtn, padding: "3px 6px", fontSize: 11 }}
                          >✕</button>
                        )}
                      </span>
                    </div>
                  );
                })}
              </div>
            )}

            {selDuties.length > 0 && (
              <div style={{ marginTop: 14, paddingTop: 12, borderTop: "1px solid var(--border-soft)", fontSize: 12, color: "var(--text-secondary)" }} className="gu">
                {t(`${selDuties.length} employee${selDuties.length === 1 ? "" : "s"} on duty across ${Object.keys(selGrouped).length} work type${Object.keys(selGrouped).length === 1 ? "" : "s"} on ${formatDMY(selectedDate)}.`, `${formatDMY(selectedDate)} ના રોજ ${Object.keys(selGrouped).length} કામના પ્રકારોમાં ${selDuties.length} કર્મચારીઓ ડ્યુટી પર હતા.`)}
              </div>
            )}
          </div>
        </div>
      </div>
      {noteFor && <DutyNoteModal record={noteFor} onClose={() => setNoteFor(null)} />}
    </React.Fragment>
  );
}

// Small popup for a single duty entry's note — reached by tapping a name
